<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ewolucja 3D</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at center,
            #12332c 0%,
            #071915 45%,
            #020807 100%
        );
}


/* =========================================================
   HUD
========================================================= */

#hud{

    position:fixed;

    top:16px;
    left:50%;

    transform:translateX(-50%);

    width:430px;
    max-width:92%;

    padding:13px 20px;

    background:rgba(7,13,12,.95);

    border:1px solid #4e625c;

    border-radius:16px;

    z-index:10000;

    box-shadow:
        0 8px 30px rgba(0,0,0,.55);

}

#entropy{

    font-size:28px;

    font-weight:700;

}

#production{

    margin-top:3px;

    color:#49e7bf;

    font-size:17px;

}

#instructions{

    margin-top:6px;

    color:#84938e;

    font-size:12px;

}


/* =========================================================
   VIEWPORT
========================================================= */

#viewport{

    position:absolute;

    inset:0;

    overflow:hidden;

    cursor:grab;

    touch-action:none;

}

#viewport.dragging{

    cursor:grabbing;

}


/* =========================================================
   CAŁY ŚWIAT
========================================================= */

#world{

    position:absolute;

    left:0;
    top:0;

    width:1600px;
    height:3450px;

    transform-origin:0 0;

}


/* =========================================================
   TŁO ŚWIATA
========================================================= */

#world::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 30% 15%,
            rgba(69,255,195,.08),
            transparent 22%
        ),

        radial-gradient(
            circle at 70% 55%,
            rgba(55,173,145,.08),
            transparent 27%
        ),

        radial-gradient(
            circle,
            rgba(116,255,213,.13) 1px,
            transparent 2px
        );

    background-size:
        auto,
        auto,
        130px 130px;

}


/* =========================================================
   LINIE
========================================================= */

#lines{

    position:absolute;

    width:1600px;
    height:3450px;

    left:0;
    top:0;

    pointer-events:none;

    z-index:1;

}

.main-line{

    stroke:#405a53;

    stroke-width:7;

    opacity:.5;

}

.main-line.active{

    stroke:#28dfb6;

    opacity:1;

    filter:
        drop-shadow(0 0 6px #28dfb6);

}

.upgrade-line{

    stroke:#536860;

    stroke-width:3;

    opacity:.55;

}

.upgrade-line.active{

    stroke:#33cfac;

    opacity:.95;

}


/* =========================================================
   GENERATOR
========================================================= */

.generator{

    position:absolute;

    left:800px;

    width:142px;
    height:142px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle at 38% 30%,
            #263a34,
            #101916 58%,
            #050908 100%
        );

    border:4px solid #42675e;

    z-index:20;

    cursor:pointer;

    transition:
        transform .16s,
        opacity .2s,
        box-shadow .2s,
        border-color .2s;

}

.generator.available,
.generator.owned{

    border-color:#28e0b8;

    box-shadow:

        0 0 9px rgba(40,224,184,.8),

        0 0 28px rgba(40,224,184,.25),

        inset 0 0 20px rgba(40,224,184,.08);

}

.generator.locked{

    opacity:.28;

    cursor:default;

}

.generator:not(.locked):hover{

    transform:
        translate(-50%,-50%)
        scale(1.07);

}


/* =========================================================
   CANVAS MODELU
========================================================= */

.model-canvas{

    position:absolute;

    left:7px;
    top:7px;

    width:120px;
    height:120px;

    border-radius:50%;

    pointer-events:none;

}


/* =========================================================
   LEVEL
========================================================= */

.level{

    position:absolute;

    right:-13px;
    top:-13px;

    min-width:42px;
    height:42px;

    padding:0 7px;

    border-radius:23px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#0d1210;

    border:2px solid #263830;

    font-size:14px;
    font-weight:bold;

    z-index:30;

}


/* =========================================================
   NAZWA
========================================================= */

.generator-name{

    position:absolute;

    left:50%;
    top:148px;

    transform:translateX(-50%);

    width:310px;

    text-align:center;

    white-space:nowrap;

    font-size:21px;

    font-weight:bold;

    text-shadow:
        0 2px 5px #000,
        0 0 5px #000;

    pointer-events:none;

}

.generator-cost{

    position:absolute;

    left:50%;
    top:178px;

    transform:translateX(-50%);

    white-space:nowrap;

    color:#43e0ba;

    font-size:14px;

    text-shadow:
        0 2px 3px #000;

    pointer-events:none;

}


/* =========================================================
   UPGRADE
========================================================= */

.upgrade{

    position:absolute;

    width:230px;
    height:86px;

    transform:
        translate(-50%,-50%);

    display:grid;

    grid-template-columns:
        62px 1fr;

    align-items:center;

    padding:8px;

    border-radius:7px;

    border:2px solid #52645e;

    background:

        linear-gradient(
            145deg,
            #222c28,
            #101613
        );

    box-shadow:
        0 5px 12px rgba(0,0,0,.55);

    z-index:15;

    cursor:pointer;

    transition:
        transform .15s,
        opacity .2s,
        border-color .2s;

}

.upgrade:hover{

    transform:
        translate(-50%,-50%)
        scale(1.045);

}

.upgrade.locked{

    opacity:.22;

    cursor:default;

}

.upgrade.bought{

    border-color:#31d5ae;

    background:

        linear-gradient(
            145deg,
            #174239,
            #0c2822
        );

}


/* =========================================================
   KWADRATOWA IKONA
========================================================= */

.upgrade-icon{

    width:55px;
    height:55px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#0a100e;

    border:2px solid #485b55;

    overflow:hidden;

}

.upgrade-icon svg{

    width:48px;
    height:48px;

}


/* =========================================================
   UPGRADE TEXT
========================================================= */

.upgrade-info{

    padding-left:8px;

}

.upgrade-name{

    font-size:14px;

    font-weight:700;

}

.upgrade-effect{

    margin-top:4px;

    font-size:12px;

    color:#8bd773;

}

.upgrade-cost{

    margin-top:2px;

    font-size:11px;

    color:#48d8b5;

}


/* =========================================================
   +1
========================================================= */

.click-number{

    position:fixed;

    pointer-events:none;

    z-index:20000;

    color:#4bf1c5;

    font-size:22px;

    font-weight:bold;

    text-shadow:
        0 2px 4px #000;

    animation:
        clickAnimation .75s forwards;

}

@keyframes clickAnimation{

    from{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);

    }

    to{

        opacity:0;

        transform:
            translate(-50%,-100px)
            scale(1.3);

    }

}


/* =========================================================
   INFO 3D
========================================================= */

#three-info{

    position:fixed;

    left:15px;
    bottom:15px;

    z-index:10000;

    padding:8px 11px;

    border-radius:8px;

    background:rgba(0,0,0,.65);

    color:#8a9994;

    font-size:11px;

}


/* =========================================================
   DEBUG BUTTON
========================================================= */

#home-button{

    position:fixed;

    right:20px;
    bottom:20px;

    width:52px;
    height:52px;

    border-radius:50%;

    border:1px solid #54655f;

    background:#101815;

    color:#4be9c0;

    font-size:23px;

    cursor:pointer;

    z-index:10000;

}

#home-button:hover{

    background:#19342d;

}

</style>
</head>

<body>


<div id="hud">

    <div id="entropy">
        0 entropii
    </div>

    <div id="production">

    </div>

    <div id="instructions">

    </div>

</div>

<button id="home-button">

</button>


<div id="viewport">

    <div id="world">

        <svg id="lines"></svg>

</div>


<script>

/* =========================================================

/* =========================================================

];


/* =========================================================
   STAN
========================================================= */

let entropy = 0;

let clickPower = 1;


generators.forEach(g => {

    g.level = 0;

    g.upgrades.forEach(u => {

        u.bought = false;

    });

});


/* =========================================================
   IKONY ULEPSZEŃ

   Są SVG, bo to tylko małe kwadraty.
========================================================= */

function upgradeIcon(type){

    if(type === "dna"){

        return `

        <svg viewBox="0 0 100 100">

            <path
                d="M30 10 C75 25 75 75 30 90"
                fill="none"
                stroke="#34bbef"
                stroke-width="8"
            />

            <path
                d="M70 10 C25 25 25 75 70 90"
                fill="none"
                stroke="#be68dd"
                stroke-width="8"
            />

            <g stroke="#ddd" stroke-width="3">

                <line x1="38" y1="22" x2="62" y2="22"/>
                <line x1="31" y1="40" x2="69" y2="40"/>
                <line x1="31" y1="60" x2="69" y2="60"/>
                <line x1="38" y1="78" x2="62" y2="78"/>

            </g>

        </svg>

        `;

    }


    if(type === "cell"){

        return `

        <svg viewBox="0 0 100 100">

            <circle
                cx="50"
                cy="50"
                r="34"
                fill="#37695c"
                stroke="#6fe4c8"
                stroke-width="5"
            />

            <circle
                cx="43"
                cy="45"
                r="13"
                fill="#82628f"
            />

            <circle
                cx="67"
                cy="61"
                r="7"
                fill="#c9795c"
            />

        </svg>

        `;

    }


    return `

    <svg viewBox="0 0 100 100">

        <circle
            cx="50"
            cy="50"
            r="31"
            fill="#246b59"
            stroke="#69e2c3"
            stroke-width="5"
        />

        <path
            d="M50 27 V73 M27 50 H73"
            stroke="#e7fff9"
            stroke-width="9"
            stroke-linecap="round"
        />

    </svg>

    `;

}


/* =========================================================
   TWORZENIE GRAFIKÓW

   WAŻNE:
   Tutaj NIE UŻYWAMY THREE.
========================================================= */

const modelCanvases = [];


generators.forEach((g,index) => {

    /* GENERATOR */

    const generator =
        document.createElement("div");


    generator.className =
        "generator";


    generator.id =
        "generator-" + g.id;


    generator.style.top =
        g.y + "px";


    /* CANVAS */

    const canvas =
        document.createElement("canvas");


    canvas.className =
        "model-canvas";


    canvas.width = 240;
    canvas.height = 240;


    generator.appendChild(canvas);


    modelCanvases.push({

        canvas:canvas,

        model:g.model,

        generator:g

    });


    /* NA RAZIE FALLBACK 2D */

    drawFallbackModel(
        canvas,
        g.model
    );


    /* LEVEL */

    const level =
        document.createElement("div");


    level.className =
        "level";


    level.textContent =
        "x0";


    generator.appendChild(level);


    /* NAZWA */

    const name =
        document.createElement("div");


    name.className =
        "generator-name";


    name.textContent =
        g.name;


    generator.appendChild(name);


    /* CENA */

    const cost =
        document.createElement("div");


    cost.className =
        "generator-cost";


    generator.appendChild(cost);


    /* KLIK */

    generator.addEventListener(

        "pointerdown",

        event => {

            event.stopPropagation();

        }

    );


    generator.addEventListener(

        "click",

        event => {

            event.stopPropagation();

            buyGenerator(index);

        }

    );


    world.appendChild(generator);


    /* UPGRADE LEWY */

    createUpgrade(
        g,
        index,
        0,
        500
    );


    /* UPGRADE PRAWY */

    createUpgrade(
        g,
        index,
        1,
        1100
    );

});


/* =========================================================
   TWORZENIE UPGRADE
========================================================= */

function createUpgrade(
    g,
    generatorIndex,
    upgradeIndex,
    x
){

    const u =
        g.upgrades[upgradeIndex];


    const element =
        document.createElement("div");


    element.className =
        "upgrade";


    element.id =
        `upgrade-${g.id}-${upgradeIndex}`;


    element.style.left =
        x + "px";


    element.style.top =
        g.y + "px";


    let iconType = "normal";


    if(
        g.id === "dna"
    ){

        iconType = "dna";

    }


    if(
        g.id === "prokaryote" ||
        g.id === "eukaryote"
    ){

        iconType = "cell";

    }


    element.innerHTML = `

        <div class="upgrade-icon">

            ${upgradeIcon(iconType)}

        </div>

        <div class="upgrade-info">

            <div class="upgrade-name">

                ${u.name}

            </div>

            <div class="upgrade-effect">

                +${Math.round(u.bonus * 100)}% produkcji

            </div>

            <div class="upgrade-cost">

                ${format(u.cost)} entropii

            </div>

        </div>

    `;


    element.addEventListener(

        "pointerdown",

        event => {

            event.stopPropagation();

        }

    );


    element.addEventListener(

        "click",

        event => {

            event.stopPropagation();

            buyUpgrade(
                generatorIndex,
                upgradeIndex
            );

        }

    );


    world.appendChild(element);

}


/* =========================================================
   FALLBACK MODELI

   Dzięki temu nawet bez THREE
   graf NIE JEST PUSTY.
========================================================= */

function drawFallbackModel(canvas,type){

    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const cx =
        canvas.width / 2;

    const cy =
        canvas.height / 2;


    const gradient =
        ctx.createRadialGradient(

            cx - 25,
            cy - 30,
            5,

            cx,
            cy,
            80

        );


    gradient.addColorStop(
        0,
        "#70e6c5"
    );

    gradient.addColorStop(
        0.55,
        "#397968"
    );

    gradient.addColorStop(
        1,
        "#143129"
    );


    ctx.fillStyle =
        gradient;


    /* DEFAULT */

    ctx.beginPath();

    ctx.ellipse(
        cx,
        cy,
        65,
        45,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#e8fff9";


    ctx.font =
        "bold 24px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    const shortNames = {

        amino:"AA",

        dna:"DNA",

        prokaryote:"PRO",

        eukaryote:"EUK",

        sponge:"G",

        jellyfish:"M",

        flatworm:"P",

        fish:"R",

        tetrapod:"4",

        mammal:"S",

        primate:"N",

        human:"H"

    };


    ctx.fillText(

        shortNames[type] || "?",

        cx,
        cy

    );

}


/* =========================================================
   LINIE
========================================================= */

function drawLines(){

    linesSVG.innerHTML = "";


    for(
        let i = 0;
        i < generators.length - 1;
        i++
    ){

        const current =
            generators[i];


        const next =
            generators[i + 1];


        createSVGLine(

            800,
            current.y,

            800,
            next.y,

            "main-line",

            "main-line-" + i

        );

    }


    generators.forEach(
        (g,index) => {

            createSVGLine(

                800,
                g.y,

                500,
                g.y,

                "upgrade-line",

                `upgrade-line-${index}-0`

            );


            createSVGLine(

                800,
                g.y,

                1100,
                g.y,

                "upgrade-line",

                `upgrade-line-${index}-1`

            );

        }
    );

}


function createSVGLine(
    x1,
    y1,
    x2,
    y2,
    className,
    id
){

    const line =
        document.createElementNS(

            "http://www.w3.org/2000/svg",

            "line"

        );


    line.setAttribute(
        "x1",
        x1
    );


    line.setAttribute(
        "y1",
        y1
    );


    line.setAttribute(
        "x2",
        x2
    );


    line.setAttribute(
        "y2",
        y2
    );


    line.setAttribute(
        "class",
        className
    );


    line.id =
        id;


    linesSVG.appendChild(line);

}


/* =========================================================
   KOSZT
========================================================= */

function generatorCost(g){

    return Math.floor(

        g.baseCost *

        Math.pow(
            1.17,
            g.level
        )

    );

}


/* =========================================================
   BONUS
========================================================= */

function generatorMultiplier(g){

    let multiplier = 1;


    g.upgrades.forEach(u => {

        if(u.bought){

            multiplier +=
                u.bonus;

        }

    });


    return multiplier;

}


/* =========================================================
   PRODUKCJA
========================================================= */

function getProduction(){

    let production = 0;


    generators.forEach(g => {

        production +=

            g.production *

            g.level *

            generatorMultiplier(g);

    });


    return production;

}


/* =========================================================
   KUP GENERATOR
========================================================= */

function buyGenerator(index){

    const g =
        generators[index];


    const unlocked =

        index === 0 ||

        generators[index - 1]
        .level > 0;


    if(!unlocked){

        return;

    }


    const cost =
        generatorCost(g);


    if(entropy < cost){

        return;

    }


    entropy -= cost;


    g.level++;


    updateUI();

}


/* =========================================================
   KUP UPGRADE
========================================================= */

function buyUpgrade(
    generatorIndex,
    upgradeIndex
){

    const g =
        generators[generatorIndex];


    const u =
        g.upgrades[upgradeIndex];


    if(g.level === 0){

        return;

    }


    if(u.bought){

        return;

    }


    if(entropy < u.cost){

        return;

    }


    entropy -=
        u.cost;


    u.bought =
        true;


    updateUI();

}


/* =========================================================
   FORMATOWANIE LICZB
========================================================= */

function format(number){

    if(number < 1000){

        return Math.floor(
            number
        ).toString();

    }


    if(number < 1e6){

        return (
            number / 1000
        ).toFixed(1) + " tys.";

    }


    if(number < 1e9){

        return (
            number / 1e6
        ).toFixed(2) + " mln";

    }


    if(number < 1e12){

        return (
            number / 1e9
        ).toFixed(2) + " mld";

    }


    if(number < 1e15){

        return (
            number / 1e12
        ).toFixed(2) + " bln";

    }


    return number.toExponential(2);

}


/* =========================================================
   UPDATE
========================================================= */

function updateUI(){

    document.getElementById(
        "entropy"
    ).textContent =

        format(entropy) +
        " entropii";


    document.getElementById(
        "production"
    ).textContent =

        "+" +
        format(getProduction()) +
        " / s";


    generators.forEach(
        (g,index) => {

            const generator =
                document.getElementById(
                    "generator-" + g.id
                );


            const unlocked =

                index === 0 ||

                generators[index - 1]
                .level > 0;


            generator.classList.remove(
                "locked",
                "available",
                "owned"
            );


            if(!unlocked){

                generator.classList.add(
                    "locked"
                );

            }

            else if(g.level === 0){

                generator.classList.add(
                    "available"
                );

            }

            else{

                generator.classList.add(
                    "owned"
                );

            }


            generator
            .querySelector(".level")
            .textContent =

                "x" + g.level;


            generator
            .querySelector(".generator-cost")
            .textContent =

                format(
                    generatorCost(g)
                ) +

                " entropii";


            /* MAIN LINE */

            if(
                index <
                generators.length - 1
            ){

                const line =

                    document.getElementById(
                        "main-line-" + index
                    );


                line.classList.toggle(

                    "active",

                    g.level > 0

                );

            }


            /* UPGRADES */

            g.upgrades.forEach(
                (u,uIndex) => {

                    const upgrade =

                        document.getElementById(

                            `upgrade-${g.id}-${uIndex}`

                        );


                    upgrade.classList.remove(
                        "locked",
                        "bought"
                    );


                    if(
                        g.level === 0
                    ){

                        upgrade.classList.add(
                            "locked"
                        );

                    }


                    if(
                        u.bought
                    ){

                        upgrade.classList.add(
                            "bought"
                        );


                        upgrade
                        .querySelector(
                            ".upgrade-effect"
                        )
                        .textContent =

                            "AKTYWNE";

                    }


                    const line =

                        document.getElementById(

                            `upgrade-line-${index}-${uIndex}`

                        );


                    line.classList.toggle(

                        "active",

                        g.level > 0

                    );

                }
            );

        }
    );

}


/* =========================================================

========================================================= */

let worldX = 0;

let worldY = 0;


let dragging = false;

let dragMoved = false;


let pointerStartX = 0;

let pointerStartY = 0;


let worldStartX = 0;

let worldStartY = 0;


function updateWorldPosition(){

    world.style.transform =

        `translate(${worldX}px, ${worldY}px)`;

}


/* =========================================================
   MOUSE DOWN
========================================================= */

viewport.addEventListener(

    "pointerdown",

    event => {

        if(
            event.target.closest(".generator") ||
            event.target.closest(".upgrade")
        ){

            return;

        }


        dragging = true;

        dragMoved = false;


        pointerStartX =
            event.clientX;


        pointerStartY =
            event.clientY;


        worldStartX =
            worldX;


        worldStartY =
            worldY;


        viewport.classList.add(
            "dragging"
        );


        viewport.setPointerCapture(
            event.pointerId
        );

    }

);


/* =========================================================
   MOUSE MOVE
========================================================= */

viewport.addEventListener(

    "pointermove",

    event => {

        if(!dragging){

            return;

        }


        const dx =

            event.clientX -
            pointerStartX;


        const dy =

            event.clientY -
            pointerStartY;


        if(
            Math.abs(dx) > 5 ||
            Math.abs(dy) > 5
        ){

            dragMoved = true;

        }


        worldX =

            worldStartX +
            dx;


        worldY =

            worldStartY +
            dy;


        updateWorldPosition();

    }

);


/* =========================================================
   MOUSE UP
========================================================= */

viewport.addEventListener(

    "pointerup",

    event => {

        if(!dragging){

            return;

        }


        dragging = false;


        viewport.classList.remove(
            "dragging"
        );


        if(!dragMoved){

            entropy +=
                clickPower;


            createClickNumber(

                event.clientX,

                event.clientY

            );


            updateUI();

        }

    }

);

/* =========================================================
   MATERIAŁ
========================================================= */

function makeMaterial(
    color,
    roughness = 0.55,
    metalness = 0.05
){

    return new THREE.MeshStandardMaterial({

        color:color,

        roughness:roughness,

        metalness:metalness

    });

}


/* =========================================================
   KULA
========================================================= */

function makeSphere(
    radius,
    color,
    segments = 20
){

    return new THREE.Mesh(

        new THREE.SphereGeometry(

            radius,

            segments,

            Math.max(
                12,
                segments - 4
            )

        ),

        makeMaterial(color)

    );

}


/* =========================================================
   BOND
========================================================= */

function addBond(
    group,
    start,
    end,
    radius = 0.055,
    color = 0xd0d5d3
){

    const startVector =

        new THREE.Vector3(
            start[0],
            start[1],
            start[2]
        );


    const endVector =

        new THREE.Vector3(
            end[0],
            end[1],
            end[2]
        );


    const direction =

        new THREE.Vector3()
        .subVectors(

            endVector,

            startVector

        );


    const length =
        direction.length();


    const mesh =

        new THREE.Mesh(

            new THREE.CylinderGeometry(

                radius,

                radius,

                length,

                10

            ),

            makeMaterial(
                color,
                0.35,
                0.12
            )

        );


    mesh.position

        .copy(startVector)

        .add(endVector)

        .multiplyScalar(0.5);


    mesh.quaternion.setFromUnitVectors(

        new THREE.Vector3(
            0,
            1,
            0
        ),

        direction
        .clone()
        .normalize()

    );


    group.add(mesh);

}


/* =========================================================
   CREATE 3D MODEL
========================================================= */

function create3DModel(
    canvas,
    type
){

    if(!THREE){

        return;

    }


    /* Czyścimy fallback */

    const context =
        canvas.getContext("2d");


    if(context){

        context.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }


    const renderer =

        new THREE.WebGLRenderer({

            canvas:canvas,

            alpha:true,

            antialias:true,

            powerPreference:"high-performance"

        });


    renderer.setSize(
        240,
        240,
        false
    );


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )

    );


    renderer.setClearColor(
        0x000000,
        0
    );


    const scene =
        new THREE.Scene();


    const camera =

        new THREE.PerspectiveCamera(

            34,

            1,

            0.1,

            100

        );


    camera.position.set(
        0,
        0,
        6
    );


    /* LIGHT */

    const ambient =

        new THREE.AmbientLight(

            0xffffff,

            1.7

        );


    scene.add(ambient);


    const keyLight =

        new THREE.DirectionalLight(

            0xffffff,

            3.5

        );


    keyLight.position.set(
        4,
        5,
        5
    );


    scene.add(keyLight);


    const blueLight =

        new THREE.DirectionalLight(

            0x4df0c5,

            2

        );


    blueLight.position.set(
        -4,
        1,
        -3
    );


    scene.add(blueLight);


    const group =
        new THREE.Group();


    scene.add(group);


    /* =====================================================
       AMINOKWAS
    ===================================================== */

    if(type === "amino"){

        const atoms = [

            {
                p:[0,0,0],
                r:.36,
                c:0x4d78c6
            },

            {
                p:[-.82,.1,.15],
                r:.32,
                c:0xd74949
            },

            {
                p:[.82,.15,-.1],
                r:.29,
                c:0xeaeaea
            },

            {
                p:[0,.83,.2],
                r:.27,
                c:0xffffff
            },

            {
                p:[-.95,-.67,-.18],
                r:.29,
                c:0xd74949
            },

            {
                p:[.45,-.72,.35],
                r:.24,
                c:0xf1f1f1
            }

        ];


        atoms.forEach(atom => {

            const mesh =

                makeSphere(
                    atom.r,
                    atom.c,
                    24
                );


            mesh.position.set(
                atom.p[0],
                atom.p[1],
                atom.p[2]
            );


            group.add(mesh);

        });


        addBond(
            group,
            [0,0,0],
            [-.82,.1,.15]
        );


        addBond(
            group,
            [0,0,0],
            [.82,.15,-.1]
        );


        addBond(
            group,
            [0,0,0],
            [0,.83,.2]
        );


        addBond(
            group,
            [-.82,.1,.15],
            [-.95,-.67,-.18]
        );


        addBond(
            group,
            [0,0,0],
            [.45,-.72,.35]
        );


        group.scale.setScalar(
            1.3
        );

    }


    /* =====================================================
       DNA
    ===================================================== */

    else if(type === "dna"){

        const count = 24;


        let previousA = null;

        let previousB = null;


        for(
            let i = 0;
            i < count;
            i++
        ){

            const y =
                (i - count/2) * .11;


            const angle =
                i * .52;


            const radius =
                .63;


            const aPosition = [

                Math.sin(angle) * radius,

                y,

                Math.cos(angle) * radius

            ];


            const bPosition = [

                -Math.sin(angle) * radius,

                y,

                -Math.cos(angle) * radius

            ];


            const a =

                makeSphere(
                    .095,
                    0x2ab9ef,
                    16
                );


            a.position.set(
                ...aPosition
            );


            const b =

                makeSphere(
                    .095,
                    0xc65bd0,
                    16
                );


            b.position.set(
                ...bPosition
            );


            group.add(
                a,
                b
            );


            if(
                i % 2 === 0
            ){

                addBond(

                    group,

                    aPosition,

                    bPosition,

                    .025,

                    0xdce3e2

                );

            }


            if(previousA){

                addBond(

                    group,

                    previousA,

                    aPosition,

                    .04,

                    0x29a9df

                );


                addBond(

                    group,

                    previousB,

                    bPosition,

                    .04,

                    0xb24cc3

                );

            }


            previousA =
                aPosition;


            previousB =
                bPosition;

        }


        group.rotation.z =
            .12;


        group.scale.setScalar(
            1.15
        );

    }


    /* =====================================================
       PROKARIOT
    ===================================================== */

    else if(type === "prokaryote"){

        const cell =

            makeSphere(
                1,
                0x4f8d62,
                32
            );


        cell.scale.set(
            1.45,
            .7,
            .72
        );


        group.add(cell);


        /* DNA */

        const dnaCurve =
            new THREE.CatmullRomCurve3([

                new THREE.Vector3(-.55,.1,.72),

                new THREE.Vector3(-.2,.38,.79),

                new THREE.Vector3(.25,.23,.81),

                new THREE.Vector3(.48,-.1,.76),

                new THREE.Vector3(.05,-.31,.78),

                new THREE.Vector3(-.4,-.18,.76)

            ]);


        const dnaTube =

            new THREE.Mesh(

                new THREE.TubeGeometry(

                    dnaCurve,

                    40,

                    .035,

                    8,

                    false

                ),

                makeMaterial(
                    0xd3e487
                )

            );


        group.add(dnaTube);


        /* rybosomy */

        for(
            let i = 0;
            i < 12;
            i++
        ){

            const dot =

                makeSphere(
                    .055,
                    0xe1e8a8,
                    10
                );


            const angle =
                i * 2.1;


            dot.position.set(

                Math.sin(angle) *
                (.3 + (i%3)*.18),

                Math.cos(angle*1.4) *
                .35,

                .7 +
                (i%2)*.04

            );


            group.add(dot);

        }


        /* wić */

        const flagellaCurve =

            new THREE.CatmullRomCurve3([

                new THREE.Vector3(1.25,0,0),

                new THREE.Vector3(1.8,.35,0),

                new THREE.Vector3(2.15,-.25,.15),

                new THREE.Vector3(2.55,.25,-.1)

            ]);


        const flagella =

            new THREE.Mesh(

                new THREE.TubeGeometry(

                    flagellaCurve,

                    30,

                    .035,

                    8,

                    false

                ),

                makeMaterial(
                    0x5bcda2
                )

            );


        group.add(flagella);


        group.scale.setScalar(
            .9
        );

    }


    /* =====================================================
       EUKARIOT
    ===================================================== */

    else if(type === "eukaryote"){

        const cell =

            makeSphere(
                1.25,
                0x376c7e,
                32
            );


        group.add(cell);


        const nucleus =

            makeSphere(
                .52,
                0x8759a0,
                24
            );


        nucleus.position.set(
            -.22,
            .12,
            .86
        );


        group.add(nucleus);


        for(
            let i = 0;
            i < 5;
            i++
        ){

            const mito =

                makeSphere(
                    .18,
                    0xc76850,
                    16
                );


            mito.scale.set(
                1.7,
                .7,
                .65
            );


            const angle =
                i * 1.35;


            mito.position.set(

                Math.cos(angle) *
                .7,

                Math.sin(angle) *
                .7,

                .75

            );


            mito.rotation.z =
                angle;


            group.add(mito);

        }


        group.scale.setScalar(
            .9
        );

    }


    /* =====================================================
       GĄBKA
    ===================================================== */

    else if(type === "sponge"){

        const heights = [
            1.7,
            1.25,
            2,
            1.4,
            1.65
        ];


        heights.forEach(
            (height,index) => {

                const tube =

                    new THREE.Mesh(

                        new THREE.CylinderGeometry(

                            .26,

                            .38,

                            height,

                            16,

                            1,

                            true

                        ),

                        makeMaterial(
                            0xd18a36,
                            .8
                        )

                    );


                tube.position.set(

                    (index - 2) * .34,

                    height/2 - .7,

                    (index%2) * .3 - .15

                );


                tube.rotation.z =

                    (index - 2) *
                    .04;


                group.add(tube);

            }
        );


        group.scale.setScalar(
            1.05
        );

    }


    /* =====================================================
       MEDUZA
    ===================================================== */

    else if(type === "jellyfish"){

        const dome =

            new THREE.Mesh(

                new THREE.SphereGeometry(

                    1,

                    32,

                    20,

                    0,

                    Math.PI*2,

                    0,

                    Math.PI/2

                ),

                new THREE.MeshStandardMaterial({

                    color:0x8195dd,

                    transparent:true,

                    opacity:.8,

                    roughness:.2

                })

            );


        dome.rotation.x =
            Math.PI;


        group.add(dome);


        for(
            let i = 0;
            i < 8;
            i++
        ){

            const x =
                (i - 3.5) * .17;


            const curve =

                new THREE.CatmullRomCurve3([

                    new THREE.Vector3(x,-.1,0),

                    new THREE.Vector3(
                        x+.1*Math.sin(i),
                        -.6,
                        .1*Math.cos(i)
                    ),

                    new THREE.Vector3(
                        x-.1*Math.cos(i),
                        -1.2,
                        -.1*Math.sin(i)
                    ),

                    new THREE.Vector3(
                        x+.15*Math.sin(i*2),
                        -1.75,
                        .1
                    )

                ]);


            const tentacle =

                new THREE.Mesh(

                    new THREE.TubeGeometry(

                        curve,

                        24,

                        .025,

                        6,

                        false

                    ),

                    makeMaterial(

                        .5
                    )

                );


            group.add(tentacle);

        }


        group.position.y =

        group.scale.setScalar(

        );

    }

       PŁAZINIEC
    ===================================================== */

    else if(type === "flatworm"){

        const body =

            );

            .25
        );

            );


        head.scale.set(

            .55,
            .45
        );


        head.position.x =

        group.add(head);


        const eye1 =

                10
            );


        eye1.position.set(

            .14,
            .38
        );


        const eye2 =

        eye2.position.set(

            .14,
            .43
        );


        group.add(
            eye1,
            eye2
        );


        group.scale.setScalar(
            1
        );

    }


    /* =====================================================
       RYBA
    ===================================================== */

    else if(type === "fish"){

        createAnimal(

        );

    }

       CZWORONÓG
    ===================================================== */

        );

    }


    /* =====================================================
       SSAK
    ===================================================== */

    else if(type === "mammal"){

        createAnimal(
            group,
            "mammal"
        );

    }


    /* =====================================================
       NACZELNE
    ===================================================== */

    else if(type === "primate"){

        createPrimate(
            group,
            false
        );

    }


    /* =====================================================
       CZŁOWIEK
    ===================================================== */

    else if(type === "human"){

        createPrimate(
            group,
            true
        );

    }


    threeAnimations.push({

        renderer:renderer,

        scene:scene,

        camera:camera,

        group:group,

        offset:
            Math.random() *
            Math.PI * 2

    });

}

   FISH / TETRAPOD / MAMMAL
========================================================= */

function createAnimal(
    group,
    type
){

    let color =
        0x478da4;


    if(type === "tetrapod"){

        color =
            0x638b48;

    }


    if(type === "mammal"){

        color =
            0x79624f;

    }


    const body =

        makeSphere(
            1,
            color,
            28
        );


    body.scale.set(
        1.35,
        .62,
        .58
    );


    group.add(body);


    const head =

        makeSphere(
            .48,
            color,
            24
        );


    head.position.set(
        1.16,
        .2,
        0
    );


    group.add(head);


    const eye =

        makeSphere(
            .07,
            0x050505,
            10
        );


    eye.position.set(
        1.48,
        .33,
        .34
    );


    group.add(eye);


    if(type === "fish"){

        const tail =

            new THREE.Mesh(

                new THREE.ConeGeometry(

                    .63,

                    .95,

                    3

                ),

                makeMaterial(
                    color
                )

            );


        tail.rotation.z =
            -Math.PI / 2;


        tail.position.x =
            -1.45;


        group.add(tail);


        const topFin =

            new THREE.Mesh(

                new THREE.ConeGeometry(

                    .35,

                    .7,

                    3

                ),

                makeMaterial(
                    0x36768b
                )

            );


        topFin.position.set(
            0,
            .75,
            0
        );


        group.add(topFin);

    }


    else{

        const positions = [

            [-.65,-.55,.38],
            [.55,-.55,.38],
            [-.65,-.55,-.38],
            [.55,-.55,-.38]

        ];


        positions.forEach(
            position => {

                const leg =

                    new THREE.Mesh(

                        new THREE.CylinderGeometry(

                            .1,

                            .13,

                            .85,

                            10

                        ),

                        makeMaterial(
                            color
                        )

                    );


                leg.position.set(
                    ...position
                );


                group.add(leg);

            }
        );


        const tailCurve =

            new THREE.CatmullRomCurve3([

                new THREE.Vector3(-1.2,0,0),

                new THREE.Vector3(-1.65,.1,.1),

                new THREE.Vector3(-1.9,.35,.15)

            ]);


        const tail =

            new THREE.Mesh(

                new THREE.TubeGeometry(

                    tailCurve,

                    18,

                    .07,

                    8,

                    false

                ),

                makeMaterial(
                    color
                )

            );


        group.add(tail);

    }


    group.scale.setScalar(
        .82
    );

}


/* =========================================================
   NACZELNY / CZŁOWIEK
========================================================= */

function createPrimate(
    group,
    human
){

    const skinColor =

        human
        ? 0xc58e6c
        : 0x755644;


    const torsoColor =

        human
        ? 0x416b8f
        : 0x5a4234;


    const torso =

        makeSphere(
            .72,
            torsoColor,
            28
        );


    torso.scale.set(
        .72,
        1.15,
        .55
    );


    group.add(torso);


    const head =

        makeSphere(
            .46,
            skinColor,
            28
        );


    head.position.y =
        1.12;


    group.add(head);


    const eye1 =

        makeSphere(
            .055,
            0x090909,
            10
        );


    eye1.position.set(
        -.15,
        1.18,
        .43
    );


    const eye2 =
        eye1.clone();


    eye2.position.x =
        .15;


    group.add(
        eye1,
        eye2
    );


    const limbMaterial =

        makeMaterial(
            human
            ? 0xb87f61
            : 0x644838
        );


    function limb(
        x,
        y,
        rotation,
        length
    ){

        const mesh =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    .105,

                    .135,

                    length,

                    10

                ),

                limbMaterial

            );


        mesh.position.set(
            x,
            y,
            0
        );


        mesh.rotation.z =
            rotation;


        group.add(mesh);

    }


    limb(
        -.68,
        .1,
        human ? .12 : .48,
        1.35
    );


    limb(
        .68,
        .1,
        human ? -.12 : -.48,
        1.35
    );


    limb(
        -.28,
        -1.02,
        human ? .04 : .18,
        1.5
    );


    limb(
        .28,
        -1.02,
        human ? -.04 : -.18,
        1.5
    );


    if(human){

        /* włosy */

        const hair =

            makeSphere(
                .43,
                0x36251f,
                24
            );


        hair.scale.set(
            1,
            .55,
            1
        );


        hair.position.set(
            0,
            1.35,
            -.08
        );


        group.add(hair);

    }


    group.scale.setScalar(
        .8
    );

}


/* =========================================================
   ANIMACJA

   360° / 5 sekund
========================================================= */

function animateThree(time){

    if(!THREE){

        return;

    }


    const seconds =
        time / 1000;


    threeAnimations.forEach(
        item => {

            item.group.rotation.y =

                item.offset +

                seconds *
                (
                    Math.PI * 2 / 5
                );


            item.group.rotation.x =

                Math.sin(
                    seconds * .45
                ) * .07;


            item.renderer.render(

                item.scene,

                item.camera

            );

        }
    );


    requestAnimationFrame(
        animateThree
    );

}
