<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ewolucja</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 50%,#16302a 0%,#0b1a18 35%,#050d0c 70%,#020606 100%);
}

/* ==============================
   TŁO
============================== */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
        radial-gradient(circle,#65e6c2 1px,transparent 1px),
        radial-gradient(circle,#ffffff 1px,transparent 1px);

    background-size:
        130px 130px,
        210px 210px;

    background-position:
        0 0,
        60px 80px;

    opacity:.08;
}


/* ==============================
   HUD
============================== */

#hud{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);

    width:410px;
    max-width:92%;

    background:rgba(9,14,13,.94);
    border:1px solid #52615d;
    border-radius:16px;

    padding:11px 20px;

    z-index:1000;

    box-shadow:
        0 8px 25px rgba(0,0,0,.65),
        inset 0 0 18px rgba(255,255,255,.03);
}

#entropy{
    font-size:27px;
    font-weight:bold;
}

#production{
    color:#72efc1;
    font-size:14px;
    margin-top:3px;
}

#hint{
    color:#8a9894;
    font-size:11px;
    margin-top:5px;
}


/* ==============================
   ŚWIAT
============================== */

#viewport{
    position:absolute;
    inset:0;

    overflow-y:auto;
    overflow-x:hidden;
}

#tree{
    position:relative;

    width:1100px;
    max-width:100%;

    height:3050px;

    margin:auto;
}


/* ==============================
   LINIE
============================== */

#connections{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;
    pointer-events:none;
}

.mainLine{
    stroke:#41675e;
    stroke-width:6;
    opacity:.45;
}

.mainLine.active{
    stroke:#37e8c1;

    opacity:1;

    filter:
        drop-shadow(0 0 5px #37e8c1);
}

.upgradeLine{
    stroke:#526c64;
    stroke-width:3;
    opacity:.5;
}

.upgradeLine.active{
    stroke:#39d9b6;
    opacity:.9;
}


/* ==============================
   GENERATOR
============================== */

.generator{
    position:absolute;

    left:50%;

    width:126px;
    height:126px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(circle at 40% 30%,#273633,#101716 58%,#050807 100%);

    border:4px solid #3f665d;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:20;

    cursor:pointer;

    perspective:600px;

    transition:
        transform .15s,
        border-color .2s,
        opacity .2s,
        box-shadow .2s;
}

.generator.available,
.generator.owned{
    border-color:#27e1bd;

    box-shadow:
        0 0 10px rgba(39,225,189,.8),
        0 0 28px rgba(39,225,189,.22),
        inset 0 0 16px rgba(39,225,189,.08);
}

.generator.locked{
    opacity:.27;
    cursor:default;
}

.generator:not(.locked):hover{
    transform:
        translate(-50%,-50%)
        scale(1.08);
}


/* ==============================
   MODEL 3D
============================== */

.model3d{
    width:88px;
    height:88px;

    transform-style:preserve-3d;

    animation:
        rotateModel 5s linear infinite;

    filter:
        drop-shadow(0 8px 6px rgba(0,0,0,.55));
}

.model3d svg{
    width:100%;
    height:100%;

    overflow:visible;
}

@keyframes rotateModel{

    0%{
        transform:
            rotateY(0deg)
            rotateX(8deg);
    }

    25%{
        transform:
            rotateY(90deg)
            rotateX(4deg);
    }

    50%{
        transform:
            rotateY(180deg)
            rotateX(-5deg);
    }

    75%{
        transform:
            rotateY(270deg)
            rotateX(4deg);
    }

    100%{
        transform:
            rotateY(360deg)
            rotateX(8deg);
    }

}


/* ==============================
   TEKST GENERATORA
============================== */

.level{
    position:absolute;

    right:-12px;
    top:-12px;

    min-width:39px;
    height:39px;

    padding:0 7px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#101312;

    border:2px solid #26332f;
    border-radius:25px;

    font-weight:bold;

    z-index:30;
}

.generatorName{
    position:absolute;

    top:132px;
    left:50%;

    transform:translateX(-50%);

    width:270px;

    text-align:center;

    font-size:19px;
    font-weight:bold;

    text-shadow:
        0 2px 4px #000,
        0 0 5px #000;
}

.generatorPrice{
    position:absolute;

    top:158px;
    left:50%;

    transform:translateX(-50%);

    white-space:nowrap;

    color:#47eac1;

    font-size:14px;
}


/* ==============================
   ULEPSZENIA
============================== */

.upgrade{
    position:absolute;

    width:190px;
    height:78px;

    transform:translate(-50%,-50%);

    display:grid;
    grid-template-columns:58px 1fr;

    align-items:center;

    padding:7px;

    background:
        linear-gradient(145deg,#202724,#111615);

    border:2px solid #53615c;
    border-radius:7px;

    box-shadow:
        0 5px 10px rgba(0,0,0,.55);

    cursor:pointer;

    z-index:15;

    transition:.15s;
}

.upgrade:hover{
    transform:
        translate(-50%,-50%)
        scale(1.05);
}

.upgrade.locked{
    opacity:.22;
    cursor:default;
}

.upgrade.bought{
    border-color:#32dbb4;

    background:
        linear-gradient(145deg,#164036,#0e2923);
}

.upgradeIcon{
    width:51px;
    height:51px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#0d1211;

    border:2px solid #485b55;
}

.upgradeIcon svg{
    width:42px;
    height:42px;
}

.upgradeText{
    padding-left:8px;
}

.upgradeTitle{
    font-size:13px;
    font-weight:bold;
}

.upgradeEffect{
    margin-top:3px;

    font-size:11px;

    color:#8dda72;
}

.upgradeCost{
    margin-top:2px;

    color:#46daba;

    font-size:11px;
}


/* ==============================
   +1 ENTROPII
============================== */

.clickText{
    position:fixed;

    z-index:3000;

    pointer-events:none;

    color:#56f4cd;

    font-size:21px;
    font-weight:bold;

    text-shadow:
        0 2px 3px #000;

    animation:
        floatClick .8s forwards;
}

@keyframes floatClick{

    from{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }

    to{
        opacity:0;

        transform:
            translate(-50%,-110px)
            scale(1.3);
    }

}

</style>
</head>

    ]
},

{

];


let entropy=0;
let clickPower=1;

generators.forEach(g=>{

    g.level=0;

    g.upgrades=
        g.upgrades.map(u=>({

            name:u[0],
            effect:u[1],
            cost:u[2],
            bought:false

        }));

});


const tree=
    document.getElementById("tree");

const connections=
    document.getElementById("connections");


/* ==========================================================
   TWORZENIE GENERATORÓW
========================================================== */

generators.forEach((g,index)=>{

    const element=
        document.createElement("div");

    element.className="generator";

    element.id="generator-"+g.id;

    element.style.top=g.y+"px";


    element.innerHTML=`

        <div class="level">
            x0
        </div>

        <div class="model3d">
            ${models[g.model]}
        </div>

        <div class="generatorName">
            ${g.name}
        </div>

        <div class="generatorPrice"></div>

    `;


    element.addEventListener(
        "click",
        e=>{

            e.stopPropagation();

            buyGenerator(index);

        }
    );


    tree.appendChild(element);


    createUpgrade(
        g,
        index,
        0,
        23
    );


    createUpgrade(
        g,
        index,
        1,
        77
    );

});


/* ==========================================================
   ULEPSZENIE
========================================================== */

function createUpgrade(g,gIndex,uIndex,x){

    const u=
        g.upgrades[uIndex];


    const element=
        document.createElement("div");


    element.className="upgrade";

    element.id=
        `upgrade-${g.id}-${uIndex}`;


    element.style.left=x+"%";

    element.style.top=g.y+"px";


    element.innerHTML=`

        <div class="upgradeIcon">

            ${upgradeSVG}

        </div>

        <div class="upgradeText">

            <div class="upgradeTitle">
                ${u.name}
            </div>

            <div class="upgradeEffect">
                +${u.effect*100}% produkcji
            </div>

            <div class="upgradeCost">
                ${format(u.cost)} entropii
            </div>

        </div>

    `;


    element.addEventListener(
        "click",
        e=>{

            e.stopPropagation();

            buyUpgrade(
                gIndex,
                uIndex
            );

        }
    );


    tree.appendChild(element);

}


/* ==========================================================
   KOSZT
========================================================== */

function generatorCost(g){

    return Math.floor(

        g.cost *
        Math.pow(
            1.17,
            g.level
        )

    );

}


/* ==========================================================
   KUPOWANIE GENERATORA
========================================================== */

function buyGenerator(index){

    const g=
        generators[index];


    if(
        index>0 &&
        generators[index-1].level===0
    ){
        return;
    }


    const cost=
        generatorCost(g);


    if(entropy<cost){
        return;
    }


    entropy-=cost;

    g.level++;


    update();

}


/* ==========================================================
   KUPOWANIE ULEPSZENIA
========================================================== */

function buyUpgrade(gIndex,uIndex){

    const g=
        generators[gIndex];

    const u=
        g.upgrades[uIndex];


    if(g.level===0){
        return;
    }


    if(u.bought){
        return;
    }


    if(entropy<u.cost){
        return;
    }


    entropy-=u.cost;

    u.bought=true;


    update();

}


/* ==========================================================
   MNOŻNIK
========================================================== */

function multiplier(g){

    let result=1;


    g.upgrades.forEach(u=>{

        if(u.bought){

            result+=u.effect;

        }

    });


    return result;

}


/* ==========================================================
   PRODUKCJA
========================================================== */

function production(){

    let result=0;


    generators.forEach(g=>{

        result+=

            g.production *

            g.level *

            multiplier(g);

    });


    return result;

}


/* ==========================================================
   FORMATOWANIE
========================================================== */

function format(n){

    if(n<1000)
        return Math.floor(n).toString();


    if(n<1e6)
        return (n/1e3).toFixed(1)+" tys.";


    if(n<1e9)
        return (n/1e6).toFixed(2)+" mln";


    if(n<1e12)
        return (n/1e9).toFixed(2)+" mld";


    if(n<1e15)
        return (n/1e12).toFixed(2)+" bln";


    return n.toExponential(2);

}


/* ==========================================================
   LINIE
========================================================== */

function drawLines(){

    connections.innerHTML="";

    const width=
        tree.clientWidth;


    /* PIONOWA GŁÓWNA LINIA */

    for(
        let i=0;
        i<generators.length-1;
        i++
    ){

        const a=
            generators[i];

        const b=
            generators[i+1];


        const line=
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );


        line.setAttribute(
            "x1",
            width/2
        );

        line.setAttribute(
            "y1",
            a.y
        );

        line.setAttribute(
            "x2",
            width/2
        );

        line.setAttribute(
            "y2",
            b.y
        );


        line.classList.add(
            "mainLine"
        );


        line.id=
            "main-"+i;


        connections.appendChild(line);

    }


    /* LINIE ULEPSZEŃ */

    generators.forEach((g,index)=>{

        [23,77].forEach(
            (x,uIndex)=>{

            const line=
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line.setAttribute(
                "x1",
                width/2
            );

            line.setAttribute(
                "y1",
                g.y
            );

            line.setAttribute(
                "x2",
                width*x/100
            );

            line.setAttribute(
                "y2",
                g.y
            );


            line.classList.add(
                "upgradeLine"
            );


            line.id=
                `upline-${index}-${uIndex}`;


            connections.appendChild(line);

        });

    });

}


/* ==========================================================
   UI
========================================================== */

function update(){

    document.getElementById(
        "entropy"
    ).textContent=

        format(entropy)+
        " entropii";


    document.getElementById(
        "production"
    ).textContent=

        "+"+
        format(production())+
        " / s";


    generators.forEach((g,index)=>{

        const element=
            document.getElementById(
                "generator-"+g.id
            );


        const unlocked=

            index===0 ||

            generators[index-1]
            .level>0;


        element.classList.remove(
            "locked",
            "available",
            "owned"
        );


        if(!unlocked){

            element.classList.add(
                "locked"
            );

        }

        else if(g.level===0){

            element.classList.add(
                "available"
            );

        }

        else{

            element.classList.add(
                "owned"
            );

        }


        element.querySelector(
            ".level"
        ).textContent=

            "x"+g.level;


        element.querySelector(
            ".generatorPrice"
        ).textContent=

            format(
                generatorCost(g)
            )+
            " entropii";


        g.upgrades.forEach((u,uIndex)=>{

            const upgrade=
                document.getElementById(
                    `upgrade-${g.id}-${uIndex}`
                );


            upgrade.classList.remove(
                "locked",
                "bought"
            );


            if(g.level===0){

                upgrade.classList.add(
                    "locked"
                );

            }


            if(u.bought){

                upgrade.classList.add(
                    "bought"
                );


                upgrade.querySelector(
                    ".upgradeEffect"
                ).textContent=
                    "AKTYWNE";

            }

        });


        if(index<generators.length-1){

            const line=
                document.getElementById(
                    "main-"+index
                );


            if(g.level>0){

                line.classList.add(
                    "active"
                );

            }else{

                line.classList.remove(
                    "active"
                );

            }

        }


        g.upgrades.forEach((u,uIndex)=>{

            const line=
                document.getElementById(
                    `upline-${index}-${uIndex}`
                );


            if(g.level>0){

                line.classList.add(
                    "active"
                );

            }else{

                line.classList.remove(
                    "active"
                );

            }

        });

    });

}


/* ==========================================================
   KLIKANIE TŁA
========================================================== */

document.addEventListener(
    "click",
    e=>{

        if(
            e.target.closest(".generator") ||
            e.target.closest(".upgrade") ||
            e.target.closest("#hud")
        ){
            return;
        }


        entropy+=clickPower;


        const text=
            document.createElement("div");


        text.className=
            "clickText";


        text.textContent=
            "+"+clickPower;


        text.style.left=
            e.clientX+"px";

        text.style.top=
            e.clientY+"px";


        document.body.appendChild(text);


        setTimeout(
            ()=>text.remove(),
            800
        );


        update();

    }
);


/* ==========================================================
   PRODUKCJA AUTOMATYCZNA
========================================================== */

setInterval(
    ()=>{

        entropy+=
            production()/10;


        update();

    },
    100
);


/* ==========================================================
   START
========================================================== */

drawLines();

update();


window.addEventListener(
    "resize",
    ()=>{

        drawLines();

        update();

    }
);


window.addEventListener(
    "load",
    ()=>{

        const viewport=
            document.getElementById(
                "viewport"
            );


        viewport.scrollTop=
            viewport.scrollHeight -
            viewport.clientHeight;

    }
);

</script>
