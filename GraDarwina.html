<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ewolucja 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:white;

    background:
        radial-gradient(circle at 50% 50%,#18362f,#0b1b18 45%,#030908 100%);
}

/* =====================================================
   HUD
===================================================== */

#hud{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%);

    width:390px;
    max-width:90%;

    padding:11px 18px;

    background:rgba(8,14,13,.94);
    border:1px solid #52645e;
    border-radius:15px;

    z-index:500;

    box-shadow:0 6px 25px rgba(0,0,0,.65);

    pointer-events:auto;
}

#entropy{
    font-size:25px;
    font-weight:bold;
}

#perSecond{
    color:#55e5ba;
    margin-top:3px;
}

#help{
    color:#82918c;
    font-size:11px;
    margin-top:5px;
}


/* =====================================================
   VIEWPORT

   Nie scrollujemy.

   Przesuwamy cały świat transformacją translate().
===================================================== */

#viewport{
    position:absolute;
    inset:0;

    overflow:hidden;

    cursor:grab;

    touch-action:none;
}

#viewport.dragging{
    cursor:grabbing;
}


/* =====================================================
   CAŁY ŚWIAT
===================================================== */

#world{
    position:absolute;

    width:1400px;
    height:3300px;

    left:0;
    top:0;

    transform-origin:0 0;
}


/* =====================================================
   SVG Z LINIAMI
===================================================== */

#connections{
    position:absolute;
    inset:0;

    width:1400px;
    height:3300px;

    pointer-events:none;

    z-index:1;
}

.mainLine{
    stroke:#50645e;
    stroke-width:6;
    opacity:.55;
}

.mainLine.active{
    stroke:#36e4bd;

    opacity:1;

    filter:
        drop-shadow(0 0 4px #36e4bd);
}

.upgradeLine{
    stroke:#536760;
    stroke-width:3;
    opacity:.6;
}

.upgradeLine.active{
    stroke:#37d7b4;
    opacity:1;
}


/* =====================================================
   GENERATOR
===================================================== */

.generator{
    position:absolute;

    left:700px;

    width:136px;
    height:136px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(circle at 40% 30%,#273833,#0c1210 68%,#030504);

    border:4px solid #41695f;

    z-index:20;

    cursor:pointer;

    box-shadow:
        inset 0 0 18px rgba(255,255,255,.04);

    transition:
        border-color .2s,
        box-shadow .2s,
        opacity .2s,
        transform .15s;
}

.generator.available,
.generator.owned{
    border-color:#25e4bb;

    box-shadow:
        0 0 10px rgba(37,228,187,.8),
        0 0 30px rgba(37,228,187,.23),
        inset 0 0 20px rgba(37,228,187,.06);
}

.generator.locked{
    opacity:.25;
}

.generator:not(.locked):hover{
    transform:
        translate(-50%,-50%)
        scale(1.07);
}


/* =====================================================
   PRAWDZIWY CANVAS 3D
===================================================== */

.modelCanvas{
    position:absolute;

    width:116px;
    height:116px;

    left:6px;
    top:6px;

    border-radius:50%;

    pointer-events:none;
}


/* =====================================================
   LEVEL
===================================================== */

.level{
    position:absolute;

    right:-11px;
    top:-11px;

    min-width:40px;
    height:40px;

    padding:0 6px;

    border-radius:22px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#101513;

    border:2px solid #26332f;

    font-weight:bold;

    z-index:40;
}


/* =====================================================
   NAZWA
===================================================== */

.generatorName{
    position:absolute;

    left:50%;
    top:142px;

    transform:translateX(-50%);

    width:300px;

    text-align:center;

    font-size:20px;
    font-weight:bold;

    text-shadow:
        0 2px 4px black,
        0 0 5px black;

    pointer-events:none;
}

.generatorCost{
    position:absolute;

    left:50%;
    top:169px;

    transform:translateX(-50%);

    white-space:nowrap;

    color:#4ee6c0;

    font-size:14px;

    pointer-events:none;
}


/* =====================================================
   ULEPSZENIA
===================================================== */

.upgrade{
    position:absolute;

    width:210px;
    height:82px;

    transform:translate(-50%,-50%);

    display:grid;

    grid-template-columns:58px 1fr;

    align-items:center;

    background:
        linear-gradient(145deg,#222a27,#111715);

    border:2px solid #56655f;
    border-radius:7px;

    padding:8px;

    z-index:15;

    cursor:pointer;

    box-shadow:
        0 5px 10px rgba(0,0,0,.55);

    transition:.15s;
}

.upgrade:hover{
    transform:
        translate(-50%,-50%)
        scale(1.05);
}

.upgrade.locked{
    opacity:.22;
}

.upgrade.bought{
    border-color:#42ddb8;

    background:
        linear-gradient(145deg,#174139,#102a25);
}

.upgradeIcon{
    width:52px;
    height:52px;

    border:2px solid #4e625b;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#0b100f;
}

.upgradeIcon svg{
    width:43px;
    height:43px;
}

.upgradeText{
    padding-left:8px;
}

.upgradeName{
    font-size:13px;
    font-weight:bold;
}

.upgradeEffect{
    color:#92df74;
    font-size:11px;
    margin-top:4px;
}

.upgradeCost{
    color:#45dcb8;
    font-size:11px;
    margin-top:2px;
}


/* =====================================================
   +ENTROPIA
===================================================== */

.clickText{
    position:fixed;

    pointer-events:none;

    color:#53efca;

    font-weight:bold;
    font-size:21px;

    z-index:1000;

    animation:clickFloat .8s forwards;

    text-shadow:0 2px 3px #000;
}

@keyframes clickFloat{
    from{
        opacity:1;
        transform:translate(-50%,-50%);
    }

    to{
        opacity:0;
        transform:translate(-50%,-100px) scale(1.25);
    }
}


/* =====================================================
   INFORMACJA PRZY ŁADOWANIU THREE
===================================================== */

#threeStatus{
    position:fixed;

    bottom:15px;
    left:15px;

    background:rgba(0,0,0,.7);

    padding:8px 12px;

    border-radius:8px;

    font-size:12px;

    color:#aaa;

    z-index:500;
}

</style>
</head>

<body>


<div id="hud">

    <div id="entropy">
        0 entropii
    </div>

    <div id="perSecond">
        +0 / s
    </div>

    <div id="help">
        Przeciągnij tło = poruszanie • kliknij tło = entropia
    </div>

</div>


<div id="threeStatus">
    Ładowanie modeli 3D...
</div>


<div id="viewport">

    <div id="world">

        <svg id="connections"></svg>

    </div>

</div>


<script type="module">

/* =========================================================
   THREE.JS
========================================================= */

let THREE;

try{

    THREE = await import(
        "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm"
    );

    document.getElementById("threeStatus").remove();

}
catch(error){

    document.getElementById("threeStatus").textContent =
        "Nie udało się załadować Three.js.";

    throw error;

}


/* =========================================================
   DANE
========================================================= */

const generators = [

{
    id:"amino",
    name:"Aminokwas",
    y:3000,

    cost:10,
    production:.2,

    model:"amino",

    upgrades:[
        ["Więcej aminokwasów",.5,80],
        ["Łączenie aminokwasów",.5,120]
    ]
},

{
    id:"dna",
    name:"DNA",
    y:2750,

    cost:60,
    production:1,

    model:"dna",

    upgrades:[
        ["Replikacja DNA",.5,350],
        ["Naprawa DNA",.5,450]
    ]
},

{
    id:"prokaryote",
    name:"Komórka prokariotyczna",
    y:2500,

    cost:300,
    production:5,

    model:"prokaryote",

    upgrades:[
        ["Błona komórkowa",.5,1500],
        ["Rybosomy",.5,1800]
    ]
},

{
    id:"eukaryote",
    name:"Komórka eukariotyczna",
    y:2250,

    cost:1500,
    production:18,

    model:"eukaryote",

    upgrades:[
        ["Jądro komórkowe",.5,8000],
        ["Mitochondria",.5,9500]
    ]
},

{
    id:"sponge",
    name:"Gąbka",
    y:2000,

    cost:8000,
    production:60,

    model:"sponge",

    upgrades:[
        ["Choanocyty",.5,40000],
        ["Lepszy przepływ wody",.5,50000]
    ]
},

{
    id:"jellyfish",
    name:"Meduza",
    y:1750,

    cost:40000,
    production:200,

    model:"jellyfish",

    upgrades:[
        ["Parzydełka",.5,200000],
        ["Sieć nerwowa",.5,250000]
    ]
},

{
    id:"flatworm",
    name:"Płaziniec",
    y:1500,

    cost:200000,
    production:700,

    model:"flatworm",

    upgrades:[
        ["Symetria dwuboczna",.5,1000000],
        ["Cefalizacja",.5,1250000]
    ]
},

{
    id:"fish",
    name:"Ryba",
    y:1250,

    cost:1000000,
    production:2400,

    model:"fish",

    upgrades:[
        ["Wydajniejsze skrzela",.5,5000000],
        ["Lepsze płetwy",.5,6000000]
    ]
},

{
    id:"tetrapod",
    name:"Czworonóg",
    y:1000,

    cost:5000000,
    production:8500,

    model:"tetrapod",

    upgrades:[
        ["Silniejsze kończyny",.5,25000000],
        ["Lepsze płuca",.5,30000000]
    ]
},

{
    id:"mammal",
    name:"Ssak",
    y:750,

    cost:25000000,
    production:30000,

    model:"mammal",

    upgrades:[
        ["Stałocieplność",.5,125000000],
        ["Opieka nad młodymi",.5,150000000]
    ]
},

{
    id:"primate",
    name:"Naczelne",
    y:500,

    cost:125000000,
    production:110000,

    model:"primate",

    upgrades:[
        ["Chwytne dłonie",.5,600000000],
        ["Większy mózg",.5,750000000]
    ]
},

{
    id:"human",
    name:"Człowiek",
    y:250,

    cost:650000000,
    production:400000,

    model:"human",

    upgrades:[
        ["Mowa",.5,3000000000],
        ["Myślenie abstrakcyjne",.5,4000000000]
    ]
}

];


generators.forEach(g=>{

    g.level=0;

    g.upgrades=g.upgrades.map(u=>({

        name:u[0],
        bonus:u[1],
        cost:u[2],
        bought:false

    }));

});


let entropy=0;

const WORLD_WIDTH=1400;

const world=
    document.getElementById("world");

const viewport=
    document.getElementById("viewport");

const connections=
    document.getElementById("connections");


/* =========================================================
   PROSTA IKONA UPGRADE
========================================================= */

const upgradeSVG=`

<svg viewBox="0 0 100 100">

<circle
cx="50"
cy="50"
r="30"
fill="#266e5d"
stroke="#79e4c9"
stroke-width="5"
/>

<path
d="M50 28 V72 M28 50 H72"
stroke="#dcfff7"
stroke-width="9"
stroke-linecap="round"
/>

</svg>

`;


/* =========================================================
   GENEROWANIE HTML
========================================================= */

generators.forEach((g,index)=>{

    const generator=
        document.createElement("div");

    generator.className="generator";

    generator.id="generator-"+g.id;

    generator.style.top=
        g.y+"px";


    const canvas=
        document.createElement("canvas");

    canvas.className=
        "modelCanvas";

    canvas.width=230;
    canvas.height=230;

    generator.appendChild(canvas);


    const level=
        document.createElement("div");

    level.className="level";

    level.textContent="x0";

    generator.appendChild(level);


    const name=
        document.createElement("div");

    name.className=
        "generatorName";

    name.textContent=
        g.name;

    generator.appendChild(name);


    const cost=
        document.createElement("div");

    cost.className=
        "generatorCost";

    generator.appendChild(cost);


    generator.addEventListener(
        "pointerdown",
        e=>e.stopPropagation()
    );


    generator.addEventListener(
        "click",
        e=>{

            e.stopPropagation();

            buyGenerator(index);

        }
    );


    world.appendChild(generator);


    createUpgrade(
        g,
        index,
        0,
        430
    );


    createUpgrade(
        g,
        index,
        1,
        970
    );


    create3DModel(
        canvas,
        g.model
    );

});


/* =========================================================
   UPGRADE
========================================================= */

function createUpgrade(
    generator,
    gIndex,
    uIndex,
    x
){

    const upgrade=
        generator.upgrades[uIndex];


    const element=
        document.createElement("div");


    element.className="upgrade";

    element.id=
        `upgrade-${generator.id}-${uIndex}`;

    element.style.left=
        x+"px";

    element.style.top=
        generator.y+"px";


    element.innerHTML=`

        <div class="upgradeIcon">
            ${upgradeSVG}
        </div>

        <div class="upgradeText">

            <div class="upgradeName">
                ${upgrade.name}
            </div>

            <div class="upgradeEffect">
                +${upgrade.bonus*100}% produkcji
            </div>

            <div class="upgradeCost">
                ${format(upgrade.cost)} entropii
            </div>

        </div>

    `;


    element.addEventListener(
        "pointerdown",
        e=>e.stopPropagation()
    );


    element.addEventListener(
        "click",
        e=>{

            e.stopPropagation();

            buyUpgrade(
                gIndex,
                uIndex
            );

        }
    );


    world.appendChild(element);

}


/* =========================================================
   MODELE THREE.JS
========================================================= */

const animations=[];


/* ---------------------------------------------------------
   MATERIAŁ
--------------------------------------------------------- */

function material(
    color,
    roughness=.55,
    metalness=.05
){

    return new THREE.MeshStandardMaterial({

        color,
        roughness,
        metalness

    });

}


/* ---------------------------------------------------------
   KULA
--------------------------------------------------------- */

function sphere(
    radius,
    color
){

    const mesh=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                radius,
                20,
                16
            ),

            material(color)

        );


    return mesh;

}


/* ---------------------------------------------------------
   MODEL
--------------------------------------------------------- */

function create3DModel(
    canvas,
    type
){

    const renderer=
        new THREE.WebGLRenderer({

            canvas,
            alpha:true,
            antialias:true

        });


    renderer.setSize(
        230,
        230,
        false
    );


    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio,
            2
        )
    );


    const scene=
        new THREE.Scene();


    const camera=
        new THREE.PerspectiveCamera(
            35,
            1,
            .1,
            100
        );


    camera.position.set(
        0,
        0,
        7
    );


    /* ŚWIATŁO */

    scene.add(
        new THREE.AmbientLight(
            0xffffff,
            1.6
        )
    );


    const keyLight=
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    keyLight.position.set(
        4,
        6,
        5
    );

    scene.add(keyLight);


    const rim=
        new THREE.DirectionalLight(
            0x46e8c2,
            2
        );

    rim.position.set(
        -5,
        1,
        -3
    );

    scene.add(rim);


    const group=
        new THREE.Group();


    scene.add(group);


    /* =====================================================
       AMINOKWAS
    ===================================================== */

    if(type==="amino"){

        const atoms=[

            [-.8,0,0,.38,0xe74c4c],
            [0,0,0,.42,0x668ed2],
            [.85,.25,0,.32,0xffffff],
            [0,.9,.1,.30,0xffffff],
            [-.9,-.75,.2,.32,0xe74c4c]

        ];


        atoms.forEach(a=>{

            const atom=
                sphere(
                    a[3],
                    a[4]
                );

            atom.position.set(
                a[0],
                a[1],
                a[2]
            );

            group.add(atom);

        });


        addBond(
            group,
            [-.8,0,0],
            [0,0,0]
        );

        addBond(
            group,
            [0,0,0],
            [.85,.25,0]
        );

        addBond(
            group,
            [0,0,0],
            [0,.9,.1]
        );

        addBond(
            group,
            [-.8,0,0],
            [-.9,-.75,.2]
        );

    }


    /* =====================================================
       DNA – PRAWDZIWA SPIRALA
    ===================================================== */

    else if(type==="dna"){

        const blue=
            material(0x29b8ef);

        const purple=
            material(0xb967db);


        for(let i=0;i<18;i++){

            const y=
                (i-8.5)*.18;

            const angle=
                i*.65;


            const x1=
                Math.sin(angle)*.6;

            const z1=
                Math.cos(angle)*.6;


            const x2=
                -x1;

            const z2=
                -z1;


            const a=
                sphere(.12,0x29b8ef);

            a.position.set(
                x1,y,z1
            );


            const b=
                sphere(.12,0xb967db);

            b.position.set(
                x2,y,z2
            );


            group.add(a,b);


            if(i%2===0){

                addBond(
                    group,
                    [x1,y,z1],
                    [x2,y,z2],
                    .04
                );

            }

        }

    }


    /* =====================================================
       PROKARIOT
    ===================================================== */

    else if(type==="prokaryote"){

        const cell=
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    1,
                    28,
                    20
                ),

                material(0x57946b)

            );


        cell.scale.set(
            1.45,
            .72,
            .72
        );


        group.add(cell);


        for(let i=0;i<10;i++){

            const dot=
                sphere(
                    .07,
                    0xd4e99c
                );

            dot.position.set(
                Math.random()*1.6-.8,
                Math.random()*.65-.325,
                .68
            );

            group.add(dot);

        }


        group.rotation.z=.18;

    }


    /* =====================================================
       EUKARIOT
    ===================================================== */

    else if(type==="eukaryote"){

        const cell=
            sphere(
                1.25,
                0x47778b
            );


        group.add(cell);


        const nucleus=
            sphere(
                .48,
                0x9162a0
            );

        nucleus.position.set(
            -.2,
            .1,
            .85
        );

        group.add(nucleus);


        for(let i=0;i<4;i++){

            const mito=
                sphere(
                    .18,
                    0xd47d5c
                );

            mito.scale.set(
                1.6,
                .65,
                .65
            );


            mito.position.set(
                Math.cos(i*1.6)*.65,
                Math.sin(i*1.8)*.65,
                .75
            );


            group.add(mito);

        }

    }


    /* =====================================================
       GĄBKA
    ===================================================== */

    else if(type==="sponge"){

        for(let i=0;i<5;i++){

            const radius=
                .35+
                Math.random()*.16;


            const height=
                1+
                Math.random()*1.2;


            const tube=
                new THREE.Mesh(

                    new THREE.CylinderGeometry(
                        radius*.75,
                        radius,
                        height,
                        14,
                        1,
                        true
                    ),

                    material(
                        0xd58b37,
                        .8
                    )

                );


            tube.position.set(

                (i-2)*.38,

                height/2-.7,

                (i%2)*.22-.1

            );


            group.add(tube);

        }

    }


    /* =====================================================
       MEDUZA
    ===================================================== */

    else if(type==="jellyfish"){

        const head=
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    1.05,
                    28,
                    18,
                    0,
                    Math.PI*2,
                    0,
                    Math.PI/2
                ),

                new THREE.MeshStandardMaterial({

                    color:0x8fa1e6,

                    transparent:true,

                    opacity:.82,

                    roughness:.25

                })

            );


        head.rotation.x=
            Math.PI;


        group.add(head);


        for(let i=0;i<7;i++){

            const tentacle=
                new THREE.Mesh(

                    new THREE.CylinderGeometry(
                        .035,
                        .06,
                        1.5,
                        8
                    ),

                    material(
                        0xa47bd2
                    )

                );


            tentacle.position.set(
                (i-3)*.2,
                -.8,
                Math.sin(i)*.2
            );


            tentacle.rotation.z=
                Math.sin(i)*.15;


            group.add(tentacle);

        }

    }


    /* =====================================================
       PŁAZINIEC
    ===================================================== */

    else if(type==="flatworm"){

        const worm=
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    1,
                    30,
                    18
                ),

                material(
                    0xb85f56,
                    .8
                )

            );


        worm.scale.set(
            1.5,
            .42,
            .18
        );


        group.add(worm);


        const eye1=
            sphere(
                .07,
                0x111111
            );

        eye1.position.set(
            -.75,
            .12,
            .2
        );


        const eye2=
            eye1.clone();

        eye2.position.x=
            -.55;


        group.add(
            eye1,
            eye2
        );

    }


    /* =====================================================
       RYBA
    ===================================================== */

    else if(type==="fish"){

        makeAnimalBody(
            group,
            0x428ca5,
            "fish"
        );

    }


    /* =====================================================
       CZWORONÓG
    ===================================================== */

    else if(type==="tetrapod"){

        makeAnimalBody(
            group,
            0x668d49,
            "tetrapod"
        );

    }


    /* =====================================================
       SSAK
    ===================================================== */

    else if(type==="mammal"){

        makeAnimalBody(
            group,
            0x756252,
            "mammal"
        );

    }


    /* =====================================================
       NACZELNE
    ===================================================== */

    else if(type==="primate"){

        makePrimate(
            group,
            false
        );

    }


    /* =====================================================
       CZŁOWIEK
    ===================================================== */

    else if(type==="human"){

        makePrimate(
            group,
            true
        );

    }


    /* SKALA */

    group.scale.setScalar(
        .85
    );


    /* KAŻDY MODEL MA SWOJĄ FAZĘ */

    animations.push({

        renderer,
        scene,
        camera,
        group,

        offset:
            Math.random()*
            Math.PI*2

    });

}


/* =========================================================
   ŁĄCZENIE ATOMÓW
========================================================= */

function addBond(
    group,
    start,
    end,
    radius=.065
){

    const startVec=
        new THREE.Vector3(
            ...start
        );

    const endVec=
        new THREE.Vector3(
            ...end
        );


    const direction=
        new THREE.Vector3()
        .subVectors(
            endVec,
            startVec
        );


    const length=
        direction.length();


    const cylinder=
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                radius,
                radius,
                length,
                10
            ),

            material(
                0xc8cecd,
                .4,
                .15
            )

        );


    cylinder.position
        .copy(startVec)
        .add(endVec)
        .multiplyScalar(.5);


    cylinder.quaternion
        .setFromUnitVectors(

            new THREE.Vector3(
                0,1,0
            ),

            direction
                .clone()
                .normalize()

        );


    group.add(
        cylinder
    );

}


/* =========================================================
   ZWIERZĘTA 3D
========================================================= */

function makeAnimalBody(
    group,
    color,
    type
){

    const body=
        sphere(
            1,
            color
        );


    body.scale.set(
        1.35,
        .63,
        .55
    );


    group.add(body);


    const head=
        sphere(
            .48,
            color
        );


    head.position.set(
        1.15,
        .22,
        0
    );


    group.add(head);


    const eye=
        sphere(
            .07,
            0x050505
        );


    eye.position.set(
        1.48,
        .34,
        .35
    );


    group.add(eye);


    if(type==="fish"){

        const tail=
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    .55,
                    .9,
                    3
                ),

                material(color)

            );


        tail.rotation.z=
            Math.PI/2;


        tail.position.x=
            -1.45;


        group.add(tail);

    }

    else{

        const legPositions=[
            [-.65,-.55,.35],
            [.55,-.55,.35],
            [-.65,-.55,-.35],
            [.55,-.55,-.35]
        ];


        legPositions.forEach(pos=>{

            const leg=
                new THREE.Mesh(

                    new THREE.CylinderGeometry(
                        .10,
                        .13,
                        .9,
                        10
                    ),

                    material(color)

                );


            leg.position.set(
                ...pos
            );


            group.add(leg);

        });

    }

}


/* =========================================================
   NACZELNY / CZŁOWIEK
========================================================= */

function makePrimate(
    group,
    human
){

    const skin=
        human
        ? 0xc8936f
        : 0x70503d;


    const torso=
        sphere(
            .7,
            human
                ? 0x426b91
                : 0x5c4436
        );


    torso.scale.set(
        .7,
        1.25,
        .55
    );


    group.add(torso);


    const head=
        sphere(
            .48,
            skin
        );


    head.position.y=
        1.25;


    group.add(head);


    const limbMat=
        material(
            human
                ? 0xb98363
                : 0x604638
        );


    function limb(
        x,
        y,
        z,
        h,
        rot
    ){

        const m=
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .11,
                    .14,
                    h,
                    10
                ),

                limbMat

            );


        m.position.set(
            x,y,z
        );


        m.rotation.z=
            rot;


        group.add(m);

    }


    limb(
        -.62,
        .2,
        0,
        1.35,
        human ? .18 : .6
    );


    limb(
        .62,
        .2,
        0,
        1.35,
        human ? -.18 : -.6
    );


    limb(
        -.3,
        -1,
        0,
        1.45,
        human ? .05 : .25
    );


    limb(
        .3,
        -1,
        0,
        1.45,
        human ? -.05 : -.25
    );

}


/* =========================================================
   JEDNA PĘTLA ANIMACJI DLA WSZYSTKICH MODELI

   1 obrót = 5 sekund.
========================================================= */

function animate(time){

    const seconds=
        time/1000;


    animations.forEach(a=>{

        a.group.rotation.y=

            a.offset +

            seconds *
            (
                Math.PI*2/5
            );


        a.group.rotation.x=
            Math.sin(
                seconds*.45
            )*.08;


        a.renderer.render(
            a.scene,
            a.camera
        );

    });


    requestAnimationFrame(
        animate
    );

}


requestAnimationFrame(
    animate
);


/* =========================================================
   KOSZT GENERATORA
========================================================= */

function generatorCost(g){

    return Math.floor(

        g.cost *

        Math.pow(
            1.17,
            g.level
        )

    );

}


/* =========================================================
   MNOŻNIK
========================================================= */

function multiplier(g){

    let value=1;


    g.upgrades.forEach(u=>{

        if(u.bought){

            value+=u.bonus;

        }

    });


    return value;

}


/* =========================================================
   PRODUKCJA
========================================================= */

function totalProduction(){

    let total=0;


    generators.forEach(g=>{

        total+=

            g.production *

            g.level *

            multiplier(g);

    });


    return total;

}


/* =========================================================
   KUPOWANIE GENERATORA
========================================================= */

function buyGenerator(index){

    const g=
        generators[index];


    if(
        index>0 &&
        generators[index-1].level===0
    ){
        return;
    }


    const price=
        generatorCost(g);


    if(entropy<price){
        return;
    }


    entropy-=price;

    g.level++;


    updateUI();

}


/* =========================================================
   KUPOWANIE UPGRADE
========================================================= */

function buyUpgrade(
    generatorIndex,
    upgradeIndex
){

    const g=
        generators[generatorIndex];

    const u=
        g.upgrades[upgradeIndex];


    if(g.level===0)
        return;


    if(u.bought)
        return;


    if(entropy<u.cost)
        return;


    entropy-=u.cost;

    u.bought=true;


    updateUI();

}


/* =========================================================
   FORMAT
========================================================= */

function format(n){

    if(n<1e3)
        return Math.floor(n).toString();


    if(n<1e6)
        return (n/1e3).toFixed(1)+" tys.";


    if(n<1e9)
        return (n/1e6).toFixed(2)+" mln";


    if(n<1e12)
        return (n/1e9).toFixed(2)+" mld";


    if(n<1e15)
        return (n/1e12).toFixed(2)+" bln";


    return n.toExponential(2);

}


/* =========================================================
   LINIE
========================================================= */

function drawLines(){

    connections.innerHTML="";


    for(
        let i=0;
        i<generators.length-1;
        i++
    ){

        const a=
            generators[i];

        const b=
            generators[i+1];


        createLine(
            700,
            a.y,
            700,
            b.y,
            "mainLine",
            "main-"+i
        );

    }


    generators.forEach(
        (g,index)=>{

            createLine(
                700,
                g.y,
                430,
                g.y,
                "upgradeLine",
                `upgradeLine-${index}-0`
            );


            createLine(
                700,
                g.y,
                970,
                g.y,
                "upgradeLine",
                `upgradeLine-${index}-1`
            );

        }
    );

}


function createLine(
    x1,
    y1,
    x2,
    y2,
    className,
    id
){

    const line=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    line.setAttribute(
        "x1",
        x1
    );

    line.setAttribute(
        "y1",
        y1
    );

    line.setAttribute(
        "x2",
        x2
    );

    line.setAttribute(
        "y2",
        y2
    );


    line.classList.add(
        className
    );


    line.id=id;


    connections.appendChild(
        line
    );

}


/* =========================================================
   UPDATE UI
========================================================= */

function updateUI(){

    document.getElementById(
        "entropy"
    ).textContent=

        format(entropy)+
        " entropii";


    document.getElementById(
        "perSecond"
    ).textContent=

        "+"+
        format(
            totalProduction()
        )+
        " / s";


    generators.forEach(
        (g,index)=>{

            const element=
                document.getElementById(
                    "generator-"+g.id
                );


            const unlocked=

                index===0 ||

                generators[index-1]
                .level>0;


            element.classList.remove(
                "locked",
                "available",
                "owned"
            );


            if(!unlocked){

                element.classList.add(
                    "locked"
                );

            }

            else if(g.level===0){

                element.classList.add(
                    "available"
                );

            }

            else{

                element.classList.add(
                    "owned"
                );

            }


            element.querySelector(
                ".level"
            ).textContent=

                "x"+g.level;


            element.querySelector(
                ".generatorCost"
            ).textContent=

                format(
                    generatorCost(g)
                )+
                " entropii";


            /* GŁÓWNA LINIA */

            if(
                index<
                generators.length-1
            ){

                const line=
                    document.getElementById(
                        "main-"+index
                    );


                line.classList.toggle(
                    "active",
                    g.level>0
                );

            }


            /* UPGRADES */

            g.upgrades.forEach(
                (u,uIndex)=>{

                    const el=
                        document.getElementById(
                            `upgrade-${g.id}-${uIndex}`
                        );


                    el.classList.remove(
                        "locked",
                        "bought"
                    );


                    if(g.level===0){

                        el.classList.add(
                            "locked"
                        );

                    }


                    if(u.bought){

                        el.classList.add(
                            "bought"
                        );


                        el.querySelector(
                            ".upgradeEffect"
                        ).textContent=
                            "AKTYWNE";

                    }


                    document
                    .getElementById(
                        `upgradeLine-${index}-${uIndex}`
                    )
                    .classList.toggle(
                        "active",
                        g.level>0
                    );

                }
            );

        }
    );

}


/* =========================================================
   PRZESUWANIE MAPY MYSZKĄ

   To zastępuje scroll.
========================================================= */

let worldX=0;
let worldY=0;

let dragging=false;

let startPointerX=0;
let startPointerY=0;

let startWorldX=0;
let startWorldY=0;

let moved=false;


function applyWorldPosition(){

    world.style.transform=
        `translate(${worldX}px,${worldY}px)`;

}


/* POINTER DOWN */

viewport.addEventListener(
    "pointerdown",
    e=>{

        /*
           Nie zaczynamy przesuwania,
           kiedy kliknięto element gry.
        */

        if(
            e.target.closest(".generator") ||
            e.target.closest(".upgrade")
        ){
            return;
        }


        dragging=true;
        moved=false;


        startPointerX=
            e.clientX;

        startPointerY=
            e.clientY;


        startWorldX=
            worldX;

        startWorldY=
            worldY;


        viewport.classList.add(
            "dragging"
        );


        viewport.setPointerCapture(
            e.pointerId
        );

    }
);


/* POINTER MOVE */

viewport.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;


        const dx=
            e.clientX-
            startPointerX;

        const dy=
            e.clientY-
            startPointerY;


        if(
            Math.abs(dx)>5 ||
            Math.abs(dy)>5
        ){

            moved=true;

        }


        worldX=
            startWorldX+
            dx;

        worldY=
            startWorldY+
            dy;


        applyWorldPosition();

    }
);


/* POINTER UP */

viewport.addEventListener(
    "pointerup",
    e=>{

        if(!dragging)
            return;


        dragging=false;


        viewport.classList.remove(
            "dragging"
        );


        /*
           Jeżeli prawie się nie ruszyło,
           traktujemy to jako kliknięcie
           po entropię.
        */

        if(!moved){

            entropy++;


            createClickText(
                e.clientX,
                e.clientY
            );


            updateUI();

        }

    }
);


/* =========================================================
   +1
========================================================= */

function createClickText(x,y){

    const text=
        document.createElement(
            "div"
        );


    text.className=
        "clickText";


    text.textContent=
        "+1";


    text.style.left=
        x+"px";

    text.style.top=
        y+"px";


    document.body.appendChild(
        text
    );


    setTimeout(
        ()=>text.remove(),
        800
    );

}


/* =========================================================
   AUTOMATYCZNA PRODUKCJA
========================================================= */

setInterval(
    ()=>{

        entropy+=
            totalProduction()/10;


        updateUI();

    },
    100
);


/* =========================================================
   POZYCJA STARTOWA

   Aminokwas na środku ekranu.
========================================================= */

function centerOnAmino(){

    worldX=

        window.innerWidth/2 -

        700;


    worldY=

        window.innerHeight*.65 -

        generators[0].y;


    applyWorldPosition();

}


window.addEventListener(
    "resize",
    centerOnAmino
);


/* =========================================================
   START
========================================================= */

drawLines();

updateUI();

centerOnAmino();
