<title>Ewolucja</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at center,#12342d 0%,#071915 45%,#020706 100%);
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

#hud{
    position:fixed;
    z-index:5000;

    top:16px;
    left:50%;

    transform:translateX(-50%);

    width:430px;
    max-width:92%;

    padding:13px 20px;

    border:1px solid #4e625c;
    border-radius:16px;

    background:rgba(7,13,11,.95);
}

#entropy{
    font-size:27px;
    font-weight:bold;
}

#perSecond{
    color:#49e7bc;
    margin-top:3px;
}

#hint{
    color:#81918b;
    font-size:12px;
    margin-top:5px;
}

#viewport{
    position:absolute;
    inset:0;

    overflow:hidden;
    cursor:grab;
    touch-action:none;
}

#viewport.dragging{
    cursor:grabbing;
}

#world{
    position:absolute;

    width:2600px;
    height:6400px;

    left:0;
    top:0;
}

#world::before{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(circle,rgba(66,233,184,.13) 1px,transparent 2px);

    background-size:145px 145px;
}

#lines{
    position:absolute;

    width:2600px;
    height:6400px;

    left:0;
    top:0;

    z-index:1;

    pointer-events:none;
}

.connection{
    stroke:#455e57;
    stroke-width:6;
    opacity:.45;
}

.connection.active{
    stroke:#30dcb5;
    opacity:1;

    filter:drop-shadow(0 0 5px #30dcb5);
}

.upgradeLine{
    stroke:#52665f;
    stroke-width:3;
    opacity:.45;
}

.upgradeLine.active{
    stroke:#35cdaa;
    opacity:.95;
}

/* =========================
   GENERATOR
========================= */

.node{
    position:absolute;

    width:140px;
    height:140px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(circle at 38% 28%,#284038,#111a17 60%,#050807);

    border:4px solid #42665e;

    cursor:pointer;

    z-index:20;

    transition:.15s;
}

.node.available,
.node.owned{
    border-color:#25e2b8;

    box-shadow:
        0 0 9px rgba(37,226,184,.8),
        0 0 28px rgba(37,226,184,.2);
}

.node.locked{
    opacity:.23;
}

.node:not(.locked):hover{
    transform:
        translate(-50%,-50%)
        scale(1.06);
}

.model{
    position:absolute;

    left:8px;
    top:8px;

    width:116px;
    height:116px;

    border-radius:50%;

    pointer-events:none;
}

.level{
    position:absolute;

    right:-12px;
    top:-12px;

    min-width:40px;
    height:40px;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:0 7px;

    border-radius:22px;

    background:#0d1210;

    border:2px solid #263630;

    font-size:14px;
    font-weight:bold;
}

.nodeName{
    position:absolute;

    left:50%;
    top:147px;

    transform:translateX(-50%);

    width:300px;

    text-align:center;
    white-space:nowrap;

    font-size:19px;
    font-weight:bold;

    text-shadow:0 2px 5px black;
}

.nodeCost{
    position:absolute;

    top:175px;
    left:50%;

    transform:translateX(-50%);

    color:#49ddb7;

    white-space:nowrap;

    font-size:13px;
}

/* =========================
   UPGRADE
========================= */

.upgrade{
    position:absolute;

    width:220px;
    height:82px;

    transform:translate(-50%,-50%);

    display:grid;
    grid-template-columns:57px 1fr;

    padding:7px;
    align-items:center;

    background:
        linear-gradient(145deg,#222b27,#101613);

    border:2px solid #52625c;
    border-radius:7px;

    cursor:pointer;

    z-index:15;

    transition:.15s;
}

.upgrade:hover{
    transform:
        translate(-50%,-50%)
        scale(1.04);
}

.upgrade.locked{
    opacity:.2;
}

.upgrade.bought{
    border-color:#34d3ad;

    background:
        linear-gradient(145deg,#174038,#0e2822);
}

.upgradeIcon{
    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#0b100e;

    border:2px solid #485a54;

    font-size:25px;
}

.upgradeText{
    padding-left:7px;
}

.upgradeName{
    font-weight:bold;
    font-size:13px;
}

.upgradeEffect{
    margin-top:4px;

    color:#8ed476;
    font-size:11px;
}

.upgradeCost{
    color:#46d7b3;
    font-size:11px;

    margin-top:2px;
}

/* =========================
   CLICK
========================= */

.clickText{
    position:fixed;

    z-index:9999;

    pointer-events:none;

    color:#4ceec2;

    font-size:21px;
    font-weight:bold;

    animation:float .75s forwards;
}

@keyframes float{
    from{
        opacity:1;
        transform:translate(-50%,-50%);
    }

    to{
        opacity:0;
        transform:translate(-50%,-100px) scale(1.25);
    }
}

#home{

    right:20px;
    bottom:20px;

    height:54px;

    border-radius:50%;

    border:1px solid #52655f;

    background:#0e1714;

    color:#47e4b9;

    font-size:22px;

    cursor:pointer;

    z-index:5000;
}
</style>
</head>

/* =====================================================
   DRAW MODEL
===================================================== */

function drawModel(canvas,node){

    const ctx =
        canvas.getContext("2d");

    const W =
        canvas.width;

    const H =
        canvas.height;

    const cx =
        W/2;

    const cy =
        H/2;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.save();


    ctx.translate(
        cx,
        cy
    );


    const g =
        ctx.createRadialGradient(
            -25,
            -30,
            5,
            0,
            0,
            90
        );


    const colors = {

        molecule:"#568bd7",
        protein:"#796dd5",
        rna:"#bc5ccc",
        dna:"#25aee7",
        bacteria:"#599366",
        cell:"#507c92",
        cells:"#617fad",
        sponge:"#d58d38",
        jelly:"#8c7fd5",
        worm:"#b76459",
        fish:"#4d91a9",
        shark:"#557889",
        tetrapod:"#678c4b",
        frog:"#56a069",
        reptile:"#70824e",
        lizard:"#71904d",
        snake:"#8a8a46",
        croc:"#687546",
        bird:"#a78c5b",
        mammal:"#7e6551",
        rodent:"#887364",
        primate:"#755342",
        ape:"#624638",
        human:"#c58967"
    };


    const color =
        colors[node.type] ||
        "#4da587";


    g.addColorStop(
        0,
        "#ffffff"
    );

    g.addColorStop(
        .15,
        color
    );

    g.addColorStop(
        1,
        "#14251f"
    );


    ctx.fillStyle =
        g;

    ctx.strokeStyle =
        color;

    ctx.lineCap =
        "round";


    /* =================================================
       DNA/RNA
    ================================================= */

    if(
        node.type==="dna" ||
        node.type==="rna"
    ){

        for(let helix=0;helix<2;helix++){

            ctx.beginPath();

            ctx.strokeStyle =
                helix===0
                ? "#39c8ff"
                : "#d36ada";

            ctx.lineWidth=11;


            for(let y=-85;y<=85;y+=3){

                const x =
                    Math.sin(
                        (y+85)/25+
                        helix*Math.PI
                    )*42;


                if(y===-85){

                    ctx.moveTo(
                        x,y
                    );

                }else{

                    ctx.lineTo(
                        x,y
                    );

                }

            }


            ctx.stroke();

        }

    }


    /* =================================================
       KOMÓRKI
    ================================================= */

    else if(
        node.type==="bacteria"
    ){

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            72,
            43,
            -.2,
            0,
            Math.PI*2
        );

        ctx.fill();


        for(let i=0;i<15;i++){

            ctx.beginPath();

            ctx.fillStyle="#dce49b";

            const a=i*2.3;

            ctx.arc(
                Math.sin(a)*48,
                Math.cos(a*1.4)*25,
                4,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    else if(
        node.type==="cell" ||
        node.type==="cells"
    ){

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            68,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#9c6dac";

        ctx.beginPath();

        ctx.arc(
            -15,
            -8,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();


        if(node.type==="cells"){

            for(let i=0;i<6;i++){

                ctx.beginPath();

                ctx.arc(
                    Math.cos(i)*45,
                    Math.sin(i)*45,
                    18,
                    0,
                    Math.PI*2
                );

                ctx.fill();

            }

        }

    }


    /* =================================================
       GĄBKA
    ================================================= */

    else if(node.type==="sponge"){

        for(let i=-2;i<=2;i++){

            ctx.fillStyle=color;

            ctx.fillRect(
                i*23-12,
                -20-Math.abs(i)*5,
                25,
                90-Math.abs(i)*10
            );

            ctx.beginPath();

            ctx.arc(
                i*23,
                -20-Math.abs(i)*5,
                12,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* =================================================
       MEDUZA
    ================================================= */

    else if(node.type==="jelly"){

        ctx.beginPath();

        ctx.arc(
            0,
            -15,
            62,
            Math.PI,
            Math.PI*2
        );

        ctx.lineTo(
            62,
            0
        );

        ctx.lineTo(
            -62,
            0
        );

        ctx.fill();


        ctx.strokeStyle=color;
        ctx.lineWidth=7;


        for(let i=-3;i<=3;i++){

            ctx.beginPath();

            ctx.moveTo(
                i*17,
                0
            );

            ctx.bezierCurveTo(
                i*17+10,
                30,
                i*17-12,
                60,
                i*17,
                85
            );

            ctx.stroke();

        }

    }


    /* =================================================
       ROBAL
    ================================================= */

    else if(node.type==="worm"){

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            82,
            32,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#111";

        ctx.beginPath();
        ctx.arc(48,-8,5,0,Math.PI*2);
        ctx.arc(61,-7,5,0,Math.PI*2);
        ctx.fill();

    }


    /* =================================================
       RYBA
    ================================================= */

    else if(
        node.type==="fish" ||
        node.type==="shark"
    ){

        ctx.beginPath();

        ctx.ellipse(
            10,
            0,
            68,
            36,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.moveTo(-50,0);
        ctx.lineTo(-95,-43);
        ctx.lineTo(-95,43);
        ctx.closePath();

        ctx.fill();


        ctx.fillStyle="#111";

        ctx.beginPath();
        ctx.arc(55,-10,5,0,Math.PI*2);
        ctx.fill();

    }


    /* =================================================
       WĄŻ
    ================================================= */

    else if(node.type==="snake"){

        ctx.strokeStyle=color;
        ctx.lineWidth=30;

        ctx.beginPath();

        ctx.moveTo(-85,30);

        ctx.bezierCurveTo(
            -50,-60,
            10,65,
            70,-15
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.arc(
            72,
            -17,
            23,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* =================================================
       PTAK
    ================================================= */

    else if(node.type==="bird"){

        ctx.beginPath();

        ctx.ellipse(
            0,
            10,
            48,
            58,
            -.3,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            40,
            -35,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#e5b64e";

        ctx.beginPath();

        ctx.moveTo(63,-38);
        ctx.lineTo(95,-27);
        ctx.lineTo(65,-22);
        ctx.closePath();

        ctx.fill();

    }


    /* =================================================
       CZŁOWIEK / NACZELNY
    ================================================= */

    else if(
        node.type==="human" ||
        node.type==="primate" ||
        node.type==="ape"
    ){

        ctx.beginPath();

        ctx.arc(
            0,
            -55,
            30,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.ellipse(
            0,
            18,
            31,
            58,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.strokeStyle=color;
        ctx.lineWidth=15;


        ctx.beginPath();

        ctx.moveTo(-23,-2);
        ctx.lineTo(-63,40);

        ctx.moveTo(23,-2);
        ctx.lineTo(63,40);

        ctx.moveTo(-14,65);
        ctx.lineTo(-30,98);

        ctx.moveTo(14,65);
        ctx.lineTo(30,98);

        ctx.stroke();

    }


    /* =================================================
       CZTERONOŻNE
    ================================================= */

    else{

        ctx.beginPath();

        ctx.ellipse(
            -8,
            5,
            60,
            35,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            53,
            -13,
            27,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.strokeStyle=color;
        ctx.lineWidth=14;


        ctx.beginPath();

        ctx.moveTo(-35,30);
        ctx.lineTo(-48,68);

        ctx.moveTo(15,32);
        ctx.lineTo(28,70);

        ctx.stroke();


        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.arc(
            62,
            -20,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.restore();

}

/* =====================================================
   UPGRADE
===================================================== */

function createUpgrade(
    node,
    nodeIndex,
    upgradeIndex,
    x
){

    const upgrade =
        node.upgrades[upgradeIndex];


    const element =
        document.createElement("div");


    element.className =
        "upgrade";


    element.id =
        `upgrade-${node.id}-${upgradeIndex}`;


    element.style.left =
        x+"px";


    element.style.top =
        node.y+"px";


    element.innerHTML=`

        <div class="upgradeIcon">
            ✦
        </div>

        <div class="upgradeText">

            <div class="upgradeName">
                ${upgrade.name}
            </div>

            <div class="upgradeEffect">
                +${upgrade.bonus*100}% produkcji
            </div>

            <div class="upgradeCost">
                ${format(upgrade.cost)} entropii
            </div>

        </div>
    `;


    element.addEventListener(
        "pointerdown",
        e=>e.stopPropagation()
    );


    element.addEventListener(
        "click",
        e=>{

            e.stopPropagation();

            buyUpgrade(
                nodeIndex,
                upgradeIndex
            );

        }
    );


    world.appendChild(element);

}


/* =====================================================
   LINES
===================================================== */

function drawLines(){

    svg.innerHTML="";


    nodes.forEach(
        (node,index)=>{

            if(node.parent){

                const parent =
                    getNode(node.parent);


                createLine(
                    parent.x,
                    parent.y,
                    node.x,
                    node.y,
                    "connection",
                    "connection-"+node.id
                );

            }


            createLine(
                node.x,
                node.y,
                node.x-300,
                node.y,
                "upgradeLine",
                `upgradeLine-${index}-0`
            );


            createLine(
                node.x,
                node.y,
                node.x+300,
                node.y,
                "upgradeLine",
                `upgradeLine-${index}-1`
            );

        }
    );

}


function createLine(
    x1,y1,x2,y2,className,id
){

    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    line.setAttribute("x1",x1);
    line.setAttribute("y1",y1);
    line.setAttribute("x2",x2);
    line.setAttribute("y2",y2);


    line.classList.add(
        className
    );


    line.id=id;


    svg.appendChild(line);

}


/* =====================================================
   COST
===================================================== */

function nodeCost(node){

    return Math.floor(

        node.cost *

        Math.pow(
            1.16,
            node.level
        )

    );

}


/* =====================================================
   PRODUCTION MULTIPLIER
===================================================== */

function multiplier(node){

    let m=1;


    node.upgrades.forEach(u=>{

        if(u.bought){

            m+=u.bonus;

        }

    });


    return m;

}


/* =====================================================
   PRODUCTION
===================================================== */

function totalProduction(){

    let result=0;


    nodes.forEach(node=>{

        result +=

            node.production *

            node.level *

            multiplier(node);

    });


    return result;

}


/* =====================================================
   BUY NODE
===================================================== */

function buyNode(index){

    const node =
        nodes[index];


    if(node.parent){

        const parent =
            getNode(node.parent);


        if(
            parent.level===0
        ){

            return;

        }

    }


    const cost =
        nodeCost(node);


    if(entropy<cost){

        return;

    }


    entropy-=cost;

    node.level++;


    update();

}


/* =====================================================
   BUY UPGRADE
===================================================== */

function buyUpgrade(
    nodeIndex,
    upgradeIndex
){

    const node =
        nodes[nodeIndex];


    const upgrade =
        node.upgrades[upgradeIndex];


    if(
        node.level===0 ||
        upgrade.bought
    ){

        return;

    }


    if(
        entropy<
        upgrade.cost
    ){

        return;

    }


    entropy -=
        upgrade.cost;


    upgrade.bought=true;


    update();

}


/* =====================================================
   FORMAT
===================================================== */

function format(n){

    if(n<1e3){

        return Math.floor(n)
        .toString();

    }


    const units=[
        ["tys.",1e3],
        ["mln",1e6],
        ["mld",1e9],
        ["bln",1e12],
        ["bld",1e15],
        ["tryl.",1e18],
        ["kwad.",1e24]
    ];


    for(
        let i=units.length-1;
        i>=0;
        i--
    ){

        if(n>=units[i][1]){

            return (
                n/
                units[i][1]
            ).toFixed(2)+
            " "+
            units[i][0];

        }

    }


    return n.toExponential(2);

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    document
    .getElementById("entropy")
    .textContent=

        format(entropy)+
        " entropii";


    document
    .getElementById("perSecond")
    .textContent=

        "+"+
        format(totalProduction())+
        " / s";


    nodes.forEach(
        (node,index)=>{

            const element =
                document
                .getElementById(
                    "node-"+node.id
                );


            let unlocked=true;


            if(node.parent){

                unlocked =
                    getNode(
                        node.parent
                    ).level>0;

            }


            element.classList.remove(
                "locked",
                "available",
                "owned"
            );


            if(!unlocked){

                element.classList.add(
                    "locked"
                );

            }

            else if(
                node.level===0
            ){

                element.classList.add(
                    "available"
                );

            }

            else{

                element.classList.add(
                    "owned"
                );

            }


            element
            .querySelector(".level")
            .textContent=

                "x"+
                node.level;


            element
            .querySelector(".nodeCost")
            .textContent=

                format(
                    nodeCost(node)
                )+
                " entropii";


            if(node.parent){

                const connection =
                    document
                    .getElementById(
                        "connection-"+node.id
                    );


                connection
                .classList
                .toggle(

                    "active",

                    getNode(
                        node.parent
                    ).level>0

                );

            }


            node.upgrades.forEach(
                (u,i)=>{

                    const el =
                        document
                        .getElementById(
                            `upgrade-${node.id}-${i}`
                        );


                    el.classList.remove(
                        "locked",
                        "bought"
                    );


                    if(node.level===0){

                        el.classList.add(
                            "locked"
                        );

                    }


                    if(u.bought){

                        el.classList.add(
                            "bought"
                        );


                        el
                        .querySelector(
                            ".upgradeEffect"
                        )
                        .textContent=
                            "AKTYWNE";

                    }


                    document
                    .getElementById(
                        `upgradeLine-${index}-${i}`
                    )
                    .classList
                    .toggle(
                        "active",
                        node.level>0
                    );

                }
            );

        }
    );

}


/* =====================================================
   DRAG MAP
===================================================== */

let worldX=0;
let worldY=0;

let dragging=false;
let moved=false;

let startX=0;
let startY=0;

let startingWorldX=0;
let startingWorldY=0;


function renderWorld(){

    world.style.transform =
        `translate(${worldX}px,${worldY}px)`;

}


viewport.addEventListener(
    "pointerdown",
    e=>{

        if(
            e.target.closest(".node") ||
            e.target.closest(".upgrade")
        ){

            return;

        }


        dragging=true;
        moved=false;


        startX=e.clientX;
        startY=e.clientY;


        startingWorldX=worldX;
        startingWorldY=worldY;


        viewport.classList.add(
            "dragging"
        );


        viewport.setPointerCapture(
            e.pointerId
        );

    }
);


viewport.addEventListener(
    "pointermove",
    e=>{

        if(!dragging){

            return;

        }


        const dx=
            e.clientX-startX;

        const dy=
            e.clientY-startY;


        if(
            Math.abs(dx)>5 ||
            Math.abs(dy)>5
        ){

            moved=true;

        }


        worldX=
            startingWorldX+
            dx;


        worldY=
            startingWorldY+
            dy;


        renderWorld();

    }
);


viewport.addEventListener(
    "pointerup",
    e=>{

        if(!dragging){

            return;

        }


        dragging=false;


        viewport.classList.remove(
            "dragging"
        );


        if(!moved){

            entropy+=
                clickPower;


            createClick(
                e.clientX,
                e.clientY
            );


            update();

        }

    }
);


/* =====================================================
   CLICK EFFECT
===================================================== */

function createClick(x,y){

    const el =
        document.createElement(
            "div"
        );


    el.className=
        "clickText";


    el.textContent=
        "+"+
        clickPower;


    el.style.left=
        x+"px";

    el.style.top=
        y+"px";


    document.body.appendChild(
        el
    );


    setTimeout(
        ()=>el.remove(),
        750
    );

}

function centerStart(){

    const amino =

    worldX=

        amino.x;


    worldY=

        amino.y;

===================================================== */

setInterval(

/* =====================================================

drawLines();

update();

centerStart();
