<title>Ewolucja</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% 50%,#18342e 0%,#0c1e1b 35%,#06100f 75%,#030807 100%);
    color:white;
    overflow:hidden;
}


/* =========================
   GÓRNY PANEL
========================= */

#hud{

    position:fixed;

    top:15px;
    left:50%;

    transform:translateX(-50%);

    width:390px;

    background:rgba(10,15,15,.94);

    border:1px solid #56605c;

    border-radius:15px;

    padding:10px 20px;

    z-index:1000;

    box-shadow:
        0 5px 20px #000,
        inset 0 0 15px rgba(255,255,255,.03);

}

#entropy{

    font-size:27px;
    font-weight:bold;

    color:white;

}

#production{

    font-size:15px;

    color:#83eaa7;

    margin-top:3px;

}

#hint{

    font-size:11px;

    color:#8e9b96;

    margin-top:5px;

}


/* =========================
   SCROLL
========================= */

#viewport{

    position:absolute;

    inset:0;

    overflow-y:auto;
    overflow-x:hidden;

}

#tree{

    position:relative;

    width:1100px;

    max-width:100%;

    height:3000px;

    margin:auto;

}


/* =========================
   SVG LINIE
========================= */

#connections{

    position:absolute;

    width:100%;
    height:100%;

    inset:0;

    z-index:1;

    pointer-events:none;

}

.mainLine{

    stroke:#53766c;

    stroke-width:5;

    opacity:.6;

}

.mainLine.active{

    stroke:#39e2bd;

    filter:drop-shadow(0 0 6px #39e2bd);

    opacity:1;

}

.upgradeLine{

    stroke:#53685f;

    stroke-width:3;

    opacity:.55;

}

.upgradeLine.active{

    stroke:#4fdcbf;

    opacity:1;

    filter:drop-shadow(0 0 4px #31d8b8);

}


/* =========================
   GENERATOR
========================= */

.generator{

    position:absolute;

    width:112px;
    height:112px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(circle,#18201e 0%,#0d1211 70%);

    border:4px solid #3b675c;

    cursor:pointer;

    z-index:10;

    display:flex;

    justify-content:center;
    align-items:center;

    transition:.15s;

}

.generator.available{

    border-color:#19e2bc;

    box-shadow:
        0 0 8px #17af94,
        0 0 22px rgba(20,230,190,.3),
        inset 0 0 15px rgba(20,230,190,.1);

}

.generator.owned{

    border-color:#17e6c0;

    box-shadow:
        0 0 12px rgba(23,230,192,.5);

}

.generator.locked{

    opacity:.3;

    cursor:default;

}

.generator:not(.locked):hover{

    transform:
        translate(-50%,-50%)
        scale(1.08);

}

.generator:active{

    transform:
        translate(-50%,-50%)
        scale(.96);

}


/* =========================
   IKONY SVG
========================= */

.icon{

    width:72px;
    height:72px;

}

.icon svg{

    width:100%;
    height:100%;

    filter:
        drop-shadow(0 3px 3px #000);

}


/* =========================
   OPIS GENERATORA
========================= */

.generatorName{

    position:absolute;

    top:117px;
    left:50%;

    transform:translateX(-50%);

    width:240px;

    text-align:center;

    font-size:19px;

    font-weight:700;

    text-shadow:
        0 2px 3px #000,
        0 0 5px #000;

}

.generatorPrice{

    position:absolute;

    top:143px;
    left:50%;

    transform:translateX(-50%);

    color:#4be8c2;

    font-size:14px;

    white-space:nowrap;

}

.level{

    position:absolute;

    right:-15px;
    top:-15px;

    min-width:38px;

    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#111;

    border:2px solid #222;

    font-weight:bold;

}


/* =========================
   UPGRADE
========================= */

.upgrade{

    position:absolute;

    width:170px;
    min-height:76px;

    transform:translate(-50%,-50%);

    background:
        linear-gradient(145deg,#202724,#151918);

    border:2px solid #59655f;

    border-radius:6px;

    cursor:pointer;

    z-index:10;

    display:grid;

    grid-template-columns:58px 1fr;

    align-items:center;

    padding:7px;

    transition:.15s;

    box-shadow:
        0 4px 8px rgba(0,0,0,.6);

}

.upgrade:hover{

    transform:
        translate(-50%,-50%)
        scale(1.05);

}

.upgrade.locked{

    opacity:.25;

    cursor:default;

}

.upgrade.bought{

    border-color:#35d9af;

    background:
        linear-gradient(145deg,#174138,#112b26);

}

.upgradeIcon{

    width:50px;
    height:50px;

    border:2px solid #4a5e57;

    background:#101514;

    display:flex;

    align-items:center;
    justify-content:center;

}

.upgradeIcon svg{

    width:42px;
    height:42px;

}

.upgradeText{

    padding-left:8px;

}

.upgradeTitle{

    font-size:13px;

    font-weight:bold;

    margin-bottom:3px;

}

.upgradeEffect{

    font-size:11px;

    color:#93e176;

}

.upgradeCost{

    font-size:11px;

    color:#4ce1bd;

    margin-top:2px;

}


/* =========================
   KLIK ENTROPII
========================= */

.clickNumber{

    position:fixed;

    z-index:3000;

    pointer-events:none;

    color:#52efcc;

    font-size:21px;

    font-weight:bold;

    text-shadow:0 2px 3px black;

    animation:float .75s forwards;

}

@keyframes float{

    from{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);

    }

    to{

        opacity:0;

        transform:
            translate(-50%,-100px)
            scale(1.25);

    }

}

</style>

function createUpgrade(
    generator,
    generatorIndex,
    upgradeIndex,
    x
){

    const data=
        generator.upgrades[upgradeIndex];

    const element=
        document.createElement("div");

    element.className="upgrade";

    element.id=
        "upgrade-"+
        generator.id+
        "-"+
        upgradeIndex;

    element.style.left=x+"%";

    element.style.top=
        generator.y+"px";


    let selectedIcon=
        data.special
        ? upgradeIcon[data.special]
        : upgradeIcon.generic;


    element.innerHTML=`

        <div class="upgradeIcon">

            ${selectedIcon}

        </div>

        <div class="upgradeText">

            <div class="upgradeTitle">

                ${data.name}

            </div>

            <div class="upgradeEffect">

                +${Math.round(data.effect*100)}%
                produkcji

            </div>

            <div class="upgradeCost">

                ${format(data.cost)}
                entropii

            </div>

        </div>

    `;


    element.onclick=e=>{

        e.stopPropagation();

        buyUpgrade(
            generatorIndex,
            upgradeIndex
        );

    };


    tree.appendChild(element);

}


/* =====================================================
   KOSZT GENERATORA
===================================================== */

function costOf(g){

    return Math.floor(

        g.baseCost *
        Math.pow(
            1.17,
            g.level
        )

    );

}


/* =====================================================
   KUPOWANIE
===================================================== */

function buyGenerator(index){

    const g=
        generators[index];


    const unlocked=
        index===0 ||
        generators[index-1].level>0;


    if(!unlocked)
        return;


    const price=
        costOf(g);


    if(entropy<price)
        return;


    entropy-=price;

    g.level++;

    update();

}


/* =====================================================
   KUPOWANIE UPGRADE
===================================================== */

function buyUpgrade(
    generatorIndex,
    upgradeIndex
){

    const generator=
        generators[generatorIndex];

    const upgrade=
        generator.upgrades[upgradeIndex];


    if(generator.level===0)
        return;


    if(upgrade.bought)
        return;


    if(entropy<upgrade.cost)
        return;


    entropy-=upgrade.cost;

    upgrade.bought=true;

    update();

}


/* =====================================================
   MNOŻNIK UPGRADE
===================================================== */

function multiplier(g){

    let multiplier=1;


    g.upgrades.forEach(u=>{

        if(u.bought){

            multiplier+=u.effect;

        }

    });


    return multiplier;

}


/* =====================================================
   PRODUKCJA
===================================================== */

function production(){

    let total=0;


    generators.forEach(g=>{

        total+=

            g.production *

            g.level *

            multiplier(g);

    });


    return total;

}


/* =====================================================
   FORMAT LICZBY
===================================================== */

function format(n){

    if(n<1000)
        return Math.floor(n).toString();


    if(n<1e6)
        return (n/1e3).toFixed(1)+" tys.";


    if(n<1e9)
        return (n/1e6).toFixed(2)+" mln";


    if(n<1e12)
        return (n/1e9).toFixed(2)+" mld";


    if(n<1e15)
        return (n/1e12).toFixed(2)+" bln";


    return n.toExponential(2);

}


/* =====================================================
   AKTUALIZOWANIE UI
===================================================== */

function update(){

    document.getElementById("entropy")
    .textContent=
        format(entropy)+
        " entropii";


    document.getElementById("production")
    .textContent=
        "+"+
        format(production())+
        " / s";


    generators.forEach((g,index)=>{


        const el=
            document.getElementById(
                "generator-"+g.id
            );


        const unlocked=
            index===0 ||
            generators[index-1].level>0;


        el.classList.remove(
            "locked",
            "available",
            "owned"
        );


        if(!unlocked){

            el.classList.add("locked");

        }
        else if(g.level===0){

            el.classList.add("available");

        }
        else{

            el.classList.add("owned");

        }


        el.querySelector(".level")
        .textContent=
            "x"+g.level;


        el.querySelector(
            ".generatorPrice"
        ).textContent=

            format(costOf(g))+
            " entropii";


        /* =========================
           UPGRADE
        ========================= */

        g.upgrades.forEach((u,i)=>{

            const upgrade=

                document.getElementById(

                    "upgrade-"+
                    g.id+
                    "-"+
                    i

                );


            upgrade.classList.remove(
                "locked",
                "bought"
            );


            if(g.level===0){

                upgrade.classList.add(
                    "locked"
                );

            }

            if(u.bought){

                upgrade.classList.add(
                    "bought"
                );


                upgrade.querySelector(
                    ".upgradeEffect"
                ).textContent=
                    "AKTYWNE";

            }

        });

    });


    updateLines();

}


/* =====================================================
   LINIE
===================================================== */

function drawLines(){

    svg.innerHTML="";


    const width=
        tree.clientWidth;


    /* =========================
       GŁÓWNA ŚCIEŻKA
    ========================= */

    for(
        let i=0;
        i<generators.length-1;
        i++
    ){

        const a=
            generators[i];

        const b=
            generators[i+1];


        const line=
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );


        line.setAttribute(
            "x1",
            width*a.x/100
        );

        line.setAttribute(
            "y1",
            a.y
        );

        line.setAttribute(
            "x2",
            width*b.x/100
        );

        line.setAttribute(
            "y2",
            b.y
        );


        line.classList.add(
            "mainLine"
        );

        line.id=
            "mainLine-"+i;


        svg.appendChild(line);

    }


    /* =========================
       LINIE DO UPGRADE
    ========================= */

    generators.forEach((g,index)=>{

        [24,76].forEach(
            (x,upgradeIndex)=>{

            const line=
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line.setAttribute(
                "x1",
                width*g.x/100
            );

            line.setAttribute(
                "y1",
                g.y
            );

            line.setAttribute(
                "x2",
                width*x/100
            );

            line.setAttribute(
                "y2",
                g.y
            );


            line.classList.add(
                "upgradeLine"
            );


            line.id=

                "upgradeLine-"+
                index+
                "-"+
                upgradeIndex;


            svg.appendChild(line);

        });

    });

}


/* =====================================================
   AKTYWNE LINIE
===================================================== */

function updateLines(){

    generators.forEach((g,index)=>{


        if(index<
            generators.length-1
        ){

            const line=
                document.getElementById(
                    "mainLine-"+index
                );


            if(g.level>0)
                line.classList.add(
                    "active"
                );
            else
                line.classList.remove(
                    "active"
                );

        }


        g.upgrades.forEach((u,i)=>{

            const line=
                document.getElementById(

                    "upgradeLine-"+
                    index+
                    "-"+
                    i

                );


            if(g.level>0){

                line.classList.add(
                    "active"
                );

            }
            else{

                line.classList.remove(
                    "active"
                );

            }

        });

    });

}


/* =====================================================
   KLIKANIE W TŁO
===================================================== */

document.addEventListener(
"click",
e=>{

    if(
        e.target.closest(".generator") ||
        e.target.closest(".upgrade") ||
        e.target.closest("#hud")
    ){
        return;
    }


    entropy+=clickPower;


    const text=
        document.createElement("div");


    text.className=
        "clickNumber";


    text.textContent=
        "+"+clickPower;


    text.style.left=
        e.clientX+"px";


    text.style.top=
        e.clientY+"px";


    document.body.appendChild(text);


    setTimeout(
        ()=>text.remove(),
        750
    );


    update();

});


/* =====================================================
   AUTOMATYCZNA PRODUKCJA
===================================================== */

setInterval(()=>{

    entropy+=
        production()/10;

    update();

},100);


/* =====================================================
   START
===================================================== */

drawLines();

update();


window.addEventListener(
"resize",
()=>{

});

()=>{

        );

});
