<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ewolucja 3D</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:white;

    background:
        radial-gradient(circle at center,#12352e 0%,#071b17 45%,#020807 100%);
}


/* =====================================================
   HUD
===================================================== */

#hud{
    position:fixed;

    top:15px;
    left:50%;

    transform:translateX(-50%);

    width:430px;
    max-width:92%;

    padding:13px 20px;

    background:rgba(7,14,12,.95);

    border:1px solid #4c625b;

    border-radius:16px;

    z-index:10000;
}

#entropy{
    font-size:28px;
    font-weight:bold;
}

#production{
    color:#4ce4bb;
    font-size:17px;
    margin-top:3px;
}

#help{
    color:#83938d;
    font-size:12px;
    margin-top:5px;
}


/* =====================================================
   VIEWPORT
===================================================== */

#viewport{
    position:absolute;
    inset:0;

    overflow:hidden;

    cursor:grab;

    touch-action:none;
}

#viewport.dragging{
    cursor:grabbing;
}


/* =====================================================
   WORLD
===================================================== */

#world{
    position:absolute;

    width:1800px;
    height:3500px;

    left:0;
    top:0;

    transform-origin:0 0;
}

#world::before{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(circle,rgba(75,238,191,.13) 1px,transparent 2px);

    background-size:145px 145px;
}


/* =====================================================
   LINES
===================================================== */

#lines{
    position:absolute;

    width:1800px;
    height:3500px;

    inset:0;

    pointer-events:none;

    z-index:1;
}

.mainLine,
.branchLine,
.upgradeLine{
    fill:none;
}

.mainLine{
    stroke:#415b54;
    stroke-width:7;
    opacity:.5;
}

.mainLine.active{
    stroke:#2ae2b7;
    opacity:1;

    filter:drop-shadow(0 0 6px #2ae2b7);
}

.branchLine{
    stroke:#49645c;
    stroke-width:6;
    opacity:.55;
}

.branchLine.active{
    stroke:#38ddb6;
    opacity:1;
}

.upgradeLine{
    stroke:#52675f;
    stroke-width:3;
    opacity:.5;
}

.upgradeLine.active{
    stroke:#3ad3b1;
    opacity:.95;
}


/* =====================================================
   GENERATOR
===================================================== */

.generator{
    position:absolute;

    width:140px;
    height:140px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(circle at 38% 28%,#263c35,#101916 60%,#050908);

    border:4px solid #41675e;

    z-index:20;

    cursor:pointer;

    transition:.15s;
}

.generator.available,
.generator.owned{
    border-color:#28e1b8;

    box-shadow:
        0 0 10px rgba(40,225,184,.75),
        0 0 27px rgba(40,225,184,.22);
}

.generator.locked{
    opacity:.25;
    cursor:default;
}

.generator:not(.locked):hover{
    transform:
        translate(-50%,-50%)
        scale(1.07);
}


/* =====================================================
   MODEL
===================================================== */

.modelCanvas{
    position:absolute;

    width:122px;
    height:122px;

    left:5px;
    top:5px;

    border-radius:50%;

    pointer-events:none;
}


/* =====================================================
   LEVEL
===================================================== */

.level{
    position:absolute;

    right:-13px;
    top:-13px;

    min-width:42px;
    height:42px;

    padding:0 7px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:24px;

    background:#0c1210;

    border:2px solid #273b34;

    font-weight:bold;
}


/* =====================================================
   NAME
===================================================== */

.generatorName{
    position:absolute;

    left:50%;
    top:147px;

    transform:translateX(-50%);

    width:310px;

    text-align:center;

    white-space:nowrap;

    font-size:21px;
    font-weight:bold;

    text-shadow:0 2px 5px #000;
}

.generatorCost{
    position:absolute;

    left:50%;
    top:177px;

    transform:translateX(-50%);

    white-space:nowrap;

    color:#49dfb7;

    font-size:14px;
}


/* =====================================================
   UPGRADES
===================================================== */

.upgrade{
    position:absolute;

    width:225px;
    height:84px;

    transform:translate(-50%,-50%);

    display:grid;

    grid-template-columns:58px 1fr;

    align-items:center;

    padding:7px;

    background:
        linear-gradient(145deg,#222b28,#101613);

    border:2px solid #52625d;

    border-radius:7px;

    z-index:15;

    cursor:pointer;

    transition:.15s;
}

.upgrade:hover{
    transform:
        translate(-50%,-50%)
        scale(1.045);
}

.upgrade.locked{
    opacity:.2;
}

.upgrade.bought{
    border-color:#34d7b1;

    background:
        linear-gradient(145deg,#174139,#0d2923);
}

.upgradeIcon{
    width:52px;
    height:52px;

    background:#0b100f;

    border:2px solid #495b55;

    display:flex;
    justify-content:center;
    align-items:center;
}

.upgradeIcon svg{
    width:45px;
    height:45px;
}

.upgradeInfo{
    padding-left:8px;
}

.upgradeName{
    font-size:13px;
    font-weight:bold;
}

.upgradeEffect{
    color:#8ed875;
    font-size:11px;
    margin-top:4px;
}

.upgradeCost{
    color:#47d9b5;
    font-size:11px;
    margin-top:2px;
}


/* =====================================================
   CLICK
===================================================== */

.clickText{
    position:fixed;

    pointer-events:none;

    color:#4ef2c5;

    font-size:21px;
    font-weight:bold;

    z-index:20000;

    animation:clickAnim .8s forwards;
}

@keyframes clickAnim{
    from{
        opacity:1;
        transform:translate(-50%,-50%);
    }

    to{
        opacity:0;
        transform:translate(-50%,-100px) scale(1.3);
    }
}


/* =====================================================
   HOME
===================================================== */

#home{
    position:fixed;

    right:20px;
    bottom:20px;

    width:52px;
    height:52px;

    border-radius:50%;

    border:1px solid #50655e;

    background:#0d1714;

    color:#4ae9bd;

    font-size:22px;

    cursor:pointer;

    z-index:10000;
}

</style>
</head>

<body>


<div id="hud">

    <div id="entropy">
        0 entropii
    </div>

<div id="viewport">

<div id="world">

<svg id="lines"></svg>

</div>


<script>

/* =====================================================

const svg =

/* =====================================================

let entropy = 0;

let clickPower = 1;


generators.forEach(g=>{

    g.level = 0;

    g.upgrades = g.upgrades.map(u=>({

        name:u[0],
        bonus:u[1],
        cost:u[2],
        bought:false

    }));

});


/* =====================================================
   FIND
===================================================== */

function byId(id){

    return generators.find(
        g => g.id === id
    );

}


/* =====================================================
   FALLBACK ICON

   Ta ikona pojawia się ZAWSZE,
   nawet bez Three.js.
===================================================== */

function drawIcon(canvas,g){

    const ctx =
        canvas.getContext("2d");


    const w =
        canvas.width;

    const h =
        canvas.height;


    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    const cx =
        w/2;

    const cy =
        h/2;


    /* shadow */

    ctx.shadowBlur = 20;

    ctx.shadowColor =
        g.color;


    const gradient =

        ctx.createRadialGradient(

            cx-25,
            cy-30,
            8,

            cx,
            cy,
            85

        );


    gradient.addColorStop(
        0,
        "#ffffff"
    );


    gradient.addColorStop(
        .18,
        g.color
    );


    gradient.addColorStop(
        1,
        "#101c19"
    );


    ctx.fillStyle =
        gradient;


    /* DIFFERENT SHAPES */

    if(g.id === "dna"){

        ctx.shadowBlur = 12;

        ctx.lineWidth = 12;

        for(
            let i = 0;
            i < 2;
            i++
        ){

            ctx.beginPath();


            ctx.strokeStyle =
                i === 0
                ? "#37c6ff"
                : "#c963d9";


            for(
                let y = 25;
                y <= 215;
                y += 3
            ){

                const t =
                    (y-25)/190;


                const x =

                    cx +

                    Math.sin(
                        t*Math.PI*4 +
                        i*Math.PI
                    ) *

                    45;


                if(y === 25){

                    ctx.moveTo(
                        x,
                        y
                    );

                }

                else{

                    ctx.lineTo(
                        x,
                        y
                    );

                }

            }


            ctx.stroke();

        }


        return;

    }


    if(
        g.id === "prokaryote"
    ){

        ctx.beginPath();

        ctx.ellipse(
            cx,
            cy,
            78,
            48,
            -.15,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.shadowBlur=0;


        for(let i=0;i<13;i++){

            ctx.beginPath();

            ctx.fillStyle="#d6e7a7";

            ctx.arc(

                cx-45+
                Math.random()*90,

                cy-27+
                Math.random()*54,

                5,

                0,
                Math.PI*2

            );

            ctx.fill();

        }


        return;

    }


    if(
        g.id === "eukaryote"
    ){

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            72,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.shadowBlur=5;

        ctx.fillStyle="#9e67af";

        ctx.beginPath();

        ctx.arc(
            cx-12,
            cy-7,
            29,
            0,
            Math.PI*2
        );

        ctx.fill();


        return;

    }


    if(g.id === "fish"){

        ctx.beginPath();

        ctx.ellipse(
            cx+5,
            cy,
            70,
            39,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.moveTo(
            cx-65,
            cy
        );

        ctx.lineTo(
            cx-110,
            cy-40
        );

        ctx.lineTo(
            cx-110,
            cy+40
        );

        ctx.closePath();

        ctx.fill();


        ctx.fillStyle="#080808";

        ctx.beginPath();

        ctx.arc(
            cx+50,
            cy-12,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();


        return;

    }


    if(
        g.id === "tetrapod" ||
        g.id === "reptile" ||
        g.id === "amphibian" ||
        g.id === "mammal"
    ){

        ctx.beginPath();

        ctx.ellipse(
            cx-5,
            cy,
            62,
            38,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            cx+62,
            cy-16,
            28,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.lineWidth=14;

        ctx.lineCap="round";

        ctx.strokeStyle=g.color;


        ctx.beginPath();

        ctx.moveTo(cx-35,cy+25);
        ctx.lineTo(cx-52,cy+63);

        ctx.moveTo(cx+15,cy+30);
        ctx.lineTo(cx+29,cy+66);

        ctx.stroke();


        ctx.fillStyle="#050505";

        ctx.beginPath();

        ctx.arc(
            cx+72,
            cy-22,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();


        return;

    }


    if(
        g.id === "primate" ||
        g.id === "human"
    ){

        ctx.beginPath();

        ctx.arc(
            cx,
            cy-48,
            32,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.ellipse(
            cx,
            cy+20,
            35,
            60,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.lineWidth=16;

        ctx.strokeStyle=g.color;

        ctx.lineCap="round";


        ctx.beginPath();

        ctx.moveTo(cx-25,cy);
        ctx.lineTo(cx-63,cy+45);

        ctx.moveTo(cx+25,cy);
        ctx.lineTo(cx+63,cy+45);

        ctx.moveTo(cx-18,cy+64);
        ctx.lineTo(cx-30,cy+100);

        ctx.moveTo(cx+18,cy+64);
        ctx.lineTo(cx+30,cy+100);

        ctx.stroke();


        return;

    }


    /* default organic icon */

    ctx.beginPath();

    ctx.ellipse(
        cx,
        cy,
        65,
        55,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;

    ctx.fillStyle="white";

    ctx.font="bold 30px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        g.fallback,
        cx,
        cy
    );

}


/* =====================================================
   UPGRADE ICON
===================================================== */

const upgradeSVG = `

<svg viewBox="0 0 100 100">

<circle
cx="50"
cy="50"
r="31"
fill="#246b59"
stroke="#6ae2c3"
stroke-width="5"
/>

<path
d="M50 27 V73 M27 50 H73"
stroke="#e9fff9"
stroke-width="9"
stroke-linecap="round"
/>

</svg>

`;


/* =====================================================
   CREATE GENERATORS
===================================================== */

generators.forEach(
    (g,index)=>{

        const generator =
            document.createElement("div");


        generator.className =
            "generator";


        generator.id =
            "generator-" + g.id;


        generator.style.left =
            g.x + "px";


        generator.style.top =
            g.y + "px";


        const canvas =
            document.createElement("canvas");


        canvas.className =
            "modelCanvas";


        canvas.width =
            240;


        canvas.height =
            240;


        generator.appendChild(
            canvas
        );


        drawIcon(
            canvas,
            g
        );


        const level =
            document.createElement("div");


        level.className =
            "level";


        level.textContent =
            "x0";


        generator.appendChild(
            level
        );


        const name =
            document.createElement("div");


        name.className =
            "generatorName";


        name.textContent =
            g.name;


        generator.appendChild(
            name
        );


        const cost =
            document.createElement("div");


        cost.className =
            "generatorCost";


        generator.appendChild(
            cost
        );


        generator.addEventListener(
            "pointerdown",
            e=>e.stopPropagation()
        );


        generator.addEventListener(
            "click",
            e=>{

                e.stopPropagation();

                buyGenerator(index);

            }
        );


        world.appendChild(
            generator
        );


        /* Branch generators have smaller upgrade offsets */

        let leftX =
            g.branch
            ? g.x - 260
            : 500;


        let rightX =
            g.branch
            ? g.x + 270
            : 1100;


        createUpgrade(
            g,
            index,
            0,
            leftX
        );


        createUpgrade(
            g,
            index,
            1,
            rightX
        );

    }
);


/* =====================================================
   CREATE UPGRADE
===================================================== */

function createUpgrade(
    g,
    generatorIndex,
    upgradeIndex,
    x
){

    const data =
        g.upgrades[upgradeIndex];


    const element =
        document.createElement("div");


    element.className =
        "upgrade";


    element.id =
        `upgrade-${g.id}-${upgradeIndex}`;


    element.style.left =
        x + "px";


    element.style.top =
        g.y + "px";


    element.innerHTML = `

        <div class="upgradeIcon">

            ${upgradeSVG}

        </div>

        <div class="upgradeInfo">

            <div class="upgradeName">
                ${data.name}
            </div>

            <div class="upgradeEffect">
                +${data.bonus*100}% produkcji
            </div>

            <div class="upgradeCost">
                ${format(data.cost)} entropii
            </div>

        </div>

    `;


    element.addEventListener(
        "pointerdown",
        e=>e.stopPropagation()
    );


    element.addEventListener(
        "click",
        e=>{

            e.stopPropagation();

            buyUpgrade(
                generatorIndex,
                upgradeIndex
            );

        }
    );


    world.appendChild(
        element
    );

}


/* =====================================================
   LINES
===================================================== */

function drawLines(){

    svg.innerHTML="";


    generators.forEach(
        (g,index)=>{

            if(!g.parent){
                return;
            }


            const parent =
                byId(
                    g.parent
                );


            const line =
                document.createElementNS(

                    "http://www.w3.org/2000/svg",

                    "line"

                );


            line.setAttribute(
                "x1",
                parent.x
            );


            line.setAttribute(
                "y1",
                parent.y
            );


            line.setAttribute(
                "x2",
                g.x
            );


            line.setAttribute(
                "y2",
                g.y
            );


            line.id =
                "connection-" +
                g.id;


            line.classList.add(

                g.branch
                ? "branchLine"
                : "mainLine"

            );


            svg.appendChild(line);


            /* upgrade lines */

            let leftX =
                g.branch
                ? g.x - 260
                : 500;


            let rightX =
                g.branch
                ? g.x + 270
                : 1100;


            createUpgradeLine(
                g,
                index,
                0,
                leftX
            );


            createUpgradeLine(
                g,
                index,
                1,
                rightX
            );

        }
    );


    /* Amino upgrade lines */

    const amino =
        generators[0];


    createUpgradeLine(
        amino,
        0,
        0,
        500
    );


    createUpgradeLine(
        amino,
        0,
        1,
        1100
    );

}


/* =====================================================
   UPGRADE LINE
===================================================== */

function createUpgradeLine(
    g,
    index,
    upgradeIndex,
    x
){

    const line =
        document.createElementNS(

            "http://www.w3.org/2000/svg",

            "line"

        );


    line.setAttribute(
        "x1",
        g.x
    );


    line.setAttribute(
        "y1",
        g.y
    );


    line.setAttribute(
        "x2",
        x
    );


    line.setAttribute(
        "y2",
        g.y
    );


    line.classList.add(
        "upgradeLine"
    );


    line.id =
        `upgradeLine-${index}-${upgradeIndex}`;


    svg.appendChild(
        line
    );

}


/* =====================================================
   COST
===================================================== */

function generatorCost(g){

    return Math.floor(

        g.cost *

        Math.pow(
            1.17,
            g.level
        )

    );

}


/* =====================================================
   MULTIPLIER
===================================================== */

function multiplier(g){

    let m = 1;


    g.upgrades.forEach(u=>{

        if(u.bought){

            m +=
                u.bonus;

        }

    });


    return m;

}


/* =====================================================
   PRODUCTION
===================================================== */

function production(){

    let total = 0;


    generators.forEach(g=>{

        total +=

            g.production *

            g.level *

            multiplier(g);

    });


    return total;

}


/* =====================================================
   BUY GENERATOR
===================================================== */

function buyGenerator(index){

    const g =
        generators[index];


    if(g.parent){

        const parent =
            byId(
                g.parent
            );


        if(
            parent.level === 0
        ){

            return;

        }

    }


    const price =
        generatorCost(g);


    if(
        entropy < price
    ){

        return;

    }


    entropy -= price;

    g.level++;


    updateUI();

}


/* =====================================================
   BUY UPGRADE
===================================================== */

function buyUpgrade(
    generatorIndex,
    upgradeIndex
){

    const g =
        generators[
            generatorIndex
        ];


    const u =
        g.upgrades[
            upgradeIndex
        ];


    if(
        g.level === 0 ||
        u.bought
    ){

        return;

    }


    if(
        entropy < u.cost
    ){

        return;

    }


    entropy -=
        u.cost;


    u.bought =
        true;


    updateUI();

}


/* =====================================================
   FORMAT
===================================================== */

function format(n){

    if(n < 1e3){

        return Math.floor(n)
        .toString();

    }


    if(n < 1e6){

        return (
            n/1e3
        ).toFixed(1) +
        " tys.";

    }


    if(n < 1e9){

        return (
            n/1e6
        ).toFixed(2) +
        " mln";

    }


    if(n < 1e12){

        return (
            n/1e9
        ).toFixed(2) +
        " mld";

    }


    if(n < 1e15){

        return (
            n/1e12
        ).toFixed(2) +
        " bln";

    }


    return n.toExponential(2);

}


/* =====================================================
   UPDATE
===================================================== */

function updateUI(){

    document
    .getElementById("entropy")
    .textContent =

        format(entropy) +
        " entropii";


    document
    .getElementById("production")
    .textContent =

        "+" +
        format(
            production()
        ) +
        " / s";


    generators.forEach(
        (g,index)=>{

            const element =

                document
                .getElementById(
                    "generator-" +
                    g.id
                );


            let unlocked =
                true;


            if(g.parent){

                unlocked =

                    byId(
                        g.parent
                    ).level > 0;

            }


            element
            .classList
            .remove(
                "locked",
                "available",
                "owned"
            );


            if(!unlocked){

                element
                .classList
                .add(
                    "locked"
                );

            }

            else if(
                g.level === 0
            ){

                element
                .classList
                .add(
                    "available"
                );

            }

            else{

                element
                .classList
                .add(
                    "owned"
                );

            }


            element
            .querySelector(
                ".level"
            )
            .textContent =

                "x" +
                g.level;


            element
            .querySelector(
                ".generatorCost"
            )
            .textContent =

                format(
                    generatorCost(g)
                ) +

                " entropii";


            /* CONNECTION */

            if(g.parent){

                const line =

                    document
                    .getElementById(
                        "connection-" +
                        g.id
                    );


                line
                .classList
                .toggle(

                    "active",

                    byId(
                        g.parent
                    ).level > 0

                );

            }


            /* UPGRADES */

            g.upgrades.forEach(
                (u,uIndex)=>{

                    const upgrade =

                        document
                        .getElementById(

                            `upgrade-${g.id}-${uIndex}`

                        );


                    upgrade
                    .classList
                    .remove(
                        "locked",
                        "bought"
                    );


                    if(
                        g.level === 0
                    ){

                        upgrade
                        .classList
                        .add(
                            "locked"
                        );

                    }


                    if(u.bought){

                        upgrade
                        .classList
                        .add(
                            "bought"
                        );


                        upgrade
                        .querySelector(
                            ".upgradeEffect"
                        )
                        .textContent =

                            "AKTYWNE";

                    }


                    const line =

                        document
                        .getElementById(

                            `upgradeLine-${index}-${uIndex}`

                        );


                    if(line){

                        line
                        .classList
                        .toggle(

                            "active",

                            g.level > 0

                        );

                    }

                }
            );

        }
    );

}


/* =====================================================
   DRAG MAP
===================================================== */

let worldX = 0;
let worldY = 0;

let dragging = false;
let moved = false;

let startPointerX = 0;
let startPointerY = 0;

let startWorldX = 0;
let startWorldY = 0;


function renderWorld(){

    world.style.transform =

        `translate(${worldX}px,${worldY}px)`;

}


/* DOWN */

viewport.addEventListener(
    "pointerdown",
    e=>{

        if(
            e.target.closest(".generator") ||
            e.target.closest(".upgrade")
        ){

            return;

        }


        dragging = true;

        moved = false;


        startPointerX =
            e.clientX;


        startPointerY =
            e.clientY;


        startWorldX =
            worldX;


        startWorldY =
            worldY;


        viewport
        .classList
        .add(
            "dragging"
        );


        viewport
        .setPointerCapture(
            e.pointerId
        );

    }
);


/* MOVE */

viewport.addEventListener(
    "pointermove",
    e=>{

        if(
            !dragging
        ){

            return;

        }


        const dx =

            e.clientX -
            startPointerX;


        const dy =

            e.clientY -
            startPointerY;


        if(
            Math.abs(dx)>5 ||
            Math.abs(dy)>5
        ){

            moved = true;

        }


        worldX =
            startWorldX +
            dx;


        worldY =
            startWorldY +
            dy;


        renderWorld();

    }
);


/* UP */

viewport.addEventListener(
    "pointerup",
    e=>{

        if(
            !dragging
        ){

            return;

        }


        dragging =
            false;


        viewport
        .classList
        .remove(
            "dragging"
        );


        if(
            !moved
        ){

            entropy +=
                clickPower;


            clickEffect(
                e.clientX,
                e.clientY
            );


            updateUI();

        }

    }
);


/* =====================================================
   CLICK TEXT
===================================================== */

function clickEffect(x,y){

    const element =

        document
        .createElement(
            "div"
        );


    element.className =
        "clickText";


    element.textContent =
        "+" +
        clickPower;


    element.style.left =
        x + "px";


    element.style.top =
        y + "px";


    document.body
    .appendChild(
        element
    );


    setTimeout(
        ()=>element.remove(),
        800
    );

}


/* =====================================================
   HOME / START POSITION
===================================================== */

function centerOnAmino(){

    const amino =
        byId(
            "amino"
        );


    worldX =

        window.innerWidth/2 -

        amino.x;


    worldY =

        window.innerHeight/2 -

        amino.y;


    renderWorld();

}


document
.getElementById("home")
.addEventListener(
    "click",
    e=>{

        e.stopPropagation();

        centerOnAmino();

    }
);


/* =====================================================
   PRODUCTION LOOP
===================================================== */

setInterval(
    ()=>{

        entropy +=
            production()/10;


        updateUI();

    },
    100
);


/* =====================================================
   START
===================================================== */

drawLines();

updateUI();

centerOnAmino();

</script>
