<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ewolucja - Entropia</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        background:
            radial-gradient(circle at center, #353535 0%, #262626 55%, #171717 100%);
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
    }

    /* =========================
       GÓRNY PANEL
    ========================= */

    #topBar {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: 350px;

        background: rgba(20, 20, 20, 0.94);
        border-radius: 16px;
        padding: 12px 18px;

        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);

        text-align: center;
    }

    #entropy {
        color: #ff9d00;
        font-size: 27px;
        font-weight: bold;
    }

    #perSecond {
        margin-top: 4px;
        color: #8adb58;
        font-size: 14px;
    }

    #info {
        color: #aaa;
        font-size: 11px;
        margin-top: 7px;
    }

    /* =========================
       MAPA
    ========================= */

    #viewport {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overflow-x: hidden;
    }

    #tree {
        position: relative;
        width: 100%;
        max-width: 900px;
        height: 2500px;
        margin: auto;
    }

    #lines {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    .connection {
        stroke: #82531a;
        stroke-width: 4;
        opacity: 0.5;
    }

    .connection.active {
        stroke: #ff9700;
        opacity: 1;
        filter: drop-shadow(0 0 5px #ff9700);
    }

    /* =========================
       GENERATORY
    ========================= */

    .generator {
        position: absolute;

        width: 118px;
        height: 118px;

        transform: translate(-50%, -50%);

        background: #111;
        border: 5px solid #5d431d;
        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;

        cursor: pointer;

        z-index: 10;

        transition:
            transform 0.15s,
            border-color 0.2s,
            box-shadow 0.2s,
            opacity 0.2s;
    }

    .generator.locked {
        opacity: 0.35;
        cursor: default;
    }

    .generator.available {
        border-color: #ff9700;
        box-shadow:
            0 0 12px rgba(255,151,0,0.5),
            inset 0 0 20px rgba(255,151,0,0.08);
    }

    .generator.owned {
        border-color: #ff9700;
        box-shadow:
            0 0 16px rgba(255,151,0,0.5);
    }

    .generator:not(.locked):hover {
        transform: translate(-50%, -50%) scale(1.08);
    }

    .generator:active {
        transform: translate(-50%, -50%) scale(0.95);
    }

    .icon {
        font-size: 43px;
    }

    .level {
        position: absolute;
        top: -14px;
        right: -15px;

        background: #151515;
        border-radius: 20px;

        padding: 5px 9px;

        color: #ffc04d;
        font-weight: bold;
        font-size: 14px;
    }

    .name {
        position: absolute;
        top: 125px;
        left: 50%;
        transform: translateX(-50%);

        white-space: nowrap;

        font-size: 19px;
        font-weight: bold;

        text-shadow:
            0 2px 3px black,
            0 0 5px black;
    }

    .price {
        position: absolute;
        top: 150px;
        left: 50%;
        transform: translateX(-50%);

        color: #ff9e00;
        font-weight: bold;
        white-space: nowrap;
        font-size: 14px;
    }

    /* =========================
       KWADRATOWE ULEPSZENIA
    ========================= */

    .upgrade {
        position: absolute;

        width: 62px;
        height: 62px;

        transform: translate(-50%, -50%);

        background: #242424;
        border: 4px solid #75501d;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 28px;

        cursor: pointer;

        z-index: 11;

        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);

        transition: 0.15s;
    }

    .upgrade.locked {
        opacity: 0.25;
        cursor: default;
    }

    .upgrade.available {
        border-color: #ff9500;
    }

    .upgrade.bought {
        border-color: #71d45c;
        background: #31422b;
    }

    .upgrade:not(.locked):not(.bought):hover {
        transform: translate(-50%, -50%) scale(1.1);
        box-shadow: 0 0 10px #ff9500;
    }

    .upgradeName {
        position: absolute;
        top: 67px;
        left: 50%;
        transform: translateX(-50%);

        font-size: 11px;
        color: #cfcfcf;

        white-space: nowrap;
    }

    /* =========================
       EFEKT KLIKNIĘCIA
    ========================= */

    .clickText {
        position: fixed;
        pointer-events: none;

        color: #ffad2e;
        font-weight: bold;
        font-size: 20px;

        z-index: 2000;

        animation: floatUp 0.8s forwards;
    }

    @keyframes floatUp {
        0% {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        100% {
            opacity: 0;
            transform: translate(-50%, -100px) scale(1.3);
        }
    }

    /* =========================
       POMOC
    ========================= */

    #help {
        position: fixed;
        bottom: 15px;
        left: 15px;

        color: #aaa;
        background: rgba(0,0,0,0.55);

        padding: 8px 12px;
        border-radius: 8px;

        font-size: 12px;
        z-index: 1000;

        pointer-events: none;
    }

</style>
</head>

<body>

<div id="topBar">
    <div>ENTROPIA</div>
    <div id="entropy">0</div>
    <div id="perSecond">0 / s</div>
    <div id="info">Klikaj puste miejsce na ekranie</div>
</div>

<div id="viewport">

    <div id="tree">

        <svg id="lines"></svg>

    </div>

</div>

<div id="help">
    Kliknięcie tła = +1 entropii
</div>


<script>

/* =====================================================
   DANE GRY
===================================================== */

let entropy = 0;

let clickPower = 1;


/*
    y:
    mniejsza wartość = wyżej
    większa wartość = niżej

    Czyli Aminokwas jest na samym dole,
    a Ssak na samej górze.
*/

const generators = [

    {
        id: "amino",
        name: "Aminokwas",
        icon: "🧪",
        x: 50,
        y: 2320,
        cost: 10,
        production: 0.2
    },

    {
        id: "protein",
        name: "Białko",
        icon: "🧬",
        x: 38,
        y: 2150,
        cost: 30,
        production: 0.5
    },

    {
        id: "rna",
        name: "RNA",
        icon: "〰️",
        x: 58,
        y: 1980,
        cost: 80,
        production: 1
    },

    {
        id: "dna",
        name: "DNA",
        icon: "🧬",
        x: 42,
        y: 1810,
        cost: 200,
        production: 2
    },

    {
        id: "prokaryote",
        name: "Komórka prokariotyczna",
        icon: "🦠",
        x: 57,
        y: 1640,
        cost: 500,
        production: 5
    },

    {
        id: "eukaryote",
        name: "Komórka eukariotyczna",
        icon: "🔬",
        x: 43,
        y: 1470,
        cost: 1200,
        production: 12
    },

    {
        id: "multicellular",
        name: "Wielokomórkowiec",
        icon: "🫧",
        x: 59,
        y: 1300,
        cost: 3000,
        production: 30
    },

    {
        id: "animal",
        name: "Zwierzę",
        icon: "🪸",
        x: 41,
        y: 1130,
        cost: 8000,
        production: 75
    },

    {
        id: "chordate",
        name: "Strunowiec",
        icon: "🪱",
        x: 58,
        y: 960,
        cost: 20000,
        production: 180
    },

    {
        id: "fish",
        name: "Ryba",
        icon: "🐟",
        x: 42,
        y: 790,
        cost: 50000,
        production: 450
    },

    {
        id: "tetrapod",
        name: "Czworonóg",
        icon: "🐸",
        x: 58,
        y: 620,
        cost: 125000,
        production: 1100
    },

    {
        id: "reptile",
        name: "Gad",
        icon: "🦎",
        x: 42,
        y: 450,
        cost: 300000,
        production: 2700
    },

    {
        id: "synapsid",
        name: "Synapsyd",
        icon: "🐊",
        x: 58,
        y: 280,
        cost: 750000,
        production: 6500
    },

    {
        id: "mammal",
        name: "Ssak",
        icon: "🐁",
        x: 50,
        y: 110,
        cost: 1800000,
        production: 15000
    }

];


/* =====================================================
   TWORZENIE GENERATORÓW
===================================================== */

const tree = document.getElementById("tree");

generators.forEach((generator, index) => {

    generator.level = 0;
    generator.upgrade = false;

    const element = document.createElement("div");

    element.className = "generator";

    element.id = "generator-" + generator.id;

    element.style.left = generator.x + "%";
    element.style.top = generator.y + "px";

    element.innerHTML = `
        <div class="level">x0</div>

        <div class="icon">
            ${generator.icon}
        </div>

        <div class="name">
            ${generator.name}
        </div>

        <div class="price"></div>
    `;

    element.addEventListener("click", (event) => {

        event.stopPropagation();

        buyGenerator(index);

    });

    tree.appendChild(element);


    /* =========================
       KWADRATOWE ULEPSZENIE
    ========================= */

    const upgrade = document.createElement("div");

    upgrade.className = "upgrade";

    upgrade.id = "upgrade-" + generator.id;

    /*
       Ulepszenia są naprzemiennie
       po lewej i prawej stronie.
    */

    let upgradeX;

    if(index % 2 === 0) {

        upgradeX = generator.x + 20;

    } else {

        upgradeX = generator.x - 20;

    }

    upgrade.style.left = upgradeX + "%";
    upgrade.style.top = generator.y + "px";

    upgrade.innerHTML = `
        ⚙️
        <div class="upgradeName">
            x2 produkcja
        </div>
    `;

    upgrade.addEventListener("click", (event) => {

        event.stopPropagation();

        buyUpgrade(index);

    });

    tree.appendChild(upgrade);

});


/* =====================================================
   LINIE
===================================================== */

function createLines() {

    const svg = document.getElementById("lines");

    svg.innerHTML = "";

    const width = tree.clientWidth;


    for(let i = 0; i < generators.length - 1; i++) {

        const first = generators[i];
        const second = generators[i + 1];

        const line = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

        line.setAttribute(
            "x1",
            width * first.x / 100
        );

        line.setAttribute(
            "y1",
            first.y
        );

        line.setAttribute(
            "x2",
            width * second.x / 100
        );

        line.setAttribute(
            "y2",
            second.y
        );

        line.classList.add("connection");

        line.id = "line-" + i;

        svg.appendChild(line);

    }

}


/* =====================================================
   KOSZT
===================================================== */

function generatorCost(generator) {

    return Math.floor(
        generator.cost *
        Math.pow(1.18, generator.level)
    );

}


/* =====================================================
   KUPOWANIE GENERATORA
===================================================== */

function buyGenerator(index) {

    const generator = generators[index];

    /*
        Pierwszy generator zawsze może być kupiony.

        Następne wymagają przynajmniej 1 poziomu
        poprzedniego generatora.
    */

    if(
        index > 0 &&
        generators[index - 1].level === 0
    ) {
        return;
    }


    const cost = generatorCost(generator);


    if(entropy < cost) {

        flashNotEnough();

        return;

    }


    entropy -= cost;

    generator.level++;

    updateUI();

}


/* =====================================================
   ULEPSZENIA
===================================================== */

function buyUpgrade(index) {

    const generator = generators[index];

    if(generator.level === 0) {
        return;
    }

    if(generator.upgrade) {
        return;
    }


    const cost = generator.cost * 8;


    if(entropy < cost) {

        flashNotEnough();

        return;

    }


    entropy -= cost;

    generator.upgrade = true;

    updateUI();

}


/* =====================================================
   PRODUKCJA
===================================================== */

function getProduction() {

    let production = 0;


    generators.forEach(generator => {

        let multiplier = 1;

        if(generator.upgrade) {
            multiplier = 2;
        }


        production +=
            generator.production *
            generator.level *
            multiplier;

    });


    return production;

}


/* =====================================================
   FORMATOWANIE LICZB
===================================================== */

function formatNumber(number) {

    if(number < 1000) {
        return Math.floor(number).toLocaleString("pl-PL");
    }

    if(number < 1_000_000) {
        return (number / 1000).toFixed(1) + " tys.";
    }

    if(number < 1_000_000_000) {
        return (number / 1_000_000).toFixed(2) + " mln";
    }

    if(number < 1_000_000_000_000) {
        return (number / 1_000_000_000).toFixed(2) + " mld";
    }


    return number.toExponential(2);

}


/* =====================================================
   AKTUALIZACJA INTERFEJSU
===================================================== */

function updateUI() {

    document.getElementById("entropy").textContent =
        "🧬 " + formatNumber(entropy);

    document.getElementById("perSecond").textContent =
        "+" + formatNumber(getProduction()) + " / s";


    generators.forEach((generator, index) => {

        const element =
            document.getElementById(
                "generator-" + generator.id
            );

        const upgrade =
            document.getElementById(
                "upgrade-" + generator.id
            );


        const unlocked =
            index === 0 ||
            generators[index - 1].level > 0;


        element.classList.remove(
            "locked",
            "available",
            "owned"
        );


        if(!unlocked) {

            element.classList.add("locked");

        } else if(generator.level === 0) {

            element.classList.add("available");

        } else {

            element.classList.add("owned");

        }


        element.querySelector(".level").textContent =
            "x" + generator.level;


        element.querySelector(".price").textContent =
            "🧬 " +
            formatNumber(generatorCost(generator));


        /* =====================
           ULEPSZENIE
        ===================== */

        upgrade.classList.remove(
            "locked",
            "available",
            "bought"
        );


        if(generator.level === 0) {

            upgrade.classList.add("locked");

        } else if(generator.upgrade) {

            upgrade.classList.add("bought");

        } else {

            upgrade.classList.add("available");

        }


        if(generator.upgrade) {

            upgrade.querySelector(".upgradeName").textContent =
                "ULEPSZONO";

        } else {

            upgrade.querySelector(".upgradeName").textContent =
                "x2 • " +
                formatNumber(generator.cost * 8);

        }


        /*
            Zapalanie linii
        */

        if(index < generators.length - 1) {

            const line =
                document.getElementById(
                    "line-" + index
                );

            if(generator.level > 0) {
                line.classList.add("active");
            } else {
                line.classList.remove("active");
            }

        }

    });

}


/* =====================================================
   KLIKANIE TŁA
===================================================== */

document.addEventListener("click", function(event) {

    /*
        Jeżeli kliknięto generator
        albo upgrade, nie dodajemy entropii.
    */

    if(
        event.target.closest(".generator") ||
        event.target.closest(".upgrade") ||
        event.target.closest("#topBar")
    ) {
        return;
    }


    entropy += clickPower;


    createClickText(
        event.clientX,
        event.clientY,
        "+" + clickPower
    );


    updateUI();

});


/* =====================================================
   TEKST +1
===================================================== */

function createClickText(x, y, text) {

    const element =
        document.createElement("div");

    element.className = "clickText";

    element.textContent = text;

    element.style.left = x + "px";
    element.style.top = y + "px";

    document.body.appendChild(element);


    setTimeout(() => {

        element.remove();

    }, 800);

}


/* =====================================================
   BRAK ENTROPII
===================================================== */

function flashNotEnough() {

    const entropyElement =
        document.getElementById("entropy");

    entropyElement.style.color = "#ff4545";

    setTimeout(() => {

        entropyElement.style.color = "#ff9d00";

    }, 250);

}


/* =====================================================
   AUTOMATYCZNA PRODUKCJA
===================================================== */

setInterval(() => {

    entropy += getProduction() / 10;

    updateUI();

}, 100);


/* =====================================================
   START
===================================================== */

createLines();

updateUI();


/*
    Zaczynamy na dole drzewa,
    przy Aminokwasie.
*/

window.addEventListener("load", () => {

    const viewport =
        document.getElementById("viewport");

    viewport.scrollTop =
        viewport.scrollHeight -
        viewport.clientHeight;

});


/*
    Poprawienie linii po zmianie
    wielkości okna.
*/

window.addEventListener(
    "resize",
    createLines
);

</script>

</body>
</html>
