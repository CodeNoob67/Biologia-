
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power Clash Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090e1d;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
#hud{position:absolute;top:15px;left:15px;background:#151e35e8;padding:15px;border-radius:15px;border:1px solid #364568;pointer-events:none}
#hud h2{margin:0 0 8px;color:#8de4ff}
#panel{position:absolute;right:15px;top:15px;width:250px;background:#151e35f2;border:1px solid #46577b;border-radius:15px;padding:14px;max-height:90vh;overflow:auto}
#panel h3{margin:0 0 10px}
button{background:#5369ee;border:0;border-radius:8px;padding:9px 12px;color:white;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.2)}
button:disabled{opacity:.45;cursor:default}
.char{display:flex;align-items:center;gap:9px;padding:9px;margin:7px 0;background:#26324e;border-radius:9px}
.char .emoji{font-size:28px}
.char .info{flex:1;font-size:12px}
.char .info b{font-size:14px}
.char button{padding:6px;font-size:11px}
#bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:#151e35e8;padding:12px;border-radius:15px}
#bottom button{padding:13px 18px}
#special{background:#b34ce3}
#message{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:34px;font-weight:bold;text-shadow:0 3px 12px black;pointer-events:none;text-align:center}
.small{font-size:12px;color:#aebcda}
@media(max-width:700px){#panel{width:190px;font-size:12px}#hud{font-size:12px}#bottom{bottom:5px}}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
<h2>⚔️ POWER CLASH</h2>
<div id="stats">Wybierz postać</div>
<div class="small">WASD – ruch | Mysz – celowanie</div>
<div class="small">Klik – atak | Spacja – supermoc</div>
</div>

<div id="panel">
<h3>👥 Postacie</h3>
<p class="small">Panel testowy: dodawaj postacie za darmo.</p>
<div id="list"></div>
<button onclick="unlockAll()">🔓 Odblokuj wszystkie</button>
</div>

<div id="bottom">
<button onclick="startGame()">▶ WALKA 1V1</button>
<button id="special" onclick="useSuper()">✨ SUPER</button>
</div>
<div id="message">Wybierz postać i rozpocznij walkę!</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W,H,cx,cy,R;
function resize(){
W=canvas.width=innerWidth;
H=canvas.height=innerHeight;
cx=W/2;cy=H/2;
R=Math.min(W*.37,H*.39,330);
}
window.addEventListener("resize",resize);
resize();

const chars=[
{id:"comet",name:"Comet",emoji:"☄️",rarity:"ASTRO",color:"#ff914d",hp:130,speed:3.3,damage:16,super:"Meteor"},
{id:"orbit",name:"Orbit",emoji:"🪐",rarity:"ASTRO",color:"#a87dff",hp:150,speed:3,damage:13,super:"Grawitacja"},
{id:"thorn",name:"Thorn",emoji:"🌿",rarity:"POWER",color:"#51df82",hp:145,speed:3.2,damage:15,super:"Kolce"},
{id:"anchor",name:"Anchor",emoji:"⚓",rarity:"POWER",color:"#5dc9f5",hp:180,speed:2.7,damage:19,super:"Kotwica"}
];

let owned=["comet"],selected="comet";
let player=null,bot=null,bullets=[],particles=[],zones=[];
let running=false,keys={},mouse={x:0,y:0,down:false};
let last=0,superReady=true,superTimer=0,botStun=0;
let shake=0,gameTime=0;

const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const get=id=>chars.find(c=>c.id===id);

function renderList(){
const list=document.getElementById("list");
list.innerHTML="";
chars.forEach(c=>{
let unlocked=owned.includes(c.id);
let div=document.createElement("div");
div.className="char";
div.innerHTML=`
<span class="emoji">${c.emoji}</span>
<div class="info"><b>${c.name}</b><br>
<span style="color:${c.rarity==="ASTRO"?"#ffd76b":"#ff8a9b"}">${c.rarity}</span></div>
<button>${unlocked?(selected===c.id?"✓":"Wybierz"):"Dodaj +"}</button>`;
div.querySelector("button").onclick=()=>{
if(!unlocked)owned.push(c.id);
selected=c.id;
renderList();
if(!running)document.getElementById("message").textContent="Wybrano: "+c.name;
};
list.appendChild(div);
});
}
function unlockAll(){owned=chars.map(c=>c.id);renderList()}
renderList();

function makeFighter(c,x,y){
return {...c,x,y,maxHp:c.hp,hp:c.hp,r:22,cooldown:0,angle:0};
}

function startGame(){
let c=get(selected);
let pool=chars.filter(a=>a.id!==selected);
let enemy=pool[Math.floor(Math.random()*pool.length)];
player=makeFighter(c,cx-R*.5,cy);
bot=makeFighter(enemy,cx+R*.5,cy);
bullets=[];particles=[];zones=[];
running=true;superReady=true;superTimer=0;botStun=0;gameTime=0;
document.getElementById("message").textContent="";
}

function stayInside(f){
let dx=f.x-cx,dy=f.y-cy;
let d=Math.hypot(dx,dy);
if(d>R-f.r-8){
f.x=cx+dx/d*(R-f.r-8);
f.y=cy+dy/d*(R-f.r-8);
}
}

function shoot(f,target,isBot=false,damageMultiplier=1){
if(f.cooldown>0)return;
let angle=Math.atan2(target.y-f.y,target.x-f.x);
f.angle=angle;
let speed=8;
bullets.push({
x:f.x+Math.cos(angle)*26,
y:f.y+Math.sin(angle)*26,
vx:Math.cos(angle)*speed,
vy:Math.sin(angle)*speed,
r:8,life:85,
damage:f.damage*damageMultiplier,
owner:isBot?"bot":"player",
color:f.color
});
f.cooldown=isBot?48:22;
burst(f.x+Math.cos(angle)*25,f.y+Math.sin(angle)*25,f.color,5);
}

function burst(x,y,color,n=15){
for(let i=0;i<n;i++){
let a=rand(0,Math.PI*2),s=rand(1,5);
particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
life:rand(15,35),max:35,color,r:rand(2,6)});
}
}

function hit(f,dmg){
if(!running)return;
f.hp=Math.max(0,f.hp-dmg);
burst(f.x,f.y,f.color,18);
shake=8;
if(f.hp<=0){
running=false;
document.getElementById("message").textContent=
f===bot?"🏆 ZWYCIĘSTWO!":"💀 PRZEGRANA!";
}
}

function useSuper(){
if(!running||!superReady)return;
superReady=false;superTimer=360;
let c=player;
if(c.id==="comet"){
zones.push({type:"meteor",x:bot.x,y:bot.y,t:50,r:65,color:"#ff8a32"});
}else if(c.id==="orbit"){
zones.push({type:"gravity",x:c.x,y:c.y,t:160,r:110,color:"#a87dff"});
}else if(c.id==="thorn"){
for(let i=0;i<12;i++){
let a=i*Math.PI/6;
bullets.push({x:c.x,y:c.y,vx:Math.cos(a)*6,vy:Math.sin(a)*6,
r:9,life:50,damage:18,owner:"player",color:"#4cff87"});
}
}else if(c.id==="anchor"){
let a=Math.atan2(mouse.y-c.y,mouse.x-c.x);
bullets.push({x:c.x,y:c.y,vx:Math.cos(a)*10,vy:Math.sin(a)*10,
r:19,life:55,damage:45,owner:"player",color:"#78dfff",stun:true});
}
burst(c.x,c.y,c.color,35);
}

function update(dt){
if(!running)return;
gameTime+=dt;
player.cooldown=Math.max(0,player.cooldown-dt);
bot.cooldown=Math.max(0,bot.cooldown-dt);
if(!superReady){
superTimer-=dt;
if(superTimer<=0)superReady=true;
}
let dx=(keys.d?1:0)-(keys.a?1:0);
let dy=(keys.s?1:0)-(keys.w?1:0);
let len=Math.hypot(dx,dy)||1;
player.x+=dx/len*player.speed*dt;
player.y+=dy/len*player.speed*dt;
stayInside(player);
player.angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);
if(mouse.down)shoot(player,mouse);

if(botStun>0)botStun-=dt;
else{
let d=dist(bot,player);
let a=Math.atan2(player.y-bot.y,player.x-bot.x);
bot.angle=a;
let direction=d>180?1:d<115?-1:0;
bot.x+=Math.cos(a)*bot.speed*.7*direction*dt;
bot.y+=Math.sin(a)*bot.speed*.7*direction*dt;
bot.x+=Math.cos(a+Math.PI/2)*Math.sin(gameTime/35)*.65*dt;
bot.y+=Math.sin(a+Math.PI/2)*Math.sin(gameTime/35)*.65*dt;
stayInside(bot);
if(d<370)shoot(bot,player,true);
}

for(let i=bullets.length-1;i>=0;i--){
let b=bullets[i];
b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
let target=b.owner==="player"?bot:player;
if(dist(b,target)<target.r+b.r){
hit(target,b.damage);
if(b.stun&&target===bot)botStun=95;
bullets.splice(i,1);
continue;
}
if(b.life<=0||Math.hypot(b.x-cx,b.y-cy)>R){
bullets.splice(i,1);
}
}

for(let i=zones.length-1;i>=0;i--){
let z=zones[i];z.t-=dt;
if(z.type==="meteor"&&z.t<=0){
if(dist(z,bot)<z.r+bot.r)hit(bot,65);
burst(z.x,z.y,z.color,70);
zones.splice(i,1);continue;
}
if(z.type==="gravity"){
z.x=player.x;z.y=player.y;
if(dist(z,bot)<z.r){
let a=Math.atan2(z.y-bot.y,z.x-bot.x);
bot.x+=Math.cos(a)*1.8*dt;
bot.y+=Math.sin(a)*1.8*dt;
if(Math.floor(z.t)%20===0)hit(bot,.3*dt);
}
}
if(z.t<=0)zones.splice(i,1);
}
}

function draw(){
ctx.clearRect(0,0,W,H);
ctx.fillStyle="#0b1225";ctx.fillRect(0,0,W,H);
ctx.save();
if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.85;if(shake<.3)shake=0;}

ctx.beginPath();ctx.arc(cx,cy,R+10,0,Math.PI*2);
ctx.fillStyle="#38496d";ctx.fill();
ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
ctx.fillStyle="#263d45";ctx.fill();
ctx.strokeStyle="#65c9b3";ctx.lineWidth=5;ctx.stroke();

ctx.save();
ctx.beginPath();ctx.arc(cx,cy,R-4,0,Math.PI*2);ctx.clip();
ctx.strokeStyle="#ffffff10";ctx.lineWidth=2;
for(let x=cx-R;x<cx+R;x+=45){
ctx.beginPath();ctx.moveTo(x,cy-R);ctx.lineTo(x,cy+R);ctx.stroke();
}
for(let y=cy-R;y<cy+R;y+=45){
ctx.beginPath();ctx.moveTo(cx-R,y);ctx.lineTo(cx+R,y);ctx.stroke();
}
ctx.restore();

zones.forEach(z=>{
ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);
ctx.fillStyle=z.type==="meteor"?"#ff602933":"#ad75ff33";
ctx.fill();ctx.strokeStyle=z.color;ctx.lineWidth=3;ctx.stroke();
if(z.type==="meteor"){
ctx.font="36px Arial";ctx.textAlign="center";ctx.fillText("☄️",z.x,z.y+12);
}
});

bullets.forEach(b=>{
ctx.shadowBlur=20;ctx.shadowColor=b.color;
ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=0;
});

function fighter(f){
if(!f)return;
ctx.save();ctx.translate(f.x,f.y);
ctx.shadowBlur=18;ctx.shadowColor=f.color;
ctx.fillStyle=f.color;
ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=0;
ctx.strokeStyle="white";ctx.lineWidth=3;ctx.stroke();
ctx.rotate(f.angle);
ctx.fillStyle="#e5edff";ctx.fillRect(12,-6,23,12);
ctx.restore();
ctx.textAlign="center";ctx.font="25px Arial";
ctx.fillText(f.emoji,f.x,f.y+8);
ctx.font="bold 13px Arial";ctx.fillStyle="white";
ctx.fillText(f.name,f.x,f.y-40);
ctx.fillStyle="#131725";ctx.fillRect(f.x-32,f.y-34,64,8);
ctx.fillStyle=f===player?"#51ee8a":"#ff526d";
ctx.fillRect(f.x-32,f.y-34,64*(f.hp/f.maxHp),8);
}
fighter(player);fighter(bot);

for(let i=particles.length-1;i>=0;i--){
let p=particles[i];
p.x+=p.vx;p.y+=p.vy;p.life--;
ctx.globalAlpha=Math.max(0,p.life/p.max);
ctx.fillStyle=p.color;
ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
ctx.globalAlpha=1;
if(p.life<=0)particles.splice(i,1);
}
ctx.restore();

document.getElementById("stats").textContent=
player?"❤️ "+Math.ceil(player.hp)+" HP | 🤖 "+Math.ceil(bot.hp)+" HP":"Wybierz postać";
document.getElementById("special").textContent=
superReady?"✨ SUPER": "⏳ "+Math.ceil(superTimer/60)+"s";
document.getElementById("special").disabled=!running||!superReady;
}

function loop(t){
let dt=Math.min((t-last)/16.67||1,2);
last=t;
update(dt);
draw();
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
if(e.code==="Space"){e.preventDefault();useSuper()}
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
canvas.addEventListener("mousedown",()=>mouse.down=true);
window.addEventListener("mouseup",()=>mouse.down=false);
canvas.addEventListener("contextmenu",e=>e.preventDefault());
</script>
</body>
</html>
