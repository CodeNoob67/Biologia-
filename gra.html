<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medieval Arena</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at center,
                    #25d8ff 0%,
                    #079fe0 55%,
                    #0876bd 100%
                );
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .game-lobby {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .background-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.08;

            background-image:
                radial-gradient(
                    circle,
                    white 3px,
                    transparent 4px
                );

            background-size: 70px 70px;
        }

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;

            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 8px 14px;

            background:
                linear-gradient(
                    #2f3b53,
                    #182238
                );

            border-bottom: 4px solid #101725;

            box-shadow: 0 5px 0 #00000055;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 10px;

            min-width: 250px;
        }

        .profile-icon {
            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #1d95e8;

            border: 4px solid #111827;
            border-radius: 10px;

            font-size: 30px;
        }

        .profile-info {
            flex: 1;
        }

        .player-name {
            font-size: 16px;
            font-weight: 900;
        }

        .trophy-line {
            margin-top: 5px;
            padding: 5px 8px;

            background: #253044;

            border: 3px solid #101724;
            border-radius: 8px;

            font-weight: 900;
        }

        .top-currencies {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .currency-box {
            min-width: 80px;
            padding: 9px 12px;

            background: #263248;

            border: 3px solid #111827;
            border-radius: 10px;

            text-align: center;
            font-size: 18px;
            font-weight: 900;
        }

        .panel-button {
            width: 52px;
            height: 52px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;

            background:
                linear-gradient(
                    #60718e,
                    #34445e
                );

            border: 3px solid #111827;
            border-radius: 9px;

            cursor: pointer;

            box-shadow: 0 4px 0 #00000066;
        }

        .panel-button span {
            display: block;

            width: 27px;
            height: 4px;

            background: white;
            border-radius: 5px;
        }

        .panel-button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #00000066;
        }

        .rank-box {
            position: absolute;
            top: 90px;
            left: 50%;
            z-index: 3;

            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rank-part {
            padding: 7px 12px;

            background: #283349;

            border: 3px solid #101724;
            border-radius: 9px;

            font-weight: 900;
        }

        .side-menu {
            position: absolute;
            top: 130px;
            z-index: 4;

            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .side-menu.left {
            left: 12px;
        }

        .side-menu.right {
            right: 12px;
        }

        .side-button {
            position: relative;

            width: 85px;
            min-height: 55px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 5px;

            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 900;

            background:
                linear-gradient(
                    #435670,
                    #202d42
                );

            border: 3px solid #101724;
            border-radius: 9px;

            box-shadow: 0 4px 0 #00000066;

            cursor: pointer;
        }

        .side-icon {
            margin-bottom: 2px;
            font-size: 24px;
        }

        .notification {
            position: absolute;
            top: -7px;
            right: -7px;

            width: 23px;
            height: 23px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: red;

            border: 2px solid white;
            border-radius: 50%;

            font-size: 12px;
        }

        .character-area {
            position: absolute;
            left: 50%;
            top: 53%;
            z-index: 2;

            transform: translate(-50%, -50%);

            width: 340px;
            height: 430px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .character-shadow {
            position: absolute;
            bottom: 30px;

            width: 230px;
            height: 45px;

            background: #004a7277;
            border-radius: 50%;

            filter: blur(3px);
        }

        .character {
            position: relative;
            z-index: 2;

            font-size: 190px;

            filter:
                drop-shadow(
                    0 15px 6px #00466e88
                );

            animation:
                characterIdle 2.2s
                ease-in-out infinite;
        }

        @keyframes characterIdle {
            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-1deg);
            }

            50% {
                transform:
                    translateY(-12px)
                    rotate(1deg);
            }
        }

        .character-title {
            z-index: 3;

            margin-top: -5px;
            padding: 7px 15px;

            background: #28344b;

            border: 3px solid #111827;
            border-radius: 10px;

            font-size: 20px;
            font-weight: 900;
        }

        .character-power {
            z-index: 3;

            margin-top: 6px;

            color: #fff080;

            font-weight: 900;
            text-shadow: 2px 2px black;
        }

        .bottom-left {
            position: absolute;
            left: 15px;
            bottom: 20px;
            z-index: 4;

            width: 260px;
        }

        .pass-box {
            padding: 12px;

            color: #111827;
            font-weight: 900;

            background:
                linear-gradient(
                    90deg,
                    #f0c900,
                    #f79e00
                );

            border: 4px solid #111827;
            border-radius: 12px;

            box-shadow: 0 6px 0 #00000066;
        }

        .pass-title {
            font-size: 22px;
        }

        .progress-background {
            height: 22px;
            margin-top: 8px;

            background: #553e00;

            border: 3px solid #111827;
            border-radius: 10px;

            overflow: hidden;
        }

        .progress-fill {
            width: 45%;
            height: 100%;

            background: #f6df3c;
        }

        .bottom-center {
            position: absolute;
            left: 50%;
            bottom: 18px;
            z-index: 4;

            transform: translateX(-50%);

            width: 370px;
        }

        .event-box {
            width: 100%;
            padding: 11px 15px;

            color: white;
            text-align: center;
            font-weight: 900;

            background:
                linear-gradient(
                    #222c3d,
                    #111827
                );

            border: 4px solid #090e17;
            border-radius: 12px;

            box-shadow: 0 6px 0 #00000066;

            cursor: pointer;
        }

        .event-title {
            font-size: 20px;
        }

        .event-map {
            margin-top: 3px;

            color: #5cff73;
        }

        .change-map-text {
            margin-top: 5px;

            color: #cccccc;
            font-size: 12px;
        }

        .bottom-right {
            position: absolute;
            right: 17px;
            bottom: 18px;
            z-index: 4;

            width: 280px;
        }

        .play-button {
            width: 100%;
            padding: 22px;

            color: #111827;
            font-size: 34px;
            font-weight: 1000;

            background:
                linear-gradient(
                    #ffd934,
                    #f0a900
                );

            border: 5px solid #111827;
            border-radius: 13px;

            box-shadow: 0 7px 0 #00000066;

            cursor: pointer;
        }

        .play-button:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #00000066;
        }

        .map-menu,
        .admin-menu {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: #000000bb;
        }

        .map-menu.visible,
        .admin-menu.visible {
            display: flex;
        }

        .map-window,
        .admin-window {
            position: relative;

            width: min(850px, 92%);
            padding: 30px;

            text-align: center;

            background:
                linear-gradient(
                    #374762,
                    #1b263a
                );

            border: 5px solid #111827;
            border-radius: 20px;

            box-shadow: 0 12px 0 #00000066;
        }

        .admin-window {
            width: min(650px, 95%);
        }

        .map-window h2,
        .admin-window h2 {
            margin-top: 0;

            color: #ffd83d;

            font-size: 32px;
            text-shadow: 3px 3px #111827;
        }

        .close-window {
            position: absolute;
            top: 10px;
            right: 12px;

            width: 45px;
            height: 45px;

            color: white;
            font-size: 22px;

            background: #d83c3c;

            border: 3px solid #111827;
            border-radius: 10px;

            cursor: pointer;
        }

        .map-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .map-card {
            padding: 12px;

            color: white;

            border: 4px solid #111827;
            border-radius: 15px;

            box-shadow: 0 6px 0 #00000066;

            cursor: pointer;
        }

        .map-card strong {
            display: block;
            margin-top: 10px;
            font-size: 20px;
        }

        .map-card span {
            display: block;
            margin-top: 5px;
        }

        .map-preview {
            width: 100%;
            aspect-ratio: 1 / 1;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 4px solid #111827;
            border-radius: 10px;

            font-size: 70px;
        }

        .green-map {
            background: #27984c;
        }

        .green-map .map-preview {
            background:
                repeating-linear-gradient(
                    45deg,
                    #4cbf65,
                    #4cbf65 30px,
                    #3da957 30px,
                    #3da957 60px
                );
        }

        .red-map {
            background: #b73b39;
        }

        .red-map .map-preview {
            background:
                repeating-linear-gradient(
                    45deg,
                    #d94b43,
                    #d94b43 30px,
                    #b83835 30px,
                    #b83835 60px
                );
        }

        .yellow-map {
            background: #ca9828;
        }

        .yellow-map .map-preview {
            background:
                repeating-linear-gradient(
                    45deg,
                    #e8bd42,
                    #e8bd42 30px,
                    #cc9c2c 30px,
                    #cc9c2c 60px
                );
        }

        .admin-section {
            margin: 17px 0;
            padding: 16px;

            text-align: left;

            background: #202c42;

            border: 3px solid #101827;
            border-radius: 14px;
        }

        .admin-section-title {
            margin-bottom: 10px;

            color: white;

            font-size: 19px;
            font-weight: 900;
        }

        .admin-row {
            display: grid;
            grid-template-columns: 1fr 130px;
            gap: 10px;
        }

        .admin-input,
        .admin-select {
            width: 100%;
            min-width: 0;
            padding: 12px;

            color: #111827;
            font-size: 17px;
            font-weight: 800;

            background: white;

            border: 3px solid #111827;
            border-radius: 10px;

            outline: none;
        }

        .admin-input:focus,
        .admin-select:focus {
            border-color: #31aaff;
        }

        .admin-send {
            padding: 11px;

            color: #111827;
            font-size: 16px;
            font-weight: 1000;

            background:
                linear-gradient(
                    #ffd93d,
                    #eca500
                );

            border: 3px solid #111827;
            border-radius: 10px;

            box-shadow: 0 4px 0 #00000066;

            cursor: pointer;
        }

        .admin-send:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #00000066;
        }

        .admin-message {
            min-height: 27px;
            margin-top: 15px;
            padding: 7px;

            color: #7dff95;

            font-size: 16px;
            font-weight: 900;
        }

        .admin-message.error {
            color: #ff7474;
        }

        .admin-current {
            margin-top: 12px;
            padding: 10px;

            background: #111827;

            border-radius: 10px;

            font-weight: 900;
        }

        @media (max-width: 900px) {
            .side-button {
                width: 66px;
                font-size: 10px;
            }

            .character {
                font-size: 145px;
            }

            .character-area {
                top: 48%;
            }

            .bottom-left {
                width: 190px;
            }

            .bottom-center {
                width: 280px;
            }

            .bottom-right {
                width: 210px;
            }

            .play-button {
                font-size: 26px;
            }
        }

        @media (max-width: 700px) {
            .map-list {
                grid-template-columns: 1fr;
            }

            .map-preview {
                aspect-ratio: 2 / 1;
            }

            .profile-box {
                min-width: 130px;
            }

            .currency-box {
                min-width: 55px;
                padding: 7px;
            }

            .admin-row {
                grid-template-columns: 1fr;
            }

            .admin-window {
                max-height: 92vh;
                overflow-y: auto;
            }
        }
    </style>
</head>

<body>

<div class="game-lobby">

    <div class="background-pattern"></div>

    <header class="top-bar">

        <div class="profile-box">

            <div class="profile-icon">
                👑
            </div>

            <div class="profile-info">

                <div class="player-name">
                    MedievalPlayer
                </div>

                <div class="trophy-line">
                    🏆 <span data-wins>0</span>
                </div>

            </div>

        </div>

        <div class="top-currencies">

            <div class="currency-box">
                🪙 <span data-coins>0</span>
            </div>

            <div class="currency-box">
                🎟️ <span data-tickets>0</span>
            </div>

            <button
                class="panel-button"
                onclick="openAdminPanel()"
                title="Panel administratora"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </header>

    <div class="rank-box">

        <div class="rank-part">
            RANGA 1
        </div>

        <div class="rank-part">
            🏆 <span data-wins>0</span>
        </div>

        <div class="rank-part">
            🛡️ 1
        </div>

    </div>

    <div class="side-menu left">

        <a href="sklep.html" class="side-button">
            <span class="side-icon">🛒</span>
            SKLEP
        </a>

        <a href="postacie.html" class="side-button">

            <span class="notification">
                1
            </span>

            <span class="side-icon">
                🧙
            </span>

            POSTACIE

        </a>

        <button
            class="side-button"
            onclick="dailyReward()"
        >

            <span class="notification">
                2
            </span>

            <span class="side-icon">
                🎁
            </span>

            NAGRODY

        </button>

        <button class="side-button">

            <span class="side-icon">
                📜
            </span>

            WIEŚCI

        </button>

    </div>

    <div class="side-menu right">

        <button class="side-button">

            <span class="side-icon">
                🤝
            </span>

            ZNAJOMI

        </button>

        <button class="side-button">

            <span class="side-icon">
                🛡️
            </span>

            KLAN

        </button>

        <button class="side-button">

            <span class="side-icon">
                💬
            </span>

            CZAT

        </button>

    </div>

    <main class="character-area">

        <div class="character-shadow"></div>

        <div
            id="heroIcon"
            class="character"
        >
            🧑‍🌾
        </div>

        <div
            id="heroName"
            class="character-title"
        >
            Farmer
        </div>

        <div
            id="heroPower"
            class="character-power"
        >
            Moc: Rzut widłami
        </div>

    </main>

    <section class="bottom-left">

        <div class="pass-box">

            <div class="pass-title">
                🎫 KRÓLEWSKA DROGA
            </div>

            <div>
                45 / 100
            </div>

            <div class="progress-background">

                <div class="progress-fill"></div>

            </div>

        </div>

    </section>

    <section class="bottom-center">

        <button
            class="event-box"
            onclick="openMapMenu()"
        >

            <div class="event-title">
                ⚔️ BITWA KRÓLESTW
            </div>

            <div
                id="selectedMapName"
                class="event-map"
            >
                Zielona Dolina
            </div>

            <div class="change-map-text">
                Kliknij, aby zmienić mapę
            </div>

        </button>

    </section>

    <section class="bottom-right">

        <button
            class="play-button"
            onclick="location.href='walka.html'"
        >
            GRAJ
        </button>

    </section>

</div>

<div id="mapMenu" class="map-menu">

    <div class="map-window">

        <button
            class="close-window"
            onclick="closeMapMenu()"
        >
            ✖
        </button>

        <h2>
            WYBIERZ MAPĘ
        </h2>

        <div class="map-list">

            <button
                class="map-card green-map"
                onclick="selectMap('green')"
            >

                <div class="map-preview">
                    🌳
                </div>

                <strong>
                    Zielona Dolina
                </strong>

                <span>
                    Trawiasta mapa
                </span>

            </button>

            <button
                class="map-card red-map"
                onclick="selectMap('red')"
            >

                <div class="map-preview">
                    🌋
                </div>

                <strong>
                    Czerwona Twierdza
                </strong>

                <span>
                    Ognista mapa
                </span>

            </button>

            <button
                class="map-card yellow-map"
                onclick="selectMap('yellow')"
            >

                <div class="map-preview">
                    🏜️
                </div>

                <strong>
                    Złota Pustynia
                </strong>

                <span>
                    Pustynna mapa
                </span>

            </button>

        </div>

    </div>

</div>

<div id="adminMenu" class="admin-menu">

    <div class="admin-window">

        <button
            class="close-window"
            onclick="closeAdminPanel()"
        >
            ✖
        </button>

        <h2>
            PANEL ADMINISTRATORA
        </h2>

        <div class="admin-current">
            🎟️ Bilety:
            <span id="adminTickets">0</span>

            &nbsp;&nbsp;|&nbsp;&nbsp;

            🪙 Monety:
            <span id="adminCoins">0</span>
        </div>

        <div class="admin-section">

            <div class="admin-section-title">
                🎟️ Dodaj bilety
            </div>

            <div class="admin-row">

                <input
                    id="ticketAmount"
                    class="admin-input"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="Wpisz liczbę, np. 100"
                >

                <button
                    class="admin-send"
                    onclick="addTickets()"
                >
                    WYŚLIJ
                </button>

            </div>

        </div>

        <div class="admin-section">

            <div class="admin-section-title">
                🪙 Dodaj monety
            </div>

            <div class="admin-row">

                <input
                    id="coinAmount"
                    class="admin-input"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="Wpisz liczbę, np. 1000"
                >

                <button
                    class="admin-send"
                    onclick="addCoins()"
                >
                    WYŚLIJ
                </button>

            </div>

        </div>

        <div class="admin-section">

            <div class="admin-section-title">
                🧙 Dodaj postać
            </div>

            <div class="admin-row">

                <select
                    id="characterSelect"
                    class="admin-select"
                >
                </select>

                <button
                    class="admin-send"
                    onclick="addCharacter()"
                >
                    WYŚLIJ
                </button>

            </div>

        </div>

        <div
            id="adminMessage"
            class="admin-message"
        ></div>

    </div>

</div>

<script src="dane.js"></script>
<script src="common.js"></script>

<script>
const MAPS = {
    green: {
        name: "Zielona Dolina"
    },

    red: {
        name: "Czerwona Twierdza"
    },

    yellow: {
        name: "Złota Pustynia"
    }
};

function renderLobby() {
    const state = getState();
    const hero = getHero(state.selected);

    document.getElementById("heroIcon").textContent =
        hero.ikona;

    document.getElementById("heroName").textContent =
        hero.nazwa;

    document.getElementById("heroPower").textContent =
        "Moc: " + hero.moc;

    updateTopbar();
}

function dailyReward() {
    const state = getState();
    const today = new Date().toDateString();

    if (state.lastReward === today) {
        alert(
            "Dzisiejsza nagroda została już odebrana."
        );

        return;
    }

    state.lastReward = today;
    state.tickets += 3;
    state.coins += 50;

    saveState(state);
    updateTopbar();

    alert(
        "Dostajesz 3 bilety i 50 monet!"
    );
}

function openMapMenu() {
    document
        .getElementById("mapMenu")
        .classList.add("visible");
}

function closeMapMenu() {
    document
        .getElementById("mapMenu")
        .classList.remove("visible");
}

function selectMap(mapId) {
    localStorage.setItem(
        "selectedMap",
        mapId
    );

    document
        .getElementById("selectedMapName")
        .textContent =
        MAPS[mapId].name;

    closeMapMenu();
}

function loadSelectedMap() {
    const selectedMap =
        localStorage.getItem("selectedMap")
        || "green";

    document
        .getElementById("selectedMapName")
        .textContent =
        MAPS[selectedMap].name;
}

function openAdminPanel() {
    document
        .getElementById("adminMenu")
        .classList.add("visible");

    loadCharacterOptions();
    updateAdminValues();
    clearAdminMessage();
}

function closeAdminPanel() {
    document
        .getElementById("adminMenu")
        .classList.remove("visible");
}

function updateAdminValues() {
    const state = getState();

    document
        .getElementById("adminTickets")
        .textContent =
        state.tickets;

    document
        .getElementById("adminCoins")
        .textContent =
        state.coins;

    updateTopbar();
}

function loadCharacterOptions() {
    const state = getState();

    const select =
        document.getElementById(
            "characterSelect"
        );

    select.innerHTML = "";

    BOHATEROWIE.forEach(
        function(hero) {
            const option =
                document.createElement(
                    "option"
                );

            option.value =
                hero.id;

            const unlocked =
                state.unlocked.includes(
                    hero.id
                );

            option.textContent =
                hero.ikona +
                " " +
                hero.nazwa +
                (
                    unlocked
                        ? " — odblokowano"
                        : ""
                );

            select.appendChild(option);
        }
    );
}

function getPositiveInteger(inputId) {
    const input =
        document.getElementById(
            inputId
        );

    const value =
        Number(input.value);

    if (
        !Number.isFinite(value) ||
        value <= 0 ||
        !Number.isInteger(value)
    ) {
        showAdminMessage(
            "Wpisz poprawną liczbę całkowitą większą od 0.",
            true
        );

        return null;
    }

    return value;
}

function addTickets() {
    const amount =
        getPositiveInteger(
            "ticketAmount"
        );

    if (amount === null) {
        return;
    }

    const state = getState();

    state.tickets += amount;

    saveState(state);

    document
        .getElementById("ticketAmount")
        .value = "";

    updateAdminValues();

    showAdminMessage(
        "Dodano " +
        amount +
        " biletów."
    );
}

function addCoins() {
    const amount =
        getPositiveInteger(
            "coinAmount"
        );

    if (amount === null) {
        return;
    }

    const state = getState();

    state.coins += amount;

    saveState(state);

    document
        .getElementById("coinAmount")
        .value = "";

    updateAdminValues();

    showAdminMessage(
        "Dodano " +
        amount +
        " monet."
    );
}

function addCharacter() {
    const select =
        document.getElementById(
            "characterSelect"
        );

    const heroId =
        select.value;

    const hero =
        getHero(heroId);

    const state =
        getState();

    if (
        state.unlocked.includes(
            heroId
        )
    ) {
        showAdminMessage(
            hero.nazwa +
            " jest już odblokowany.",
            true
        );

        return;
    }

    state.unlocked.push(
        heroId
    );

    saveState(state);

    loadCharacterOptions();

    showAdminMessage(
        "Odblokowano postać: " +
        hero.ikona +
        " " +
        hero.nazwa +
        "."
    );
}

function showAdminMessage(
    message,
    error = false
) {
    const messageElement =
        document.getElementById(
            "adminMessage"
        );

    messageElement.textContent =
        message;

    messageElement.classList.toggle(
        "error",
        error
    );
}

function clearAdminMessage() {
    const messageElement =
        document.getElementById(
            "adminMessage"
        );

    messageElement.textContent = "";

    messageElement.classList.remove(
        "error"
    );
}

document
    .getElementById("adminMenu")
    .addEventListener(
        "click",
        function(event) {
            if (
                event.target ===
                this
            ) {
                closeAdminPanel();
            }
        }
    );

document
    .getElementById("mapMenu")
    .addEventListener(
        "click",
        function(event) {
            if (
                event.target ===
                this
            ) {
                closeMapMenu();
            }
        }
    );

document.addEventListener(
    "keydown",
    function(event) {
        if (
            event.key === "Escape"
        ) {
            closeAdminPanel();
            closeMapMenu();
        }

        if (
            event.key === "Enter" &&
            document.activeElement.id ===
                "ticketAmount"
        ) {
            addTickets();
        }

        if (
            event.key === "Enter" &&
            document.activeElement.id ===
                "coinAmount"
        ) {
            addCoins();
        }
    }
);

loadSelectedMap();
renderLobby();
</script>

</body>
</html>
