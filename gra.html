<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Arena</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div class="logo">⚔️ MEDIEVAL ARENA</div>

    <div class="currency">
        <div class="pill">🎟️ <span data-tickets>0</span></div>
        <div class="pill">🪙 <span data-coins>0</span></div>
        <div class="pill">🏆 <span data-wins>0</span></div>
    </div>
</header>

<main class="screen">

    <div class="hero">

        <section class="card selected-hero">
            <div id="heroIcon" class="character-icon"></div>
            <div id="heroName" class="character-name"></div>
            <div id="heroPower" class="power"></div>
            <p id="heroDesc"></p>
        </section>

        <section>

            <div class="menu-grid">

                <a class="btn btn-blue menu-tile" href="postacie.html">
                    🧙
                    <span>POSTACIE</span>
                </a>

                <a class="btn btn-gold menu-tile" href="sklep.html">
                    🛒
                    <span>SKLEP</span>
                </a>

                <button class="btn btn-dark menu-tile" onclick="dailyReward()">
                    🎁
                    <span>DZIENNA NAGRODA</span>
                </button>

                <button class="btn btn-dark menu-tile" onclick="resetGame()">
                    ♻️
                    <span>RESET ZAPISU</span>
                </button>

            </div>

            <a class="btn btn-green big-play" href="walka.html">
                ⚔️ GRAJ
            </a>

        </section>

    </div>

</main>

<nav class="bottom-nav">
    <a class="active" href="gra.html">🏰<br>Lobby</a>
    <a href="postacie.html">🧙<br>Postacie</a>
    <a href="sklep.html">🛒<br>Sklep</a>
    <a href="walka.html">⚔️<br>Gra</a>
</nav>

<script src="dane.js"></script>
<script src="common.js"></script>

<script>
function renderLobby() {
    const state = getState();
    const hero = getHero(state.selected);

    document.getElementById("heroIcon").textContent = hero.ikona;
    document.getElementById("heroName").textContent = hero.nazwa;
    document.getElementById("heroPower").textContent = "Moc: " + hero.moc;
    document.getElementById("heroDesc").textContent = hero.opis;
}

function dailyReward() {
    const state = getState();
    const today = new Date().toDateString();

    if (state.lastReward === today) {
        alert("Dzisiejsza nagroda została już odebrana.");
        return;
    }

    state.lastReward = today;
    state.tickets += 3;
    state.coins += 50;

    saveState(state);
    updateTopbar();

    alert("Otrzymujesz 3 bilety i 50 monet!");
}

function resetGame() {
    const confirmation = confirm("Czy na pewno chcesz usunąć zapis gry?");

    if (confirmation) {
        localStorage.removeItem("medievalArenaState");
        location.reload();
    }
}

renderLobby();
</script>

</body>
</html>
