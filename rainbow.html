<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON RUSH 3D</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#080b20;color:white;font-family:system-ui,Arial}#hud{position:fixed;top:18px;left:20px;z-index:2;font-weight:800;text-shadow:0 2px 8px #000;font-size:18px}#hud small{font-size:12px;color:#a8b9ff}#panel{position:fixed;inset:0;display:grid;place-items:center;background:#070b1bc9;z-index:5}#card{max-width:480px;width:90%;text-align:center;background:#111936;border:1px solid #6674ff;border-radius:22px;padding:32px;box-shadow:0 0 55px #5545ff55}h1{font-size:48px;margin:0;color:#65f5ff;text-shadow:0 0 20px #32d5ff}button{background:linear-gradient(90deg,#39ddff,#a665ff);border:0;border-radius:12px;padding:14px 32px;font-weight:900;font-size:18px;cursor:pointer;color:#08112c}p{line-height:1.6;color:#d3d9ff}#tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#cad6ff;font-size:13px;text-align:center;pointer-events:none}#flash{position:fixed;inset:0;pointer-events:none;z-index:4;background:#ff3760;opacity:0;transition:opacity .15s}#mobile{position:fixed;bottom:45px;left:15px;right:15px;display:none;justify-content:space-between;z-index:3}#mobile button{padding:12px 16px;opacity:.8}@media(pointer:coarse){#mobile{display:flex}#tip{display:none}}</style></head><body><div id="hud">💎 <span id="score">0</span> &nbsp; ❤️ <span id="hp">3</span> &nbsp; 🏁 <span id="distance">0</span> m<br><small>REKORD: <span id="best">0</span> m</small></div><div id="tip">A/D lub ←/→: ruch • SPACJA: skok • SHIFT: turbo • P: pauza</div><div id="mobile"><button id="left">◀</button><button id="jump">SKOK</button><button id="right">▶</button></div><div id="flash"></div><div id="panel"><div id="card"><h1>NEON RUSH 3D</h1><p>Śmigaj po neonowej trasie w kosmosie!<br>💎 Zbieraj kryształy • 🟥 Omijaj bloki • 🟩 Skacz na rampach<br><b>WASD / strzałki</b> — kierunek, <b>Spacja</b> — skok, <b>Shift</b> — turbo.</p><button id="start">START GRY 🚀</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(()=>{if(!window.THREE){document.querySelector('#card p').textContent='Nie udało się załadować Three.js. Sprawdź połączenie z internetem i odśwież stronę.';return}const scene=new THREE.Scene();scene.background=new THREE.Color(0x080b20);scene.fog=new THREE.FogExp2(0x080b20,.014);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,600);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0x8acaff,0x20113c,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-12,30,15);scene.add(sun);const mat=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:e,metalness:.4,roughness:.35});const roadMat=mat(0x17234d),lineMat=mat(0x16e9ff,1.2),pink=mat(0xf84cf9,1),gemMat=mat(0x55fff1,1.5),danger=mat(0xff355b,.6),rampMat=mat(0x4bff8a,.6);const geo=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);const road=[];for(let i=0;i<16;i++){const g=new THREE.Group();const deck=geo(16,.5,30,roadMat);g.add(deck);for(const x of [-7.85,7.85]){const rail=geo(.22,.28,30,lineMat);rail.position.set(x,.34,0);g.add(rail)}for(const x of [-5,0,5]){const stripe=geo(.12,.04,17,lineMat);stripe.position.set(x,.28,0);g.add(stripe)}g.position.z=-i*30;scene.add(g);road.push(g)}const player=new THREE.Group();const body=geo(1.75,.6,2.8,mat(0x875cff,.5));body.position.y=.8;player.add(body);const cockpit=geo(1.1,.45,1.2,mat(0x52eaff,.8));cockpit.position.set(0,1.28,-.25);player.add(cockpit);for(const x of [-1,1]){const wing=geo(.65,.15,1.65,pink);wing.position.set(x*1.12,.6,.2);player.add(wing);const thr=geo(.3,.28,.3,lineMat);thr.position.set(x*.55,.68,1.48);player.add(thr)}scene.add(player);const stars=new THREE.BufferGeometry(),arr=[];for(let i=0;i<1000;i++)arr.push((Math.random()-.5)*320,Math.random()*120+5,-Math.random()*350);stars.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));const st=new THREE.Points(stars,new THREE.PointsMaterial({color:0x9baaff,size:.42}));scene.add(st);const obstacles=[];const lanes=[-5,0,5];let active=false,paused=false,score=0,hp=3,dist=0,speed=23,y=0,vy=0,inv=0,spawn=0,elapsed=0;const keys={};const $=s=>document.querySelector(s);const best=()=>{try{return Number(localStorage.getItem('neonRushBest')||0)}catch{return 0}};$('#best').textContent=best();function createObject(){const lane=lanes[Math.floor(Math.random()*3)],kind=Math.random();let mesh,type;if(kind<.59){type='gem';mesh=new THREE.Mesh(new THREE.OctahedronGeometry(.9),gemMat);mesh.position.y=1.65}else if(kind<.88){type='block';mesh=geo(2.5,2.3,2.5,danger);mesh.position.y=1.3}else{type='ramp';mesh=geo(2.7,.4,3.5,rampMat);mesh.position.y=.4;mesh.rotation.x=-.16}mesh.position.x=lane;mesh.position.z=-125;scene.add(mesh);obstacles.push({mesh,type,hit:false})}function hud(){$('#score').textContent=score;$('#hp').textContent=hp;$('#distance').textContent=Math.floor(dist)}function end(){active=false;const b=Math.max(best(),Math.floor(dist));try{localStorage.setItem('neonRushBest',b)}catch{}$('#best').textContent=b;$('#card').innerHTML=`<h1>KONIEC TRASY!</h1><p>🏁 Dystans: <b>${Math.floor(dist)} m</b><br>💎 Kryształy: <b>${score}</b><br>🏆 Rekord: <b>${b} m</b></p><button id="again">ZAGRAJ PONOWNIE 🚀</button>`;$('#panel').style.display='grid';$('#again').onclick=reset}function reset(){for(const o of obstacles)scene.remove(o.mesh);obstacles.length=0;active=true;paused=false;score=0;hp=3;dist=0;speed=23;y=0;vy=0;inv=0;spawn=.6;elapsed=0;player.position.set(0,0,0);$('#panel').style.display='none';hud()}$('#start').onclick=reset;window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='KeyP'&&active){paused=!paused;$('#panel').style.display=paused?'grid':'none';if(paused){$('#card').innerHTML='<h1>PAUZA</h1><p>Naciśnij P, aby wrócić do gry.</p>'}}});window.addEventListener('keyup',e=>keys[e.code]=false);for(const [id,k] of [['left','ArrowLeft'],['right','ArrowRight'],['jump','Space']]){const el=$('#'+id);el.onpointerdown=e=>{e.preventDefault();keys[k]=true};el.onpointerup=el.onpointercancel=()=>keys[k]=false}let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.045);last=now;if(active&&!paused){elapsed+=dt;const turbo=keys.ShiftLeft||keys.ShiftRight;speed=Math.min(50,23+dist/250)+(turbo?13:0);dist+=speed*dt;const move=(keys.KeyA||keys.ArrowLeft?-1:0)+(keys.KeyD||keys.ArrowRight?1:0);player.position.x=THREE.MathUtils.clamp(player.position.x+move*11*dt,-6.5,6.5);player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-move*.17,dt*8);if((keys.Space||keys.KeyW||keys.ArrowUp)&&y<=.01){vy=10.8}vy-=25*dt;y=Math.max(0,y+vy*dt);if(y===0)vy=0;player.position.y=y;player.rotation.x=THREE.MathUtils.lerp(player.rotation.x,y>0?-.09:0,dt*4);for(const r of road){r.position.z+=speed*dt;if(r.position.z>30)r.position.z-=road.length*30}spawn-=dt;if(spawn<=0){createObject();spawn=Math.max(.48,1.1-dist/900)}inv=Math.max(0,inv-dt);player.visible=inv===0||Math.floor(inv*12)%2===0;for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.mesh.position.z+=speed*dt;if(o.type==='gem'){o.mesh.rotation.y+=dt*3;o.mesh.position.y=1.6+Math.sin(elapsed*5+i)*.24}if(!o.hit&&Math.abs(o.mesh.position.z)<1.9&&Math.abs(o.mesh.position.x-player.position.x)<1.75){o.hit=true;if(o.type==='gem'){score++;scene.remove(o.mesh);obstacles.splice(i,1);hud();continue}if(o.type==='ramp'){vy=Math.max(vy,14)}else if(y<1.65&&inv<=0){hp--;inv=1.5;$('#flash').style.opacity='.3';setTimeout(()=>$('#flash').style.opacity='0',130);if(hp<=0){hud();end();break}}hud()}if(o.mesh.position.z>18){scene.remove(o.mesh);obstacles.splice(i,1)}}hud()}camera.position.lerp(new THREE.Vector3(player.position.x*.38,7.4+y*.22,14.5),Math.min(1,dt*4));camera.lookAt(player.position.x*.35,1.1,-22);renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();
</script></body></html>
