<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snake</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#101418;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.screen{
    display:none;
    width:100%;
    text-align:center;
}

.screen.active{
    display:block;
}

/* =========================
   POCZEKALNIA
========================= */

.panel{
    width:min(450px,90vw);
    margin:auto;
    padding:30px;
    background:#1b2229;
    border:2px solid #34404a;
    border-radius:22px;
}

h1{
    font-size:55px;
    margin:0 0 8px;
}

.subtitle{
    color:#9da7af;
    margin-bottom:28px;
    font-size:17px;
}

label{
    display:block;
    text-align:left;
    margin-bottom:8px;
    font-size:17px;
}

select{
    width:100%;
    padding:14px;
    font-size:18px;
    border-radius:10px;
    border:2px solid #46535e;
    background:#11171c;
    color:white;
}

button{
    border:0;
    border-radius:12px;
    padding:14px 20px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    transform:scale(1.04);
}

#startButton{
    width:100%;
    margin-top:22px;
    background:#42d965;
    color:#07140a;
}

/* =========================
   GRA
========================= */

#game{
    width:100%;
}

.gameHeader{
    width:min(700px,94vw);
    margin:0 auto 12px;
    display:flex;
    justify-content:space-between;
    font-size:20px;
}

#gameContainer{
    position:relative;
    margin:auto;
    width:min(700px,92vw);
    aspect-ratio:1/1;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    background:#18251a;
    border:5px solid #3c4740;
    border-radius:20px;
}

.controlsInfo{
    margin-top:13px;
    color:#8c969e;
}

/* =========================
   PRZEGRANA
========================= */

#gameOverScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;

    background:rgba(5,8,10,.88);

    align-items:center;
    justify-content:center;
}

#gameOverScreen.active{
    display:flex;
}

.gameOverBox{
    width:min(430px,90vw);
    padding:35px;

    background:#1b2229;

    border:2px solid #3c4853;
    border-radius:24px;

    box-shadow:
        0 20px 80px rgba(0,0,0,.6);
}

.gameOverBox h2{
    margin:0;

    color:#ff4d4d;

    font-size:50px;
    letter-spacing:2px;
}

.finalText{
    margin-top:18px;
    font-size:21px;
}

.buttons{
    margin-top:25px;

    display:flex;
    flex-direction:column;
    gap:12px;
}

#restartButton{
    background:#44dc68;
    color:#07140a;
}

#lobbyButton{
    background:#3c4853;
    color:white;
}

/* =========================
   TELEFON
========================= */

#mobileControls{
    display:grid;

    width:190px;

    grid-template-columns:repeat(3,60px);
    grid-template-rows:repeat(2,60px);

    gap:5px;

    margin:18px auto;
}

.control{
    padding:0;

    background:#29343d;
    color:white;

    height:60px;

    font-size:25px;
}

#up{
    grid-column:2;
}

#left{
    grid-column:1;
    grid-row:2;
}

#down{
    grid-column:2;
    grid-row:2;
}

#right{
    grid-column:3;
    grid-row:2;
}

@media(min-width:800px){

    #mobileControls{
        display:none;
    }

}

</style>
</head>


<body>

<!-- =====================
     POCZEKALNIA
===================== -->

<div id="lobby" class="screen active">

    <div class="panel">

        <h1>🐍 SNAKE</h1>

        <div class="subtitle">
            Zjadaj jabłka i rośnij!
        </div>


        <label>
            Wielkość mapy
        </label>


        <select id="mapSize">

            <option value="5">5 × 5</option>

            <option value="8">8 × 8</option>

            <option value="10">
                10 × 10
            </option>

            <option value="15">
                15 × 15
            </option>

            <option value="20">
                20 × 20
            </option>

            <option value="25">
                25 × 25
            </option>

        </select>


        <button id="startButton">
            ▶ ROZPOCZNIJ GRĘ
        </button>

    </div>

</div>



<!-- =====================
     GRA
===================== -->

<div id="game" class="screen">

    <div class="gameHeader">

        <div>
            🍎 Wynik:
            <b id="score">0</b>
        </div>

        <div>
            Mapa:
            <b id="mapInfo">8 × 8</b>
        </div>

    </div>


    <div id="gameContainer">

        <canvas id="gameCanvas"></canvas>

    </div>


    <div class="controlsInfo">
        Sterowanie: WASD lub strzałki
    </div>


    <div id="mobileControls">

        <button
            id="up"
            class="control">
            ▲
        </button>

        <button
            id="left"
            class="control">
            ◀
        </button>

        <button
            id="down"
            class="control">
            ▼
        </button>

        <button
            id="right"
            class="control">
            ▶
        </button>

    </div>

</div>



<!-- =====================
     PRZEGRANA
===================== -->

<div id="gameOverScreen">

    <div class="gameOverBox">

        <h2 id="gameOverTitle">
            PRZEGRANA
        </h2>

        <div class="finalText">

            Wynik:

            <b id="finalScore">
                0
            </b>

        </div>


        <div class="buttons">

            <button id="restartButton">
                🔄 Zagraj ponownie
            </button>

            <button id="lobbyButton">
                🏠 Przejdź do poczekalni
            </button>

        </div>

    </div>

</div>



<script>

/* =========================
   ELEMENTY
========================= */

const lobby =
document.getElementById("lobby");

const game =
document.getElementById("game");

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

const mapSelect =
document.getElementById("mapSize");

const scoreElement =
document.getElementById("score");

const finalScore =
document.getElementById("finalScore");

const mapInfo =
document.getElementById("mapInfo");

const gameOverScreen =
document.getElementById(
    "gameOverScreen"
);

const gameOverTitle =
document.getElementById(
    "gameOverTitle"
);


/* =========================
   ZMIENNE GRY
========================= */

let mapSize = 8;

let snake = [];

let apple = {
    x:0,
    y:0
};

let direction = {
    x:1,
    y:0
};

let nextDirection = {
    x:1,
    y:0
};

let score = 0;

let interval = null;

let gameRunning = false;

let cellSize = 50;


/* =========================
   ZAPIS USTAWIEŃ
========================= */

const savedSize =
localStorage.getItem(
    "snakeMapSize"
);

if(savedSize){

    mapSelect.value =
        savedSize;

}


function saveSettings(){

    localStorage.setItem(
        "snakeMapSize",
        mapSize
    );

}


/* =========================
   START
========================= */

document
.getElementById("startButton")
.onclick = function(){

    mapSize =
        Number(mapSelect.value);

    saveSettings();

    startGame();

};


function startGame(){

    clearInterval(interval);

    gameOverScreen
        .classList
        .remove("active");

    lobby
        .classList
        .remove("active");

    game
        .classList
        .add("active");


    score = 0;

    scoreElement.textContent =
        score;

    mapInfo.textContent =
        mapSize +
        " × " +
        mapSize;


    const center =
        Math.floor(
            mapSize / 2
        );


    /*
    Wąż zaczyna już z kilkoma
    segmentami, żeby od początku
    wyglądał jak wąż.
    */

    snake = [

        {
            x:center,
            y:center
        },

        {
            x:center - 1,
            y:center
        },

        {
            x:center - 2,
            y:center
        }

    ];


    /*
    Dla bardzo małej mapy
    poprawiamy początek.
    */

    if(mapSize === 5){

        snake = [

            {
                x:2,
                y:2
            },

            {
                x:1,
                y:2
            },

            {
                x:0,
                y:2
            }

        ];

    }


    direction = {
        x:1,
        y:0
    };

    nextDirection = {
        x:1,
        y:0
    };


    resizeCanvas();

    spawnApple();

    draw();


    gameRunning = true;


    let speed = 180;

    if(mapSize <= 5)
        speed = 330;

    else if(mapSize <= 8)
        speed = 240;

    else if(mapSize <= 10)
        speed = 200;

    else if(mapSize <= 15)
        speed = 165;

    else
        speed = 140;


    interval =
        setInterval(
            gameLoop,
            speed
        );

}


/* =========================
   CANVAS
========================= */

function resizeCanvas(){

    const size =
        Math.min(
            window.innerWidth * .90,
            window.innerHeight * .68,
            700
        );


    canvas.width = size;

    canvas.height = size;


    cellSize =
        canvas.width /
        mapSize;


    draw();

}


/* =========================
   PĘTLA
========================= */

function gameLoop(){

    if(!gameRunning)
        return;


    direction = {
        ...nextDirection
    };


    const newHead = {

        x:
        snake[0].x +
        direction.x,

        y:
        snake[0].y +
        direction.y

    };


    /* =================
       ŚCIANA
    ================= */

    if(
        newHead.x < 0 ||
        newHead.x >= mapSize ||
        newHead.y < 0 ||
        newHead.y >= mapSize
    ){

        endGame(false);

        return;

    }


    /*
    Jeżeli wąż nie je jabłka,
    ogon za chwilę się przesunie.
    Dlatego ostatni segment można
    pominąć przy sprawdzaniu kolizji.
    */

    const eating =
        newHead.x === apple.x &&
        newHead.y === apple.y;


    const lengthToCheck =
        eating
        ? snake.length
        : snake.length - 1;


    for(
        let i = 0;
        i < lengthToCheck;
        i++
    ){

        if(
            snake[i].x === newHead.x &&
            snake[i].y === newHead.y
        ){

            endGame(false);

            return;

        }

    }


    snake.unshift(
        newHead
    );


    if(eating){

        score++;

        scoreElement.textContent =
            score;


        if(
            snake.length >=
            mapSize * mapSize
        ){

            draw();

            endGame(true);

            return;

        }


        spawnApple();

    }

    else{

        snake.pop();

    }


    draw();

}


/* =========================
   JABŁKO
========================= */

function spawnApple(){

    const free = [];


    for(
        let y=0;
        y<mapSize;
        y++
    ){

        for(
            let x=0;
            x<mapSize;
            x++
        ){

            const occupied =
                snake.some(
                    part =>
                    part.x === x &&
                    part.y === y
                );


            if(!occupied){

                free.push({
                    x,
                    y
                });

            }

        }

    }


    if(
        free.length === 0
    )
        return;


    apple =
        free[
            Math.floor(
                Math.random() *
                free.length
            )
        ];

}


/* =========================
   RYSOWANIE
========================= */

function draw(){

    if(
        !canvas.width ||
        !canvas.height
    )
        return;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* TŁO */

    ctx.fillStyle =
        "#18251a";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* DELIKATNA SIATKA */

    ctx.strokeStyle =
        "rgba(255,255,255,0.035)";

    ctx.lineWidth = 1;


    for(
        let i=1;
        i<mapSize;
        i++
    ){

        const p =
            i * cellSize;


        ctx.beginPath();

        ctx.moveTo(
            p,
            0
        );

        ctx.lineTo(
            p,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            p
        );

        ctx.lineTo(
            canvas.width,
            p
        );

        ctx.stroke();

    }


    drawApple();

    drawSnake();

}


/* =========================
   PRAWDZIWIE WYGLĄDAJĄCY WĄŻ
========================= */

function drawSnake(){

    if(
        snake.length === 0
    )
        return;


    const radius =
        cellSize * .32;


    /*
    Najpierw rysujemy grube
    połączenia między segmentami.
    Dzięki temu nie wygląda to
    jak osobne klocki.
    */

    ctx.strokeStyle =
        "#45df67";

    ctx.lineWidth =
        radius * 2;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    ctx.beginPath();


    const firstX =
        snake[0].x *
        cellSize +
        cellSize / 2;

    const firstY =
        snake[0].y *
        cellSize +
        cellSize / 2;


    ctx.moveTo(
        firstX,
        firstY
    );


    for(
        let i=1;
        i<snake.length;
        i++
    ){

        const x =
            snake[i].x *
            cellSize +
            cellSize / 2;

        const y =
            snake[i].y *
            cellSize +
            cellSize / 2;


        ctx.lineTo(
            x,
            y
        );

    }


    ctx.stroke();


    /*
    Zaokrąglone części ciała.
    */

    for(
        let i=1;
        i<snake.length;
        i++
    ){

        const part =
            snake[i];

        const x =
            part.x *
            cellSize +
            cellSize / 2;

        const y =
            part.y *
            cellSize +
            cellSize / 2;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#45df67";

        ctx.fill();

    }


    drawSnakeHead();

}


/* =========================
   GŁOWA WĘŻA
========================= */

function drawSnakeHead(){

    const head =
        snake[0];


    const x =
        head.x *
        cellSize +
        cellSize / 2;

    const y =
        head.y *
        cellSize +
        cellSize / 2;


    const radius =
        cellSize * .38;


    /*
    Głowa
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#66f184";

    ctx.fill();


    /*
    Położenie oczu zależne
    od kierunku poruszania.
    */

    const eyeDistance =
        radius * .38;

    const forward =
        radius * .35;


    let eye1X;
    let eye1Y;

    let eye2X;
    let eye2Y;


    if(direction.x !== 0){

        eye1X =
            x +
            direction.x *
            forward;

        eye2X =
            eye1X;

        eye1Y =
            y -
            eyeDistance;

        eye2Y =
            y +
            eyeDistance;

    }

    else{

        eye1Y =
            y +
            direction.y *
            forward;

        eye2Y =
            eye1Y;

        eye1X =
            x -
            eyeDistance;

        eye2X =
            x +
            eyeDistance;

    }


    const eyeRadius =
        Math.max(
            2,
            radius * .13
        );


    /*
    Białka oczu
    */

    ctx.fillStyle =
        "white";


    ctx.beginPath();

    ctx.arc(
        eye1X,
        eye1Y,
        eyeRadius * 1.7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        eye2X,
        eye2Y,
        eyeRadius * 1.7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
    Źrenice
    */

    ctx.fillStyle =
        "#111";


    ctx.beginPath();

    ctx.arc(
        eye1X +
        direction.x *
        eyeRadius * .5,

        eye1Y +
        direction.y *
        eyeRadius * .5,

        eyeRadius,

        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        eye2X +
        direction.x *
        eyeRadius * .5,

        eye2Y +
        direction.y *
        eyeRadius * .5,

        eyeRadius,

        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
   JABŁKO
========================= */

function drawApple(){

    const x =
        apple.x *
        cellSize +
        cellSize / 2;

    const y =
        apple.y *
        cellSize +
        cellSize / 2;


    const radius =
        cellSize * .28;


    /*
    Jabłko
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y + radius * .08,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ff4141";

    ctx.fill();


    /*
    Ogonek
    */

    ctx.strokeStyle =
        "#82532e";

    ctx.lineWidth =
        Math.max(
            2,
            cellSize * .06
        );


    ctx.beginPath();

    ctx.moveTo(
        x,
        y - radius * .8
    );

    ctx.lineTo(
        x + radius * .12,
        y - radius * 1.35
    );

    ctx.stroke();


    /*
    Listek
    */

    ctx.fillStyle =
        "#58ca61";

    ctx.beginPath();

    ctx.ellipse(
        x + radius * .48,
        y - radius * 1.05,

        radius * .42,
        radius * .20,

        -.5,

        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
   KONIEC
========================= */

function endGame(win){

    gameRunning = false;

    clearInterval(
        interval
    );


    finalScore.textContent =
        score;


    if(win){

        gameOverTitle.textContent =
            "WYGRANA! 🏆";

        gameOverTitle.style.color =
            "#4bea70";

    }

    else{

        gameOverTitle.textContent =
            "PRZEGRANA";

        gameOverTitle.style.color =
            "#ff4d4d";

    }


    gameOverScreen
        .classList
        .add("active");

}


/* =========================
   RESTART
========================= */

document
.getElementById(
    "restartButton"
)
.onclick = function(){

    /*
    Ta sama mapa i te same
    ustawienia.
    */

    startGame();

};


/* =========================
   POCZEKALNIA
========================= */

document
.getElementById(
    "lobbyButton"
)
.onclick = function(){

    gameRunning = false;

    clearInterval(
        interval
    );


    saveSettings();


    mapSelect.value =
        mapSize;


    gameOverScreen
        .classList
        .remove("active");

    game
        .classList
        .remove("active");

    lobby
        .classList
        .add("active");

};


/* =========================
   KIERUNEK
========================= */

function changeDirection(
    x,
    y
){

    if(!gameRunning)
        return;


    /*
    Nie można natychmiast
    zawrócić.
    */

    if(
        x === -direction.x &&
        y === -direction.y
    )
        return;


    nextDirection = {
        x,
        y
    };

}


/* =========================
   KLAWIATURA
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(!gameRunning)
            return;


        const key =
            e.key.toLowerCase();


        if(
            key === "arrowup" ||
            key === "w"
        ){

            e.preventDefault();

            changeDirection(
                0,
                -1
            );

        }


        else if(
            key === "arrowdown" ||
            key === "s"
        ){

            e.preventDefault();

            changeDirection(
                0,
                1
            );

        }


        else if(
            key === "arrowleft" ||
            key === "a"
        ){

            e.preventDefault();

            changeDirection(
                -1,
                0
            );

        }


        else if(
            key === "arrowright" ||
            key === "d"
        ){

            e.preventDefault();

            changeDirection(
                1,
                0
            );

        }

    }
);


/* =========================
   TELEFON
========================= */

document
.getElementById("up")
.onclick =
() =>
changeDirection(
    0,
    -1
);


document
.getElementById("down")
.onclick =
() =>
changeDirection(
    0,
    1
);


document
.getElementById("left")
.onclick =
() =>
changeDirection(
    -1,
    0
);


document
.getElementById("right")
.onclick =
() =>
changeDirection(
    1,
    0
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    function(){

        if(
            game.classList
            .contains("active")
        ){

            resizeCanvas();

        }

    }
);

</script>

</body>
</html>
