<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bitwa Królestw</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            color: white;
            font-family: Arial, sans-serif;
            text-align: center;

            background:
                radial-gradient(
                    circle at top,
                    #34405a,
                    #101621
                );
        }

        button,
        a {
            font-family: inherit;
        }

        .topbar {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            padding: 10px 18px;

            background: #111827;

            border-bottom:
                4px solid #050912;
        }

        .logo {
            color: #ffd43b;
            font-size: 24px;
            font-weight: 900;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        button,
        .back-button {
            padding: 10px 15px;

            color: white;
            font-weight: 900;
            text-decoration: none;

            background: #35445e;

            border:
                3px solid #080d16;

            border-radius: 10px;

            cursor: pointer;
        }

        .restart-button {
            background: #d34242;
        }

        .game-info {
            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;

            padding: 7px;
        }

        .info-box {
            padding: 7px 13px;

            background: #26344b;

            border:
                3px solid #101722;

            border-radius: 10px;

            font-weight: 900;
        }

        .game-container {
            position: relative;

            width:
                min(
                    96vw,
                    1200px
                );

            aspect-ratio: 12 / 7;

            max-height:
                calc(100vh - 155px);

            margin: 0 auto;
        }

        canvas {
            width: 100%;
            height: 100%;

            display: block;

            background: #5cad58;

            border:
                7px solid #111827;

            border-radius: 12px;

            box-shadow:
                0 15px 40px #00000099;

            cursor: crosshair;
        }

        .loading-screen {
            position: absolute;
            inset: 7px;
            z-index: 30;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background:
                radial-gradient(
                    circle,
                    #243856,
                    #080e18
                );

            border-radius: 5px;

            transition:
                opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-logo {
            font-size: 75px;

            animation:
                loadingSword 1.2s
                ease-in-out infinite;
        }

        @keyframes loadingSword {
            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-8deg);
            }

            50% {
                transform:
                    translateY(-12px)
                    rotate(8deg);
            }
        }

        .loading-title {
            margin-top: 10px;

            color: #ffd43b;

            font-size:
                clamp(30px, 5vw, 58px);

            font-weight: 1000;

            text-shadow:
                4px 4px black;
        }

        .loading-map-name {
            margin-top: 8px;

            color: #8be3ff;

            font-size: 22px;
            font-weight: 900;
        }

        .loading-text {
            margin-top: 28px;

            font-size: 17px;
            font-weight: 900;
        }

        .loading-bar {
            width:
                min(
                    520px,
                    85%
                );

            height: 35px;

            margin-top: 12px;

            overflow: hidden;

            background: #080d16;

            border:
                5px solid #00050b;

            border-radius: 12px;

            box-shadow:
                inset 0 0 12px black;
        }

        .loading-fill {
            width: 0;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #e56d16,
                    #ffb126
                );

            transition:
                width 0.12s linear;
        }

        .loading-percent {
            margin-top: 10px;

            font-size: 18px;
            font-weight: 1000;
        }

        .intro-cover {
            position: absolute;
            inset: 7px;
            z-index: 20;

            display: none;

            pointer-events: none;

            background: #252932;

            opacity: 0.85;

            border-radius: 5px;
        }

        .intro-cover.visible {
            display: block;
        }

        .battle-text {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 25;

            display: none;

            transform:
                translate(-50%, -50%)
                scale(0.4);

            color: white;

            font-size:
                clamp(55px, 10vw, 120px);

            font-weight: 1000;

            text-shadow:
                6px 6px #111827,
                10px 10px #00000088;
        }

        .battle-text.visible {
            display: block;

            animation:
                battleAnimation
                1.1s ease forwards;
        }

        @keyframes battleAnimation {
            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.3)
                    rotate(-8deg);
            }

            35% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.15)
                    rotate(3deg);
            }

            70% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1)
                    rotate(0);
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(1.3);
            }
        }

        .death-screen {
            position: absolute;
            inset: 7px;
            z-index: 40;

            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;

            padding: 20px;

            background: #000000bb;

            border-radius: 5px;
        }

        .death-screen.visible {
            display: flex;
        }

        .death-title {
            font-size:
                clamp(42px, 7vw, 80px);

            font-weight: 1000;

            text-shadow:
                5px 5px black;
        }

        .match-result {
            padding: 13px 22px;

            font-size: 20px;
            font-weight: 900;
            line-height: 1.5;

            background: #111827dd;

            border:
                4px solid #050912;

            border-radius: 12px;
        }

        .return-button {
            min-width: 230px;

            padding: 18px 30px;

            color: #111827;

            font-size: 28px;
            font-weight: 1000;

            background:
                linear-gradient(
                    #ffd93d,
                    #f0a500
                );

            border:
                5px solid #111827;

            border-radius: 14px;

            box-shadow:
                0 7px 0 #00000077;
        }

        .controls {
            position: fixed;
            left: 15px;
            bottom: 12px;

            padding: 8px 12px;

            color: #d1d5db;

            font-size: 13px;

            background: #111827cc;

            border-radius: 8px;
        }

        @media (max-width: 700px) {
            .logo {
                font-size: 17px;
            }

            .topbar {
                padding: 8px;
            }

            .top-buttons button,
            .back-button {
                padding: 7px;

                font-size: 12px;
            }

            .info-box {
                font-size: 12px;
            }

            .controls {
                display: none;
            }
        }
    </style>
</head>

window.addEventListener(
    "keydown",
    function(event) {
        const key =
            event.key.toLowerCase();

        keys[key] = true;

        if (
            key === "arrowup" ||
            key === "arrowdown" ||
            key === "arrowleft" ||
            key === "arrowright"
        ) {
            event.preventDefault();
        }
    }
);

window.addEventListener(
    "keyup",
    function(event) {
        keys[
            event.key.toLowerCase()
        ] = false;
    }
);

canvas.addEventListener(
    "mousemove",
    function(event) {
        const rectangle =
            canvas.getBoundingClientRect();

        mouse.x =
            (
                event.clientX -
                rectangle.left
            ) *
            canvas.width /
            rectangle.width;

        mouse.y =
            (
                event.clientY -
                rectangle.top
            ) *
            canvas.height /
            rectangle.height;
    }
);

canvas.addEventListener(
    "mousedown",
    function(event) {
        if (event.button === 0) {
            mouse.down = true;
        }
    }
);

window.addEventListener(
    "mouseup",
    function(event) {
        if (event.button === 0) {
            mouse.down = false;
        }
    }
);

canvas.addEventListener(
    "contextmenu",
    function(event) {

    }
);

function randomNumber(
    minimum,
    maximum
) {
    return (
        Math.random() *
        (
            maximum -
            minimum
        ) +
        minimum
    );
}

function randomItem(array) {
    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}

function shuffleArray(array) {
    const copy =
        array.slice();

    for (
        let i =
            copy.length - 1;

        i > 0;

        i--
    ) {
        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        const temporary =
            copy[i];

        copy[i] =
            copy[j];

        copy[j] =
            temporary;
    }

    return copy;
}

function distance(
    first,
    second
) {
    return Math.hypot(
        first.x -
        second.x,

        first.y -
        second.y
    );
}

function normalize(dx, dy) {
    const length =
        Math.hypot(
            dx,
            dy
        ) || 1;

    return {
        x:
            dx / length,

        y:
            dy / length
    };
}

function rotateDirection(
    direction,
    angle
) {
    return {
        x:
            direction.x *
            Math.cos(angle) -
            direction.y *
            Math.sin(angle),

        y:
            direction.x *
            Math.sin(angle) +
            direction.y *
            Math.cos(angle)
    };
}

function clamp(
    value,
    minimum,
    maximum
) {
    return Math.max(
        minimum,
        Math.min(
            maximum,
            value
        )
    );
}

function easeInOut(
    progress
) {
    return (
        progress < 0.5
            ? 2 *
              progress *
              progress
            : 1 -
              Math.pow(
                  -2 *
                  progress +
                  2,
                  2
              ) /
              2
    );
}

function rectangleCollision(
    x,
    y,
    radius,
    rectangle
) {
    const closestX =
        Math.max(
            rectangle.x,
            Math.min(
                x,
                rectangle.x +
                rectangle.w
            )
        );

    const closestY =
        Math.max(
            rectangle.y,
            Math.min(
                y,
                rectangle.y +
                rectangle.h
            )
        );

    const dx =
        x -
        closestX;

    const dy =
        y -
        closestY;

    return (
        dx * dx +
        dy * dy <
        radius * radius
    );
}

function collidesWithWall(
    x,
    y,
    radius
) {
    return walls.some(
        function(wall) {
            return rectangleCollision(
                x,
                y,
                radius,
                wall
            );
        }
    );
}

function collidesWithWater(
    x,
    y,
    radius
) {
    return waterPools.some(
        function(water) {
            return rectangleCollision(
                x,
                y,
                radius,
                water
            );
        }
    );
}

function isBlocked(
    x,
    y,
    radius
) {
    return (
        collidesWithWall(
            x,
            y,
            radius
        ) ||
        collidesWithWater(
            x,
            y,
            radius
        )
    );
}

function isSafeSpawn(
    x,
    y,
    radius = 40
) {
    if (
        x <
        radius + 70 ||
        y <
        radius + 70 ||
        x >
        WORLD_WIDTH -
        radius -
        70 ||
        y >
        WORLD_HEIGHT -
        radius -
        70
    ) {
        return false;
    }

    return !isBlocked(
        x,
        y,
        radius
    );
}

function getSafeSpawn(
    position
) {
    if (
        isSafeSpawn(
            position.x,
            position.y
        )
    ) {
        return {
            x: position.x,
            y: position.y
        };
    }

    for (
        let searchRadius = 40;
        searchRadius <= 600;
        searchRadius += 40
    ) {
        for (
            let angle = 0;
            angle <
            Math.PI * 2;
            angle += 0.25
        ) {
            const x =
                position.x +
                Math.cos(angle) *
                searchRadius;

            const y =
                position.y +
                Math.sin(angle) *
                searchRadius;

            if (
                isSafeSpawn(
                    x,
                    y
                )
            ) {
                return {
                    x: x,
                    y: y
                };
            }
        }
    }

    return {
        x:
            WORLD_WIDTH / 2,

        y:
            WORLD_HEIGHT / 2
    };
}
