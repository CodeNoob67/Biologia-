<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bitwa Królestw</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            color: white;
            font-family: Arial, sans-serif;
            text-align: center;

            background:
                radial-gradient(
                    circle at top,
                    #34405a,
                    #111722
                );
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;

            padding: 10px 18px;

            background: #111827;
            border-bottom: 4px solid #050912;
        }

        .logo {
            color: #ffd43b;
            font-size: 25px;
            font-weight: 900;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        button,
        .back-button {
            padding: 10px 15px;

            color: white;
            font-weight: 900;
            text-decoration: none;

            background: #35445e;

            border: 3px solid #080d16;
            border-radius: 10px;

            cursor: pointer;
        }

        .restart-button {
            background: #d34242;
        }

        .game-info {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;

            margin: 12px;
        }

        .info-box {
            padding: 8px 13px;

            background: #26344b;

            border: 3px solid #101722;
            border-radius: 10px;

            font-weight: 900;
        }

        canvas {
            width: min(82vh, 94vw);
            height: min(82vh, 94vw);

            max-width: 850px;
            max-height: 850px;

            border: 7px solid #111827;
            border-radius: 12px;

            box-shadow: 0 15px 40px #00000099;
        }

        .controls {
            margin: 10px;
            color: #d1d5db;
        }

        .mobile-controls {
            display: none;

            width: 280px;
            margin: 15px auto;

            grid-template-columns:
                repeat(3, 75px);

            justify-content: center;
            gap: 8px;
        }

        .mobile-controls button {
            height: 65px;
            font-size: 25px;
        }

        .attack-button {
            grid-column: 3;
            grid-row: 1 / 3;

            height: 138px !important;

            background: #d34242 !important;
        }

        @media (max-width: 800px) {
            .mobile-controls {
                display: grid;
            }

            canvas {
                width: 96vw;
                height: 96vw;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="logo">
        ⚔️ BITWA KRÓLESTW
    </div>

    <div class="top-buttons">

        <button
            class="restart-button"
            onclick="startGame()"
        >
            NOWA GRA
        </button>

        <a
            class="back-button"
            href="gra.html"
        >
            LOBBY
        </a>

    </div>

</header>

<div class="game-info">

    <div
        id="mapName"
        class="info-box"
    >
        Mapa
    </div>

    <div
        id="aliveCounter"
        class="info-box"
    >
        Pozostało: 8
    </div>

    <div
        id="playerInfo"
        class="info-box"
    >
        Gracz
    </div>

</div>

<canvas
    id="gameCanvas"
    width="850"
    height="850"
></canvas>

<div class="controls">
    WASD lub strzałki — ruch |
    Spacja — atak
</div>

<div class="mobile-controls">

    <button data-key="arrowup">
        ⬆️
    </button>

    <button
        class="attack-button"
        data-key=" "
    >
        ⚔️
    </button>

    <button data-key="arrowleft">
        ⬅️
    </button>

    <button data-key="arrowdown">
        ⬇️
    </button>

    <button data-key="arrowright">
        ➡️
    </button>

</div>

<script src="dane.js"></script>
<script src="common.js"></script>

<script>
const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const keys = {};

const MAPS = {
    green: {
        name: "Zielona Dolina",
        ground: "#58ad58",
        groundDark: "#459348",
        decoration: "🌳"
    },

    red: {
        name: "Czerwona Twierdza",
        ground: "#bd4b43",
        groundDark: "#9b3936",
        decoration: "🔥"
    },

    yellow: {
        name: "Złota Pustynia",
        ground: "#deb84e",
        groundDark: "#c79b35",
        decoration: "🌵"
    }
};

let selectedMap;

let fighters = [];
let projectiles = [];

let player;
let winner = null;

window.addEventListener(
    "keydown",
    function(event) {
        const key =
            event.key.toLowerCase();

        keys[key] = true;

        if (
            key === " " ||
            key === "arrowup" ||
            key === "arrowdown" ||
            key === "arrowleft" ||
            key === "arrowright"
        ) {
            event.preventDefault();
        }
    }
);

window.addEventListener(
    "keyup",
    function(event) {
        keys[event.key.toLowerCase()] =
            false;
    }
);

document
    .querySelectorAll("[data-key]")
    .forEach(function(button) {
        const key =
            button.dataset.key;

        button.addEventListener(
            "pointerdown",
            function() {
                keys[key] = true;
            }
        );

        button.addEventListener(
            "pointerup",
            function() {
                keys[key] = false;
            }
        );

        button.addEventListener(
            "pointerleave",
            function() {
                keys[key] = false;
            }
        );
    });

function randomNumber(minimum, maximum) {
    return (
        Math.random() *
        (maximum - minimum) +
        minimum
    );
}

function randomItem(array) {
    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}

function distance(first, second) {
    return Math.hypot(
        first.x - second.x,
        first.y - second.y
    );
}

function normalize(dx, dy) {
    const length =
        Math.hypot(dx, dy) || 1;

    return {
        x: dx / length,
        y: dy / length
    };
}

function createFighter(
    hero,
    x,
    y,
    isPlayer,
    number
) {
    return {
        id:
            isPlayer
                ? "player"
                : "bot-" + number,

        name:
            isPlayer
                ? "TY"
                : "BOT " + number,

        heroId: hero.id,
        heroName: hero.nazwa,
        icon: hero.ikona,

        x: x,
        y: y,

        radius: 24,

        hp: hero.hp,
        maxHp: hero.hp,

        damage: hero.damage,
        speed: hero.speed,
        range: hero.range,
        cooldown: hero.cooldown,

        isPlayer: isPlayer,
        alive: true,

        lastAttack: 0,

        target: null,
        behavior: "wander",

        directionX:
            randomNumber(-1, 1),

        directionY:
            randomNumber(-1, 1),

        nextDecision:
            performance.now() +
            randomNumber(700, 2000),

        color:
            isPlayer
                ? "#44aaff"
                : `hsl(
                    ${Math.random() * 360},
                    70%,
                    55%
                )`
    };
}

function startGame() {
    const mapId =
        localStorage.getItem(
            "selectedMap"
        ) || "green";

    selectedMap =
        MAPS[mapId];

    document
        .getElementById("mapName")
        .textContent =
        selectedMap.name;

    const state =
        getState();

    const selectedHero =
        getHero(state.selected);

    fighters = [];
    projectiles = [];

    winner = null;

    player =
        createFighter(
            selectedHero,
            425,
            730,
            true,
            0
        );

    fighters.push(player);

    const spawnPositions = [
        {
            x: 100,
            y: 100
        },

        {
            x: 425,
            y: 100
        },

        {
            x: 750,
            y: 100
        },

        {
            x: 100,
            y: 425
        },

        {
            x: 750,
            y: 425
        },

        {
            x: 170,
            y: 730
        },

        {
            x: 680,
            y: 730
        }
    ];

    for (
        let i = 0;
        i < 7;
        i++
    ) {
        const randomHero =
            randomItem(BOHATEROWIE);

        const position =
            spawnPositions[i];

        const bot =
            createFighter(
                randomHero,
                position.x,
                position.y,
                false,
                i + 1
            );

        fighters.push(bot);
    }

    updateInformation();
}

function updateInformation() {
    const alive =
        fighters.filter(
            function(fighter) {
                return fighter.alive;
            }
        ).length;

    document
        .getElementById(
            "aliveCounter"
        )
        .textContent =
        "Pozostało: " + alive;

    document
        .getElementById(
            "playerInfo"
        )
        .textContent =
        player.icon +
        " " +
        player.heroName +
        " | ❤️ " +
        Math.max(
            0,
            Math.ceil(player.hp)
        );
}

function keepInsideArena(fighter) {
    fighter.x =
        Math.max(
            fighter.radius,
            Math.min(
                canvas.width -
                fighter.radius,
                fighter.x
            )
        );

    fighter.y =
        Math.max(
            fighter.radius,
            Math.min(
                canvas.height -
                fighter.radius,
                fighter.y
            )
        );
}

function movePlayer() {
    if (
        !player.alive ||
        winner
    ) {
        return;
    }

    let dx = 0;
    let dy = 0;

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {
        dy -= 1;
    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {
        dy += 1;
    }

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        dx -= 1;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        dx += 1;
    }

    if (
        dx !== 0 ||
        dy !== 0
    ) {
        const direction =
            normalize(dx, dy);

        player.x +=
            direction.x *
            player.speed;

        player.y +=
            direction.y *
            player.speed;
    }

    keepInsideArena(player);

    if (keys[" "]) {
        const target =
            findClosestEnemy(player);

        if (target) {
            attack(
                player,
                target
            );
        }
    }
}

function findClosestEnemy(fighter) {
    const enemies =
        fighters.filter(
            function(other) {
                return (
                    other.alive &&
                    other !== fighter
                );
            }
        );

    if (
        enemies.length === 0
    ) {
        return null;
    }

    enemies.sort(
        function(first, second) {
            return (
                distance(
                    fighter,
                    first
                ) -
                distance(
                    fighter,
                    second
                )
            );
        }
    );

    return enemies[0];
}

function chooseBotDecision(bot) {
    const possibleTargets =
        fighters.filter(
            function(other) {
                return (
                    other.alive &&
                    other !== bot
                );
            }
        );

    if (
        possibleTargets.length === 0
    ) {
        bot.target = null;
        return;
    }

    bot.target =
        randomItem(
            possibleTargets
        );

    const roll =
        Math.random();

    if (
        bot.hp <
        bot.maxHp * 0.3
    ) {
        if (
            Math.random() < 0.75
        ) {
            bot.behavior = "flee";
        } else {
            bot.behavior = "attack";
        }
    } else if (roll < 0.55) {
        bot.behavior = "attack";
    } else if (roll < 0.8) {
        bot.behavior = "wander";
    } else {
        bot.behavior = "flee";
    }

    bot.directionX =
        randomNumber(-1, 1);

    bot.directionY =
        randomNumber(-1, 1);

    bot.nextDecision =
        performance.now() +
        randomNumber(700, 2200);
}

function updateBot(
    bot,
    currentTime
) {
    if (
        !bot.alive ||
        winner
    ) {
        return;
    }

    if (
        currentTime >=
            bot.nextDecision ||
        !bot.target ||
        !bot.target.alive
    ) {
        chooseBotDecision(bot);
    }

    if (!bot.target) {
        return;
    }

    const dx =
        bot.target.x - bot.x;

    const dy =
        bot.target.y - bot.y;

    const direction =
        normalize(dx, dy);

    const targetDistance =
        distance(
            bot,
            bot.target
        );

    if (
        bot.behavior === "attack"
    ) {
        if (
            targetDistance >
            Math.min(
                bot.range * 0.75,
                150
            )
        ) {
            bot.x +=
                direction.x *
                bot.speed *
                0.75;

            bot.y +=
                direction.y *
                bot.speed *
                0.75;
        } else {
            bot.x -=
                direction.x *
                bot.speed *
                0.15;

            bot.y -=
                direction.y *
                bot.speed *
                0.15;
        }

        attack(
            bot,
            bot.target
        );
    }

    if (
        bot.behavior === "flee"
    ) {
        bot.x -=
            direction.x *
            bot.speed;

        bot.y -=
            direction.y *
            bot.speed;

        if (
            Math.random() <
            0.025
        ) {
            attack(
                bot,
                bot.target
            );
        }
    }

    if (
        bot.behavior === "wander"
    ) {
        const wanderDirection =
            normalize(
                bot.directionX,
                bot.directionY
            );

        bot.x +=
            wanderDirection.x *
            bot.speed *
            0.55;

        bot.y +=
            wanderDirection.y *
            bot.speed *
            0.55;

        if (
            Math.random() <
            0.015
        ) {
            bot.directionX =
                randomNumber(-1, 1);

            bot.directionY =
                randomNumber(-1, 1);
        }

        if (
            targetDistance <
                bot.range &&
            Math.random() <
                0.04
        ) {
            attack(
                bot,
                bot.target
            );
        }
    }

    keepInsideArena(bot);
}

function isMeleeCharacter(heroId) {
    return (
        heroId === "rycerz" ||
        heroId === "goblin" ||
        heroId === "golem" ||
        heroId === "krol"
    );
}

function attack(
    attacker,
    target
) {
    if (
        !attacker.alive ||
        !target ||
        !target.alive
    ) {
        return;
    }

    const currentTime =
        performance.now();

    if (
        currentTime -
        attacker.lastAttack <
        attacker.cooldown
    ) {
        return;
    }

    attacker.lastAttack =
        currentTime;

    const targetDistance =
        distance(
            attacker,
            target
        );

    if (
        isMeleeCharacter(
            attacker.heroId
        )
    ) {
        if (
            targetDistance <=
            Math.max(
                attacker.range,
                80
            )
        ) {
            damageFighter(
                target,
                attacker.damage
            );
        }

        return;
    }

    const dx =
        target.x -
        attacker.x;

    const dy =
        target.y -
        attacker.y;

    const direction =
        normalize(dx, dy);

    let projectileColor =
        "#fff0a1";

    let projectileRadius =
        8;

    if (
        attacker.heroId ===
        "krolowa"
    ) {
        projectileColor =
            "#d55cff";

        projectileRadius =
            12;
    }

    if (
        attacker.heroId ===
        "farmer"
    ) {
        projectileColor =
            "#8b5a2b";
    }

    projectiles.push({
        x: attacker.x,
        y: attacker.y,

        vx:
            direction.x * 7,

        vy:
            direction.y * 7,

        radius:
            projectileRadius,

        damage:
            attacker.damage,

        owner:
            attacker,

        color:
            projectileColor
    });
}

function damageFighter(
    target,
    damage
) {
    if (!target.alive) {
        return;
    }

    target.hp -= damage;

    if (target.hp <= 0) {
        target.hp = 0;
        target.alive = false;
    }

    updateInformation();
    checkWinner();
}

function updateProjectiles() {
    for (
        let i =
            projectiles.length - 1;

        i >= 0;

        i--
    ) {
        const projectile =
            projectiles[i];

        projectile.x +=
            projectile.vx;

        projectile.y +=
            projectile.vy;

        let hit = false;

        for (
            const fighter
            of fighters
        ) {
            if (
                !fighter.alive ||
                fighter ===
                    projectile.owner
            ) {
                continue;
            }

            const projectileDistance =
                Math.hypot(
                    projectile.x -
                        fighter.x,

                    projectile.y -
                        fighter.y
                );

            if (
                projectileDistance <
                projectile.radius +
                fighter.radius
            ) {
                damageFighter(
                    fighter,
                    projectile.damage
                );

                hit = true;
                break;
            }
        }

        if (
            hit ||
            projectile.x < 0 ||
            projectile.y < 0 ||
            projectile.x >
                canvas.width ||
            projectile.y >
                canvas.height
        ) {
            projectiles.splice(
                i,
                1
            );
        }
    }
}

function checkWinner() {
    const alive =
        fighters.filter(
            function(fighter) {
                return fighter.alive;
            }
        );

    if (
        alive.length !== 1 ||
        winner
    ) {
        return;
    }

    winner = alive[0];

    if (winner === player) {
        const state =
            getState();

        state.tickets += 4;
        state.coins += 50;
        state.wins += 1;

        saveState(state);

        setTimeout(
            function() {
                alert(
                    "ZWYCIĘSTWO! Dostajesz 4 bilety i 50 monet."
                );
            },
            100
        );
    }
}

function update() {
    if (winner) {
        return;
    }

    movePlayer();

    const currentTime =
        performance.now();

    fighters.forEach(
        function(fighter) {
            if (
                !fighter.isPlayer
            ) {
                updateBot(
                    fighter,
                    currentTime
                );
            }
        }
    );

    updateProjectiles();
    updateInformation();
    checkWinner();
}

function drawMap() {
    ctx.fillStyle =
        selectedMap.ground;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const tileSize = 85;

    for (
        let x = 0;
        x < canvas.width;
        x += tileSize
    ) {
        for (
            let y = 0;
            y < canvas.height;
            y += tileSize
        ) {
            const column =
                x / tileSize;

            const row =
                y / tileSize;

            if (
                (column + row) %
                2 ===
                0
            ) {
                ctx.fillStyle =
                    selectedMap
                        .groundDark;

                ctx.fillRect(
                    x,
                    y,
                    tileSize,
                    tileSize
                );
            }
        }
    }

    ctx.font =
        "35px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    const decorations = [
        [80, 210],
        [220, 80],
        [640, 100],
        [770, 260],
        [100, 650],
        [720, 680],
        [425, 425]
    ];

    decorations.forEach(
        function(position) {
            ctx.fillText(
                selectedMap
                    .decoration,

                position[0],
                position[1]
            );
        }
    );
}

function drawHealthBar(fighter) {
    const width = 55;
    const height = 8;

    const x =
        fighter.x -
        width / 2;

    const y =
        fighter.y -
        fighter.radius -
        23;

    ctx.fillStyle =
        "#311f25";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.fillStyle =
        fighter.isPlayer
            ? "#48df68"
            : "#ef4d4d";

    ctx.fillRect(
        x,
        y,

        width *
        Math.max(
            0,
            fighter.hp /
            fighter.maxHp
        ),

        height
    );

    ctx.strokeStyle =
        "#111827";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );
}

function drawFighter(fighter) {
    if (!fighter.alive) {
        return;
    }

    ctx.beginPath();

    ctx.arc(
        fighter.x,
        fighter.y,
        fighter.radius + 6,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        fighter.color;

    ctx.fill();

    ctx.strokeStyle =
        fighter.isPlayer
            ? "white"
            : "#111827";

    ctx.lineWidth =
        fighter.isPlayer
            ? 5
            : 3;

    ctx.stroke();

    ctx.font =
        "40px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        fighter.icon,
        fighter.x,
        fighter.y
    );

    ctx.font =
        "bold 13px Arial";

    ctx.strokeStyle =
        "black";

    ctx.lineWidth = 4;

    ctx.strokeText(
        fighter.name,
        fighter.x,
        fighter.y + 43
    );

    ctx.fillStyle =
        "white";

    ctx.fillText(
        fighter.name,
        fighter.x,
        fighter.y + 43
    );

    drawHealthBar(fighter);
}

function drawProjectiles() {
    projectiles.forEach(
        function(projectile) {
            ctx.beginPath();

            ctx.arc(
                projectile.x,
                projectile.y,
                projectile.radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                projectile.color;

            ctx.fill();

            ctx.strokeStyle =
                "#111827";

            ctx.lineWidth = 2;

            ctx.stroke();
        }
    );
}

function drawMessage() {
    if (winner) {
        ctx.fillStyle =
            "#000000aa";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle =
            "white";

        ctx.textAlign =
            "center";

        ctx.font =
            "bold 60px Arial";

        if (
            winner === player
        ) {
            ctx.fillText(
                "ZWYCIĘSTWO!",
                canvas.width / 2,
                canvas.height / 2
            );
        } else {
            ctx.fillText(
                winner.name +
                " WYGRYWA!",

                canvas.width / 2,
                canvas.height / 2
            );

            ctx.font =
                "bold 35px Arial";

            ctx.fillText(
                winner.icon +
                " " +
                winner.heroName,

                canvas.width / 2,
                canvas.height / 2 +
                65
            );
        }

        return;
    }

    if (!player.alive) {
        ctx.fillStyle =
            "#00000055";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 36px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "POKONANY — OBSERWUJ WALKĘ",

            canvas.width / 2,
            65
        );
    }
}

function draw() {
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMap();

    fighters.forEach(
        drawFighter
    );

    drawProjectiles();
    drawMessage();
}

function gameLoop() {
    update();
    draw();

    requestAnimationFrame(
        gameLoop
    );
}

startGame();
gameLoop();
</script>

</body>
</html>
