            border-radius: 12px;

});

function randomNumber(minimum, maximum) {
    return Math.random() * (maximum - minimum) + minimum;
}

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function distance(first, second) {
    return Math.hypot(
        first.x - second.x,
        first.y - second.y
    );
}

function normalize(dx, dy) {
    const length = Math.hypot(dx, dy) || 1;

    return {
        x: dx / length,
        y: dy / length
    };
}

function rotateDirection(direction, angle) {
    return {
        x:
            direction.x * Math.cos(angle) -
            direction.y * Math.sin(angle),

        y:
            direction.x * Math.sin(angle) +
            direction.y * Math.cos(angle)
    };
}

function rectangleCollision(x, y, radius, rectangle) {
    const closestX = Math.max(
        rectangle.x,
        Math.min(x, rectangle.x + rectangle.w)
    );

    const closestY = Math.max(
        rectangle.y,
        Math.min(y, rectangle.y + rectangle.h)
    );

    const dx = x - closestX;
    const dy = y - closestY;

    return dx * dx + dy * dy < radius * radius;
}

function collidesWithWall(x, y, radius) {
    return walls.some(function(wall) {
        return rectangleCollision(x, y, radius, wall);
    });
}

function collidesWithWater(x, y, radius) {
    return waterPools.some(function(water) {
        return rectangleCollision(x, y, radius, water);
    });
}

function isBlocked(x, y, radius) {
    return (
        collidesWithWall(x, y, radius) ||
        collidesWithWater(x, y, radius)
    );
}

function isSafeSpawn(x, y, radius = 35) {
    if (
        x < radius ||
        y < radius ||
        x > WORLD_WIDTH - radius ||
        y > WORLD_HEIGHT - radius
    ) {
        return false;
    }

    return !isBlocked(x, y, radius);
}

function getSafeSpawn(position) {
    if (isSafeSpawn(position.x, position.y)) {
        return position;
    }

    for (let radius = 60; radius <= 600; radius += 50) {
        for (let angle = 0; angle < Math.PI * 2; angle += 0.35) {
            const x =
                position.x +
                Math.cos(angle) * radius;

            const y =
                position.y +
                Math.sin(angle) * radius;

            if (isSafeSpawn(x, y)) {
                return { x, y };
            }
        }
    }

    return {
        x: WORLD_WIDTH / 2,
        y: WORLD_HEIGHT / 2
    };
}

        !selectedHero ||
        !BOHATEROWIE.some(function(hero) {
            return hero.id === selectedHero.id;
        })
    ) {
        selectedHero = BOHATEROWIE[0];
    }

    fighters = [];
    projectiles = [];
    effects = [];

    winner = null;
    matchFinished = false;
    trophiesAwarded = false;
    summonNumber = 0;

    mouse.down = false;

    document
        .getElementById("deathScreen")
        .classList.remove("visible");

    document.getElementById("matchResult").innerHTML = "";

    const playerSpawn = getSafeSpawn(spawnPositions[8]);

    player = createFighter(
        selectedHero,
        playerSpawn.x,
        playerSpawn.y,
        true,
        0
    );

    fighters.push(player);

    const botSpawns = spawnPositions.filter(function(_, index) {
        return index !== 8;
    });

    for (let i = 0; i < 9; i++) {
        const randomHero = randomItem(BOHATEROWIE);
        const safePosition = getSafeSpawn(botSpawns[i]);

        fighters.push(
            createFighter(
                randomHero,
                safePosition.x,
                safePosition.y,
                false,
                i + 1
            )
        );
    }

    updateBushStatus();
    updateCamera();
    updateInformation();
}

function updateInformation() {
    const alive = getAliveContestants().length;

    document.getElementById("aliveCounter").textContent =
        "Pozostało: " + alive;

    if (!player) {
        return;
    }

    let extra = "";

    if (
        player.lowHpShield &&
        player.hp <=
            player.maxHp *
            player.shieldThreshold
    ) {
        extra += " | 🛡️ TARCZA";
    }

    if (player.cursedUntil > performance.now()) {
        extra += " | 🔮 KLĄTWA";
    }

    if (player.hidden) {
        extra += " | 🌿 UKRYTY";
    }

    if (player.summonsGhosts) {
        const summons = fighters.filter(function(fighter) {
            return (
                fighter.alive &&
                fighter.isSummon &&
                fighter.summoner === player
            );
        }).length;

        extra +=
            " | 👻 " +
            summons +
            "/" +
            player.maximumSummons;
    }

    if (player.canPassWalls) {
        extra += " | 🧱 PRZENIKANIE";
    }

    document.getElementById("playerInfo").textContent =
        player.icon +
        " " +
        player.heroName +
        " | ❤️ " +
        Math.max(0, Math.ceil(player.hp)) +
        extra;
}

function updateCamera() {
    if (!player) {
        return;
    }

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;

    camera.x = Math.max(
        0,
        Math.min(
            WORLD_WIDTH - canvas.width,
            camera.x
        )
    );

    camera.y = Math.max(
        0,
        Math.min(
            WORLD_HEIGHT - canvas.height,
            camera.y
        )
    );
}

function moveFighter(fighter, dx, dy) {
    const nextX = Math.max(
        fighter.radius,
        Math.min(
            WORLD_WIDTH - fighter.radius,
            fighter.x + dx
        )
    );

    if (
        fighter.canPassWalls ||
        !isBlocked(
            nextX,
            fighter.y,
            fighter.radius
        )
    ) {
        fighter.x = nextX;
    }

    const nextY = Math.max(
        fighter.radius,
        Math.min(
            WORLD_HEIGHT - fighter.radius,
            fighter.y + dy
        )
    );

    if (
        fighter.canPassWalls ||
        !isBlocked(
            fighter.x,
            nextY,
            fighter.radius
        )
    ) {
        fighter.y = nextY;
    }
}

function pointInsideRectangle(x, y, rectangle) {
    return (
        x >= rectangle.x &&
        x <= rectangle.x + rectangle.w &&
        y >= rectangle.y &&
        y <= rectangle.y + rectangle.h
    );
}

function updateBushStatus() {
    fighters.forEach(function(fighter) {
        fighter.hidden =
            fighter.alive &&
            bushes.some(function(bush) {
                return pointInsideRectangle(
                    fighter.x,
                    fighter.y,
                    bush
                );
            });
    });
}

function canSeeFighter(observer, target) {
    if (!target.hidden) {
        return true;
    }

    return distance(observer, target) < 170;
}

function isEnemy(observer, target) {
    if (
        !target.alive ||
        target === observer
    ) {
        return false;
    }

    if (
        observer.isSummon &&
        target === observer.summoner
    ) {
        return false;
    }

    if (
        target.isSummon &&
        target.summoner === observer
    ) {
        return false;
    }

    if (
        observer.isSummon &&
        target.isSummon &&
        observer.summoner === target.summoner
    ) {
        return false;
    }

    return true;
}

function movePlayer() {
    if (
        !player ||
        !player.alive ||
        matchFinished
    ) {
        return;
    }

    let dx = 0;
    let dy = 0;

    if (keys["w"] || keys["arrowup"]) {
        dy -= 1;
    }

    if (keys["s"] || keys["arrowdown"]) {
        dy += 1;
    }

    if (keys["a"] || keys["arrowleft"]) {
        dx -= 1;
    }

    if (keys["d"] || keys["arrowright"]) {
        dx += 1;
    }

    if (dx !== 0 || dy !== 0) {
        const direction = normalize(dx, dy);

        moveFighter(
            player,
            direction.x * player.speed,
            direction.y * player.speed
        );
    }

    if (mouse.down) {
        attackTowards(
            player,
            mouse.x + camera.x,
            mouse.y + camera.y
        );
    }
}

function getPossibleTargets(fighter) {
    return fighters.filter(function(other) {
        return (
            isEnemy(fighter, other) &&
            canSeeFighter(fighter, other)
        );
    });
}

function getNearestTarget(fighter) {
    const targets = getPossibleTargets(fighter);

    if (targets.length === 0) {
        return null;
    }

    targets.sort(function(first, second) {
        return (
            distance(fighter, first) -
            distance(fighter, second)
        );
    });

    return targets[0];
}

function chooseBotDecision(bot) {
    const targets = getPossibleTargets(bot);

    if (targets.length === 0) {
        bot.target = null;
        bot.behavior = "wander";
    } else {
        bot.target = randomItem(targets);

        const roll = Math.random();

        if (bot.hp < bot.maxHp * 0.3) {
            bot.behavior =
                Math.random() < 0.72
                    ? "flee"
                    : "attack";
        } else if (roll < 0.62) {
            bot.behavior = "attack";
        } else if (roll < 0.84) {
            bot.behavior = "wander";
        } else {
            bot.behavior = "flee";
        }
    }

    bot.directionX = randomNumber(-1, 1);
    bot.directionY = randomNumber(-1, 1);

    bot.nextDecision =
        performance.now() +
        randomNumber(700, 2200);
}

function updateBot(bot, currentTime) {
    if (
        !bot.alive ||
        matchFinished ||
        bot.isSummon
    ) {
        return;
    }

    if (
        currentTime >= bot.nextDecision ||
        !bot.target ||
        !bot.target.alive ||
        !isEnemy(bot, bot.target) ||
        !canSeeFighter(bot, bot.target)
    ) {
        chooseBotDecision(bot);
    }

    if (bot.behavior === "wander") {
        const direction = normalize(
            bot.directionX,
            bot.directionY
        );

        moveFighter(
            bot,
            direction.x * bot.speed * 0.58,
            direction.y * bot.speed * 0.58
        );

        if (Math.random() < 0.015) {
            bot.directionX = randomNumber(-1, 1);
            bot.directionY = randomNumber(-1, 1);
        }

        return;
    }

    if (!bot.target) {
        return;
    }

    const direction = normalize(
        bot.target.x - bot.x,
        bot.target.y - bot.y
    );

    const targetDistance = distance(bot, bot.target);

    if (bot.behavior === "flee") {
        moveFighter(
            bot,
            -direction.x * bot.speed,
            -direction.y * bot.speed
        );

        if (Math.random() < 0.035) {
            attackTowards(
                bot,
                bot.target.x,
                bot.target.y
            );
        }

        return;
    }

    const preferredDistance =
        bot.melee
            ? bot.range * 0.7
            : Math.min(bot.range * 0.58, 500);

    if (targetDistance > preferredDistance) {
        moveFighter(
            bot,
            direction.x * bot.speed * 0.78,
            direction.y * bot.speed * 0.78
        );
    } else if (!bot.melee) {
        moveFighter(
            bot,
            -direction.x * bot.speed * 0.24,
            -direction.y * bot.speed * 0.24
        );
    }

    attackTowards(
        bot,
        bot.target.x,
        bot.target.y
    );
}

function updateSummon(summon) {
    if (
        !summon.alive ||
        matchFinished
    ) {
        return;
    }

    if (
        !summon.summoner ||
        !summon.summoner.alive
    ) {
        summon.alive = false;
        return;
    }

    if (
        !summon.target ||
        !summon.target.alive ||
        !isEnemy(summon, summon.target)
    ) {
        summon.target = getNearestTarget(summon);
    }

    if (!summon.target) {
        return;
    }

    const direction = normalize(
        summon.target.x - summon.x,
        summon.target.y - summon.y
    );

    const targetDistance = distance(
        summon,
        summon.target
    );

    if (targetDistance > summon.range * 0.72) {
        moveFighter(
            summon,
            direction.x * summon.speed,
            direction.y * summon.speed
        );
    }

    attackTowards(
        summon,
        summon.target.x,
        summon.target.y
    );
}

function updatePriestSummons(currentTime) {
    fighters.slice().forEach(function(fighter) {
        if (
            !fighter.alive ||
            fighter.isSummon ||
            !fighter.summonsGhosts
        ) {
            return;
        }

        const summons = fighters.filter(function(other) {
            return (
                other.alive &&
                other.isSummon &&
                other.summoner === fighter
            );
        });

        if (
            summons.length >=
            fighter.maximumSummons
        ) {
            return;
        }

        if (
            currentTime -
            fighter.lastSummon <
            fighter.summonCooldown
        ) {
            return;
        }

        fighter.lastSummon = currentTime;
        createSummonedGhost(fighter);
    });
}

function findTargetNearPoint(
    attacker,
    targetX,
    targetY
) {
    const targets = fighters.filter(function(fighter) {
        return (
            isEnemy(attacker, fighter) &&
            canSeeFighter(attacker, fighter)
        );
    });

    targets.sort(function(first, second) {
        return (
            Math.hypot(
                first.x - targetX,
                first.y - targetY
            ) -
            Math.hypot(
                second.x - targetX,
                second.y - targetY
            )
        );
    });

    return targets[0] || null;
}

function attackTowards(
    attacker,
    targetX,
    targetY
) {
    if (
        !attacker.alive ||
        matchFinished
    ) {
        return;
    }

    const currentTime = performance.now();

    if (
        currentTime -
        attacker.lastAttack <
        attacker.cooldown
    ) {
        return;
    }

    const direction = normalize(
        targetX - attacker.x,
        targetY - attacker.y
    );

    attacker.lastAttack = currentTime;
    attacker.hidden = false;
    attacker.attackCounter++;

    let attackDamage = attacker.damage;

    if (
        attacker.farmerThirdAttack &&
        attacker.attackCounter % 3 === 0
    ) {
        attackDamage *= 1.5;

        createTextEffect(
            attacker.x,
            attacker.y - 50,
            "WZMOCNIONY!",
            "#ffd93d"
        );
    }

    if (
        attacker.lowHpDamageBonus &&
        attacker.hp <
            attacker.maxHp *
            attacker.damageBonusThreshold
    ) {
        attackDamage *=
            attacker.damageBonusMultiplier;
    }

    attackDamage = Math.round(attackDamage);

    if (attacker.melee) {
        const target = findTargetNearPoint(
            attacker,
            targetX,
            targetY
        );

        if (
            target &&
            distance(attacker, target) <= attacker.range
        ) {
            damageFighter(
                target,
                attackDamage,
                attacker
            );

            createMeleeEffect(
                attacker,
                direction
            );
        }

        return;
    }

    if (
        attacker.shockwaveEvery > 0 &&
        attacker.attackCounter %
            attacker.shockwaveEvery ===
            0
    ) {
        createGolemShockwave(attacker);
    }

    if (attacker.tripleShot) {
        createProjectile(
            attacker,
            direction,
            -0.14,
            attackDamage
        );

        createProjectile(
            attacker,
            direction,
            0,
            attackDamage
        );

        createProjectile(
            attacker,
            direction,
            0.14,
            attackDamage
        );

        return;
    }

    createProjectile(
        attacker,
        direction,
        0,
        attackDamage
    );
}

function createProjectile(
    attacker,
    direction,
    angle,
    attackDamage
) {
    const rotated = rotateDirection(
        direction,
        angle
    );

    let color = "#f9eda2";
    let speedMultiplier = 1;
    let appliesCurse = false;

    if (attacker.heroId === "farmer") {
        color = "#6b4327";
    }

    if (attacker.heroId === "lucznik") {
        color = "#f3e6a2";

        if (
            attacker.fastThirdArrow &&
            attacker.attackCounter % 3 === 0
        ) {
            speedMultiplier =
                attacker.fastArrowMultiplier;

            color = "#ffffff";
        }
    }

    if (attacker.heroId === "ksiadz") {
        color = "#e9f4ff";
    }

    if (attacker.heroId === "golem") {
        color = "#8b7566";
    }

    if (attacker.heroId === "czarodziej") {
        color = "#d851ff";

        if (
            attacker.curseEvery > 0 &&
            attacker.attackCounter %
                attacker.curseEvery ===
                0
        ) {
            appliesCurse = true;
            color = "#741cff";
        }
    }

    if (attacker.heroId === "krol") {
        color = "#ffd638";
    }

    if (attacker.heroId === "wiedzma") {
        color = "#FFCC33";
    }

    projectiles.push({
        x:
            attacker.x +
            rotated.x * 34,

        y:
            attacker.y +
            rotated.y * 34,

        vx:
            rotated.x *
            attacker.projectileSpeed *
            speedMultiplier,

        vy:
            rotated.y *
            attacker.projectileSpeed *
            speedMultiplier,

        radius: attacker.projectileWidth,
        damage: attackDamage,
        owner: attacker,
        color,

        born: performance.now(),
        life: attacker.projectileLife,

        appliesCurse,
        curseDuration: attacker.curseDuration,
        curseMultiplier: attacker.curseMultiplier
    });
}

function createMeleeEffect(attacker, direction) {
    effects.push({
        type: "circle",

        x:
            attacker.x +
            direction.x * 38,

        y:
            attacker.y +
            direction.y * 38,

        radius: 25,
        maximumRadius: attacker.range,

        color:
            attacker.isSummon ||
            attacker.heroId === "duch"
                ? "#bdefff"
                : "#ffffff",

        born: performance.now(),
        life: 180,
        lineWidth: 12
    });
}

function createGolemShockwave(attacker) {
    fighters.forEach(function(target) {
        if (!isEnemy(attacker, target)) {
            return;
        }

        if (
            distance(attacker, target) <=
            attacker.attackShockwaveRadius
        ) {
            damageFighter(
                target,
                attacker.attackShockwaveDamage,
                attacker
            );
        }
    });

    effects.push({
        type: "circle",
        x: attacker.x,
        y: attacker.y,
        radius: 20,
        maximumRadius: attacker.attackShockwaveRadius,
        color: "#d3c0a0",
        born: performance.now(),
        life: 550,
        lineWidth: 18
    });
}

function createTextEffect(x, y, text, color) {
    effects.push({
        type: "text",
        x,
        y,
        text,
        color,
        born: performance.now(),
        life: 700
    });
}

function removeSummonsOf(summoner) {
    fighters.forEach(function(fighter) {
        if (
            fighter.alive &&
            fighter.isSummon &&
            fighter.summoner === summoner
        ) {
            fighter.alive = false;
        }
    });
}

function damageFighter(target, damage, attacker) {
    if (!target.alive) {
        return;
    }

    let finalDamage = Number(damage) || 0;

    if (
        target.cursedUntil >
        performance.now()
    ) {
        finalDamage *=
            target.receivedDamageMultiplier;
    } else {
        target.receivedDamageMultiplier = 1;
    }

    if (
        target.lowHpShield &&
        target.hp <=
            target.maxHp *
            target.shieldThreshold
    ) {
        finalDamage *=
            1 - target.shieldReduction;
    }

    finalDamage = Math.max(
        1,
        Math.round(finalDamage)
    );

    target.hp -= finalDamage;
    target.hidden = false;

    createTextEffect(
        target.x,
        target.y - 35,
        "-" + finalDamage,
        "#ff6464"
    );

    if (target.hp <= 0) {
        target.hp = 0;
        target.alive = false;

        if (target.summonsGhosts) {
            removeSummonsOf(target);
        }

        if (target === player) {
            const aliveAfterDeath =
                getAliveContestants().length;

            awardTrophies(
                aliveAfterDeath + 1
            );

            showDeathScreen(false);
        }
    }

    checkWinner();
    updateInformation();
}

function projectileHitsWall(projectile) {
    return (
        walls.some(function(wall) {
            return rectangleCollision(
                projectile.x,
                projectile.y,
                projectile.radius,
                wall
            );
        }) ||
        waterPools.some(function(water) {
            return rectangleCollision(
                projectile.x,
                projectile.y,
                projectile.radius,
                water
            );
        })
    );
}

function updateProjectiles(currentTime) {
    for (
        let i = projectiles.length - 1;
        i >= 0;
        i--
    ) {
        const projectile = projectiles[i];

        projectile.x += projectile.vx;
        projectile.y += projectile.vy;

        let remove = false;

        if (
            currentTime -
            projectile.born >
            projectile.life
        ) {
            remove = true;
        }

        if (
            projectile.x < 0 ||
            projectile.y < 0 ||
            projectile.x > WORLD_WIDTH ||
            projectile.y > WORLD_HEIGHT
        ) {
            remove = true;
        }

        if (
            !remove &&
            projectileHitsWall(projectile)
        ) {
            remove = true;
        }

        if (!remove) {
            for (const fighter of fighters) {
                if (
                    !isEnemy(
                        projectile.owner,
                        fighter
                    )
                ) {
                    continue;
                }

                const hit =
                    Math.hypot(
                        projectile.x - fighter.x,
                        projectile.y - fighter.y
                    ) <
                    projectile.radius +
                    fighter.radius;

                if (!hit) {
                    continue;
                }

                damageFighter(
                    fighter,
                    projectile.damage,
                    projectile.owner
                );

                if (projectile.appliesCurse) {
                    fighter.cursedUntil =
                        performance.now() +
                        projectile.curseDuration;

                    fighter.receivedDamageMultiplier =
                        projectile.curseMultiplier;

                    createTextEffect(
                        fighter.x,
                        fighter.y - 60,
                        "KLĄTWA!",
                        "#b662ff"
                    );
                }

                remove = true;
                break;
            }
        }

        if (remove) {
            projectiles.splice(i, 1);
        }
    }
}

function updateEffects(currentTime) {
    for (
        let i = effects.length - 1;
        i >= 0;
        i--
    ) {
        const effect = effects[i];

        const progress =
            (currentTime - effect.born) /
            effect.life;

        if (effect.type === "circle") {
            effect.radius =
                20 +
                (
                    effect.maximumRadius -
                    20
                ) *
                Math.min(1, progress);
        }

        if (progress >= 1) {
            effects.splice(i, 1);
        }
    }
}

function awardTrophies(place) {
    if (
        trophiesAwarded ||
        !player
    ) {
        return;
    }

    trophiesAwarded = true;

    const safePlace = Math.max(
        1,
        Math.min(
            10,
            Math.floor(place)
        )
    );

    const reward =
        TROPHY_REWARDS[safePlace] || 0;

    const state = getState();

    if (
        !state.heroTrophies ||
        typeof state.heroTrophies !== "object"
    ) {
        state.heroTrophies = {};
    }

    const before = Math.max(
        0,
        Number(
            state.heroTrophies[
                player.heroId
            ]
        ) || 0
    );

    const after = Math.max(
        0,
        before + reward
    );

    const realChange = after - before;

    state.heroTrophies[player.heroId] =
        after;

    saveState(state);

    const sign =
        realChange > 0
            ? "+"
            : "";

    document.getElementById("matchResult").innerHTML =
        "Miejsce: <b>" +
        safePlace +
        "</b><br>" +
        "Zmiana pucharków: <b>" +
        sign +
        realChange +
        "</b><br>" +
        player.heroName +
        " ma teraz: <b>🏆 " +
        after +
        "</b>";
}

function checkWinner() {
    const alive = getAliveContestants();

    if (
        alive.length !== 1 ||
        matchFinished
    ) {
        return;
    }

    winner = alive[0];
    matchFinished = true;

    if (winner === player) {
        awardTrophies(1);

        const state = getState();

        state.tickets =
            (Number(state.tickets) || 0) +
            4;

        state.coins =
            (Number(state.coins) || 0) +
            50;

        state.wins =
            (Number(state.wins) || 0) +
            1;

        saveState(state);
        showDeathScreen(true);
    } else if (!player.alive) {
        showDeathScreen(false);
    }
}

function showDeathScreen(playerWon) {
    document.getElementById("deathTitle").textContent =
        playerWon
            ? "ZWYCIĘSTWO!"
            : "POKONANY";

    document
        .getElementById("deathScreen")
        .classList.add("visible");
}

function update() {
    if (matchFinished) {
        return;
    }

    movePlayer();

    const currentTime = performance.now();

    fighters.slice().forEach(function(fighter) {
        if (fighter.isSummon) {
            updateSummon(fighter);
        } else if (!fighter.isPlayer) {
            updateBot(fighter, currentTime);
        }
    });

    updatePriestSummons(currentTime);
    updateBushStatus();
    updateProjectiles(currentTime);
    updateEffects(currentTime);
    updateCamera();
    updateInformation();
    checkWinner();
}

function worldToScreenX(x) {
    return x - camera.x;
}

function worldToScreenY(y) {
    return y - camera.y;
}

function objectVisible(x, y, width, height) {
    return (
        x + width >= camera.x &&
        x <= camera.x + canvas.width &&
        y + height >= camera.y &&
        y <= camera.y + canvas.height
    );
}

function drawMap() {
    ctx.fillStyle = selectedMap.ground;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const tileSize = 80;

    const startColumn = Math.floor(
        camera.x / tileSize
    );

    const endColumn = Math.ceil(
        (camera.x + canvas.width) /
        tileSize
    );

    const startRow = Math.floor(
        camera.y / tileSize
    );

    const endRow = Math.ceil(
        (camera.y + canvas.height) /
        tileSize
    );

    for (
        let column = startColumn;
        column <= endColumn;
        column++
    ) {
        for (
            let row = startRow;
            row <= endRow;
            row++
        ) {
            if ((column + row) % 2 === 0) {
                ctx.fillStyle =
                    selectedMap.groundDark;

                ctx.fillRect(
                    column * tileSize -
                    camera.x,

                    row * tileSize -
                    camera.y,

                    tileSize,
                    tileSize
                );
            }
        }
    }
}

function drawWater() {
    waterPools.forEach(function(water) {
        if (
            !objectVisible(
                water.x,
                water.y,
                water.w,
                water.h
            )
        ) {
            return;
        }

        const x = worldToScreenX(water.x);
        const y = worldToScreenY(water.y);

        ctx.fillStyle = "#153e68";

        ctx.fillRect(
            x - 6,
            y - 6,
            water.w + 12,
            water.h + 12
        );

        ctx.fillStyle = selectedMap.water;

        ctx.fillRect(
            x,
            y,
            water.w,
            water.h
        );

        ctx.fillStyle =
            selectedMap.waterLight;

        for (
            let waveX = 15;
            waveX < water.w;
            waveX += 45
        ) {
            ctx.fillRect(
                x + waveX,
                y + 17,
                24,
                5
            );
        }

        ctx.strokeStyle = "#0f3558";
        ctx.lineWidth = 4;

        ctx.strokeRect(
            x,
            y,
            water.w,
            water.h
        );
    });
}

function drawBushes() {
    bushes.forEach(function(bush) {
        if (
            !objectVisible(
                bush.x,
                bush.y,
                bush.w,
                bush.h
            )
        ) {
            return;
        }

        const x = worldToScreenX(bush.x);
        const y = worldToScreenY(bush.y);

        ctx.fillStyle = selectedMap.bush;

        ctx.fillRect(
            x,
            y,
            bush.w,
            bush.h
        );

        ctx.fillStyle =
            selectedMap.bushLight;

        for (
            let leafX = 10;
            leafX < bush.w;
            leafX += 32
        ) {
            for (
                let leafY = 10;
                leafY < bush.h;
                leafY += 32
            ) {
                ctx.beginPath();

                ctx.arc(
                    x +
                    leafX +
                    Math.sin(
                        (bush.x + leafX) *
                        12.345
                    ) *
                    4,

                    y +
                    leafY +
                    Math.sin(
                        (bush.y + leafY) *
                        12.345
                    ) *
                    4,

                    15,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }
        }

        ctx.strokeStyle = "#173b21";
        ctx.lineWidth = 4;

        ctx.strokeRect(
            x,
            y,
            bush.w,
            bush.h
        );
    });
}

function drawWalls() {
    walls.forEach(function(wall) {
        if (
            !objectVisible(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            )
        ) {
            return;
        }

        const x = worldToScreenX(wall.x);
        const y = worldToScreenY(wall.y);

        ctx.fillStyle = "#00000044";

        ctx.fillRect(
            x + 9,
            y + 11,
            wall.w,
            wall.h
        );

        ctx.fillStyle = selectedMap.wall;

        ctx.fillRect(
            x,
            y,
            wall.w,
            wall.h
        );

        ctx.fillStyle = selectedMap.wallTop;

        ctx.fillRect(
            x,
            y,
            wall.w,
            Math.min(22, wall.h)
        );

        ctx.strokeStyle =
            selectedMap.brickLine;

        ctx.lineWidth = 4;

        ctx.strokeRect(
            x,
            y,
            wall.w,
            wall.h
        );

        for (
            let brickX = 25;
            brickX < wall.w;
            brickX += 50
        ) {
            ctx.beginPath();

            ctx.moveTo(
                x + brickX,
                y
            );

            ctx.lineTo(
                x + brickX,
                y + Math.min(22, wall.h)
            );

            ctx.stroke();
        }

        for (
            let brickY = 45;
            brickY < wall.h;
            brickY += 45
        ) {
            ctx.beginPath();

            ctx.moveTo(
                x,
                y + brickY
            );

            ctx.lineTo(
                x + wall.w,
                y + brickY
            );

            ctx.stroke();
        }
    });
}

function drawHealthBar(fighter, screenX, screenY) {
    const width =
        fighter.isSummon
            ? 42
            : 62;

    const height =
        fighter.isSummon
            ? 6
            : 9;

    const x =
        screenX -
        width / 2;

    const y =
        screenY -
        fighter.radius -
        27;

    ctx.fillStyle = "#281b20";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.fillStyle =
        fighter.isPlayer
            ? "#42de63"
            : fighter.isSummon
                ? "#6fe6ff"
                : "#ef4d4d";

    ctx.fillRect(
        x,
        y,

        width *
        Math.max(
            0,
            fighter.hp /
            fighter.maxHp
        ),

        height
    );

    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );
}

function drawFighter(fighter) {
    if (!fighter.alive) {
        return;
    }

    const screenX = worldToScreenX(fighter.x);
    const screenY = worldToScreenY(fighter.y);

    if (
        screenX < -80 ||
        screenY < -80 ||
        screenX > canvas.width + 80 ||
        screenY > canvas.height + 80
    ) {
        return;
    }

    const visibleToPlayer =
        fighter === player ||
        !fighter.hidden ||
        (
            player.alive &&
            distance(player, fighter) < 170
        );

    if (!visibleToPlayer) {
        return;
    }

    ctx.save();

    if (fighter.hidden) {
        ctx.globalAlpha =
            fighter === player
                ? 0.65
                : 0.4;
    }

    if (
        fighter.heroId === "duch" ||
        fighter.isSummon
    ) {
        ctx.globalAlpha *= 0.78;
    }

    ctx.beginPath();

    ctx.arc(
        screenX,
        screenY,
        fighter.radius + 7,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = fighter.color;
    ctx.fill();

    ctx.strokeStyle =
        fighter.isPlayer
            ? "white"
            : fighter.isSummon
                ? "#c9f6ff"
                : "#111827";

    ctx.lineWidth =
        fighter.isPlayer
            ? 5
            : 3;

    ctx.stroke();

    if (
        fighter.lowHpShield &&
        fighter.hp <=
            fighter.maxHp *
            fighter.shieldThreshold
    ) {
        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            fighter.radius + 13,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle = "#63d8ff";
        ctx.lineWidth = 5;
        ctx.stroke();
    }

    if (
        fighter.cursedUntil >
        performance.now()
    ) {
        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            fighter.radius + 17,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle = "#b14cff";
        ctx.lineWidth = 4;
        ctx.stroke();
    }

    ctx.font =
        fighter.isSummon
            ? "31px Arial"
            : "43px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        fighter.icon,
        screenX,
        screenY
    );

    ctx.font =
        fighter.isSummon
            ? "bold 10px Arial"
            : "bold 13px Arial";

    ctx.strokeStyle = "black";
    ctx.lineWidth = 4;

    ctx.strokeText(
        fighter.name,
        screenX,
        screenY +
        fighter.radius +
        21
    );

    ctx.fillStyle = "white";

    ctx.fillText(
        fighter.name,
        screenX,
        screenY +
        fighter.radius +
        21
    );

    drawHealthBar(
        fighter,
        screenX,
        screenY
    );

    ctx.restore();
}

function drawProjectiles() {
    projectiles.forEach(function(projectile) {
        const screenX = worldToScreenX(
            projectile.x
        );

        const screenY = worldToScreenY(
            projectile.y
        );

        if (
            screenX < -50 ||
            screenY < -50 ||
            screenX > canvas.width + 50 ||
            screenY > canvas.height + 50
        ) {
            return;
        }

        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            projectile.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = projectile.color;
        ctx.fill();

        if (
            projectile.owner.heroId ===
            "wiedzma"
        ) {
            ctx.strokeStyle = "#9a7415";
            ctx.lineWidth = 1;
        } else {
            ctx.strokeStyle = "#111827";
            ctx.lineWidth = 2;
        }

        ctx.stroke();
    });
}

function drawEffects() {
    const now = performance.now();

    effects.forEach(function(effect) {
        const progress = Math.min(
            1,
            (now - effect.born) /
            effect.life
        );

        const alpha = Math.max(
            0,
            1 - progress
        );

        const screenX = worldToScreenX(effect.x);
        const screenY = worldToScreenY(effect.y);

        ctx.save();
        ctx.globalAlpha = alpha;

        if (effect.type === "circle") {
            ctx.beginPath();

            ctx.arc(
                screenX,
                screenY,
                effect.radius,
                0,
                Math.PI * 2
            );

            ctx.strokeStyle = effect.color;
            ctx.lineWidth = effect.lineWidth;
            ctx.stroke();
        }

        if (effect.type === "text") {
            ctx.font = "bold 19px Arial";
            ctx.textAlign = "center";
            ctx.fillStyle = effect.color;
            ctx.strokeStyle = "black";
            ctx.lineWidth = 4;

            const y =
                screenY -
                progress * 35;

            ctx.strokeText(
                effect.text,
                screenX,
                y
            );

            ctx.fillText(
                effect.text,
                screenX,
                y
            );
        }

        ctx.restore();
    });
}

function drawMiniMap() {
    const width = 155;
    const height = 155;

    const x =
        canvas.width -
        width -
        16;

    const y = 16;

    ctx.fillStyle = "#111827dd";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.fillStyle = selectedMap.ground;

    ctx.fillRect(
        x + 5,
        y + 5,
        width - 10,
        height - 10
    );

    walls.forEach(function(wall) {
        ctx.fillStyle = selectedMap.wall;

        ctx.fillRect(
            x + 5 +
            wall.x /
            WORLD_WIDTH *
            (width - 10),

            y + 5 +
            wall.y /
            WORLD_HEIGHT *
            (height - 10),

            Math.max(
                2,
                wall.w /
                WORLD_WIDTH *
                (width - 10)
            ),

            Math.max(
                2,
                wall.h /
                WORLD_HEIGHT *
                (height - 10)
            )
        );
    });

    waterPools.forEach(function(water) {
        ctx.fillStyle = selectedMap.water;

        ctx.fillRect(
            x + 5 +
            water.x /
            WORLD_WIDTH *
            (width - 10),

            y + 5 +
            water.y /
            WORLD_HEIGHT *
            (height - 10),

            Math.max(
                2,
                water.w /
                WORLD_WIDTH *
                (width - 10)
            ),

            Math.max(
                2,
                water.h /
                WORLD_HEIGHT *
                (height - 10)
            )
        );
    });

    fighters.forEach(function(fighter) {
        if (!fighter.alive) {
            return;
        }

        const dotX =
            x + 5 +
            fighter.x /
            WORLD_WIDTH *
            (width - 10);

        const dotY =
            y + 5 +
            fighter.y /
            WORLD_HEIGHT *
            (height - 10);

        ctx.beginPath();

        ctx.arc(
            dotX,
            dotY,
            fighter.isPlayer
                ? 5
                : fighter.isSummon
                    ? 2
                    : 3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            fighter.isPlayer
                ? "#36a9ff"
                : fighter.isSummon
                    ? "#8ceaff"
                    : "#ef4d4d";

        ctx.fill();
    });

    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );
}

function drawCrosshair() {
    if (
        !player ||
        !player.alive ||
        matchFinished
    ) {
        return;
    }

    ctx.beginPath();

    ctx.arc(
        mouse.x,
        mouse.y,
        13,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "#ffffffcc";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        mouse.x - 19,
        mouse.y
    );

    ctx.lineTo(
        mouse.x + 19,
        mouse.y
    );

    ctx.moveTo(
        mouse.x,
        mouse.y - 19
    );

    ctx.lineTo(
        mouse.x,
        mouse.y + 19
    );

    ctx.stroke();
}

function draw() {
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMap();
    drawWater();
    drawBushes();
    drawWalls();

    fighters.forEach(drawFighter);

    drawProjectiles();
    drawEffects();
    drawMiniMap();
    drawCrosshair();
}

function gameLoop() {
    update();
    draw();

    requestAnimationFrame(gameLoop);
}

startGame();
gameLoop();
</script>
