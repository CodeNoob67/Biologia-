function restartGame() {
    location.reload();
}

function prepareGame() {
    const mapId =
        localStorage.getItem(
            "selectedMap"
        ) || "green";

    selectedMap =
        MAPS[mapId] ||
        MAPS.green;

    document
        .getElementById(
            "mapName"
        )
        .textContent =
        selectedMap.name;

    document
        .getElementById(
            "loadingMapName"
        )
        .textContent =
        selectedMap.name;

    const state =
        getState();

    let selectedHero =
        getHero(
            state.selected
        );

    if (!selectedHero) {
        selectedHero =
            BOHATEROWIE[0];
    }

    fighters = [];
    projectiles = [];
    electricWaves = [];
    effects = [];

    winner = null;

    matchFinished = false;
    trophiesAwarded = false;

    summonNumber = 0;

    mouse.down = false;

    const shuffledSpawns =
        shuffleArray(
            spawnPoints
        );

    const playerSpawn =
        getSafeSpawn(
            shuffledSpawns[0]
        );

    player =
        createFighter(
            selectedHero,
            playerSpawn.x,
            playerSpawn.y,
            true,
            0
        );

    fighters.push(
        player
    );

    for (
        let i = 1;
        i < TOTAL_PLAYERS;
        i++
    ) {
        const randomHero =
            randomItem(
                BOHATEROWIE
            );

        const spawn =
            getSafeSpawn(
                shuffledSpawns[i]
            );

        fighters.push(
            createFighter(
                randomHero,
                spawn.x,
                spawn.y,
                false,
                i
            )
        );
    }

    playerCameraTarget = {
        x:
            clamp(
                player.x -
                CAMERA_WIDTH / 2,

                0,

                WORLD_WIDTH -
                CAMERA_WIDTH
            ),

        y:
            clamp(
                player.y -
                CAMERA_HEIGHT / 2,

                0,

                WORLD_HEIGHT -
                CAMERA_HEIGHT
            )
    };

    camera.x =
        clamp(
            player.x -
            CAMERA_WIDTH / 2,

            0,

            WORLD_WIDTH -
            CAMERA_WIDTH
        );

    camera.y = 0;

    updateBushStatus();
    updateInformation();

    startLoading();
}

function startLoading() {
    gamePhase =
        "loading";

    const loadingFill =
        document.getElementById(
            "loadingFill"
        );

    const loadingPercent =
        document.getElementById(
            "loadingPercent"
        );

    let progress = 0;

    const loadingInterval =
        setInterval(
            function() {
                progress +=
                    randomNumber(
                        4,
                        12
                    );

                progress =
                    Math.min(
                        100,
                        progress
                    );

                loadingFill.style.width =
                    progress + "%";

                loadingPercent.textContent =
                    Math.floor(
                        progress
                    ) + "%";

                if (
                    progress >= 100
                ) {
                    clearInterval(
                        loadingInterval
                    );

                    setTimeout(
                        startIntro,
                        350
                    );
                }
            },
            110
        );
}

function startIntro() {
    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );

    const introCover =
        document.getElementById(
            "introCover"
        );

    loadingScreen.classList.add(
        "hidden"
    );

    introCover.classList.add(
        "visible"
    );

    gamePhase =
        "intro";

    introStartTime =
        performance.now();

    setTimeout(
        function() {
            loadingScreen.style.display =
                "none";
        },
        550
    );
}

function updateIntro(
    currentTime
) {
    const duration = 2600;

    const elapsed =
        currentTime -
        introStartTime;

    const rawProgress =
        Math.min(
            1,
            elapsed /
            duration
        );

    const progress =
        easeInOut(
            rawProgress
        );

    const startingX =
        clamp(
            player.x -
            CAMERA_WIDTH / 2,

            0,

            WORLD_WIDTH -
            CAMERA_WIDTH
        );

    const startingY = 0;

    camera.x =
        startingX +
        (
            playerCameraTarget.x -
            startingX
        ) *
        progress;

    camera.y =
        startingY +
        (
            playerCameraTarget.y -
            startingY
        ) *
        progress;

    const introCover =
        document.getElementById(
            "introCover"
        );

    introCover.style.opacity =
        String(
            0.85 -
            progress *
            0.85
        );

    if (
        rawProgress >= 1
    ) {
        introCover.classList.remove(
            "visible"
        );

        introCover.style.opacity =
            "";

        showBattleText();
    }
}

function showBattleText() {
    gamePhase =
        "battle-text";

    const battleText =
        document.getElementById(
            "battleText"
        );

    battleText.classList.add(
        "visible"
    );

    setTimeout(
        function() {
            battleText.classList.remove(
                "visible"
            );

            gamePhase =
                "playing";
        },
        1100
    );
}

function updateInformation() {
    const alive =
        getAliveContestants()
            .length;

    document
        .getElementById(
            "aliveCounter"
        )
        .textContent =
        "Pozostało: " +
        alive;

    if (!player) {
        return;
    }

    let extra = "";

    if (player.hidden) {
        extra +=
            " | 🌿 UKRYTY";
    }

    if (
        player.stunnedUntil >
        performance.now()
    ) {
        extra +=
            " | ⚡ ZATRZYMANY";
    }

    if (
        player.lowHpShield &&
        player.hp <=
        player.maxHp *
        player.shieldThreshold
    ) {
        extra +=
            " | 🛡️ TARCZA";
    }

    if (
        player.cursedUntil >
        performance.now()
    ) {
        extra +=
            " | 🔮 KLĄTWA";
    }

    if (
        player.canPassWalls
    ) {
        extra +=
            " | 🧱 PRZENIKANIE";
    }

    if (
        player.summonsGhosts
    ) {
        const summons =
            fighters.filter(
                function(fighter) {
                    return (
                        fighter.alive &&
                        fighter.isSummon &&
                        fighter.summoner ===
                        player
                    );
                }
            ).length;

        extra +=
            " | 👻 " +
            summons +
            "/" +
            player.maximumSummons;
    }

    if (player.vampire) {
        if (
            player.transformed
        ) {
            extra +=
                " | 🦇 NIETOPERZE";
        } else {
            const remaining =
                Math.max(
                    0,

                    player
                        .transformationCooldown -
                    (
                        performance.now() -
                        player
                            .lastTransformation
                    )
                );

            extra +=
                " | 🦇 " +
                (
                    remaining <= 0
                        ? "GOTOWE"
                        : (
                            remaining /
                            1000
                        ).toFixed(1) +
                          "s"
                );
        }
    }

    document
        .getElementById(
            "playerInfo"
        )
        .textContent =
        player.icon +
        " " +
        player.heroName +
        " | ❤️ " +
        Math.max(
            0,
            Math.ceil(
                player.hp
            )
        ) +
        extra;
}

function updateCamera() {
    if (
        !player ||
        gamePhase === "intro"
    ) {
        return;
    }

    camera.x =
        clamp(
            player.x -
            CAMERA_WIDTH / 2,

            0,

            WORLD_WIDTH -
            CAMERA_WIDTH
        );

    camera.y =
        clamp(
            player.y -
            CAMERA_HEIGHT / 2,

            0,

            WORLD_HEIGHT -
            CAMERA_HEIGHT
        );
}

function moveFighter(
    fighter,
    dx,
    dy
) {
    if (
        fighter.stunnedUntil >
        performance.now()
    ) {
        return;
    }

    const passesObstacles =
        fighter.canPassWalls ||
        fighter.transformed;

    const nextX =
        clamp(
            fighter.x + dx,

            fighter.radius,

            WORLD_WIDTH -
            fighter.radius
        );

    if (
        passesObstacles ||
        !isBlocked(
            nextX,
            fighter.y,
            fighter.radius
        )
    ) {
        fighter.x =
            nextX;
    }

    const nextY =
        clamp(
            fighter.y + dy,

            fighter.radius,

            WORLD_HEIGHT -
            fighter.radius
        );

    if (
        passesObstacles ||
        !isBlocked(
            fighter.x,
            nextY,
            fighter.radius
        )
    ) {
        fighter.y =
            nextY;
    }
}

function pointInsideRectangle(
    x,
    y,
    rectangle
) {
    return (
        x >= rectangle.x &&
        x <=
        rectangle.x +
        rectangle.w &&
        y >= rectangle.y &&
        y <=
        rectangle.y +
        rectangle.h
    );
}

function updateBushStatus() {
    fighters.forEach(
        function(fighter) {
            fighter.hidden =
                fighter.alive &&
                !fighter.transformed &&
                bushes.some(
                    function(bush) {
                        return pointInsideRectangle(
                            fighter.x,
                            fighter.y,
                            bush
                        );
                    }
                );
        }
    );
}

function canSeeFighter(
    observer,
    target
) {
    if (!target.hidden) {
        return true;
    }

    return (
        distance(
            observer,
            target
        ) < 170
    );
}

function isEnemy(
    observer,
    target
) {
    if (
        !target.alive ||
        target === observer
    ) {
        return false;
    }

    if (
        observer.isSummon &&
        target ===
        observer.summoner
    ) {
        return false;
    }

    if (
        target.isSummon &&
        target.summoner ===
        observer
    ) {
        return false;
    }

    if (
        observer.isSummon &&
        target.isSummon &&
        observer.summoner ===
        target.summoner
    ) {
        return false;
    }

    return true;
}

function movePlayer() {
    if (
        gamePhase !== "playing" ||
        !player ||
        !player.alive ||
        matchFinished
    ) {
        return;
    }

    if (
        player.stunnedUntil >
        performance.now()
    ) {
        return;
    }

    let dx = 0;
    let dy = 0;

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {
        dy -= 1;
    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {
        dy += 1;
    }

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        dx -= 1;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        dx += 1;
    }

    if (
        dx !== 0 ||
        dy !== 0
    ) {
        const direction =
            normalize(
                dx,
                dy
            );

        moveFighter(
            player,

            direction.x *
            player.speed,

            direction.y *
            player.speed
        );
    }

    if (mouse.down) {
        attackTowards(
            player,

            mouse.x +
            camera.x,

            mouse.y +
            camera.y
        );
    }
}

function getPossibleTargets(
    fighter
) {
    return fighters.filter(
        function(other) {
            return (
                isEnemy(
                    fighter,
                    other
                ) &&
                canSeeFighter(
                    fighter,
                    other
                )
            );
        }
    );
}

function getNearestTarget(
    fighter
) {
    const targets =
        getPossibleTargets(
            fighter
        );

    if (
        targets.length === 0
    ) {
        return null;
    }

    targets.sort(
        function(first, second) {
            return (
                distance(
                    fighter,
                    first
                ) -
                distance(
                    fighter,
                    second
                )
            );
        }
    );

    return targets[0];
}

function chooseBotDecision(
    bot
) {
    const targets =
        getPossibleTargets(
            bot
        );

    if (
        targets.length === 0
    ) {
        bot.target = null;
        bot.behavior =
            "wander";
    } else {
        bot.target =
            randomItem(
                targets
            );

        const roll =
            Math.random();

        if (
            bot.hp <
            bot.maxHp *
            0.3
        ) {
            bot.behavior =
                Math.random() <
                0.72
                    ? "flee"
                    : "attack";
        } else if (
            roll < 0.62
        ) {
            bot.behavior =
                "attack";
        } else if (
            roll < 0.84
        ) {
            bot.behavior =
                "wander";
        } else {
            bot.behavior =
                "flee";
        }
    }

    bot.directionX =
        randomNumber(
            -1,
            1
        );

    bot.directionY =
        randomNumber(
            -1,
            1
        );

    bot.nextDecision =
        performance.now() +
        randomNumber(
            700,
            2200
        );
}

function updateBot(
    bot,
    currentTime
) {
    if (
        gamePhase !== "playing" ||
        !bot.alive ||
        matchFinished ||
        bot.isSummon
    ) {
        return;
    }

    if (
        bot.stunnedUntil >
        currentTime
    ) {
        return;
    }

    if (
        currentTime >=
        bot.nextDecision ||
        !bot.target ||
        !bot.target.alive ||
        !isEnemy(
            bot,
            bot.target
        ) ||
        !canSeeFighter(
            bot,
            bot.target
        )
    ) {
        chooseBotDecision(
            bot
        );
    }

    if (
        bot.vampire &&
        bot.target &&
        !bot.transformed &&
        currentTime -
        bot.lastTransformation >=
        bot.transformationCooldown
    ) {
        startVampireTransformation(
            bot,
            bot.target.x,
            bot.target.y
        );
    }

    if (
        bot.behavior ===
        "wander"
    ) {
        const direction =
            normalize(
                bot.directionX,
                bot.directionY
            );

        moveFighter(
            bot,

            direction.x *
            bot.speed *
            0.58,

            direction.y *
            bot.speed *
            0.58
        );

        if (
            Math.random() <
            0.015
        ) {
            bot.directionX =
                randomNumber(
                    -1,
                    1
                );

            bot.directionY =
                randomNumber(
                    -1,
                    1
                );
        }

        return;
    }

    if (!bot.target) {
        return;
    }

    const direction =
        normalize(
            bot.target.x -
            bot.x,

            bot.target.y -
            bot.y
        );

    const targetDistance =
        distance(
            bot,
            bot.target
        );

    if (
        bot.behavior ===
        "flee"
    ) {
        moveFighter(
            bot,

            -direction.x *
            bot.speed,

            -direction.y *
            bot.speed
        );

        if (
            !bot.vampire &&
            Math.random() <
            0.035
        ) {
            attackTowards(
                bot,
                bot.target.x,
                bot.target.y
            );
        }

        return;
    }

    if (bot.vampire) {
        if (
            bot.transformed
        ) {
            moveFighter(
                bot,

                direction.x *
                bot.speed,

                direction.y *
                bot.speed
            );
        }

        return;
    }

    const preferredDistance =
        bot.melee
            ? bot.range *
              0.7
            : Math.min(
                  bot.range *
                  0.58,

                  500
              );

    if (
        targetDistance >
        preferredDistance
    ) {
        moveFighter(
            bot,

            direction.x *
            bot.speed *
            0.78,

            direction.y *
            bot.speed *
            0.78
        );
    } else if (
        !bot.melee
    ) {
        moveFighter(
            bot,

            -direction.x *
            bot.speed *
            0.24,

            -direction.y *
            bot.speed *
            0.24
        );
    }

    attackTowards(
        bot,
        bot.target.x,
        bot.target.y
    );
}

function updateSummon(
    summon
) {
    if (
        gamePhase !== "playing" ||
        !summon.alive ||
        matchFinished
    ) {
        return;
    }

    if (
        !summon.summoner ||
        !summon.summoner.alive
    ) {
        summon.alive =
            false;

        return;
    }

    if (
        !summon.target ||
        !summon.target.alive ||
        !isEnemy(
            summon,
            summon.target
        )
    ) {
        summon.target =
            getNearestTarget(
                summon
            );
    }

    if (!summon.target) {
        return;
    }

    const direction =
        normalize(
            summon.target.x -
            summon.x,

            summon.target.y -
            summon.y
        );

    if (
        distance(
            summon,
            summon.target
        ) >
        summon.range *
        0.72
    ) {
        moveFighter(
            summon,

            direction.x *
            summon.speed,

            direction.y *
            summon.speed
        );
    }

    attackTowards(
        summon,
        summon.target.x,
        summon.target.y
    );
}

function updatePriestSummons(
    currentTime
) {
    if (
        gamePhase !== "playing"
    ) {
        return;
    }

    fighters
        .slice()
        .forEach(
            function(fighter) {
                if (
                    !fighter.alive ||
                    fighter.isSummon ||
                    !fighter.summonsGhosts
                ) {
                    return;
                }

                const summons =
                    fighters.filter(
                        function(other) {
                            return (
                                other.alive &&
                                other.isSummon &&
                                other.summoner ===
                                fighter
                            );
                        }
                    );

                if (
                    summons.length >=
                    fighter.maximumSummons
                ) {
                    return;
                }

                if (
                    currentTime -
                    fighter.lastSummon <
                    fighter.summonCooldown
                ) {
                    return;
                }

                fighter.lastSummon =
                    currentTime;

                createSummonedGhost(
                    fighter
                );
            }
        );
}

function findTargetNearPoint(
    attacker,
    targetX,
    targetY
) {
    const targets =
        fighters.filter(
            function(fighter) {
                return (
                    isEnemy(
                        attacker,
                        fighter
                    ) &&
                    canSeeFighter(
                        attacker,
                        fighter
                    )
                );
            }
        );

    targets.sort(
        function(first, second) {
            return (
                Math.hypot(
                    first.x -
                    targetX,

                    first.y -
                    targetY
                ) -
                Math.hypot(
                    second.x -
                    targetX,

                    second.y -
                    targetY
                )
            );
        }
    );

    return (
        targets[0] ||
        null
    );
}

function attackTowards(
    attacker,
    targetX,
    targetY
) {
    if (
        gamePhase !== "playing" ||
        !attacker.alive ||
        matchFinished ||
        attacker.stunnedUntil >
        performance.now()
    ) {
        return;
    }

    if (attacker.vampire) {
        startVampireTransformation(
            attacker,
            targetX,
            targetY
        );

        return;
    }

    const currentTime =
        performance.now();

    if (
        currentTime -
        attacker.lastAttack <
        attacker.cooldown
    ) {
        return;
    }

    const direction =
        normalize(
            targetX -
            attacker.x,

            targetY -
            attacker.y
        );

    attacker.lastAttack =
        currentTime;

    attacker.hidden =
        false;

    attacker.attackCounter++;

    let attackDamage =
        attacker.damage;

    if (
        attacker.farmerThirdAttack &&
        attacker.attackCounter %
        3 === 0
    ) {
        attackDamage *=
            1.5;

        createTextEffect(
            attacker.x,
            attacker.y - 50,
            "WZMOCNIONY!",
            "#ffd93d"
        );
    }

    if (
        attacker.lowHpDamageBonus &&
        attacker.hp <
        attacker.maxHp *
        attacker.damageBonusThreshold
    ) {
        attackDamage *=
            attacker.damageBonusMultiplier;
    }

    attackDamage =
        Math.round(
            attackDamage
        );

    if (attacker.melee) {
        const target =
            findTargetNearPoint(
                attacker,
                targetX,
                targetY
            );

        if (
            target &&
            distance(
                attacker,
                target
            ) <=
            attacker.range
        ) {
            damageFighter(
                target,
                attackDamage,
                attacker
            );

            createMeleeEffect(
                attacker,
                direction
            );
        }

        return;
    }

    if (
        attacker.electricWave
    ) {
        createElectricWave(
            attacker,
            direction,
            attackDamage
        );

        return;
    }

    if (
        attacker.shockwaveEvery >
        0 &&
        attacker.attackCounter %
        attacker.shockwaveEvery ===
        0
    ) {
        createGolemShockwave(
            attacker
        );
    }

    if (
        attacker.tripleShot
    ) {
        createProjectile(
            attacker,
            direction,
            -0.14,
            attackDamage
        );

        createProjectile(
            attacker,
            direction,
            0,
            attackDamage
        );

        createProjectile(
            attacker,
            direction,
            0.14,
            attackDamage
        );

        return;
    }

    createProjectile(
        attacker,
        direction,
        0,
        attackDamage
    );
}

function startVampireTransformation(
    vampire,
    targetX,
    targetY
) {
    const currentTime =
        performance.now();

    if (
        vampire.transformed ||
        currentTime -
        vampire.lastTransformation <
        vampire.transformationCooldown
    ) {
        return;
    }

    vampire.transformed =
        true;

    vampire.lastTransformation =
        currentTime;

    vampire.transformationEnd =
        currentTime +
        vampire.transformationDuration;

    vampire.transformationHits =
        new Set();

    vampire.speed =
        vampire.normalSpeed *
        vampire.batSpeedMultiplier;

    vampire.hidden =
        false;

    vampire.batDirection =
        normalize(
            targetX -
            vampire.x,

            targetY -
            vampire.y
        );

    createTextEffect(
        vampire.x,
        vampire.y - 55,
        "NOCNY RÓJ!",
        "#ca8cff"
    );
}

function updateVampires(
    currentTime
) {
    if (
        gamePhase !== "playing"
    ) {
        return;
    }

    fighters.forEach(
        function(vampire) {
            if (
                !vampire.alive ||
                !vampire.vampire ||
                !vampire.transformed
            ) {
                return;
            }

            if (
                currentTime >=
                vampire.transformationEnd
            ) {
                vampire.transformed =
                    false;

                vampire.speed =
                    vampire.normalSpeed;

                vampire.transformationHits =
                    new Set();

                return;
            }

            if (
                !vampire.isPlayer &&
                vampire.target &&
                vampire.target.alive
            ) {
                vampire.batDirection =
                    normalize(
                        vampire.target.x -
                        vampire.x,

                        vampire.target.y -
                        vampire.y
                    );
            }

            if (
                !vampire.isPlayer &&
                vampire.batDirection
            ) {
                moveFighter(
                    vampire,

                    vampire.batDirection.x *
                    vampire.speed,

                    vampire.batDirection.y *
                    vampire.speed
                );
            }

            fighters.forEach(
                function(target) {
                    if (
                        !isEnemy(
                            vampire,
                            target
                        ) ||
                        vampire
                            .transformationHits
                            .has(
                                target.id
                            )
                    ) {
                        return;
                    }

                    if (
                        distance(
                            vampire,
                            target
                        ) <=
                        vampire.radius +
                        target.radius +
                        12
                    ) {
                        vampire
                            .transformationHits
                            .add(
                                target.id
                            );

                        damageFighter(
                            target,
                            vampire.damage,
                            vampire
                        );

                        const healing =
                            vampire.damage *
                            vampire.vampireHealing;

                        vampire.hp =
                            Math.min(
                                vampire.maxHp,

                                vampire.hp +
                                healing
                            );

                        createTextEffect(
                            vampire.x,
                            vampire.y - 42,
                            "+" +
                            Math.round(
                                healing
                            ),
                            "#6dff75"
                        );
                    }
                }
            );
        }
    );
}

function createElectricWave(
    attacker,
    direction,
    attackDamage
) {
    const ultra =
        attacker.ultraEvery >
        0 &&
        attacker.attackCounter %
        attacker.ultraEvery ===
        0;

    const speed =
        attacker.projectileSpeed *
        (
            ultra
                ? attacker
                      .ultraSpeedMultiplier
                : 1
        );

    electricWaves.push({
        x:
            attacker.x,

        y:
            attacker.y,

        directionX:
            direction.x,

        directionY:
            direction.y,

        speed:
            speed,

        damage:
            attackDamage,

        owner:
            attacker,

        born:
            performance.now(),

        life:
            attacker.projectileLife,

        traveled: 0,

        minimumWidth: 12,

        spread: 0.17,

        ultra:
            ultra,

        color:
            ultra
                ? "#ffd92f"
                : "#80eaff",

        stunDuration:
            ultra
                ? attacker
                      .ultraStunDuration
                : 0
    });

    if (ultra) {
        createTextEffect(
            attacker.x,
            attacker.y - 55,
            "ULTRA!",
            "#ffe747"
        );
    }
}

function createProjectile(
    attacker,
    direction,
    angle,
    attackDamage
) {
    const rotated =
        rotateDirection(
            direction,
            angle
        );

    let color =
        "#f9eda2";

    let speedMultiplier =
        1;

    let appliesCurse =
        false;

    if (
        attacker.heroId ===
        "farmer"
    ) {
        color =
            "#6b4327";
    }

    if (
        attacker.heroId ===
        "lucznik"
    ) {
        color =
            "#f3e6a2";

        if (
            attacker.fastThirdArrow &&
            attacker.attackCounter %
            3 === 0
        ) {
            speedMultiplier =
                attacker
                    .fastArrowMultiplier;

            color =
                "#ffffff";
        }
    }

    if (
        attacker.heroId ===
        "ksiadz"
    ) {
        color =
            "#e9f4ff";
    }

    if (
        attacker.heroId ===
        "golem"
    ) {
        color =
            "#8b7566";
    }

    if (
        attacker.heroId ===
        "czarodziej"
    ) {
        color =
            "#d851ff";

        if (
            attacker.curseEvery >
            0 &&
            attacker.attackCounter %
            attacker.curseEvery ===
            0
        ) {
            appliesCurse =
                true;

            color =
                "#741cff";
        }
    }

    if (
        attacker.heroId ===
        "krol"
    ) {
        color =
            "#ffd638";
    }

    if (
        attacker.heroId ===
        "wiedzma"
    ) {
        color =
            "#FFCC33";
    }

    projectiles.push({
        x:
            attacker.x +
            rotated.x *
            34,

        y:
            attacker.y +
            rotated.y *
            34,

        vx:
            rotated.x *
            attacker.projectileSpeed *
            speedMultiplier,

        vy:
            rotated.y *
            attacker.projectileSpeed *
            speedMultiplier,

        radius:
            attacker.projectileWidth,

        damage:
            attackDamage,

        owner:
            attacker,

        color:
            color,

        born:
            performance.now(),

        life:
            attacker.projectileLife,

        appliesCurse:
            appliesCurse,

        curseDuration:
            attacker.curseDuration,

        curseMultiplier:
            attacker.curseMultiplier
    });
}

function createMeleeEffect(
    attacker,
    direction
) {
    effects.push({
        type:
            "circle",

        x:
            attacker.x +
            direction.x *
            38,

        y:
            attacker.y +
            direction.y *
            38,

        radius: 25,

        maximumRadius:
            attacker.range,

        color:
            attacker.isSummon ||
            attacker.heroId ===
            "duch"
                ? "#bdefff"
                : "#ffffff",

        born:
            performance.now(),

        life: 180,

        lineWidth: 12
    });
}

function createGolemShockwave(
    attacker
) {
    fighters.forEach(
        function(target) {
            if (
                !isEnemy(
                    attacker,
                    target
                )
            ) {
                return;
            }

            if (
                distance(
                    attacker,
                    target
                ) <=
                attacker
                    .attackShockwaveRadius
            ) {
                damageFighter(
                    target,

                    attacker
                        .attackShockwaveDamage,

                    attacker
                );
            }
        }
    );

    effects.push({
        type:
            "circle",

        x:
            attacker.x,

        y:
            attacker.y,

        radius: 20,

        maximumRadius:
            attacker
                .attackShockwaveRadius,

        color:
            "#d3c0a0",

        born:
            performance.now(),

        life: 550,

        lineWidth: 18
    });
}

function createTextEffect(
    x,
    y,
    text,
    color
) {
    effects.push({
        type:
            "text",

        x: x,
        y: y,

        text: text,

        color:
            color,

        born:
            performance.now(),

        life: 700
    });
}

function removeSummonsOf(
    summoner
) {
    fighters.forEach(
        function(fighter) {
            if (
                fighter.alive &&
                fighter.isSummon &&
                fighter.summoner ===
                summoner
            ) {
                fighter.alive =
                    false;
            }
        }
    );
}

function damageFighter(
    target,
    damage,
    attacker
) {
    if (!target.alive) {
        return;
    }

    let finalDamage =
        Number(
            damage
        ) || 0;

    if (
        target.cursedUntil >
        performance.now()
    ) {
        finalDamage *=
            target
                .receivedDamageMultiplier;
    } else {
        target.receivedDamageMultiplier =
            1;
    }

    if (
        target.lowHpShield &&
        target.hp <=
        target.maxHp *
        target.shieldThreshold
    ) {
        finalDamage *=
            1 -
            target.shieldReduction;
    }

    finalDamage =
        Math.max(
            1,
            Math.round(
                finalDamage
            )
        );

    target.hp -=
        finalDamage;

    target.hidden =
        false;

    createTextEffect(
        target.x,
        target.y - 35,
        "-" +
        finalDamage,
        "#ff6464"
    );

    if (
        target.hp <= 0
    ) {
        target.hp = 0;
        target.alive =
            false;

        if (
            target.summonsGhosts
        ) {
            removeSummonsOf(
                target
            );
        }

        if (
            target === player
        ) {
            const aliveAfterDeath =
                getAliveContestants()
                    .length;

            awardTrophies(
                aliveAfterDeath +
                1
            );

            showDeathScreen(
                false
            );
        }
    }

    checkWinner();
    updateInformation();
}

function projectileHitsObstacle(
    projectile
) {
    return (
        collidesWithWall(
            projectile.x,
            projectile.y,
            projectile.radius
        ) ||
        collidesWithWater(
            projectile.x,
            projectile.y,
            projectile.radius
        )
    );
}

function updateProjectiles(
    currentTime
) {
    if (
        gamePhase !== "playing"
    ) {
        return;
    }

    for (
        let i =
            projectiles.length -
            1;

        i >= 0;

        i--
    ) {
        const projectile =
            projectiles[i];

        projectile.x +=
            projectile.vx;

        projectile.y +=
            projectile.vy;

        let remove =
            false;

        if (
            currentTime -
            projectile.born >
            projectile.life
        ) {
            remove =
                true;
        }

        if (
            projectile.x < 0 ||
            projectile.y < 0 ||
            projectile.x >
            WORLD_WIDTH ||
            projectile.y >
            WORLD_HEIGHT
        ) {
            remove =
                true;
        }

        if (
            !remove &&
            projectileHitsObstacle(
                projectile
            )
        ) {
            remove =
                true;
        }

        if (!remove) {
            for (
                const fighter
                of fighters
            ) {
                if (
                    !isEnemy(
                        projectile.owner,
                        fighter
                    )
                ) {
                    continue;
                }

                const hit =
                    Math.hypot(
                        projectile.x -
                        fighter.x,

                        projectile.y -
                        fighter.y
                    ) <
                    projectile.radius +
                    fighter.radius;

                if (!hit) {
                    continue;
                }

                damageFighter(
                    fighter,

                    projectile.damage,

                    projectile.owner
                );

                if (
                    projectile.appliesCurse
                ) {
                    fighter.cursedUntil =
                        performance.now() +
                        projectile.curseDuration;

                    fighter.receivedDamageMultiplier =
                        projectile.curseMultiplier;

                    createTextEffect(
                        fighter.x,
                        fighter.y - 60,
                        "KLĄTWA!",
                        "#b662ff"
                    );
                }

                remove =
                    true;

                break;
            }
        }

        if (remove) {
            projectiles.splice(
                i,
                1
            );
        }
    }
}

function updateElectricWaves(
    currentTime
) {
    if (
        gamePhase !== "playing"
    ) {
        return;
    }

    for (
        let i =
            electricWaves.length -
            1;

        i >= 0;

        i--
    ) {
        const wave =
            electricWaves[i];

        wave.x +=
            wave.directionX *
            wave.speed;

        wave.y +=
            wave.directionY *
            wave.speed;

        wave.traveled +=
            wave.speed;

        const width =
            wave.minimumWidth +
            wave.traveled *
            wave.spread;

        let remove =
            false;

        if (
            currentTime -
            wave.born >
            wave.life
        ) {
            remove =
                true;
        }

        if (
            wave.x < 0 ||
            wave.y < 0 ||
            wave.x >
            WORLD_WIDTH ||
            wave.y >
            WORLD_HEIGHT
        ) {
            remove =
                true;
        }

        if (
            !remove &&
            isBlocked(
                wave.x,
                wave.y,
                Math.min(
                    width,
                    55
                )
            )
        ) {
            remove =
                true;
        }

        if (!remove) {
            for (
                const fighter
                of fighters
            ) {
                if (
                    !isEnemy(
                        wave.owner,
                        fighter
                    )
                ) {
                    continue;
                }

                if (
                    Math.hypot(
                        wave.x -
                        fighter.x,

                        wave.y -
                        fighter.y
                    ) <=
                    width +
                    fighter.radius
                ) {
                    damageFighter(
                        fighter,
                        wave.damage,
                        wave.owner
                    );

                    if (
                        wave.ultra
                    ) {
                        fighter.stunnedUntil =
                            performance.now() +
                            wave.stunDuration;

                        createTextEffect(
                            fighter.x,
                            fighter.y - 60,
                            "ZATRZYMANY!",
                            "#ffe342"
                        );
                    }

                    remove =
                        true;

                    break;
                }
            }
        }

        if (remove) {
            electricWaves.splice(
                i,
                1
            );
        }
    }
}

function updateEffects(
    currentTime
) {
    for (
        let i =
            effects.length - 1;

        i >= 0;

        i--
    ) {
        const effect =
            effects[i];

        const progress =
            (
                currentTime -
                effect.born
            ) /
            effect.life;

        if (
            effect.type ===
            "circle"
        ) {
            effect.radius =
                20 +
                (
                    effect.maximumRadius -
                    20
                ) *
                Math.min(
                    1,
                    progress
                );
        }

        if (
            progress >= 1
        ) {
            effects.splice(
                i,
                1
            );
        }
    }
}

function awardTrophies(
    place
) {
    if (
        trophiesAwarded ||
        !player
    ) {
        return;
    }

    trophiesAwarded =
        true;

    const safePlace =
        Math.max(
            1,
            Math.min(
                10,
                Math.floor(
                    place
                )
            )
        );

    const reward =
        TROPHY_REWARDS[
            safePlace
        ] || 0;

    const state =
        getState();

    if (
        !state.heroTrophies ||
        typeof state.heroTrophies !==
        "object"
    ) {
        state.heroTrophies =
            {};
    }

    const before =
        Math.max(
            0,
            Number(
                state.heroTrophies[
                    player.heroId
                ]
            ) || 0
        );

    const after =
        Math.max(
            0,
            before +
            reward
        );

    const realChange =
        after -
        before;

    state.heroTrophies[
        player.heroId
    ] =
        after;

    saveState(
        state
    );

    const sign =
        realChange > 0
            ? "+"
            : "";

    document
        .getElementById(
            "matchResult"
        )
        .innerHTML =
        "Miejsce: <b>" +
        safePlace +
        "</b><br>" +
        "Zmiana pucharków: <b>" +
        sign +
        realChange +
        "</b><br>" +
        player.heroName +
        " ma teraz: <b>🏆 " +
        after +
        "</b>";
}

function checkWinner() {
    const alive =
        getAliveContestants();

    if (
        alive.length !== 1 ||
        matchFinished
    ) {
        return;
    }

    winner =
        alive[0];

    matchFinished =
        true;

    if (
        winner === player
    ) {
        awardTrophies(
            1
        );

        const state =
            getState();

        state.tickets =
            (
                Number(
                    state.tickets
                ) || 0
            ) +
            4;

        state.coins =
            (
                Number(
                    state.coins
                ) || 0
            ) +
            50;

        state.wins =
            (
                Number(
                    state.wins
                ) || 0
            ) +
            1;

        saveState(
            state
        );

        showDeathScreen(
            true
        );
    } else if (
        !player.alive
    ) {
        showDeathScreen(
            false
        );
    }
}

function showDeathScreen(
    playerWon
) {
    gamePhase =
        "finished";

    document
        .getElementById(
            "deathTitle"
        )
        .textContent =
        playerWon
            ? "ZWYCIĘSTWO!"
            : "POKONANY";

    document
        .getElementById(
            "deathScreen"
        )
        .classList.add(
            "visible"
        );
}

function update() {
    const currentTime =
        performance.now();

    if (
        gamePhase === "intro"
    ) {
        updateIntro(
            currentTime
        );

        updateEffects(
            currentTime
        );

        return;
    }

    if (
        gamePhase !== "playing" ||
        matchFinished
    ) {
        updateEffects(
            currentTime
        );

        return;
    }

    movePlayer();

    fighters
        .slice()
        .forEach(
            function(fighter) {
                if (
                    fighter.isSummon
                ) {
                    updateSummon(
                        fighter
                    );
                } else if (
                    !fighter.isPlayer
                ) {
                    updateBot(
                        fighter,
                        currentTime
                    );
                }
            }
        );

    updatePriestSummons(
        currentTime
    );

    updateVampires(
        currentTime
    );

    updateBushStatus();

    updateProjectiles(
        currentTime
    );

    updateElectricWaves(
        currentTime
    );

    updateEffects(
        currentTime
    );

    updateCamera();

    updateInformation();

    checkWinner();
}

function worldToScreenX(
    x
) {
    return (
        x -
        camera.x
    );
}

function worldToScreenY(
    y
) {
    return (
        y -
        camera.y
    );
}

function objectVisible(
    x,
    y,
    width,
    height
) {
    return (
        x + width >=
        camera.x &&
        x <=
        camera.x +
        canvas.width &&
        y + height >=
        camera.y &&
        y <=
        camera.y +
        canvas.height
    );
}

function drawMap() {
    ctx.fillStyle =
        selectedMap.ground;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const tileSize =
        80;

    const startColumn =
        Math.floor(
            camera.x /
            tileSize
        );

    const endColumn =
        Math.ceil(
            (
                camera.x +
                canvas.width
            ) /
            tileSize
        );

    const startRow =
        Math.floor(
            camera.y /
            tileSize
        );

    const endRow =
        Math.ceil(
            (
                camera.y +
                canvas.height
            ) /
            tileSize
        );

    for (
        let column =
            startColumn;

        column <=
        endColumn;

        column++
    ) {
        for (
            let row =
                startRow;

            row <=
            endRow;

            row++
        ) {
            if (
                (
                    column +
                    row
                ) %
                2 === 0
            ) {
                ctx.fillStyle =
                    selectedMap
                        .groundDark;

                ctx.fillRect(
                    column *
                    tileSize -
                    camera.x,

                    row *
                    tileSize -
                    camera.y,

                    tileSize,
                    tileSize
                );
            }
        }
    }
}

function drawWater() {
    waterPools.forEach(
        function(water) {
            if (
                !objectVisible(
                    water.x,
                    water.y,
                    water.w,
                    water.h
                )
            ) {
                return;
            }

            const x =
                worldToScreenX(
                    water.x
                );

            const y =
                worldToScreenY(
                    water.y
                );

            ctx.fillStyle =
                "#153e68";

            ctx.fillRect(
                x - 6,
                y - 6,
                water.w + 12,
                water.h + 12
            );

            ctx.fillStyle =
                selectedMap.water;

            ctx.fillRect(
                x,
                y,
                water.w,
                water.h
            );

            ctx.fillStyle =
                selectedMap
                    .waterLight;

            for (
                let waveX = 15;
                waveX <
                water.w;
                waveX += 45
            ) {
                ctx.fillRect(
                    x + waveX,
                    y + 17,
                    24,
                    5
                );
            }

            ctx.strokeStyle =
                "#0f3558";

            ctx.lineWidth =
                4;

            ctx.strokeRect(
                x,
                y,
                water.w,
                water.h
            );
        }
    );
}

function drawBushes() {
    bushes.forEach(
        function(bush) {
            if (
                !objectVisible(
                    bush.x,
                    bush.y,
                    bush.w,
                    bush.h
                )
            ) {
                return;
            }

            const x =
                worldToScreenX(
                    bush.x
                );

            const y =
                worldToScreenY(
                    bush.y
                );

            ctx.fillStyle =
                selectedMap.bush;

            ctx.fillRect(
                x,
                y,
                bush.w,
                bush.h
            );

            ctx.fillStyle =
                selectedMap
                    .bushLight;

            for (
                let leafX = 10;
                leafX <
                bush.w;
                leafX += 32
            ) {
                for (
                    let leafY = 10;
                    leafY <
                    bush.h;
                    leafY += 32
                ) {
                    ctx.beginPath();

                    ctx.arc(
                        x +
                        leafX +
                        Math.sin(
                            (
                                bush.x +
                                leafX
                            ) *
                            12.345
                        ) *
                        4,

                        y +
                        leafY +
                        Math.sin(
                            (
                                bush.y +
                                leafY
                            ) *
                            12.345
                        ) *
                        4,

                        15,
                        0,
                        Math.PI *
                        2
                    );

                    ctx.fill();
                }
            }

            ctx.strokeStyle =
                "#173b21";

            ctx.lineWidth =
                4;

            ctx.strokeRect(
                x,
                y,
                bush.w,
                bush.h
            );
        }
    );
}

function drawWalls() {
    walls.forEach(
        function(wall) {
            if (
                !objectVisible(
                    wall.x,
                    wall.y,
                    wall.w,
                    wall.h
                )
            ) {
                return;
            }

            const x =
                worldToScreenX(
                    wall.x
                );

            const y =
                worldToScreenY(
                    wall.y
                );

            ctx.fillStyle =
                "#00000044";

            ctx.fillRect(
                x + 9,
                y + 11,
                wall.w,
                wall.h
            );

            ctx.fillStyle =
                selectedMap.wall;

            ctx.fillRect(
                x,
                y,
                wall.w,
                wall.h
            );

            ctx.fillStyle =
                selectedMap
                    .wallTop;

            ctx.fillRect(
                x,
                y,
                wall.w,
                Math.min(
                    22,
                    wall.h
                )
            );

            ctx.strokeStyle =
                selectedMap
                    .brickLine;

            ctx.lineWidth =
                4;

            ctx.strokeRect(
                x,
                y,
                wall.w,
                wall.h
            );
        }
    );
}

function drawHealthBar(
    fighter,
    screenX,
    screenY
) {
    const width =
        fighter.isSummon
            ? 42
            : 62;

    const height =
        fighter.isSummon
            ? 6
            : 9;

    const x =
        screenX -
        width / 2;

    const y =
        screenY -
        fighter.radius -
        27;

    ctx.fillStyle =
        "#281b20";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.fillStyle =
        fighter.isPlayer
            ? "#42de63"
            : fighter.isSummon
                ? "#6fe6ff"
                : "#ef4d4d";

    ctx.fillRect(
        x,
        y,

        width *
        Math.max(
            0,
            fighter.hp /
            fighter.maxHp
        ),

        height
    );

    ctx.strokeStyle =
        "#111827";

    ctx.lineWidth =
        2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );
}

function drawBatSwarm(
    fighter,
    screenX,
    screenY
) {
    const time =
        performance.now() /
        120;

    ctx.font =
        "24px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    for (
        let i = 0;
        i < 6;
        i++
    ) {
        const angle =
            time +
            i *
            Math.PI *
            2 /
            6;

        const radius =
            23 +
            Math.sin(
                time *
                1.4 +
                i
            ) *
            7;

        ctx.fillText(
            "🦇",

            screenX +
            Math.cos(
                angle
            ) *
            radius,

            screenY +
            Math.sin(
                angle
            ) *
            radius
        );
    }
}

function drawFighter(
    fighter
) {
    if (!fighter.alive) {
        return;
    }

    const screenX =
        worldToScreenX(
            fighter.x
        );

    const screenY =
        worldToScreenY(
            fighter.y
        );

    if (
        screenX < -100 ||
        screenY < -100 ||
        screenX >
        canvas.width + 100 ||
        screenY >
        canvas.height + 100
    ) {
        return;
    }

    const visibleToPlayer =
        fighter === player ||
        !fighter.hidden ||
        (
            player.alive &&
            distance(
                player,
                fighter
            ) < 170
        );

    if (!visibleToPlayer) {
        return;
    }

    ctx.save();

    if (fighter.hidden) {
        ctx.globalAlpha =
            fighter === player
                ? 0.65
                : 0.4;
    }

    if (
        fighter.heroId ===
        "duch" ||
        fighter.isSummon
    ) {
        ctx.globalAlpha *=
            0.78;
    }

    if (
        fighter.transformed
    ) {
        drawBatSwarm(
            fighter,
            screenX,
            screenY
        );
    } else {
        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            fighter.radius +
            7,
            0,
            Math.PI *
            2
        );

        ctx.fillStyle =
            fighter.color;

        ctx.fill();

        ctx.strokeStyle =
            fighter.isPlayer
                ? "white"
                : fighter.isSummon
                    ? "#c9f6ff"
                    : "#111827";

        ctx.lineWidth =
            fighter.isPlayer
                ? 5
                : 3;

        ctx.stroke();

        ctx.font =
            fighter.isSummon
                ? "31px Arial"
                : "43px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            fighter.icon,
            screenX,
            screenY
        );
    }

    if (
        fighter.lowHpShield &&
        fighter.hp <=
        fighter.maxHp *
        fighter.shieldThreshold
    ) {
        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            fighter.radius +
            13,
            0,
            Math.PI *
            2
        );

        ctx.strokeStyle =
            "#63d8ff";

        ctx.lineWidth =
            5;

        ctx.stroke();
    }

    if (
        fighter.cursedUntil >
        performance.now()
    ) {
        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            fighter.radius +
            17,
            0,
            Math.PI *
            2
        );

        ctx.strokeStyle =
            "#b14cff";

        ctx.lineWidth =
            4;

        ctx.stroke();
    }

    if (
        fighter.stunnedUntil >
        performance.now()
    ) {
        ctx.font =
            "22px Arial";

        ctx.fillText(
            "⚡",
            screenX,
            screenY -
            50
        );
    }

    ctx.font =
        fighter.isSummon
            ? "bold 10px Arial"
            : "bold 13px Arial";

    ctx.textAlign =
        "center";

    ctx.strokeStyle =
        "black";

    ctx.lineWidth =
        4;

    ctx.strokeText(
        fighter.name,
        screenX,
        screenY +
        fighter.radius +
        21
    );

    ctx.fillStyle =
        "white";

    ctx.fillText(
        fighter.name,
        screenX,
        screenY +
        fighter.radius +
        21
    );

    drawHealthBar(
        fighter,
        screenX,
        screenY
    );

    ctx.restore();
}

function drawProjectiles() {
    projectiles.forEach(
        function(projectile) {
            const screenX =
                worldToScreenX(
                    projectile.x
                );

            const screenY =
                worldToScreenY(
                    projectile.y
                );

            if (
                screenX < -50 ||
                screenY < -50 ||
                screenX >
                canvas.width + 50 ||
                screenY >
                canvas.height + 50
            ) {
                return;
            }

            ctx.beginPath();

            ctx.arc(
                screenX,
                screenY,
                projectile.radius,
                0,
                Math.PI *
                2
            );

            ctx.fillStyle =
                projectile.color;

            ctx.fill();

            ctx.strokeStyle =
                projectile.owner
                    .heroId ===
                "wiedzma"
                    ? "#9a7415"
                    : "#111827";

            ctx.lineWidth =
                projectile.owner
                    .heroId ===
                "wiedzma"
                    ? 1
                    : 2;

            ctx.stroke();
        }
    );
}

function drawElectricWaves() {
    electricWaves.forEach(
        function(wave) {
            const screenX =
                worldToScreenX(
                    wave.x
                );

            const screenY =
                worldToScreenY(
                    wave.y
                );

            const angle =
                Math.atan2(
                    wave.directionY,
                    wave.directionX
                );

            const width =
                wave.minimumWidth +
                wave.traveled *
                wave.spread;

            ctx.save();

            ctx.translate(
                screenX,
                screenY
            );

            ctx.rotate(
                angle
            );

            ctx.strokeStyle =
                wave.color;

            ctx.lineWidth =
                wave.ultra
                    ? 8
                    : 6;

            ctx.shadowColor =
                wave.color;

            ctx.shadowBlur =
                wave.ultra
                    ? 18
                    : 10;

            const sizes = [
                width *
                0.45,

                width *
                0.72,

                width
            ];

            sizes.forEach(
                function(
                    size,
                    index
                ) {
                    ctx.beginPath();

                    ctx.arc(
                        -index *
                        13,

                        0,

                        Math.max(
                            8,
                            size
                        ),

                        -0.65,
                        0.65
                    );

                    ctx.stroke();
                }
            );

            ctx.restore();
        }
    );
}

function drawEffects() {
    const now =
        performance.now();

    effects.forEach(
        function(effect) {
            const progress =
                Math.min(
                    1,

                    (
                        now -
                        effect.born
                    ) /
                    effect.life
                );

            const alpha =
                Math.max(
                    0,
                    1 -
                    progress
                );

            const screenX =
                worldToScreenX(
                    effect.x
                );

            const screenY =
                worldToScreenY(
                    effect.y
                );

            ctx.save();

            ctx.globalAlpha =
                alpha;

            if (
                effect.type ===
                "circle"
            ) {
                ctx.beginPath();

                ctx.arc(
                    screenX,
                    screenY,
                    effect.radius,
                    0,
                    Math.PI *
                    2
                );

                ctx.strokeStyle =
                    effect.color;

                ctx.lineWidth =
                    effect.lineWidth;

                ctx.stroke();
            }

            if (
                effect.type ===
                "text"
            ) {
                ctx.font =
                    "bold 19px Arial";

                ctx.textAlign =
                    "center";

                ctx.fillStyle =
                    effect.color;

                ctx.strokeStyle =
                    "black";

                ctx.lineWidth =
                    4;

                const y =
                    screenY -
                    progress *
                    35;

                ctx.strokeText(
                    effect.text,
                    screenX,
                    y
                );

                ctx.fillText(
                    effect.text,
                    screenX,
                    y
                );
            }

            ctx.restore();
        }
    );
}

function drawMiniMap() {
    const width =
        190;

    const height =
        108;

    const x =
        canvas.width -
        width -
        16;

    const y =
        16;

    ctx.fillStyle =
        "#111827dd";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.fillStyle =
        selectedMap.ground;

    ctx.fillRect(
        x + 5,
        y + 5,
        width - 10,
        height - 10
    );

    walls.forEach(
        function(wall) {
            ctx.fillStyle =
                selectedMap.wall;

            ctx.fillRect(
                x + 5 +
                wall.x /
                WORLD_WIDTH *
                (width - 10),

                y + 5 +
                wall.y /
                WORLD_HEIGHT *
                (height - 10),

                Math.max(
                    1,

                    wall.w /
                    WORLD_WIDTH *
                    (width - 10)
                ),

                Math.max(
                    1,

                    wall.h /
                    WORLD_HEIGHT *
                    (height - 10)
                )
            );
        }
    );

    fighters.forEach(
        function(fighter) {
            if (!fighter.alive) {
                return;
            }

            const dotX =
                x + 5 +
                fighter.x /
                WORLD_WIDTH *
                (width - 10);

            const dotY =
                y + 5 +
                fighter.y /
                WORLD_HEIGHT *
                (height - 10);

            ctx.beginPath();

            ctx.arc(
                dotX,
                dotY,

                fighter.isPlayer
                    ? 5
                    : fighter.isSummon
                        ? 2
                        : 3,

                0,
                Math.PI *
                2
            );

            ctx.fillStyle =
                fighter.isPlayer
                    ? "#36a9ff"
                    : fighter.isSummon
                        ? "#8ceaff"
                        : "#ef4d4d";

            ctx.fill();
        }
    );

    ctx.strokeStyle =
        "white";

    ctx.lineWidth =
        2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );
}

function drawCrosshair() {
    if (
        gamePhase !== "playing" ||
        !player ||
        !player.alive ||
        matchFinished
    ) {
        return;
    }

    ctx.beginPath();

    ctx.arc(
        mouse.x,
        mouse.y,
        13,
        0,
        Math.PI *
        2
    );

    ctx.strokeStyle =
        "#ffffffcc";

    ctx.lineWidth =
        2;

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        mouse.x - 19,
        mouse.y
    );

    ctx.lineTo(
        mouse.x + 19,
        mouse.y
    );

    ctx.moveTo(
        mouse.x,
        mouse.y - 19
    );

    ctx.lineTo(
        mouse.x,
        mouse.y + 19
    );

    ctx.stroke();
}

function draw() {
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMap();
    drawWater();
    drawBushes();
    drawWalls();

    fighters.forEach(
        drawFighter
    );

    drawProjectiles();
    drawElectricWaves();
    drawEffects();
    drawMiniMap();
    drawCrosshair();
}

function gameLoop() {
    update();
    draw();

    requestAnimationFrame(
        gameLoop
    );
}

prepareGame();
gameLoop();
</script>
