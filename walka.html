<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bitwa Królestw</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            color: white;
            font-family: Arial, sans-serif;
            text-align: center;

            background:
                radial-gradient(
                    circle at top,
                    #34405a,
                    #101621
                );
        }

        button,
        a {
            font-family: inherit;
        }

        .topbar {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            padding: 10px 18px;

            background: #111827;

            border-bottom:
                4px solid #050912;
        }

        .logo {
            color: #ffd43b;
            font-size: 24px;
            font-weight: 1000;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        button,
        .back-button {
            padding: 10px 15px;

            color: white;
            font-weight: 1000;
            text-decoration: none;

            background: #35445e;

            border:
                3px solid #080d16;

            border-radius: 10px;

            cursor: pointer;
        }

        .restart-button {
            background: #d34242;
        }

        .game-info {
            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;

            padding: 7px;
        }

        .info-box {
            padding: 7px 13px;

            background: #26344b;

            border:
                3px solid #101722;

            border-radius: 10px;

            font-weight: 1000;
        }

        .game-container {
            position: relative;

            width:
                min(
                    96vw,
                    1300px
                );

            aspect-ratio: 12 / 7;

            max-height:
                calc(100vh - 150px);

            margin: 0 auto;
        }

        canvas {
            width: 100%;
            height: 100%;

            display: block;

            background: #58ad58;

            border:
                7px solid #111827;

            border-radius: 12px;

            box-shadow:
                0 15px 40px #00000099;

            cursor: crosshair;
        }

        .loading-screen {
            position: absolute;
            inset: 7px;
            z-index: 500;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background:
                radial-gradient(
                    circle,
                    #263b5b,
                    #080e18
                );

            border-radius: 5px;

            transition:
                opacity 0.45s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-icon {
            font-size: 80px;

            animation:
                swordMove 1.1s
                ease-in-out infinite;
        }

        @keyframes swordMove {
            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-8deg);
            }

            50% {
                transform:
                    translateY(-14px)
                    rotate(8deg);
            }
        }

        .loading-title {
            margin-top: 10px;

            color: #ffd43b;

            font-size:
                clamp(34px, 6vw, 65px);

            font-weight: 1000;

            text-shadow:
                5px 5px black;
        }

        .loading-map {
            margin-top: 8px;

            color: #73dcff;

            font-size: 22px;
            font-weight: 1000;
        }

        .loading-text {
            margin-top: 28px;

            font-size: 17px;
            font-weight: 1000;
        }

        .loading-bar {
            width:
                min(
                    540px,
                    85%
                );

            height: 38px;

            margin-top: 12px;

            overflow: hidden;

            background: #080d16;

            border:
                5px solid #00050b;

            border-radius: 12px;

            box-shadow:
                inset 0 0 12px black;
        }

        .loading-fill {
            width: 0;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #e36d18,
                    #ffb42b
                );
        }

        .loading-percent {
            margin-top: 10px;

            font-size: 19px;
            font-weight: 1000;
        }

        .intro-shade {
            position: absolute;
            inset: 7px;
            z-index: 300;

            display: none;

            pointer-events: none;

            background: #4a4d55;

            opacity: 0.88;

            border-radius: 5px;
        }

        .intro-shade.visible {
            display: block;
        }

        .battle-text {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 350;

            display: none;

            transform:
                translate(-50%, -50%);

            color: white;

            font-size:
                clamp(65px, 11vw, 145px);

            font-weight: 1000;

            text-shadow:
                6px 6px #111827,
                11px 11px #00000077;
        }

        .battle-text.visible {
            display: block;

            animation:
                battleAppear 1.15s
                ease forwards;
        }

        @keyframes battleAppear {
            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.25)
                    rotate(-10deg);
            }

            35% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.2)
                    rotate(3deg);
            }

            70% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(1.35);
            }
        }

        .death-screen {
            position: absolute;
            inset: 7px;
            z-index: 600;

            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 17px;

            padding: 25px;

            background: #000000c7;

            border-radius: 5px;
        }

        .death-screen.visible {
            display: flex;
        }

        .death-title {
            font-size:
                clamp(48px, 8vw, 90px);

            font-weight: 1000;

            text-shadow:
                5px 5px black;
        }

        .match-result {
            padding: 14px 24px;

            font-size: 20px;
            font-weight: 1000;
            line-height: 1.5;

            background: #111827e8;

            border:
                4px solid #050912;

            border-radius: 12px;
        }

        .return-button {
            min-width: 230px;

            padding: 18px 30px;

            color: #111827;

            font-size: 28px;
            font-weight: 1000;

            background:
                linear-gradient(
                    #ffd93d,
                    #f0a500
                );

            border:
                5px solid #111827;

            border-radius: 14px;

            box-shadow:
                0 7px 0 #00000077;
        }

        .screen-controls {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 25px;
            z-index: 200;

            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            pointer-events: none;
        }

        .movement-controls {
            position: relative;

            width: 180px;
            height: 150px;

            pointer-events: auto;
        }

        .movement-key {
            position: absolute;

            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            color: #111827;

            font-size: 26px;
            font-weight: 1000;

            background:
                linear-gradient(
                    #e5e7eb,
                    #9ca3af
                );

            border:
                4px solid #111827;

            border-radius: 7px;

            box-shadow:
                0 5px 0 #00000088;

            touch-action: none;
            user-select: none;
        }

        .movement-key.active {
            color: white;

            background:
                linear-gradient(
                    #555b66,
                    #252a33
                );

            transform:
                translateY(4px);

            box-shadow:
                0 1px 0 #00000088;
        }

        .key-w {
            left: 61px;
            top: 0;
        }

        .key-a {
            left: 0;
            top: 61px;
        }

        .key-s {
            left: 61px;
            top: 61px;
        }

        .key-d {
            left: 122px;
            top: 61px;
        }

        .attack-joystick {
            position: relative;

            width: 180px;
            height: 180px;

            pointer-events: auto;

            background:
                radial-gradient(
                    circle,
                    #32c4ff,
                    #0788c4
                );

            border:
                5px solid #07131d;

            border-radius: 50%;

            box-shadow:
                inset 0 0 22px #ffffff55,
                0 7px 0 #00000066;

            touch-action: none;
            user-select: none;
        }

        .attack-stick {
            position: absolute;
            left: 50%;
            top: 50%;

            width: 88px;
            height: 88px;

            transform:
                translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    #5864e8,
                    #303cae
                );

            border:
                5px solid #111827;

            border-radius: 50%;

            box-shadow:
                0 5px 0 #00000055;

            pointer-events: none;
        }

        .attack-joystick.active {
            filter: brightness(0.9);
        }

        .attack-joystick.active .attack-stick {
            filter: brightness(0.75);
        }

        .attack-label {
            position: absolute;
            left: 50%;
            bottom: -25px;

            transform:
                translateX(-50%);

            font-size: 13px;
            font-weight: 1000;

            text-shadow:
                2px 2px black;
        }

        @media (max-width: 800px) {
            .logo {
                font-size: 17px;
            }

            .topbar {
                padding: 8px;
            }

            .top-buttons button,
            .back-button {
                padding: 7px;

                font-size: 12px;
            }

            .info-box {
                font-size: 12px;
            }

            .screen-controls {
                left: 12px;
                right: 12px;
                bottom: 15px;
            }

            .movement-controls {
                width: 135px;
                height: 115px;
            }

            .movement-key {
                width: 44px;
                height: 44px;

                font-size: 19px;
            }

            .key-w {
                left: 46px;
            }

            .key-a {
                top: 46px;
            }

            .key-s {
                left: 46px;
                top: 46px;
            }

            .key-d {
                left: 92px;
                top: 46px;
            }

            .attack-joystick {
                width: 135px;
                height: 135px;
            }

            .attack-stick {
                width: 65px;
                height: 65px;
            }
        }
    </style>
</head>

function addRectangle(
    collection,
    x,
    y,
    width,
    height
) {
    collection.push({
        x: x,
        y: y,
        w: width,
        h: height
    });
}

function addSymmetricFour(
    collection,
    x,
    y,
    width,
    height
) {
    addRectangle(
        collection,
        x,
        y,
        width,
        height
    );

    addRectangle(
        collection,
        WORLD_WIDTH - x - width,
        y,
        width,
        height
    );

    addRectangle(
        collection,
        x,
        WORLD_HEIGHT - y - height,
        width,
        height
    );

    addRectangle(
        collection,
        WORLD_WIDTH - x - width,
        WORLD_HEIGHT - y - height,
        width,
        height
    );
}

        walls,
        0,
        WORLD_HEIGHT - border,
        WORLD_WIDTH,
        border

    addRectangle(
        walls,
        0,
        0,
        border,
        WORLD_HEIGHT

    addRectangle(
        walls,
        WORLD_WIDTH - border,
        0,
        border,
        WORLD_HEIGHT

        650,

        430,
        820,

        520,
        90

        900,
        1520,
        90,
        520

    addSymmetricFour(

        480,

    addRectangle(

        700,

    addRectangle(

function clamp(
    value,
    minimum,
    maximum
) {
    return Math.max(
        minimum,
        Math.min(
            maximum,
            value
        )
    );
}

function randomNumber(
    minimum,
    maximum
) {
    return (
        Math.random() *
        (
            maximum -
            minimum
        ) +
        minimum
    );
}

function randomItem(array) {
    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}

function shuffle(array) {
    const copy =
        array.slice();

    for (
        let index =
            copy.length - 1;

        index > 0;

        index--
    ) {
        const randomIndex =
            Math.floor(
                Math.random() *
                (index + 1)
            );

        const temporary =
            copy[index];

        copy[index] =
            copy[randomIndex];

        copy[randomIndex] =
            temporary;
    }

    return copy;
}

function normalize(
    x,
    y
) {
    const length =
        Math.hypot(
            x,
            y
        ) || 1;

    return {
        x:
            x / length,

        y:
            y / length
    };
}

function distance(
    first,
    second
) {
    return Math.hypot(
        first.x -
        second.x,

        first.y -
        second.y
    );
}

function rotateDirection(
    direction,
    angle
) {
    return {
        x:
            direction.x *
            Math.cos(angle) -
            direction.y *
            Math.sin(angle),

        y:
            direction.x *
            Math.sin(angle) +
            direction.y *
            Math.cos(angle)
    };
}

function easeInOut(
    progress
) {
    if (progress < 0.5) {
        return (
            2 *
            progress *
            progress
        );
    }

    return (
        1 -
        Math.pow(
            -2 *
            progress +
            2,
            2
        ) /
        2
    );
}

function rectangleCollision(
    x,
    y,
    radius,
    rectangle
) {
    const nearestX =
        Math.max(
            rectangle.x,
            Math.min(
                x,
                rectangle.x +
                rectangle.w
            )
        );

    const nearestY =
        Math.max(
            rectangle.y,
            Math.min(
                y,
                rectangle.y +
                rectangle.h
            )
        );

    const differenceX =
        x - nearestX;

    const differenceY =
        y - nearestY;

    return (
        differenceX *
        differenceX +
        differenceY *
        differenceY <
        radius *
        radius
    );
}

function collidesWithCollection(
    x,
    y,
    radius,
    collection
) {
    return collection.some(
        function(rectangle) {
            return rectangleCollision(
                x,
                y,
                radius,
                rectangle
            );
        }
    );
}

function collidesWithWall(
    x,
    y,
    radius
) {
    return collidesWithCollection(
        x,
        y,
        radius,
        walls
    );
}

function collidesWithWater(
    x,
    y,
    radius
) {
    return collidesWithCollection(
        x,
        y,
        radius,
        waterPools
    );
}

function collidesWithBush(
    x,
    y,
    radius
) {
    return collidesWithCollection(
        x,
        y,
        radius,
        bushes
    );
}

function isBlocked(
    x,
    y,
    radius
) {
    return (
        collidesWithWall(
            x,
            y,
            radius
        ) ||
        collidesWithWater(
            x,
            y,
            radius
        )
    );
}

function isSafeSpawn(
    x,
    y,
    radius = 40
) {
    if (
        x < radius + 110 ||
        y < radius + 110 ||
        x >
        WORLD_WIDTH -
        radius -
        110 ||
        y >
        WORLD_HEIGHT -
        radius -
        110
    ) {
        return false;
    }

    return (
        !collidesWithWall(
            x,
            y,
            radius
        ) &&
        !collidesWithWater(
            x,
            y,
            radius
        ) &&
        !collidesWithBush(
            x,
            y,
            radius
        )
    );
}

function getSafeSpawn(
    position
) {
    if (
        isSafeSpawn(
            position.x,
            position.y
        )
    ) {
        return {
            x:
                position.x,

            y:
                position.y
        };
    }

    for (
        let searchRadius = 50;

        searchRadius <= 850;

        searchRadius += 50
    ) {
        for (
            let angle = 0;

            angle <
            Math.PI * 2;

            angle += 0.22
        ) {
            const x =
                position.x +
                Math.cos(angle) *
                searchRadius;

            const y =
                position.y +
                Math.sin(angle) *
                searchRadius;

            if (
                isSafeSpawn(
                    x,
                    y
                )
            ) {
                return {
                    x: x,
                    y: y
                };
            }
        }
    }

    return {
        x: 2500,
        y: 2500
    };
}

function isEnemy(
    observer,
    target
) {
    if (
        observer === target ||
        !target.alive
    ) {
        return false;
    }

    if (
        observer.isSummon &&
        observer.summoner ===
        target
    ) {
        return false;
    }

    if (
        target.isSummon &&
        target.summoner ===
        observer
    ) {
        return false;
    }

    if (
        observer.isSummon &&
        target.isSummon &&
        observer.summoner ===
        target.summoner
    ) {
        return false;
    }

    return true;
}

function pointInsideRectangle(
    x,
    y,
    rectangle
) {
    return (
        x >= rectangle.x &&
        x <=
        rectangle.x +
        rectangle.w &&
        y >= rectangle.y &&
        y <=
        rectangle.y +
        rectangle.h
    );
}

function updateBushStatus() {
    fighters.forEach(
        function(fighter) {
            fighter.hidden =
                fighter.alive &&
                !fighter.transformed &&
                bushes.some(
                    function(bush) {
                        return pointInsideRectangle(
                            fighter.x,
                            fighter.y,
                            bush
                        );
                    }
                );
        }
    );
}

function canSee(
    observer,
    target
) {
    if (!target.hidden) {
        return true;
    }

    return (
        distance(
            observer,
            target
        ) < 170
    );
}

function getTargets(
    fighter
) {
    return fighters.filter(
        function(other) {
            return (
                isEnemy(
                    fighter,
                    other
                ) &&
                canSee(
                    fighter,
                    other
                )
            );
        }
    );
}

function getNearestTarget(
    fighter
) {
    const targets =
        getTargets(
            fighter
        );

    targets.sort(
        function(first, second) {
            return (
                distance(
                    fighter,
                    first
                ) -
                distance(
                    fighter,
                    second
                )
            );
        }
    );

    return (
        targets[0] ||
        null
    );
}

function updateIntro(
    currentTime
) {
    const duration = 2800;

    const progress =
        Math.min(
            1,
            (
                currentTime -
                introStartTime
            ) /
            duration
        );

    const eased =
        easeInOut(
            progress
        );

    camera.x =
        introStartCamera.x +
        (
            introTargetCamera.x -
            introStartCamera.x
        ) *
        eased;

    camera.y =
        introStartCamera.y +
        (
            introTargetCamera.y -
            introStartCamera.y
        ) *
        eased;

    const introShade =
        document.getElementById(
            "introShade"
        );

    introShade.style.opacity =
        String(
            0.88 -
            eased *
            0.88
        );

    if (progress >= 1) {
        introShade.classList.remove(
            "visible"

        introShade.style.opacity =

        showBattleText();

function moveFighter(
    fighter,
    movementX,
    movementY
) {
    if (
        fighter.stunnedUntil >
        performance.now()
    ) {
        return;
    }

    if (
        fighter.speedBoostUntil >
        0 &&
        fighter.speedBoostUntil <
        performance.now()
    ) {
        fighter.speed =
            fighter.normalSpeed;

        fighter.speedBoostUntil =
            0;
    }

    const passesWalls =
        fighter.canPassWalls ||
        fighter.transformed;

    const nextX =
        clamp(
            fighter.x +
            movementX,

            fighter.radius,

            WORLD_WIDTH -
            fighter.radius
        );

    if (
        passesWalls ||
        !isBlocked(
            nextX,
            fighter.y,
            fighter.radius
        )
    ) {
        fighter.x =
            nextX;
    }

    const nextY =
        clamp(
            fighter.y +
            movementY,

            fighter.radius,

            WORLD_HEIGHT -
            fighter.radius
        );

    if (
        passesWalls ||
        !isBlocked(
            fighter.x,
            nextY,
            fighter.radius
        )
    ) {
        fighter.y =
            nextY;
    }
}

function connectMovementButton(
    elementId,
    keyName
) {
    const button =
        document.getElementById(
            elementId
        );

    function press(
        event
    ) {
        event.preventDefault();

        keys[keyName] =
            true;

        updateMovementButtons();

        if (
            button.setPointerCapture &&
            event.pointerId !==
            undefined
        ) {
            button.setPointerCapture(
                event.pointerId
            );
        }
    }

    function release(
        event
    ) {
        if (event) {
            event.preventDefault();
        }

        keys[keyName] =
            false;

        updateMovementButtons();
    }

    button.addEventListener(
        "pointerdown",
        press
    );

    button.addEventListener(
        "pointerup",
        release
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "lostpointercapture",
        release
    );
}

    const centerY =
        rectangle.top +
        rectangle.height / 2;

    const differenceX =
        clientX -
        centerX;

    const differenceY =
        clientY -
        centerY;

    const distanceFromCenter =
        Math.hypot(
            differenceX,
            differenceY
        );

    const direction =
        normalize(
            differenceX,
            differenceY
        );

    const maximumDistance =
        rectangle.width *
        0.27;

    const stickDistance =
        Math.min(
            maximumDistance,
            distanceFromCenter
        );

    const stickX =
        direction.x *
        stickDistance;

    const stickY =
        direction.y *
        stickDistance;

    attackStick.style.transform =
        "translate(-50%, -50%) " +
        "translate(" +
        stickX +
        "px, " +
        stickY +
        "px)";

    joystickAttack.directionX =
        direction.x;

    joystickAttack.directionY =
        direction.y;

    joystickAttack.active =
        distanceFromCenter >
        8;

    attackJoystick.classList.toggle(
        "active",
        joystickAttack.active
    );
}

function resetAttackJoystick() {
    joystickAttack.active =
        false;

    joystickAttack.directionX =
        0;

    joystickAttack.directionY =
        0;

    attackStick.style.transform =
        "translate(-50%, -50%)";

    attackJoystick.classList.remove(
        "active"
    );
}

attackJoystick.addEventListener(
    "pointerdown",
    function(event) {
        event.preventDefault();

        attackJoystick.setPointerCapture(
            event.pointerId
        );

        updateAttackJoystick(
            event.clientX,
            event.clientY
        );
    }
);

attackJoystick.addEventListener(
    "pointermove",
    function(event) {
        if (
            !attackJoystick
                .hasPointerCapture(
                    event.pointerId
                )
        ) {
            return;
        }

        event.preventDefault();

        updateAttackJoystick(
            event.clientX,
            event.clientY
        );
    }
);

attackJoystick.addEventListener(
    "pointerup",
    function(event) {
        event.preventDefault();

        resetAttackJoystick();
    }
);

attackJoystick.addEventListener(
    "pointercancel",
    resetAttackJoystick
);

attackJoystick.addEventListener(
    "lostpointercapture",
    resetAttackJoystick
);

canvas.addEventListener(
    "mousemove",
    function(event) {
        const rectangle =
            canvas.getBoundingClientRect();

        mouse.x =
            (
                event.clientX -
                rectangle.left
            ) *
            canvas.width /
            rectangle.width;

        mouse.y =
            (
                event.clientY -
                rectangle.top
            ) *
            canvas.height /
            rectangle.height;
    }
);

canvas.addEventListener(
    "mousedown",
    function(event) {
        if (event.button === 0) {
            mouse.down =
                true;
        }
    }
);

window.addEventListener(
    "mouseup",
    function(event) {
        if (event.button === 0) {
            mouse.down =
                false;
        }
    }
);

canvas.addEventListener(
    "contextmenu",
    function(event) {
        event.preventDefault();
    }
);

function movePlayer() {
    if (
        phase !== "playing" ||
        !player ||
        !player.alive ||
        matchFinished
    ) {
        return;
    }

    let movementX = 0;
    let movementY = 0;

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {
        movementY -=
            1;
    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {
        movementY +=
            1;
    }

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        movementX -=
            1;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        movementX +=
            1;
    }

    player.moving =
        movementX !== 0 ||
        movementY !== 0;

    if (player.moving) {
        const direction =
            normalize(
                movementX,
                movementY
            );

        moveFighter(
            player,

            direction.x *
            player.speed,

            direction.y *
            player.speed
        );
    }

    if (mouse.down) {
        attackTowards(
            player,

            mouse.x +
            camera.x,

            mouse.y +
            camera.y
        );
    }

    if (
        joystickAttack.active
    ) {
        const attackDistance =
            Math.max(
                player.range,
                350
            );

        attackTowards(
            player,

            player.x +
            joystickAttack
                .directionX *
            attackDistance,

            player.y +
            joystickAttack
                .directionY *
            attackDistance
        );
    }
}

function chooseBotDecision(
    bot
) {
    const targets =
        getTargets(
            bot
        );

    if (
        targets.length === 0
    ) {
        bot.target =
            null;

        bot.behavior =
            "wander";
    } else {
        bot.target =
            randomItem(
                targets
            );

        const random =
            Math.random();

        if (
            bot.hp <
            bot.maxHp *
            0.3
        ) {
            bot.behavior =
                random < 0.7
                    ? "flee"
                    : "attack";
        } else {
            bot.behavior =
                random < 0.72
                    ? "attack"
                    : "wander";
        }
    }

    bot.directionX =
        randomNumber(
            -1,
            1
        );

    bot.directionY =
        randomNumber(
            -1,
            1
        );

    bot.nextDecision =
        performance.now() +
        randomNumber(
            650,
            1900
        );
}

function updateBot(
    bot,
    currentTime
) {
    if (
        phase !== "playing" ||
        !bot.alive ||
        bot.isSummon ||
        matchFinished
    ) {
        return;
    }

    if (
        currentTime >=
        bot.nextDecision ||
        !bot.target ||
        !bot.target.alive ||
        !isEnemy(
            bot,
            bot.target
        )
    ) {
        chooseBotDecision(
            bot
        );
    }

    if (
        bot.vampire &&
        bot.target &&
        !bot.transformed &&
        currentTime -
        bot.lastTransformation >=
        bot.transformationCooldown
    ) {
        startVampireTransformation(
            bot,
            bot.target.x,
            bot.target.y
        );
    }

    if (
        bot.behavior ===
        "wander"
    ) {
        const direction =
            normalize(
                bot.directionX,
                bot.directionY
            );

        bot.moving =
            true;

        moveFighter(
            bot,

            direction.x *
            bot.speed *
            0.65,

            direction.y *
            bot.speed *
            0.65
        );

        return;
    }

    if (!bot.target) {
        bot.moving =
            false;

        return;
    }

    const direction =
        normalize(
            bot.target.x -
            bot.x,

            bot.target.y -
            bot.y
        );

    const targetDistance =
        distance(
            bot,
            bot.target
        );

    if (
        bot.behavior ===
        "flee"
    ) {
        bot.moving =
            true;

        moveFighter(
            bot,

            -direction.x *
            bot.speed,

            -direction.y *
            bot.speed
        );

        return;
    }

    if (bot.vampire) {
        if (bot.transformed) {
            bot.moving =
                true;

            moveFighter(
                bot,

                direction.x *
                bot.speed,

                direction.y *
                bot.speed
            );
        }

        return;
    }

    const preferredDistance =
        bot.swordsman ||
        bot.melee
            ? bot.range *
              0.75
            : Math.min(
                  bot.range *
                  0.58,
                  520
              );

    if (
        targetDistance >
        preferredDistance
    ) {
        bot.moving =
            true;

        moveFighter(
            bot,

            direction.x *
            bot.speed *
            0.8,

            direction.y *
            bot.speed *
            0.8
        );
    } else {
        bot.moving =
            false;
    }

    if (!bot.swordsman) {
        attackTowards(
            bot,
            bot.target.x,
            bot.target.y
        );
    }
}

function findMeleeTarget(
    attacker,
    targetX,
    targetY
) {
    const targets =
        getTargets(
            attacker
        );

    targets.sort(
        function(first, second) {
            return (
                Math.hypot(
                    first.x -
                    targetX,

                    first.y -
                    targetY
                ) -
                Math.hypot(
                    second.x -
                    targetX,

                    second.y -
                    targetY
                )
            );
        }
    );

    return (
        targets[0] ||
        null
    );
}

function attackTowards(
    attacker,
    targetX,
    targetY
) {
    if (
        phase !== "playing" ||
        !attacker.alive ||
        matchFinished
    ) {
        return;
    }

    if (attacker.swordsman) {
        return;
    }

    if (attacker.vampire) {
        startVampireTransformation(
            attacker,
            targetX,
            targetY
        );

        return;
    }

    const currentTime =
        performance.now();

    if (
        currentTime -
        attacker.lastAttack <
        attacker.cooldown
    ) {
        return;
    }

    attacker.lastAttack =
        currentTime;

    attacker.attackCounter++;

    attacker.hidden =
        false;

    const direction =
        normalize(
            targetX -
            attacker.x,

            targetY -
            attacker.y
        );

    let damage =
        attacker.damage;

    if (
        attacker.farmerThirdAttack &&
        attacker.attackCounter %
        3 === 0
    ) {
        damage *=
            1.5;

        createTextEffect(
            attacker.x,
            attacker.y - 55,
            "WZMOCNIONY!",
            "#ffd93d"
        );
    }

    if (
        attacker.lowHpDamageBonus &&
        attacker.hp <
        attacker.maxHp *
        attacker.damageBonusThreshold
    ) {
        damage *=
            attacker
                .damageBonusMultiplier;
    }

    damage =
        Math.round(
            damage
        );

    if (attacker.alchemist) {
        createPotion(
            attacker,
            direction
        );

        return;
    }

    if (attacker.musicWave) {
        createMusicWave(
            attacker,
            direction,
            damage
        );

        return;
    }

    if (attacker.melee) {
        const target =
            findMeleeTarget(
                attacker,
                targetX,
                targetY
            );

        if (
            target &&
            distance(
                attacker,
                target
            ) <=
            attacker.range
        ) {
            damageFighter(
                target,
                damage,
                attacker
            );

            createCircleEffect(
                attacker.x +
                direction.x *
                35,

                attacker.y +
                direction.y *
                35,

                20,
                attacker.range,
                "#ffffff",
                180,
                10
            );
        }

        return;
    }

    if (
        attacker.shockwaveEvery >
        0 &&
        attacker.attackCounter %
        attacker.shockwaveEvery ===
        0
    ) {
        createGolemShockwave(
            attacker
        );
    }

    if (attacker.tripleShot) {
        createProjectile(
            attacker,
            direction,
            -0.14,
            damage
        );

        createProjectile(
            attacker,
            direction,
            0,
            damage
        );

        createProjectile(
            attacker,
            direction,
            0.14,
            damage
        );

        return;
    }

    createProjectile(
        attacker,
        direction,
        0,
        damage
    );
}

function createProjectile(
    attacker,
    direction,
    angle,
    damage
) {
    const rotated =
        rotateDirection(
            direction,
            angle
        );

    let color =
        "#f9eda2";

    let speedMultiplier =
        1;

    let curse =
        false;

    if (
        attacker.heroId ===
        "farmer"
    ) {
        color =
            "#6b4327";
    }

    if (
        attacker.heroId ===
        "lucznik"
    ) {
        color =
            "#f5ecb0";

        if (
            attacker.fastThirdArrow &&
            attacker.attackCounter %
            3 === 0
        ) {
            color =
                "#ffffff";

            speedMultiplier =
                attacker
                    .fastArrowMultiplier;
        }
    }

    if (
        attacker.heroId ===
        "ksiadz"
    ) {
        color =
            "#e9f4ff";
    }

    if (
        attacker.heroId ===
        "golem"
    ) {
        color =
            "#897567";
    }

    if (
        attacker.heroId ===
        "czarodziej"
    ) {
        color =
            "#d851ff";

        if (
            attacker.curseEvery >
            0 &&
            attacker.attackCounter %
            attacker.curseEvery ===
            0
        ) {
            color =
                "#721cff";

            curse =
                true;
        }
    }

    if (
        attacker.heroId ===
        "krol"
    ) {
        color =
            "#ffd638";
    }

    if (
        attacker.heroId ===
        "wiedzma"
    ) {
        color =
            "#FFCC33";
    }

    projectiles.push({
        x:
            attacker.x +
            rotated.x *
            35,

        y:
            attacker.y +
            rotated.y *
            35,

        vx:
            rotated.x *
            attacker.projectileSpeed *
            speedMultiplier,

        vy:
            rotated.y *
            attacker.projectileSpeed *
            speedMultiplier,

        radius:
            attacker.projectileWidth,

        damage:
            damage,

        owner:
            attacker,

        color:
            color,

        born:
            performance.now(),

        life:
            attacker.projectileLife,

        curse:
            curse,

        curseDuration:
            attacker.curseDuration,

        curseMultiplier:
            attacker.curseMultiplier
    });
}

function createMusicWave(
    attacker,
    direction,
    damage
) {
    const ultra =
        attacker.ultraEvery >
        0 &&
        attacker.attackCounter %
        attacker.ultraEvery ===
        0;

    waves.push({
        x:
            attacker.x,

        y:
            attacker.y,

        directionX:
            direction.x,

        directionY:
            direction.y,

        speed:
            attacker.projectileSpeed *
            (
                ultra
                    ? attacker
                          .ultraSpeedMultiplier
                    : 1
            ),

        damage:
            damage,

        owner:
            attacker,

        born:
            performance.now(),

        life:
            attacker.projectileLife,

        traveled: 0,

        minimumWidth: 12,

        spread: 0.18,

        ultra:
            ultra,

        color:
            ultra
                ? "#ffd92f"
                : "#80eaff",

        stunDuration:
            ultra
                ? attacker
                      .ultraStunDuration
                : 0
    });

    if (ultra) {
        createTextEffect(
            attacker.x,
            attacker.y - 55,
            "ULTRA!",
            "#ffe747"
        );
    }
}

function createPotion(
    attacker,
    direction
) {
    const potionTypes = [
        "damage",
        "heal",
        "stun",
        "speed"
    ];

    const type =
        randomItem(
            potionTypes
        );

    const colors = {
        damage: "#ff4040",
        heal: "#43ef68",
        stun: "#ffe34d",
        speed: "#53d8ff"
    };

    potionProjectiles.push({
        x:
            attacker.x +
            direction.x *
            35,

        y:
            attacker.y +
            direction.y *
            35,

        vx:
            direction.x *
            attacker.projectileSpeed,

        vy:
            direction.y *
            attacker.projectileSpeed,

        radius:
            attacker.projectileWidth,

        owner:
            attacker,

        type:
            type,

        color:
            colors[type],

        born:
            performance.now(),

        life:
            attacker.projectileLife
    });
}

function createGolemShockwave(
    attacker
) {
    fighters.forEach(
        function(target) {
            if (
                !isEnemy(
                    attacker,
                    target
                )
            ) {
                return;
            }

            if (
                distance(
                    attacker,
                    target
                ) <=
                attacker
                    .shockwaveRadius
            ) {
                damageFighter(
                    target,

                    attacker
                        .shockwaveDamage,

                    attacker
                );
            }
        }
    );

    createCircleEffect(
        attacker.x,
        attacker.y,
        20,
        attacker.shockwaveRadius,
        "#d3c0a0",
        550,
        18
    );
}

function updateSwordsmen(
    currentTime
) {
    fighters.forEach(
        function(swordsman) {
            if (
                !swordsman.alive ||
                !swordsman.swordsman ||
                !swordsman.moving
            ) {
                return;
            }

            if (
                currentTime -
                swordsman.lastSwordDamage <
                swordsman.cooldown
            ) {
                return;
            }

            const targets =
                getTargets(
                    swordsman
                );

            const target =
                targets.find(
                    function(other) {
                        return (
                            distance(
                                swordsman,
                                other
                            ) <=
                            swordsman.range +
                            other.radius
                        );
                    }
                );

            if (!target) {
                return;
            }

            swordsman.lastSwordDamage =
                currentTime;

            damageFighter(
                target,
                swordsman.damage,
                swordsman
            );

            createCircleEffect(
                swordsman.x,
                swordsman.y,
                20,
                swordsman.range,
                "#e8f3ff",
                200,
                12
            );
        }
    );
}

function startVampireTransformation(
    vampire,
    targetX,
    targetY
) {
    const currentTime =
        performance.now();

    if (
        vampire.transformed ||
        currentTime -
        vampire.lastTransformation <
        vampire.transformationCooldown
    ) {
        return;
    }

    vampire.transformed =
        true;

    vampire.lastTransformation =
        currentTime;

    vampire.transformationEnd =
        currentTime +
        vampire.transformationDuration;

    vampire.transformationHits =
        new Set();

    vampire.speed =
        vampire.normalSpeed *
        vampire.batSpeedMultiplier;

    vampire.hidden =
        false;

    vampire.batDirection =
        normalize(
            targetX -
            vampire.x,

            targetY -
            vampire.y
        );

    createTextEffect(
        vampire.x,
        vampire.y - 55,
        "NOCNY RÓJ!",
        "#ca8cff"
    );
}

function updateVampires(
    currentTime
) {
    fighters.forEach(
        function(vampire) {
            if (
                !vampire.alive ||
                !vampire.vampire ||
                !vampire.transformed
            ) {
                return;
            }

            if (
                currentTime >=
                vampire.transformationEnd
            ) {
                vampire.transformed =
                    false;

                vampire.speed =
                    vampire.normalSpeed;

                vampire.transformationHits =
                    new Set();

                return;
            }

            if (
                !vampire.isPlayer &&
                vampire.target &&
                vampire.target.alive
            ) {
                vampire.batDirection =
                    normalize(
                        vampire.target.x -
                        vampire.x,

                        vampire.target.y -
                        vampire.y
                    );

                moveFighter(
                    vampire,

                    vampire
                        .batDirection.x *
                    vampire.speed,

                    vampire
                        .batDirection.y *
                    vampire.speed
                );
            }

            fighters.forEach(
                function(target) {
                    if (
                        !isEnemy(
                            vampire,
                            target
                        ) ||
                        vampire
                            .transformationHits
                            .has(
                                target.id
                            )
                    ) {
                        return;
                    }

                    if (
                        distance(
                            vampire,
                            target
                        ) <=
                        vampire.radius +
                        target.radius +
                        12
                    ) {
                        vampire
                            .transformationHits
                            .add(
                                target.id
                            );

                        damageFighter(
                            target,
                            vampire.damage,
                            vampire
                        );

                        const healing =
                            vampire.damage *
                            vampire.vampireHealing;

                        vampire.hp =
                            Math.min(
                                vampire.maxHp,

                                vampire.hp +
                                healing
                            );

                        createTextEffect(
                            vampire.x,
                            vampire.y - 45,

                            "+" +
                            Math.round(
                                healing
                            ),

                            "#65ff72"
                        );
                    }
                }
            );
        }
    );
}

) {

                randomNumber(

                ),

                randomNumber(
                    -90,
                    90
                )
        });

        id:
            "summon-" +
            summonCounter,

        name:
            "DUCH",

        heroId:
            "summoned-ghost",

            "Przywołany Duch",

        icon:
            "👻",

        x:
            position.x,

        y:
            position.y,

        radius: 20,

        hp: 18,
        maxHp: 18,

        damage: 8,

        cooldown: 650,

        melee: true,
        canPassWalls: true,

        vampire: false,

        speedBoostUntil: 0,

        transformed: false,

        stunnedUntil: 0,
        cursedUntil: 0,
