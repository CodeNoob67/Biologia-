<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bitwa Królestw</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            color: white;
            font-family: Arial, sans-serif;
            text-align: center;

            background:
                radial-gradient(
                    circle at top,
                    #34405a,
                    #101621
                );
        }

        .topbar {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            padding: 10px 18px;

            background: #111827;
            border-bottom: 4px solid #050912;
        }

        .logo {
            color: #ffd43b;
            font-size: 24px;
            font-weight: 900;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        button,
        .back-button {
            padding: 10px 15px;

            color: white;
            font-family: inherit;
            font-weight: 900;
            text-decoration: none;

            background: #35445e;

            border: 3px solid #080d16;
            border-radius: 10px;

            cursor: pointer;
        }

        .restart-button {
            background: #d34242;
        }

        .game-info {
            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;

            padding: 7px;
        }

        .info-box {
            padding: 7px 13px;

            background: #26344b;

            border: 3px solid #101722;
            border-radius: 10px;

            font-weight: 900;
        }

        .game-container {
            position: relative;

            width: min(
                calc(100vh - 155px),
                96vw
            );

            height: min(
                calc(100vh - 155px),
                96vw
            );

            max-width: 900px;
            max-height: 900px;

            margin: 0 auto;
        }

        canvas {
            width: 100%;
            height: 100%;

            display: block;

            background: #58ad58;

            border: 7px solid #111827;
            border-radius: 12px;

            box-shadow:
                0 15px 40px #00000099;

            cursor: crosshair;
        }

        .death-screen {
            position: absolute;
            inset: 7px;
            z-index: 10;

            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;

            padding: 20px;

            background: #000000bb;
            border-radius: 6px;
        }

        .death-screen.visible {
            display: flex;
        }

        .death-title {
            font-size: 54px;
            font-weight: 1000;

            text-shadow:
                4px 4px black;
        }

        .match-result {
            padding: 13px 22px;

            font-size: 20px;
            font-weight: 900;
            line-height: 1.5;

            background: #111827dd;

            border: 4px solid #050912;
            border-radius: 12px;
        }

        .return-button {
            min-width: 230px;

            padding: 18px 30px;

            color: #111827;
            font-size: 28px;
            font-weight: 1000;

            background:
                linear-gradient(
                    #ffd93d,
                    #f0a500
                );

            border: 5px solid #111827;
            border-radius: 14px;

            box-shadow:
                0 7px 0 #00000077;

            cursor: pointer;
        }

        .controls {
            position: fixed;
            left: 15px;
            bottom: 12px;

            padding: 8px 12px;

            color: #d1d5db;
            font-size: 13px;

            background: #111827cc;
            border-radius: 8px;
        }

        @media (max-width: 700px) {
            .logo {
                font-size: 17px;
            }

            .topbar {
                padding: 8px;
            }

            .top-buttons button,
            .back-button {
                padding: 7px;
                font-size: 12px;
            }

            .info-box {
                font-size: 12px;
            }

            .death-title {
                font-size: 38px;
            }

            .controls {
                display: none;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="logo">
        ⚔️ BITWA KRÓLESTW
    </div>

    <div class="top-buttons">

        <button
            class="restart-button"
            onclick="startGame()"
        >
            NOWA GRA
        </button>

        <a
            class="back-button"
            href="gra.html"
        >
            LOBBY
        </a>

    </div>

</header>

<div class="game-info">

    <div
        id="mapName"
        class="info-box"
    >
        Mapa
    </div>

    <div
        id="aliveCounter"
        class="info-box"
    >
        Pozostało: 10
    </div>

    <div
        id="playerInfo"
        class="info-box"
    >
        Gracz
    </div>

</div>

<div class="game-container">

    <canvas
        id="gameCanvas"
        width="900"
        height="900"
    ></canvas>

    <div
        id="deathScreen"
        class="death-screen"
    >

        <div
            id="deathTitle"
            class="death-title"
        >
            POKONANY
        </div>

        <div
            id="matchResult"
            class="match-result"
        ></div>

        <button
            class="return-button"
            onclick="location.href='gra.html'"
        >
            POWRÓT
        </button>

    </div>

</div>

<div class="controls">
    WASD lub strzałki — ruch |
    LPM — atak |
    krzaki — ukrycie
</div>

<script src="dane.js"></script>
<script src="common.js"></script>

<script>
"use strict";

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");

const WORLD_WIDTH = 2700;
const WORLD_HEIGHT = 2700;

const TROPHY_REWARDS = {

    3: 6,
    4: 4,
    5: 2,
    6: 0,

};

const keys = {};

let mouse = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    down: false
};

let camera = {
    x: 0,
    y: 0
};

let selectedMap;
let fighters = [];
let projectiles = [];
let effects = [];

let player = null;
let winner = null;
let matchFinished = false;
let trophiesAwarded = false;

const MAPS = {
    green: {
        name: "Zielona Dolina",

        wall: "#776046",

    },

const HERO_STATS = {

 wiedzma: {

const walls = [

const bushes = [
    { x: 120, y: 220, w: 300, h: 260 },
    { x: 2280, y: 220, w: 300, h: 260 },

    { x: 120, y: 2220, w: 300, h: 260 },

    { x: 540, y: 520, w: 300, h: 150 },
    { x: 1860, y: 520, w: 300, h: 150 },

    { x: 540, y: 2030, w: 300, h: 150 },

    { x: 1030, y: 650, w: 250, h: 170 },
    { x: 1420, y: 650, w: 250, h: 170 },

    { x: 1030, y: 1880, w: 250, h: 170 },
    { x: 1420, y: 1880, w: 250, h: 170 },

    { x: 560, y: 1160, w: 180, h: 380 },
    { x: 1960, y: 1160, w: 180, h: 380 },

    { x: 1000, y: 1250, w: 150, h: 200 },
    { x: 1550, y: 1250, w: 150, h: 200 }

const spawnPositions = [
    { x: 180, y: 180 },
    { x: WORLD_WIDTH / 2, y: 180 },
    { x: WORLD_WIDTH - 180, y: 180 },

    { x: 180, y: WORLD_HEIGHT / 2 },
    { x: WORLD_WIDTH - 180, y: WORLD_HEIGHT / 2 },

    { x: 220, y: WORLD_HEIGHT - 220 },
    { x: WORLD_WIDTH - 220, y: WORLD_HEIGHT - 220 },

    {
        x: WORLD_WIDTH / 2 - 480,
        y: WORLD_HEIGHT / 2
    },

    {
        x: WORLD_WIDTH / 2 + 480,
        y: WORLD_HEIGHT / 2
    }
];

window.addEventListener(
    "keydown",
    function(event) {
        const key =
            event.key.toLowerCase();

        keys[key] = true;

        if (
            key === "arrowup" ||
            key === "arrowdown" ||
            key === "arrowleft" ||
            key === "arrowright"
        ) {
            event.preventDefault();
        }
    }
);

window.addEventListener(
    "keyup",
    function(event) {
        keys[
            event.key.toLowerCase()
        ] = false;
    }
);

canvas.addEventListener(
    "mousemove",
    function(event) {
        const rectangle =
            canvas.getBoundingClientRect();

        mouse.x =
            (
                event.clientX -
                rectangle.left
            ) *
            canvas.width /
            rectangle.width;

        mouse.y =
            (
                event.clientY -
                rectangle.top
            ) *
            canvas.height /
            rectangle.height;
    }
);

canvas.addEventListener(
    "mousedown",
    function(event) {
        if (event.button === 0) {
            mouse.down = true;
        }
    }
);

window.addEventListener(
    "mouseup",
    function(event) {
        if (event.button === 0) {
            mouse.down = false;
        }
    }
);

canvas.addEventListener(
    "contextmenu",
    function(event) {
        event.preventDefault();
    }
);

function randomNumber(minimum, maximum) {
    return (
        Math.random() *
        (
            maximum -
            minimum
        ) +
        minimum
    );
}

function randomItem(array) {
    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}

function distance(first, second) {
    return Math.hypot(
        first.x - second.x,
        first.y - second.y
    );
}

function normalize(dx, dy) {
    const length =
        Math.hypot(dx, dy) || 1;

    return {
        x: dx / length,
        y: dy / length
    };
}

function rotateDirection(
    direction,
    angle
) {
    return {
        x:
            direction.x *
            Math.cos(angle) -
            direction.y *
            Math.sin(angle),

        y:
            direction.x *
            Math.sin(angle) +
            direction.y *
            Math.cos(angle)
    };
}

function getCharacterStats(heroId) {
    return (
        HERO_STATS[heroId] ||
        HERO_STATS.farmer
    );
}

function createFighter(
    hero,
    x,
    y,
    isPlayer,
    number
) {
    const stats =
        getCharacterStats(
            hero.id
        );

    return {
        id:
            isPlayer
                ? "player"
                : "bot-" + number,

        name:
            isPlayer
                ? "TY"
                : "BOT " + number,

        heroId: hero.id,
        heroName: hero.nazwa,
        icon: hero.ikona,

        x: x,
        y: y,

        radius: 28,

        hp: stats.hp,
        maxHp: stats.hp,

        damage: stats.damage,
        speed: stats.speed,
        range: stats.range,
        cooldown: stats.cooldown,

        projectileSpeed:
            stats.projectileSpeed || 0,

        projectileWidth:
            stats.projectileWidth || 0,

        projectileLife:
            stats.projectileLife || 0,

        melee:
            Boolean(stats.melee),

        tripleShot:
            Boolean(stats.tripleShot),

        farmerThirdAttack:
            Boolean(
                stats.farmerThirdAttack
            ),

        lowHpShield:
            Boolean(
                stats.lowHpShield
            ),

        shieldThreshold:
            stats.shieldThreshold || 0,

        shieldReduction:
            stats.shieldReduction || 0,

        fastThirdArrow:
            Boolean(
                stats.fastThirdArrow
            ),

        fastArrowMultiplier:
            stats.fastArrowMultiplier || 1,

        lowHpDamageBonus:
            Boolean(
                stats.lowHpDamageBonus
            ),

        damageBonusThreshold:
            stats.damageBonusThreshold || 0,

        damageBonusMultiplier:
            stats.damageBonusMultiplier || 1,

        shockwaveEvery:
            stats.shockwaveEvery || 0,

        attackShockwaveRadius:
            stats.attackShockwaveRadius || 0,

        attackShockwaveDamage:
            stats.attackShockwaveDamage || 0,

        curseEvery:
            stats.curseEvery || 0,

        curseDuration:
            stats.curseDuration || 0,

        curseMultiplier:
            stats.curseMultiplier || 1,

        attackCounter: 0,

        cursedUntil: 0,
        receivedDamageMultiplier: 1,

        isPlayer: isPlayer,
        alive: true,
        hidden: false,

        lastAttack: 0,

        target: null,
        behavior: "wander",

        directionX:
            randomNumber(-1, 1),

        directionY:
            randomNumber(-1, 1),

        nextDecision:
            performance.now() +
            randomNumber(700, 2200),

        color:
            isPlayer
                ? "#36a9ff"
                : `hsl(
                    ${Math.random() * 360},
                    70%,
                    55%
                )`
    };
}

function startGame() {
    const mapId =
        localStorage.getItem(
            "selectedMap"
        ) || "green";

    selectedMap =
        MAPS[mapId] ||
        MAPS.green;

    document
        .getElementById("mapName")
        .textContent =
        selectedMap.name;

    const state =
        getState();

    let selectedHero =
        getHero(state.selected);

    if (
        !selectedHero ||
        !BOHATEROWIE.some(
            function(hero) {
                return (
                    hero.id ===
                    selectedHero.id
                );
            }
        )
    ) {
        selectedHero =
            BOHATEROWIE[0];
    }

    fighters = [];
    projectiles = [];
    effects = [];

    winner = null;
    matchFinished = false;
    trophiesAwarded = false;

    mouse.down = false;

    document
        .getElementById(
            "deathScreen"
        )
        .classList.remove(
            "visible"
        );

    document
        .getElementById(
            "matchResult"
        )
        .innerHTML = "";

    player =
        createFighter(
            selectedHero,
            WORLD_WIDTH / 2,
            WORLD_HEIGHT - 220,
            true,
            0
        );

    fighters.push(player);

    for (
        let i = 0;
        i < 9;
        i++
    ) {
        const randomHero =
            randomItem(
                BOHATEROWIE
            );

        const position =
            spawnPositions[i];

        fighters.push(
            createFighter(
                randomHero,
                position.x,
                position.y,
                false,
                i + 1
            )
        );
    }

    updateBushStatus();
    updateCamera();
    updateInformation();
}

function updateInformation() {
    const alive =
        fighters.filter(
            function(fighter) {
                return fighter.alive;
            }
        ).length;

    document
        .getElementById(
            "aliveCounter"
        )
        .textContent =
        "Pozostało: " +
        alive;

    if (!player) {
        return;
    }

    let extra = "";

    if (
        player.lowHpShield &&
        player.hp <=
            player.maxHp *
            player.shieldThreshold
    ) {
        extra += " | 🛡️ TARCZA";
    }

    if (
        player.cursedUntil >
        performance.now()
    ) {
        extra += " | 🔮 KLĄTWA";
    }

    if (player.hidden) {
        extra += " | 🌿 UKRYTY";
    }

    document
        .getElementById(
            "playerInfo"
        )
        .textContent =
        player.icon +
        " " +
        player.heroName +
        " | ❤️ " +
        Math.max(
            0,
            Math.ceil(player.hp)
        ) +
        extra;
}

function updateCamera() {
    if (!player) {
        return;
    }

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;

    camera.x =
        Math.max(
            0,
            Math.min(
                WORLD_WIDTH -
                canvas.width,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                WORLD_HEIGHT -
                canvas.height,
                camera.y
            )
        );
}

function rectangleCollision(
    x,
    y,
    radius,
    rectangle
) {
    const closestX =
        Math.max(
            rectangle.x,
            Math.min(
                x,
                rectangle.x +
                rectangle.w
            )
        );

    const closestY =
        Math.max(
            rectangle.y,
            Math.min(
                y,
                rectangle.y +
                rectangle.h
            )
        );

    const dx =
        x - closestX;

    const dy =
        y - closestY;

    return (
        dx * dx +
        dy * dy <
        radius * radius
    );
}

function collidesWithWall(
    x,
    y,
    radius
) {
    return walls.some(
        function(wall) {
            return rectangleCollision(
                x,
                y,
                radius,
                wall
            );
        }
    );
}

function moveFighter(
    fighter,
    dx,
    dy
) {
    const nextX =
        Math.max(
            fighter.radius,
            Math.min(
                WORLD_WIDTH -
                fighter.radius,
                fighter.x + dx
            )
        );

    if (
        !collidesWithWall(
            nextX,
            fighter.y,
            fighter.radius
        )
    ) {
        fighter.x =
            nextX;
    }

    const nextY =
        Math.max(
            fighter.radius,
            Math.min(
                WORLD_HEIGHT -
                fighter.radius,
                fighter.y + dy
            )
        );

    if (
        !collidesWithWall(
            fighter.x,
            nextY,
            fighter.radius
        )
    ) {
        fighter.y =
            nextY;
    }
}

function pointInsideRectangle(
    x,
    y,
    rectangle
) {
    return (
        x >= rectangle.x &&
        x <=
            rectangle.x +
            rectangle.w &&
        y >= rectangle.y &&
        y <=
            rectangle.y +
            rectangle.h
    );
}

function updateBushStatus() {
    fighters.forEach(
        function(fighter) {
            fighter.hidden =
                fighter.alive &&
                bushes.some(
                    function(bush) {
                        return pointInsideRectangle(
                            fighter.x,
                            fighter.y,
                            bush
                        );
                    }
                );
        }
    );
}

function canSeeFighter(
    observer,
    target
) {
    if (!target.hidden) {
        return true;
    }

    return (
        distance(
            observer,
            target
        ) < 170
    );
}

function movePlayer() {
    if (
        !player ||
        !player.alive ||
        matchFinished
    ) {
        return;
    }

    let dx = 0;
    let dy = 0;

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {
        dy -= 1;
    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {
        dy += 1;
    }

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        dx -= 1;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        dx += 1;
    }

    if (
        dx !== 0 ||
        dy !== 0
    ) {
        const direction =
            normalize(dx, dy);

        moveFighter(
            player,
            direction.x *
            player.speed,
            direction.y *
            player.speed
        );
    }

    if (mouse.down) {
        attackTowards(
            player,
            mouse.x + camera.x,
            mouse.y + camera.y
        );
    }
}

function getPossibleTargets(
    fighter
) {
    return fighters.filter(
        function(other) {
            return (
                other.alive &&
                other !== fighter &&
                canSeeFighter(
                    fighter,
                    other
                )
            );
        }
    );
}

function chooseBotDecision(bot) {
    const targets =
        getPossibleTargets(bot);

    if (
        targets.length === 0
    ) {
        bot.target = null;
        bot.behavior = "wander";
    } else {
        bot.target =
            randomItem(targets);

        const roll =
            Math.random();

        if (
            bot.hp <
            bot.maxHp * 0.3
        ) {
            bot.behavior =
                Math.random() <
                0.72
                    ? "flee"
                    : "attack";
        } else if (
            roll < 0.62
        ) {
            bot.behavior =
                "attack";
        } else if (
            roll < 0.84
        ) {
            bot.behavior =
                "wander";
        } else {
            bot.behavior =
                "flee";
        }
    }

    bot.directionX =
        randomNumber(-1, 1);

    bot.directionY =
        randomNumber(-1, 1);

    bot.nextDecision =
        performance.now() +
        randomNumber(
            700,
            2200
        );
}

function updateBot(
    bot,
    currentTime
) {
    if (
        !bot.alive ||
        matchFinished
    ) {
        return;
    }

    if (
        currentTime >=
            bot.nextDecision ||
        !bot.target ||
        !bot.target.alive ||
        !canSeeFighter(
            bot,
            bot.target
        )
    ) {
        chooseBotDecision(bot);
    }

    if (
        bot.behavior ===
        "wander"
    ) {
        const direction =
            normalize(
                bot.directionX,
                bot.directionY
            );

        moveFighter(
            bot,
            direction.x *
            bot.speed *
            0.58,

            direction.y *
            bot.speed *
            0.58
        );

        if (
            Math.random() <
            0.015
        ) {
            bot.directionX =
                randomNumber(-1, 1);

            bot.directionY =
                randomNumber(-1, 1);
        }

        return;
    }

    if (!bot.target) {
        return;
    }

    const direction =
        normalize(
            bot.target.x -
            bot.x,

            bot.target.y -
            bot.y
        );

    const targetDistance =
        distance(
            bot,
            bot.target
        );

    if (
        bot.behavior === "flee"
    ) {
        moveFighter(
            bot,
            -direction.x *
            bot.speed,

            -direction.y *
            bot.speed
        );

        if (
            Math.random() <
            0.035
        ) {
            attackTowards(
                bot,
                bot.target.x,
                bot.target.y
            );
        }

        return;
    }

    const preferredDistance =
        bot.melee
            ? bot.range * 0.7
            : Math.min(
                bot.range * 0.58,
                500
            );

    if (
        targetDistance >
        preferredDistance
    ) {
        moveFighter(
            bot,
            direction.x *
            bot.speed *
            0.78,

            direction.y *
            bot.speed *
            0.78
        );
    } else if (
        !bot.melee
    ) {
        moveFighter(
            bot,
            -direction.x *
            bot.speed *
            0.24,

            -direction.y *
            bot.speed *
            0.24
        );
    }

    attackTowards(
        bot,
        bot.target.x,
        bot.target.y
    );
}

function findTargetNearPoint(
    attacker,
    targetX,
    targetY
) {
    const targets =
        fighters.filter(
            function(fighter) {
                return (
                    fighter.alive &&
                    fighter !==
                        attacker &&
                    canSeeFighter(
                        attacker,
                        fighter
                    )
                );
            }
        );

    targets.sort(
        function(first, second) {
            return (
                Math.hypot(
                    first.x -
                    targetX,

                    first.y -
                    targetY
                ) -
                Math.hypot(
                    second.x -
                    targetX,

                    second.y -
                    targetY
                )
            );
        }
    );

    return targets[0] || null;
}

function attackTowards(
    attacker,
    targetX,
    targetY
) {
    if (
        !attacker.alive ||
        matchFinished
    ) {
        return;
    }

    const currentTime =
        performance.now();

    if (
        currentTime -
        attacker.lastAttack <
        attacker.cooldown
    ) {
        return;
    }

    const direction =
        normalize(
            targetX -
            attacker.x,

            targetY -
            attacker.y
        );

    attacker.lastAttack =
        currentTime;

    attacker.hidden = false;
    attacker.attackCounter++;

    let attackDamage =
        attacker.damage;

    if (
        attacker
            .farmerThirdAttack &&
        attacker.attackCounter %
            3 === 0
    ) {
        attackDamage *= 1.5;

        createTextEffect(
            attacker.x,
            attacker.y - 50,
            "WZMOCNIONY!",
            "#ffd93d"
        );
    }

    if (
        attacker
            .lowHpDamageBonus &&
        attacker.hp <
            attacker.maxHp *
            attacker
                .damageBonusThreshold
    ) {
        attackDamage *=
            attacker
                .damageBonusMultiplier;
    }

    attackDamage =
        Math.round(
            attackDamage
        );

    if (attacker.melee) {
        const target =
            findTargetNearPoint(
                attacker,
                targetX,
                targetY
            );

        if (
            target &&
            distance(
                attacker,
                target
            ) <= attacker.range
        ) {
            damageFighter(
                target,
                attackDamage,
                attacker
            );

            createMeleeEffect(
                attacker,
                direction
            );
        }

        return;
    }

    if (
        attacker.shockwaveEvery >
            0 &&
        attacker.attackCounter %
            attacker.shockwaveEvery ===
            0
    ) {
        createGolemShockwave(
            attacker
        );
    }

    if (
        attacker.tripleShot
    ) {
        createProjectile(
            attacker,
            direction,
            -0.14,
            attackDamage
        );

        createProjectile(
            attacker,
            direction,
            0,
            attackDamage
        );

        createProjectile(
            attacker,
            direction,
            0.14,
            attackDamage
        );

        return;
    }

    createProjectile(
        attacker,
        direction,
        0,
        attackDamage
    );
}

function createProjectile(
    attacker,
    direction,
    angle,
    attackDamage
) {
    const rotated =
        rotateDirection(
            direction,
            angle
        );

    let color =
        "#f9eda2";

    let speedMultiplier = 1;

    let appliesCurse = false;

    if (
        attacker.heroId ===
        "farmer"
    ) {
        color = "#6b4327";
    }

    if (
        attacker.heroId ===
        "lucznik"
    ) {
        color = "#f3e6a2";

        if (
            attacker.fastThirdArrow &&
            attacker.attackCounter %
                3 === 0
        ) {
            speedMultiplier =
                attacker
                    .fastArrowMultiplier;

            color = "#ffffff";
        }
    }

    if (
        attacker.heroId ===
        "golem"
    ) {
        color = "#8b7566";
    }

    if (
        attacker.heroId ===
        "czarodziej"
    ) {
        color = "#d851ff";

        if (
            attacker.curseEvery >
                0 &&
            attacker.attackCounter %
                attacker.curseEvery ===
                0
        ) {
            appliesCurse = true;
            color = "#741cff";
        }
    }

    if (
        attacker.heroId ===
        "krol"
    ) {
        color = "#ffd638";
    }

    if (
        attacker.heroId ===
        "wiedzma"
    ) {
        color = "#000000";
    }

    projectiles.push({
        x:
            attacker.x +
            rotated.x * 34,

        y:
            attacker.y +
            rotated.y * 34,

        vx:
            rotated.x *
            attacker.projectileSpeed *
            speedMultiplier,

        vy:
            rotated.y *
            attacker.projectileSpeed *
            speedMultiplier,

        radius:
            attacker.projectileWidth,

        damage:
            attackDamage,

        owner:
            attacker,

        color:
            color,

        born:
            performance.now(),

        life:
            attacker.projectileLife,

        appliesCurse:
            appliesCurse,

        curseDuration:
            attacker.curseDuration,

        curseMultiplier:
            attacker.curseMultiplier
    });
}

function createMeleeEffect(
    attacker,
    direction
) {
    effects.push({
        type: "circle",

        x:
            attacker.x +
            direction.x * 38,

        y:
            attacker.y +
            direction.y * 38,

        radius: 25,
        maximumRadius:
            attacker.range,

        color: "#ffffff",

        born:
            performance.now(),

        life: 180,
        lineWidth: 12
    });
}

function createGolemShockwave(
    attacker
) {
    fighters.forEach(
        function(target) {
            if (
                target === attacker ||
                !target.alive
            ) {
                return;
            }

            if (
                distance(
                    attacker,
                    target
                ) <=
                attacker
                    .attackShockwaveRadius
            ) {
                damageFighter(
                    target,
                    attacker
                        .attackShockwaveDamage,
                    attacker
                );
            }
        }
    );

    effects.push({
        type: "circle",

        x: attacker.x,
        y: attacker.y,

        radius: 20,

        maximumRadius:
            attacker
                .attackShockwaveRadius,

        color: "#d3c0a0",

        born:
            performance.now(),

        life: 550,
        lineWidth: 18
    });
}

function createTextEffect(
    x,
    y,
    text,
    color
) {
    effects.push({
        type: "text",
        x: x,
        y: y,
        text: text,
        color: color,
        born:
            performance.now(),
        life: 700
    });
}

function damageFighter(
    target,
    damage,
    attacker
) {
    if (!target.alive) {
        return;
    }

    let finalDamage =
        Number(damage) || 0;

    if (
        target.cursedUntil >
        performance.now()
    ) {
        finalDamage *=
            target
                .receivedDamageMultiplier;
    } else {
        target
            .receivedDamageMultiplier =
            1;
    }

    if (
        target.lowHpShield &&
        target.hp <=
            target.maxHp *
            target.shieldThreshold
    ) {
        finalDamage *=
            1 -
            target.shieldReduction;
    }

    finalDamage =
        Math.max(
            1,
            Math.round(
                finalDamage
            )
        );

    target.hp -=
        finalDamage;

    target.hidden = false;

    createTextEffect(
        target.x,
        target.y - 35,
        "-" + finalDamage,
        "#ff6464"
    );

    if (target.hp <= 0) {
        target.hp = 0;
        target.alive = false;

        if (target === player) {
            const aliveAfterDeath =
                fighters.filter(
                    function(fighter) {
                        return fighter.alive;
                    }
                ).length;

            awardTrophies(
                aliveAfterDeath + 1
            );

            showDeathScreen(false);
        }
    }

    checkWinner();
    updateInformation();
}

function projectileHitsWall(
    projectile
) {
    return walls.some(
        function(wall) {
            return rectangleCollision(
                projectile.x,
                projectile.y,
                projectile.radius,
                wall
            );
        }
    );
}

function updateProjectiles(
    currentTime
) {
    for (
        let i =
            projectiles.length - 1;

        i >= 0;

        i--
    ) {
        const projectile =
            projectiles[i];

        projectile.x +=
            projectile.vx;

        projectile.y +=
            projectile.vy;

        let remove = false;

        if (
            currentTime -
            projectile.born >
            projectile.life
        ) {
            remove = true;
        }

        if (
            projectile.x < 0 ||
            projectile.y < 0 ||
            projectile.x >
                WORLD_WIDTH ||
            projectile.y >
                WORLD_HEIGHT
        ) {
            remove = true;
        }

        if (
            !remove &&
            projectileHitsWall(
                projectile
            )
        ) {
            remove = true;
        }

        if (!remove) {
            for (
                const fighter
                of fighters
            ) {
                if (
                    !fighter.alive ||
                    fighter ===
                        projectile.owner
                ) {
                    continue;
                }

                const hit =
                    Math.hypot(
                        projectile.x -
                        fighter.x,

                        projectile.y -
                        fighter.y
                    ) <
                    projectile.radius +
                    fighter.radius;

                if (!hit) {
                    continue;
                }

                damageFighter(
                    fighter,
                    projectile.damage,
                    projectile.owner
                );

                if (
                    projectile
                        .appliesCurse
                ) {
                    fighter.cursedUntil =
                        performance.now() +
                        projectile
                            .curseDuration;

                    fighter
                        .receivedDamageMultiplier =
                        projectile
                            .curseMultiplier;

                    createTextEffect(
                        fighter.x,
                        fighter.y - 60,
                        "KLĄTWA!",
                        "#b662ff"
                    );
                }

                remove = true;
                break;
            }
        }

        if (remove) {
            projectiles.splice(
                i,
                1
            );
        }
    }
}

function updateEffects(
    currentTime
) {
    for (
        let i =
            effects.length - 1;

        i >= 0;

        i--
    ) {
        const effect =
            effects[i];

        const progress =
            (
                currentTime -
                effect.born
            ) /
            effect.life;

        if (
            effect.type ===
            "circle"
        ) {
            effect.radius =
                20 +
                (
                    effect
                        .maximumRadius -
                    20
                ) *
                Math.min(
                    1,
                    progress
                );
        }

        if (progress >= 1) {
            effects.splice(
                i,
                1
            );
        }
    }
}

function awardTrophies(place) {
    if (
        trophiesAwarded ||
        !player
    ) {
        return;
    }

    trophiesAwarded = true;

    const safePlace =
        Math.max(
            1,
            Math.min(
                10,
                Math.floor(place)
            )
        );

    const reward =
        TROPHY_REWARDS[
            safePlace
        ] || 0;

    const state =
        getState();

    if (
        !state.heroTrophies ||
        typeof state.heroTrophies !==
            "object"
    ) {
        state.heroTrophies = {};
    }

    const before =
        Math.max(
            0,
            Number(
                state.heroTrophies[
                    player.heroId
                ]
            ) || 0
        );

    const after =
        Math.max(
            0,
            before + reward
        );

    const realChange =
        after - before;

    state.heroTrophies[
        player.heroId
    ] = after;

    saveState(state);

    const sign =
        realChange > 0
            ? "+"
            : "";

    document
        .getElementById(
            "matchResult"
        )
        .innerHTML =
        "Miejsce: <b>" +
        safePlace +
        "</b><br>" +
        "Zmiana pucharków: <b>" +
        sign +
        realChange +
        "</b><br>" +
        player.heroName +
        " ma teraz: <b>🏆 " +
        after +
        "</b>";
}

function checkWinner() {
    const alive =
        fighters.filter(
            function(fighter) {
                return fighter.alive;
            }
        );

    if (
        alive.length !== 1 ||
        matchFinished
    ) {
        return;
    }

    winner = alive[0];
    matchFinished = true;

    if (winner === player) {
        awardTrophies(1);

        const state =
            getState();

        state.tickets =
            (
                Number(
                    state.tickets
                ) || 0
            ) + 4;

        state.coins =
            (
                Number(
                    state.coins
                ) || 0
            ) + 50;

        state.wins =
            (
                Number(
                    state.wins
                ) || 0
            ) + 1;

        saveState(state);

        showDeathScreen(true);
    } else if (
        !player.alive
    ) {
        showDeathScreen(false);
    }
}

function showDeathScreen(
    playerWon
) {
    document
        .getElementById(
            "deathTitle"
        )
        .textContent =
        playerWon
            ? "ZWYCIĘSTWO!"
            : "POKONANY";

    document
        .getElementById(
            "deathScreen"
        )
        .classList.add(
            "visible"
        );
}

function update() {
    if (matchFinished) {
        return;
    }

    movePlayer();

    const currentTime =
        performance.now();

    fighters.forEach(
        function(fighter) {
            if (
                !fighter.isPlayer
            ) {
                updateBot(
                    fighter,
                    currentTime
                );
            }
        }
    );

    updateBushStatus();

    updateProjectiles(
        currentTime
    );

    updateEffects(
        currentTime
    );

    updateCamera();
    updateInformation();
    checkWinner();
}

function worldToScreenX(x) {
    return x - camera.x;
}

function worldToScreenY(y) {
    return y - camera.y;
}

function objectVisible(
    x,
    y,
    width,
    height
) {
    return (
        x + width >=
            camera.x &&
        x <=
            camera.x +
            canvas.width &&
        y + height >=
            camera.y &&
        y <=
            camera.y +
            canvas.height
    );
}

function drawMap() {
    ctx.fillStyle =
        selectedMap.ground;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const tileSize = 100;

    const startColumn =
        Math.floor(
            camera.x /
            tileSize
        );

    const endColumn =
        Math.ceil(
            (
                camera.x +
                canvas.width
            ) /
            tileSize
        );

    const startRow =
        Math.floor(
            camera.y /
            tileSize
        );

    const endRow =
        Math.ceil(
            (
                camera.y +
                canvas.height
            ) /
            tileSize
        );

    for (
        let column =
            startColumn;

        column <=
            endColumn;

        column++
    ) {
        for (
            let row =
                startRow;

            row <= endRow;

            row++
        ) {
            if (
                (
                    column +
                    row
                ) % 2 === 0
            ) {
                ctx.fillStyle =
                    selectedMap
                        .groundDark;

                ctx.fillRect(
                    column *
                    tileSize -
                    camera.x,

                    row *
                    tileSize -
                    camera.y,

                    tileSize,
                    tileSize
                );
            }
        }
    }

    ctx.strokeStyle =
        "#111827";

    ctx.lineWidth = 10;

    ctx.strokeRect(
        -camera.x,
        -camera.y,
        WORLD_WIDTH,
        WORLD_HEIGHT
    );
}

function drawBushes() {
    bushes.forEach(
        function(bush) {
            if (
                !objectVisible(
                    bush.x,
                    bush.y,
                    bush.w,
                    bush.h
                )
            ) {
                return;
            }

            const x =
                worldToScreenX(
                    bush.x
                );

            const y =
                worldToScreenY(
                    bush.y
                );

            ctx.fillStyle =
                selectedMap.bush;

            ctx.fillRect(
                x,
                y,
                bush.w,
                bush.h
            );

            ctx.fillStyle =
                selectedMap
                    .bushLight;

            for (
                let leafX = 10;
                leafX <
                    bush.w;

                leafX += 34
            ) {
                for (
                    let leafY = 10;
                    leafY <
                        bush.h;

                    leafY += 34
                ) {
                    ctx.beginPath();

                    ctx.arc(
                        x +
                        leafX +
                        Math.sin(
                            (
                                bush.x +
                                leafX
                            ) *
                            12.345
                        ) *
                        4,

                        y +
                        leafY +
                        Math.sin(
                            (
                                bush.y +
                                leafY
                            ) *
                            12.345
                        ) *
                        4,

                        16,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();
                }
            }

            ctx.strokeStyle =
                "#183c22";

            ctx.lineWidth = 4;

            ctx.strokeRect(
                x,
                y,
                bush.w,
                bush.h
            );
        }
    );
}

function drawWalls() {
    walls.forEach(
        function(wall) {
            if (
                !objectVisible(
                    wall.x,
                    wall.y,
                    wall.w,
                    wall.h
                )
            ) {
                return;
            }

            const x =
                worldToScreenX(
                    wall.x
                );

            const y =
                worldToScreenY(
                    wall.y
                );

            ctx.fillStyle =
                "#00000044";

            ctx.fillRect(
                x + 8,
                y + 10,
                wall.w,
                wall.h
            );

            ctx.fillStyle =
                selectedMap.wall;

            ctx.fillRect(
                x,
                y,
                wall.w,
                wall.h
            );

            ctx.fillStyle =
                selectedMap
                    .wallTop;

            ctx.fillRect(
                x,
                y,
                wall.w,
                Math.min(
                    24,
                    wall.h
                )
            );

            ctx.strokeStyle =
                "#32271e";

            ctx.lineWidth = 4;

            ctx.strokeRect(
                x,
                y,
                wall.w,
                wall.h
            );
        }
    );
}

function drawHealthBar(
    fighter,
    screenX,
    screenY
) {
    const width = 62;
    const height = 9;

    const x =
        screenX -
        width / 2;

    const y =
        screenY -
        fighter.radius -
        27;

    ctx.fillStyle =
        "#281b20";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.fillStyle =
        fighter.isPlayer
            ? "#42de63"
            : "#ef4d4d";

    ctx.fillRect(
        x,
        y,

        width *
        Math.max(
            0,
            fighter.hp /
            fighter.maxHp
        ),

        height
    );

    ctx.strokeStyle =
        "#111827";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );
}

function drawFighter(fighter) {
    if (!fighter.alive) {
        return;
    }

    const screenX =
        worldToScreenX(
            fighter.x
        );

    const screenY =
        worldToScreenY(
            fighter.y
        );

    if (
        screenX < -80 ||
        screenY < -80 ||
        screenX >
            canvas.width + 80 ||
        screenY >
            canvas.height + 80
    ) {
        return;
    }

    const visibleToPlayer =
        fighter === player ||
        !fighter.hidden ||
        (
            player.alive &&
            distance(
                player,
                fighter
            ) < 170
        );

    if (!visibleToPlayer) {
        return;
    }

    ctx.save();

    if (
        fighter.hidden &&
        fighter !== player
    ) {
        ctx.globalAlpha =
            0.4;
    }

    if (
        fighter.hidden &&
        fighter === player
    ) {
        ctx.globalAlpha =
            0.65;
    }

    ctx.beginPath();

    ctx.arc(
        screenX,
        screenY,
        fighter.radius + 7,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        fighter.color;

    ctx.fill();

    ctx.strokeStyle =
        fighter.isPlayer
            ? "white"
            : "#111827";

    ctx.lineWidth =
        fighter.isPlayer
            ? 5
            : 3;

    ctx.stroke();

    if (
        fighter.lowHpShield &&
        fighter.hp <=
            fighter.maxHp *
            fighter.shieldThreshold
    ) {
        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            fighter.radius + 13,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            "#63d8ff";

        ctx.lineWidth = 5;
        ctx.stroke();
    }

    if (
        fighter.cursedUntil >
        performance.now()
    ) {
        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            fighter.radius + 17,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            "#b14cff";

        ctx.lineWidth = 4;
        ctx.stroke();
    }

    ctx.font =
        "43px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        fighter.icon,
        screenX,
        screenY
    );

    ctx.font =
        "bold 13px Arial";

    ctx.strokeStyle =
        "black";

    ctx.lineWidth = 4;

    ctx.strokeText(
        fighter.name,
        screenX,
        screenY + 49
    );

    ctx.fillStyle =
        "white";

    ctx.fillText(
        fighter.name,
        screenX,
        screenY + 49
    );

    drawHealthBar(
        fighter,
        screenX,
        screenY
    );

    ctx.restore();
}

function drawProjectiles() {
    projectiles.forEach(
        function(projectile) {
            const screenX =
                worldToScreenX(
                    projectile.x
                );

            const screenY =
                worldToScreenY(
                    projectile.y
                );

            if (
                screenX < -50 ||
                screenY < -50 ||
                screenX >
                    canvas.width + 50 ||
                screenY >
                    canvas.height + 50
            ) {
                return;
            }

            ctx.beginPath();

            ctx.arc(
                screenX,
                screenY,
                projectile.radius,
                0,
                Math.PI * 2
            );

           if (projectile.owner.heroId === "wiedzma") {
    ctx.fillStyle = "#FFFFFF";
} else {
    ctx.fillStyle = projectile.color;
}

ctx.fill();
            
if (projectile.owner.heroId === "wiedzma") {
    ctx.strokeStyle = "#000000";   // kolor obramowania
    ctx.lineWidth = 4;             // grubość
} else {
    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 2;
}

ctx.stroke();

            
        }
    );
}

function drawEffects() {
    const now =
        performance.now();

    effects.forEach(
        function(effect) {
            const progress =
                Math.min(
                    1,
                    (
                        now -
                        effect.born
                    ) /
                    effect.life
                );

            const alpha =
                Math.max(
                    0,
                    1 - progress
                );

            const screenX =
                worldToScreenX(
                    effect.x
                );

            const screenY =
                worldToScreenY(
                    effect.y
                );

            ctx.save();
            ctx.globalAlpha =
                alpha;

            if (
                effect.type ===
                "circle"
            ) {
                ctx.beginPath();

                ctx.arc(
                    screenX,
                    screenY,
                    effect.radius,
                    0,
                    Math.PI * 2
                );

                ctx.strokeStyle =
                    effect.color;

                ctx.lineWidth =
                    effect.lineWidth;

                ctx.stroke();
            }

            if (
                effect.type ===
                "text"
            ) {
                ctx.font =
                    "bold 19px Arial";

                ctx.textAlign =
                    "center";

                ctx.fillStyle =
                    effect.color;

                ctx.strokeStyle =
                    "black";

                ctx.lineWidth = 4;

                const y =
                    screenY -
                    progress * 35;

                ctx.strokeText(
                    effect.text,
                    screenX,
                    y
                );

                ctx.fillText(
                    effect.text,
                    screenX,
                    y
                );
            }

            ctx.restore();
        }
    );
}

function drawMiniMap() {
    const width = 155;
    const height = 155;

    const x =
        canvas.width -
        width -
        16;

    const y = 16;

    ctx.fillStyle =
        "#111827cc";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.fillStyle =
        selectedMap.ground;

    ctx.fillRect(
        x + 5,
        y + 5,
        width - 10,
        height - 10
    );

    fighters.forEach(
        function(fighter) {
            if (!fighter.alive) {
                return;
            }

            const dotX =
                x + 5 +
                fighter.x /
                WORLD_WIDTH *
                (width - 10);

            const dotY =
                y + 5 +
                fighter.y /
                WORLD_HEIGHT *
                (height - 10);

            ctx.beginPath();

            ctx.arc(
                dotX,
                dotY,
                fighter.isPlayer
                    ? 5
                    : 3,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                fighter.isPlayer
                    ? "#36a9ff"
                    : "#ef4d4d";

            ctx.fill();
        }
    );

    ctx.strokeStyle =
        "white";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );
}

function drawCrosshair() {
    if (
        !player ||
        !player.alive ||
        matchFinished
    ) {
        return;
    }

    ctx.beginPath();

    ctx.arc(
        mouse.x,
        mouse.y,
        13,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "#FFFFFF";

    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        mouse.x - 19,
        mouse.y
    );

    ctx.lineTo(
        mouse.x + 19,
        mouse.y
    );

    ctx.moveTo(
        mouse.x,
        mouse.y - 19
    );

    ctx.lineTo(
        mouse.x,
        mouse.y + 19
    );

    ctx.stroke();
}

function draw() {
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMap();
    drawBushes();
    drawWalls();

    fighters.forEach(
        drawFighter
    );

    drawProjectiles();
    drawEffects();
    drawMiniMap();
    drawCrosshair();
}

function gameLoop() {
    update();
    draw();

    requestAnimationFrame(
        gameLoop
    );
}

startGame();
gameLoop();
</script>
