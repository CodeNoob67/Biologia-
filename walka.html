<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bitwa Królestw</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;

            background:
                radial-gradient(
                    circle at top,
                    #34405a,
                    #101621
                );
        }

        .topbar {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 18px;
            background: #111827;
            border-bottom: 4px solid #050912;
        }

        .logo {
            color: #ffd43b;
            font-size: 24px;
            font-weight: 900;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        button,
        .back-button {
            padding: 10px 15px;
            color: white;
            font-family: inherit;
            font-weight: 900;
            text-decoration: none;
            background: #35445e;
            border: 3px solid #080d16;
            border-radius: 10px;
            cursor: pointer;
        }

        .restart-button {
            background: #d34242;
        }

        .game-info {
            height: 58px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 7px;
        }

        .info-box {
            padding: 7px 13px;
            background: #26344b;
            border: 3px solid #101722;
            border-radius: 10px;
            font-weight: 900;
        }

        .game-container {
            position: relative;

            width: min(
                calc(100vh - 155px),
                96vw
            );

            height: min(
                calc(100vh - 155px),
                96vw
            );

            max-width: 900px;
            max-height: 900px;
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #58ad58;
            border: 7px solid #111827;
            border-radius: 12px;
            box-shadow: 0 15px 40px #00000099;
            cursor: crosshair;
        }

        .death-screen {
            position: absolute;
            inset: 7px;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            background: #000000aa;
            border-radius: 6px;
        }

        .death-screen.visible {
            display: flex;
        }

        .death-title {
            font-size: 54px;
            font-weight: 1000;
            text-shadow: 4px 4px black;
        }

        .return-button {
            min-width: 230px;
            padding: 18px 30px;
            color: #111827;
            font-size: 28px;
            font-weight: 1000;

            background:
                linear-gradient(
                    #ffd93d,
                    #f0a500
                );

            border: 5px solid #111827;
            border-radius: 14px;
            box-shadow: 0 7px 0 #00000077;
            cursor: pointer;
        }

        .controls {
            position: fixed;
            left: 15px;
            bottom: 12px;
            padding: 8px 12px;
            color: #d1d5db;
            font-size: 13px;
            background: #111827cc;
            border-radius: 8px;
        }

        @media (max-width: 700px) {
            .logo {
                font-size: 17px;
            }

            .topbar {
                padding: 8px;
            }

            .top-buttons button,
            .back-button {
                padding: 7px;
                font-size: 12px;
            }

            .info-box {
                font-size: 12px;
            }

            .death-title {
                font-size: 38px;
            }

            .controls {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="logo">

    </div>

</div>

</div>

<div class="controls">

window.addEventListener("keydown", function(event) {
    const key = event.key.toLowerCase();
    keys[key] = true;

    if (
        key === "arrowup" ||
        key === "arrowdown" ||
        key === "arrowleft" ||
        key === "arrowright"
    ) {
        event.preventDefault();
    }
});

window.addEventListener("keyup", function(event) {
    keys[event.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", function(event) {
    const rectangle = canvas.getBoundingClientRect();

    mouse.x =
        (event.clientX - rectangle.left) *
        canvas.width /
        rectangle.width;

    mouse.y =
        (event.clientY - rectangle.top) *
        canvas.height /
        rectangle.height;
});

canvas.addEventListener("mousedown", function(event) {
    if (event.button === 0) {
        mouse.down = true;
    }
});

window.addEventListener("mouseup", function(event) {
    if (event.button === 0) {
        mouse.down = false;
    }
});

canvas.addEventListener("contextmenu", function(event) {
    event.preventDefault();
});

function randomNumber(minimum, maximum) {
    return Math.random() * (maximum - minimum) + minimum;
}

function randomItem(array) {
    return array[
        Math.floor(Math.random() * array.length)
    ];
}

function distance(first, second) {
    return Math.hypot(
        first.x - second.x,
        first.y - second.y
    );
}

function normalize(dx, dy) {
    const length = Math.hypot(dx, dy) || 1;

    return {
        x: dx / length,
        y: dy / length
    };
}

function getCharacterStats(heroId) {
    return HERO_STATS[heroId] || HERO_STATS.farmer;
}

function createFighter(hero, x, y, isPlayer, number) {
    const stats = getCharacterStats(hero.id);

    return {
        id: isPlayer
            ? "player"
            : "bot-" + number,

        name: isPlayer
            ? "TY"
            : "BOT " + number,

        heroId: hero.id,
        heroName: hero.nazwa,
        icon: hero.ikona,

        x: x,
        y: y,
        radius: 28,

        hp: stats.hp,
        maxHp: stats.hp,

        damage: stats.damage,
        speed: stats.speed,
        range: stats.range,
        cooldown: stats.cooldown,

        projectileSpeed:
            stats.projectileSpeed || 0,

        projectileWidth:
            stats.projectileWidth || 0,

        projectileLife:
            stats.projectileLife || 0,

        melee: stats.melee,
        tripleShot: stats.tripleShot || false,

        shockwaveCooldown:
            stats.shockwaveCooldown || 0,

        shockwaveRadius:
            stats.shockwaveRadius || 0,

        shockwaveDamage:
            stats.shockwaveDamage || 0,

        shockwaveHeal:
            stats.shockwaveHeal || 0,

        isPlayer: isPlayer,
        alive: true,
        hidden: false,

        lastAttack: 0,
        lastShockwave: performance.now(),

        target: null,
        behavior: "wander",

        directionX: randomNumber(-1, 1),
        directionY: randomNumber(-1, 1),

        nextDecision:
            performance.now() +
            randomNumber(700, 2200),

        color:
            isPlayer
                ? "#36a9ff"
                : `hsl(${Math.random() * 360}, 70%, 55%)`
    };
}

function startGame() {
    resetMatchTrophies();
    
    const mapId =
        localStorage.getItem("selectedMap") ||
        "green";

    selectedMap =
        MAPS[mapId] ||
        MAPS.green;

    document
        .getElementById("mapName")
        .textContent =
        selectedMap.name;

    const state = getState();

    const selectedHero =
        getHero(state.selected) ||
        BOHATEROWIE[0];

    fighters = [];
    projectiles = [];
    shockwaves = [];

    winner = null;
    matchFinished = false;
    mouse.down = false;

    document
        .getElementById("deathScreen")
        .classList.remove("visible");

    player = createFighter(
        selectedHero,
        WORLD_WIDTH / 2,
        WORLD_HEIGHT - 220,
        true,
        0
    );

    fighters.push(player);

const spawnPositions = [
    { x: 180, y: 180 },

    {
        x: WORLD_WIDTH / 2,
        y: 180
    },

    {
        x: WORLD_WIDTH - 180,
        y: 180
    },

    {
        x: 180,
        y: WORLD_HEIGHT / 2
    },

    {
        x: WORLD_WIDTH - 180,
        y: WORLD_HEIGHT / 2
    },

    {
        x: 220,
        y: WORLD_HEIGHT - 220
    },

    {
        x: WORLD_WIDTH - 220,
        y: WORLD_HEIGHT - 220
    },

    {
        x: WORLD_WIDTH / 2 - 480,
        y: WORLD_HEIGHT / 2
    },

    {
        x: WORLD_WIDTH / 2 + 480,
        y: WORLD_HEIGHT / 2
    }
];
    
    for (let i = 0; i < 9; i++) {
        const randomHero =
            randomItem(BOHATEROWIE);

        const position =
            spawnPositions[i];

        fighters.push(
            createFighter(
                randomHero,
                position.x,
                position.y,
                false,
                i + 1
            )
        );
    }

    updateCamera();
    updateInformation();
}

function updateInformation() {
    const alive =
        fighters.filter(function(fighter) {
            return fighter.alive;
        }).length;

    document
        .getElementById("aliveCounter")
        .textContent =
        "Pozostało: " + alive;

    if (!player) {
        return;
    }

    document
        .getElementById("playerInfo")
        .textContent =
        player.icon +
        " " +
        player.heroName +
        " | ❤️ " +
        Math.max(0, Math.ceil(player.hp)) +
        (player.hidden
            ? " | 🌿 UKRYTY"
            : "");
}

function updateCamera() {
    if (!player) {
        return;
    }

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;

    camera.x = Math.max(
        0,
        Math.min(
            WORLD_WIDTH - canvas.width,
            camera.x
        )
    );

    camera.y = Math.max(
        0,
        Math.min(
            WORLD_HEIGHT - canvas.height,
            camera.y
        )
    );
}

function rectangleCollision(x, y, radius, rectangle) {
    const closestX = Math.max(
        rectangle.x,
        Math.min(
            x,
            rectangle.x + rectangle.w
        )
    );

    const closestY = Math.max(
        rectangle.y,
        Math.min(
            y,
            rectangle.y + rectangle.h
        )
    );

    const dx = x - closestX;
    const dy = y - closestY;

    return (
        dx * dx + dy * dy <
        radius * radius
    );
}

function collidesWithWall(x, y, radius) {
    return walls.some(function(wall) {
        return rectangleCollision(
            x,
            y,
            radius,
            wall
        );
    });
}

function moveFighter(fighter, dx, dy) {
    const nextX = Math.max(
        fighter.radius,
        Math.min(
            WORLD_WIDTH - fighter.radius,
            fighter.x + dx
        )
    );

    if (
        !collidesWithWall(
            nextX,
            fighter.y,
            fighter.radius
        )
    ) {
        fighter.x = nextX;
    }

    const nextY = Math.max(
        fighter.radius,
        Math.min(
            WORLD_HEIGHT - fighter.radius,
            fighter.y + dy
        )
    );

    if (
        !collidesWithWall(
            fighter.x,
            nextY,
            fighter.radius
        )
    ) {
        fighter.y = nextY;
    }
}

function pointInsideRectangle(x, y, rectangle) {
    return (
        x >= rectangle.x &&
        x <= rectangle.x + rectangle.w &&
        y >= rectangle.y &&
        y <= rectangle.y + rectangle.h
    );
}

function updateBushStatus() {
    fighters.forEach(function(fighter) {
        fighter.hidden =
            fighter.alive &&
            bushes.some(function(bush) {
                return pointInsideRectangle(
                    fighter.x,
                    fighter.y,
                    bush
                );
            });
    });
}

function canSeeFighter(observer, target) {
    if (!target.hidden) {
        return true;
    }

    return distance(observer, target) < 170;
}

function movePlayer() {
    if (
        !player ||
        !player.alive ||
        matchFinished
    ) {
        return;
    }

    let dx = 0;
    let dy = 0;

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {
        dy -= 1;
    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {
        dy += 1;
    }

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        dx -= 1;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        dx += 1;
    }

    if (
        dx !== 0 ||
        dy !== 0
    ) {
        const direction =
            normalize(dx, dy);

        moveFighter(
            player,
            direction.x * player.speed,
            direction.y * player.speed
        );
    }

    if (mouse.down) {
        const targetWorldX =
            mouse.x + camera.x;

        const targetWorldY =
            mouse.y + camera.y;

        attackTowards(
            player,
            targetWorldX,
            targetWorldY
        );
    }
}

function getPossibleTargets(fighter) {
    return fighters.filter(function(other) {
        return (
            other.alive &&
            other !== fighter &&
            canSeeFighter(
                fighter,
                other
            )
        );
    });
}

function chooseBotDecision(bot) {
    const targets =
        getPossibleTargets(bot);

    if (targets.length === 0) {
        bot.target = null;
        bot.behavior = "wander";
    } else {
        bot.target =
            randomItem(targets);

        const roll =
            Math.random();

        if (
            bot.hp <
            bot.maxHp * 0.3
        ) {
            bot.behavior =
                Math.random() < 0.75
                    ? "flee"
                    : "attack";
        } else if (roll < 0.58) {
            bot.behavior = "attack";
        } else if (roll < 0.82) {
            bot.behavior = "wander";
        } else {
            bot.behavior = "flee";
        }
    }

    bot.directionX =
        randomNumber(-1, 1);

    bot.directionY =
        randomNumber(-1, 1);

    bot.nextDecision =
        performance.now() +
        randomNumber(700, 2200);
}

function updateBot(bot, currentTime) {
    if (
        !bot.alive ||
        matchFinished
    ) {
        return;
    }

    if (
        currentTime >= bot.nextDecision ||
        !bot.target ||
        !bot.target.alive ||
        !canSeeFighter(
            bot,
            bot.target
        )
    ) {
        chooseBotDecision(bot);
    }

    if (bot.behavior === "wander") {
        const direction =
            normalize(
                bot.directionX,
                bot.directionY
            );

        moveFighter(
            bot,
            direction.x * bot.speed * 0.58,
            direction.y * bot.speed * 0.58
        );

        if (Math.random() < 0.015) {
            bot.directionX =
                randomNumber(-1, 1);

            bot.directionY =
                randomNumber(-1, 1);
        }

        return;
    }

    if (!bot.target) {
        return;
    }

    const dx =
        bot.target.x - bot.x;

    const dy =
        bot.target.y - bot.y;

    const direction =
        normalize(dx, dy);

    const targetDistance =
        distance(
            bot,
            bot.target
        );

    if (bot.behavior === "flee") {
        moveFighter(
            bot,
            -direction.x * bot.speed,
            -direction.y * bot.speed
        );

        if (Math.random() < 0.018) {
            attackTowards(
                bot,
                bot.target.x,
                bot.target.y
            );
        }

        return;
    }

    const preferredDistance =
        bot.melee
            ? bot.range * 0.7
            : Math.min(
                bot.range * 0.58,
                500
            );

    if (
        targetDistance >
        preferredDistance
    ) {
        moveFighter(
            bot,
            direction.x * bot.speed * 0.78,
            direction.y * bot.speed * 0.78
        );
    } else if (!bot.melee) {
        moveFighter(
            bot,
            -direction.x * bot.speed * 0.25,
            -direction.y * bot.speed * 0.25
        );
    }

    attackTowards(
        bot,
        bot.target.x,
        bot.target.y
    );
}

function attackTowards(attacker, targetX, targetY) {
    if (!attacker.alive) {
        return;
    }

    const currentTime =
        performance.now();

    if (
        currentTime -
        attacker.lastAttack <
        attacker.cooldown
    ) {
        return;
    }

    const dx =
        targetX - attacker.x;

    const dy =
        targetY - attacker.y;

    const direction =
        normalize(dx, dy);

    attacker.lastAttack =
        currentTime;

    attacker.hidden = false;

    if (attacker.melee) {
        const target =
            findTargetNearPoint(
                attacker,
                targetX,
                targetY
            );

        if (
            target &&
            distance(
                attacker,
                target
            ) <= attacker.range
        ) {
            damageFighter(
                target,
                attacker.damage,
                attacker
            );

            createMeleeEffect(
                attacker,
                direction
            );
        }

        return;
    }

    if (attacker.tripleShot) {
        createProjectile(
            attacker,
            direction,
            -0.14
        );

        createProjectile(
            attacker,
            direction,
            0
        );

        createProjectile(
            attacker,
            direction,
            0.14
        );

        return;
    }

    createProjectile(
        attacker,
        direction,
        0
    );
}

function findTargetNearPoint(attacker, targetX, targetY) {
    const targets =
        fighters.filter(function(fighter) {
            return (
                fighter.alive &&
                fighter !== attacker &&
                canSeeFighter(
                    attacker,
                    fighter
                )
            );
        });

    targets.sort(function(first, second) {
        const firstDistance =
            Math.hypot(
                first.x - targetX,
                first.y - targetY
            );

        const secondDistance =
            Math.hypot(
                second.x - targetX,
                second.y - targetY
            );

        return (
            firstDistance -
            secondDistance
        );
    });

    return targets[0] || null;
}

function rotateDirection(direction, angle) {
    return {
        x:
            direction.x * Math.cos(angle) -
            direction.y * Math.sin(angle),

        y:
            direction.x * Math.sin(angle) +
            direction.y * Math.cos(angle)
    };
}

function createProjectile(attacker, direction, angle) {
    const rotated =
        rotateDirection(
            direction,
            angle
        );

    let color = "#f9eda2";

    if (attacker.heroId === "farmer") {
        color = "#6b4327";
    }

    if (attacker.heroId === "krolowa") {
        color = "#df61ff";
    }

    if (attacker.heroId === "krol") {
        color = "#ffd638";
    }

    projectiles.push({
        x:
            attacker.x +
            rotated.x * 34,

        y:
            attacker.y +
            rotated.y * 34,

        vx:
            rotated.x *
            attacker.projectileSpeed,

        vy:
            rotated.y *
            attacker.projectileSpeed,

        radius:
            attacker.projectileWidth,

        damage:
            attacker.damage,

        owner:
            attacker,

        color: color,
        born: performance.now(),
        life: attacker.projectileLife
    });
}

function createMeleeEffect(attacker, direction) {
    shockwaves.push({
        x:
            attacker.x +
            direction.x * 38,

        y:
            attacker.y +
            direction.y * 38,

        radius: 25,
        maximumRadius:
            attacker.range,

        color: "#ffffff",
        born: performance.now(),
        life: 180,
        visualOnly: true
    });
}

function updateKingShockwaves(currentTime) {
    fighters.forEach(function(fighter) {
        if (
            !fighter.alive ||
            fighter.heroId !== "krol"
        ) {
            return;
        }

        if (
            currentTime -
            fighter.lastShockwave <
            fighter.shockwaveCooldown
        ) {
            return;
        }

        fighter.lastShockwave =
            currentTime;

        fighter.hp = Math.min(
            fighter.maxHp,
            fighter.hp +
            fighter.shockwaveHeal
        );

        fighters.forEach(function(target) {
            if (
                target !== fighter &&
                target.alive &&
                distance(
                    fighter,
                    target
                ) <=
                fighter.shockwaveRadius
            ) {
                damageFighter(
                    target,
                    fighter.shockwaveDamage,
                    fighter
                );
            }
        });

        shockwaves.push({
            x: fighter.x,
            y: fighter.y,
            radius: 20,

            maximumRadius:
                fighter.shockwaveRadius,

            color: "#ffd638",
            born: currentTime,
            life: 700,
            visualOnly: false
        });
    });
}

function damageFighter(target, damage, attacker) {
    if (!target.alive) {
        return;
    }

    target.hp -= damage;
    target.hidden = false;

    if (target.hp <= 0) {
        target.hp = 0;
        target.alive = false;
if (target === player) {
    const aliveAfterDeath =
        fighters.filter(
            function(fighter) {
                return fighter.alive;
            }
        ).length;

    const playerPlace =
        aliveAfterDeath + 1;

    awardTrophiesForPlace(
        playerPlace
    );

    showDeathScreen(false);
}
    }

    checkWinner();
    updateInformation();
}

function projectileHitsWall(projectile) {
    return walls.some(function(wall) {
        return rectangleCollision(
            projectile.x,
            projectile.y,
            projectile.radius,
            wall
        );
    });
}

function updateProjectiles(currentTime) {
    for (
        let i = projectiles.length - 1;
        i >= 0;
        i--
    ) {
        const projectile =
            projectiles[i];

        projectile.x +=
            projectile.vx;

        projectile.y +=
            projectile.vy;

        let remove = false;

        if (
            currentTime -
            projectile.born >
            projectile.life
        ) {
            remove = true;
        }

        if (
            projectile.x < 0 ||
            projectile.y < 0 ||
            projectile.x > WORLD_WIDTH ||
            projectile.y > WORLD_HEIGHT
        ) {
            remove = true;
        }

        if (
            projectileHitsWall(
                projectile
            )
        ) {
            remove = true;
        }

        if (!remove) {
            for (const fighter of fighters) {
                if (
                    !fighter.alive ||
                    fighter === projectile.owner
                ) {
                    continue;
                }

                if (
                    Math.hypot(
                        projectile.x -
                        fighter.x,

                        projectile.y -
                        fighter.y
                    ) <
                    projectile.radius +
                    fighter.radius
                ) {
                    damageFighter(
                        fighter,
                        projectile.damage,
                        projectile.owner
                    );

                    remove = true;
                    break;
                }
            }
        }

        if (remove) {
            projectiles.splice(i, 1);
        }
    }
}

function updateShockwaves(currentTime) {
    for (
        let i = shockwaves.length - 1;
        i >= 0;
        i--
    ) {
        const wave =
            shockwaves[i];

        const progress = Math.min(
            1,
            (
                currentTime -
                wave.born
            ) /
            wave.life
        );

        wave.radius =
            20 +
            (
                wave.maximumRadius -
                20
            ) *
            progress;

        if (progress >= 1) {
            shockwaves.splice(i, 1);
        }
    }
}

function checkWinner() {
    const alive =
        fighters.filter(function(fighter) {
            return fighter.alive;
        });

    if (
        alive.length !== 1 ||
        matchFinished
    ) {
        return;
    }

    winner = alive[0];
    matchFinished = true;

    if (winner === player) {
        awardTrophiesForPlace(1);
        
        const state =
            getState();

        state.tickets =
            (state.tickets || 0) + 4;

        state.coins =
            (state.coins || 0) + 50;

        state.wins =
            (state.wins || 0) + 1;

        saveState(state);
        showDeathScreen(true);
    } else if (!player.alive) {
        showDeathScreen(false);
    }
}

function showDeathScreen(playerWon) {
    const deathScreen =
        document.getElementById(
            "deathScreen"
        );

    const deathTitle =
        document.getElementById(
            "deathTitle"
        );

    deathTitle.textContent =
        playerWon
            ? "ZWYCIĘSTWO!"
            : "POKONANY";

    deathScreen.classList.add(
        "visible"
    );
}

function update() {
    if (matchFinished) {
        return;
    }

    movePlayer();

    const currentTime =
        performance.now();

    fighters.forEach(function(fighter) {
        if (!fighter.isPlayer) {
            updateBot(
                fighter,
                currentTime
            );
        }
    });

    updateBushStatus();
    updateProjectiles(currentTime);
    updateKingShockwaves(currentTime);
    updateShockwaves(currentTime);
    updateCamera();
    updateInformation();
    checkWinner();
}

function worldToScreenX(x) {
    return x - camera.x;
}

function worldToScreenY(y) {
    return y - camera.y;
}

function objectVisible(x, y, width, height) {
    return (
        x + width >= camera.x &&
        x <= camera.x + canvas.width &&
        y + height >= camera.y &&
        y <= camera.y + canvas.height
    );
}

function drawMap() {
    ctx.fillStyle =
        selectedMap.ground;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const tileSize = 100;

    const startColumn =
        Math.floor(
            camera.x / tileSize
        );

    const endColumn =
        Math.ceil(
            (
                camera.x +
                canvas.width
            ) /
            tileSize
        );

    const startRow =
        Math.floor(
            camera.y / tileSize
        );

    const endRow =
        Math.ceil(
            (
                camera.y +
                canvas.height
            ) /
            tileSize
        );

    for (
        let column = startColumn;
        column <= endColumn;
        column++
    ) {
        for (
            let row = startRow;
            row <= endRow;
            row++
        ) {
            if (
                (
                    column +
                    row
                ) % 2 === 0
            ) {
                ctx.fillStyle =
                    selectedMap.groundDark;

                ctx.fillRect(
                    column *
                    tileSize -
                    camera.x,

                    row *
                    tileSize -
                    camera.y,

                    tileSize,
                    tileSize
                );
            }
        }
    }

    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 10;

    ctx.strokeRect(
        -camera.x,
        -camera.y,
        WORLD_WIDTH,
        WORLD_HEIGHT
    );
}

function drawWalls() {
    walls.forEach(function(wall) {
        if (
            !objectVisible(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            )
        ) {
            return;
        }

        const x =
            worldToScreenX(wall.x);

        const y =
            worldToScreenY(wall.y);

        ctx.fillStyle = "#00000044";

        ctx.fillRect(
            x + 8,
            y + 10,
            wall.w,
            wall.h
        );

        ctx.fillStyle =
            selectedMap.wall;

        ctx.fillRect(
            x,
            y,
            wall.w,
            wall.h
        );

        ctx.fillStyle =
            selectedMap.wallTop;

        ctx.fillRect(
            x,
            y,
            wall.w,
            Math.min(24, wall.h)
        );

        ctx.strokeStyle = "#32271e";
        ctx.lineWidth = 4;

        ctx.strokeRect(
            x,
            y,
            wall.w,
            wall.h
        );

        for (
            let brickX = 18;
            brickX < wall.w;
            brickX += 45
        ) {
            ctx.beginPath();

            ctx.moveTo(
                x + brickX,
                y
            );

            ctx.lineTo(
                x + brickX,
                y + Math.min(24, wall.h)
            );

            ctx.stroke();
        }
    });
}

function drawBushes() {
    bushes.forEach(function(bush) {
        if (
            !objectVisible(
                bush.x,
                bush.y,
                bush.w,
                bush.h
            )
        ) {
            return;
        }

        const x =
            worldToScreenX(bush.x);

        const y =
            worldToScreenY(bush.y);

        ctx.fillStyle =
            selectedMap.bush;

        ctx.fillRect(
            x,
            y,
            bush.w,
            bush.h
        );

        ctx.fillStyle =
            selectedMap.bushLight;

        const leafSize = 34;

        for (
            let leafX = 8;
            leafX < bush.w;
            leafX += leafSize
        ) {
            for (
                let leafY = 8;
                leafY < bush.h;
                leafY += leafSize
            ) {
                ctx.beginPath();

                ctx.arc(
                    x +
                    leafX +
                    randomStaticOffset(
                        bush.x +
                        leafX
                    ),

                    y +
                    leafY +
                    randomStaticOffset(
                        bush.y +
                        leafY
                    ),

                    16,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }
        }

        ctx.strokeStyle = "#183c22";
        ctx.lineWidth = 4;

        ctx.strokeRect(
            x,
            y,
            bush.w,
            bush.h
        );
    });
}

function randomStaticOffset(value) {
    return Math.sin(value * 12.345) * 4;
}

function drawHealthBar(fighter, screenX, screenY) {
    const width = 62;
    const height = 9;

    const x =
        screenX -
        width / 2;

    const y =
        screenY -
        fighter.radius -
        27;

    ctx.fillStyle = "#281b20";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.fillStyle =
        fighter.isPlayer
            ? "#42de63"
            : "#ef4d4d";

    ctx.fillRect(
        x,
        y,

        width *
        Math.max(
            0,
            fighter.hp /
            fighter.maxHp
        ),

        height
    );

    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );
}

function drawFighter(fighter) {
    if (!fighter.alive) {
        return;
    }

    const screenX =
        worldToScreenX(fighter.x);

    const screenY =
        worldToScreenY(fighter.y);

    if (
        screenX < -80 ||
        screenY < -80 ||
        screenX > canvas.width + 80 ||
        screenY > canvas.height + 80
    ) {
        return;
    }

    const visibleToPlayer =
        fighter === player ||
        !fighter.hidden ||
        (
            player.alive &&
            distance(
                player,
                fighter
            ) < 170
        );

    if (!visibleToPlayer) {
        return;
    }

    ctx.save();

    if (
        fighter.hidden &&
        fighter !== player
    ) {
        ctx.globalAlpha = 0.4;
    }

    if (
        fighter.hidden &&
        fighter === player
    ) {
        ctx.globalAlpha = 0.65;
    }

    ctx.beginPath();

    ctx.arc(
        screenX,
        screenY,
        fighter.radius + 7,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        fighter.color;

    ctx.fill();

    ctx.strokeStyle =
        fighter.isPlayer
            ? "white"
            : "#111827";

    ctx.lineWidth =
        fighter.isPlayer
            ? 5
            : 3;

    ctx.stroke();

    ctx.font = "43px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        fighter.icon,
        screenX,
        screenY
    );

    ctx.font = "bold 13px Arial";
    ctx.strokeStyle = "black";
    ctx.lineWidth = 4;

    ctx.strokeText(
        fighter.name,
        screenX,
        screenY + 49
    );

    ctx.fillStyle = "white";

    ctx.fillText(
        fighter.name,
        screenX,
        screenY + 49
    );

    drawHealthBar(
        fighter,
        screenX,
        screenY
    );

    if (fighter.hidden) {
        ctx.font = "20px Arial";

        ctx.fillText(
            "🌿",
            screenX + 28,
            screenY - 28
        );
    }

    ctx.restore();
}

function drawProjectiles() {
    projectiles.forEach(function(projectile) {
        const screenX =
            worldToScreenX(
                projectile.x
            );

        const screenY =
            worldToScreenY(
                projectile.y
            );

        if (
            screenX < -40 ||
            screenY < -40 ||
            screenX > canvas.width + 40 ||
            screenY > canvas.height + 40
        ) {
            return;
        }

        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            projectile.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            projectile.color;

        ctx.fill();

        ctx.strokeStyle = "#111827";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            screenX,
            screenY
        );

        ctx.lineTo(
            screenX -
            projectile.vx * 3,

            screenY -
            projectile.vy * 3
        );

        ctx.strokeStyle =
            projectile.color;

        ctx.lineWidth =
            projectile.radius;

        ctx.stroke();
    });
}

function drawShockwaves() {
    shockwaves.forEach(function(wave) {
        const screenX =
            worldToScreenX(wave.x);

        const screenY =
            worldToScreenY(wave.y);

        const remaining = Math.max(
            0,
            1 -
            (
                performance.now() -
                wave.born
            ) /
            wave.life
        );

        ctx.save();
        ctx.globalAlpha = remaining;
        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            wave.radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            wave.color;

        ctx.lineWidth =
            wave.visualOnly
                ? 12
                : 18;

        ctx.stroke();
        ctx.restore();
    });
}

function drawMiniMap() {
    const width = 155;
    const height = 155;

    const x =
        canvas.width -
        width -
        16;

    const y = 16;

    ctx.fillStyle = "#111827cc";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.fillStyle =
        selectedMap.ground;

    ctx.fillRect(
        x + 5,
        y + 5,
        width - 10,
        height - 10
    );

    fighters.forEach(function(fighter) {
        if (!fighter.alive) {
            return;
        }

        const dotX =
            x + 5 +
            fighter.x /
            WORLD_WIDTH *
            (width - 10);

        const dotY =
            y + 5 +
            fighter.y /
            WORLD_HEIGHT *
            (height - 10);

        ctx.beginPath();

        ctx.arc(
            dotX,
            dotY,
            fighter.isPlayer
                ? 5
                : 3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            fighter.isPlayer
                ? "#36a9ff"
                : "#ef4d4d";

        ctx.fill();
    });

    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );
}

function drawCrosshair() {
    if (
        !player ||
        !player.alive ||
        matchFinished
    ) {
        return;
    }

    ctx.beginPath();

    ctx.arc(
        mouse.x,
        mouse.y,
        13,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "#ffffffcc";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        mouse.x - 19,
        mouse.y
    );

    ctx.lineTo(
        mouse.x + 19,
        mouse.y
    );

    ctx.moveTo(
        mouse.x,
        mouse.y - 19
    );

    ctx.lineTo(
        mouse.x,
        mouse.y + 19
    );

    ctx.stroke();
}

function draw() {
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMap();
    drawBushes();
    drawWalls();

    fighters.forEach(
        drawFighter
    );

    drawProjectiles();
    drawShockwaves();
    drawMiniMap();
    drawCrosshair();
}

function gameLoop() {
    update();
    draw();

    requestAnimationFrame(
        gameLoop
    );
}

startGame();
gameLoop();
</script>
