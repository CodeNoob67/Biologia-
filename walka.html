            priest,

        alive: true,
        hidden: false,
        moving: false,

        lastAttack: 0,

        target: null,

        behavior:
            "attack",

        directionX: 0,
        directionY: 0,

        nextDecision: 0,

        color:
            "#9cecff"
    });
}

function updatePriestSummons(
    currentTime
) {
    fighters
        .slice()
        .forEach(
            function(fighter) {
                if (
                    !fighter.alive ||
                    fighter.isSummon ||
                    !fighter.summonsGhosts
                ) {
                    return;
                }

                const summons =
                    fighters.filter(
                        function(other) {
                            return (
                                other.alive &&
                                other.isSummon &&
                                other.summoner ===
                                fighter
                            );
                        }
                    );

                if (
                    summons.length >=
                    fighter.maximumSummons
                ) {
                    return;
                }

                if (
                    currentTime -
                    fighter.lastSummon <
                    fighter.summonCooldown
                ) {
                    return;
                }

                fighter.lastSummon =
                    currentTime;

                createSummonedGhost(
                    fighter
                );
            }
        );
}

function updateSummon(
    summon
) {
    if (
        !summon.alive ||
        !summon.summoner ||
        !summon.summoner.alive
    ) {
        summon.alive =
            false;

        return;
    }

    if (
        !summon.target ||
        !summon.target.alive ||
        !isEnemy(
            summon,
            summon.target
        )
    ) {
        summon.target =
            getNearestTarget(
                summon
            );
    }

    if (!summon.target) {
        summon.moving =
            false;

        return;
    }

    const direction =
        normalize(
            summon.target.x -
            summon.x,

            summon.target.y -
            summon.y
        );

    if (
        distance(
            summon,
            summon.target
        ) >
        summon.range *
        0.75
    ) {
        summon.moving =
            true;

        moveFighter(
            summon,

            direction.x *
            summon.speed,

            direction.y *
            summon.speed
        );
    } else {
        summon.moving =
            false;
    }

    attackTowards(
        summon,
        summon.target.x,
        summon.target.y
    );
}

function damageFighter(
    target,
    damage,
    attacker
) {
    if (!target.alive) {
        return;
    }

    let finalDamage =
        Number(
            damage
        ) || 0;

    if (
        target.cursedUntil >
        performance.now()
    ) {
        finalDamage *=
            target
                .receivedDamageMultiplier;
    } else {
        target.receivedDamageMultiplier =
            1;
    }

    if (
        target.lowHpShield &&
        target.hp <=
        target.maxHp *
        target.shieldThreshold
    ) {
        finalDamage *=
            1 -
            target.shieldReduction;
    }

    finalDamage =
        Math.max(
            1,
            Math.round(
                finalDamage
            )
        );

    target.hp -=
        finalDamage;

    target.hidden =
        false;

    createTextEffect(
        target.x,
        target.y - 38,

        "-" +
        finalDamage,

        "#ff6666"
    );

    if (
        target.hp <= 0
    ) {
        target.hp =
            0;

        target.alive =
            false;

        if (
            target === player
        ) {
            const placement =
                getAlivePlayers()
                    .length +
                1;

            awardTrophies(
                placement
            );

            showDeathScreen(
                false
            );
        }
    }

    checkWinner();
    updateInformation();
}

function updateProjectiles(
    currentTime
) {
    for (
        let index =
            projectiles.length - 1;

        index >= 0;

        index--
    ) {
        const projectile =
            projectiles[index];

        projectile.x +=
            projectile.vx;

        projectile.y +=
            projectile.vy;

        let remove =
            false;

        if (
            currentTime -
            projectile.born >
            projectile.life
        ) {
            remove =
                true;
        }

        if (
            projectile.x < 0 ||
            projectile.y < 0 ||
            projectile.x >
            WORLD_WIDTH ||
            projectile.y >
            WORLD_HEIGHT
        ) {
            remove =
                true;
        }

        if (
            !remove &&
            isBlocked(
                projectile.x,
                projectile.y,
                projectile.radius
            )
        ) {
            remove =
                true;
        }

        if (!remove) {
            for (
                const fighter
                of fighters
            ) {
                if (
                    !isEnemy(
                        projectile.owner,
                        fighter
                    )
                ) {
                    continue;
                }

                if (
                    distance(
                        projectile,
                        fighter
                    ) <
                    projectile.radius +
                    fighter.radius
                ) {
                    damageFighter(
                        fighter,

                        projectile.damage,

                        projectile.owner
                    );

                    if (
                        projectile.curse
                    ) {
                        fighter.cursedUntil =
                            performance.now() +
                            projectile
                                .curseDuration;

                        fighter.receivedDamageMultiplier =
                            projectile
                                .curseMultiplier;

                        createTextEffect(
                            fighter.x,
                            fighter.y - 62,
                            "KLĄTWA!",
                            "#bb62ff"
                        );
                    }

                    remove =
                        true;

                    break;
                }
            }
        }

        if (remove) {
            projectiles.splice(
                index,
                1
            );
        }
    }
}

function updateWaves(
    currentTime
) {
    for (
        let index =
            waves.length - 1;

        index >= 0;

        index--
    ) {
        const wave =
            waves[index];

        wave.x +=
            wave.directionX *
            wave.speed;

        wave.y +=
            wave.directionY *
            wave.speed;

        wave.traveled +=
            wave.speed;

        const width =
            wave.minimumWidth +
            wave.traveled *
            wave.spread;

        let remove =
            false;

        if (
            currentTime -
            wave.born >
            wave.life
        ) {
            remove =
                true;
        }

        if (
            wave.x < 0 ||
            wave.y < 0 ||
            wave.x >
            WORLD_WIDTH ||
            wave.y >
            WORLD_HEIGHT
        ) {
            remove =
                true;
        }

        if (
            !remove &&
            isBlocked(
                wave.x,
                wave.y,

                Math.min(
                    width,
                    55
                )
            )
        ) {
            remove =
                true;
        }

        if (!remove) {
            for (
                const fighter
                of fighters
            ) {
                if (
                    !isEnemy(
                        wave.owner,
                        fighter
                    )
                ) {
                    continue;
                }

                if (
                    distance(
                        wave,
                        fighter
                    ) <=
                    width +
                    fighter.radius
                ) {
                    damageFighter(
                        fighter,
                        wave.damage,
                        wave.owner
                    );

                    if (
                        wave.ultra
                    ) {
                        fighter.stunnedUntil =
                            performance.now() +
                            wave.stunDuration;

                        createTextEffect(
                            fighter.x,
                            fighter.y - 62,
                            "ZATRZYMANY!",
                            "#ffe342"
                        );
                    }

                    remove =
                        true;

                    break;
                }
            }
        }

        if (remove) {
            waves.splice(
                index,
                1
            );
        }
    }
}

function updatePotions(
    currentTime
) {
    for (
        let index =
            potionProjectiles.length -
            1;

        index >= 0;

        index--
    ) {
        const potion =
            potionProjectiles[
                index
            ];

        potion.x +=
            potion.vx;

        potion.y +=
            potion.vy;

        let remove =
            false;

        if (
            currentTime -
            potion.born >
            potion.life
        ) {
            remove =
                true;
        }

        if (
            isBlocked(
                potion.x,
                potion.y,
                potion.radius
            )
        ) {
            remove =
                true;
        }

        if (!remove) {
            for (
                const fighter
                of fighters
            ) {
                if (
                    !fighter.alive ||
                    fighter ===
                    potion.owner
                ) {
                    continue;
                }

                if (
                    distance(
                        potion,
                        fighter
                    ) >
                    potion.radius +
                    fighter.radius
                ) {
                    continue;
                }

                if (
                    potion.type ===
                    "damage" &&
                    isEnemy(
                        potion.owner,
                        fighter
                    )
                ) {
                    damageFighter(
                        fighter,

                        potion.owner
                            .potionDamage,

                        potion.owner
                    );

                    remove =
                        true;
                }

                if (
                    potion.type ===
                    "stun" &&
                    isEnemy(
                        potion.owner,
                        fighter
                    )
                ) {
                    fighter.stunnedUntil =
                        performance.now() +
                        potion.owner
                            .potionStunDuration;

                    createTextEffect(
                        fighter.x,
                        fighter.y - 55,
                        "ZATRZYMANY!",
                        "#ffe342"
                    );

                    remove =
                        true;
                }
            }
        }

        if (
            !remove &&
            potion.type ===
            "heal" &&
            distance(
                potion,
                potion.owner
            ) <
            potion.radius +
            potion.owner.radius
        ) {
            potion.owner.hp =
                Math.min(
                    potion.owner.maxHp,

                    potion.owner.hp +
                    potion.owner
                        .potionHealing
                );

            createTextEffect(
                potion.owner.x,
                potion.owner.y - 45,

                "+" +
                potion.owner
                    .potionHealing,

                "#61ff75"
            );

            remove =
                true;
        }

        if (
            !remove &&
            potion.type ===
            "speed" &&
            distance(
                potion,
                potion.owner
            ) <
            potion.radius +
            potion.owner.radius
        ) {
            potion.owner.speed =
                potion.owner
                    .normalSpeed *
                potion.owner
                    .potionSpeedMultiplier;

            potion.owner.speedBoostUntil =
                performance.now() +
                potion.owner
                    .potionSpeedDuration;

            createTextEffect(
                potion.owner.x,
                potion.owner.y - 45,
                "PRZYSPIESZENIE!",
                "#53d8ff"
            );

            remove =
                true;
        }

        if (remove) {
            potionProjectiles.splice(
                index,
                1
            );
        }
    }
}

function createCircleEffect(
    x,
    y,
    startRadius,
    endRadius,
    color,
    duration,
    lineWidth
) {
    effects.push({
        type:
            "circle",

        x: x,
        y: y,

        radius:
            startRadius,

        startRadius:
            startRadius,

        endRadius:
            endRadius,

        color:
            color,

        born:
            performance.now(),

        duration:
            duration,

        lineWidth:
            lineWidth
    });
}

function createTextEffect(
    x,
    y,
    text,
    color
) {
    effects.push({
        type:
            "text",

        x: x,
        y: y,

        text:
            text,

        color:
            color,

        born:
            performance.now(),

        duration:
            700
    });
}

function updateEffects(
    currentTime
) {
    for (
        let index =
            effects.length - 1;

        index >= 0;

        index--
    ) {
        const effect =
            effects[index];

        const progress =
            (
                currentTime -
                effect.born
            ) /
            effect.duration;

        if (
            effect.type ===
            "circle"
        ) {
            effect.radius =
                effect.startRadius +
                (
                    effect.endRadius -
                    effect.startRadius
                ) *
                Math.min(
                    1,
                    progress
                );
        }

        if (progress >= 1) {
            effects.splice(
                index,
                1
            );
        }
    }
}

function awardTrophies(
    placement
) {
    if (
        trophiesAwarded ||
        !player
    ) {
        return;
    }

    trophiesAwarded =
        true;

    const safePlacement =
        clamp(
            Math.floor(
                placement
            ),
            1,
            10
        );

    const reward =
        TROPHY_REWARDS[
            safePlacement
        ] || 0;

    const state =
        getState();

    if (
        !state.heroTrophies ||
        typeof state.heroTrophies !==
        "object"
    ) {
        state.heroTrophies =
            {};
    }

    const before =
        Math.max(
            0,

            Number(
                state.heroTrophies[
                    player.heroId
                ]
            ) || 0
        );

    const after =
        Math.max(
            0,
            before +
            reward
        );

    const realChange =
        after -
        before;

    state.heroTrophies[
        player.heroId
    ] =
        after;

    saveState(
        state
    );

    document
        .getElementById(
            "matchResult"
        )
        .innerHTML =
        "Miejsce: <b>" +
        safePlacement +
        "</b><br>" +
        "Zmiana pucharków: <b>" +
        (
            realChange > 0
                ? "+"
                : ""
        ) +
        realChange +
        "</b><br>" +
        player.heroName +
        " ma teraz: <b>🏆 " +
        after +
        "</b>";
}

function checkWinner() {
    const alivePlayers =
        getAlivePlayers();

    if (
        alivePlayers.length !== 1 ||
        matchFinished
    ) {
        return;
    }

    matchFinished =
        true;

    if (
        alivePlayers[0] ===
        player
    ) {
        awardTrophies(
            1
        );

        const state =
            getState();

        state.tickets =
            (
                Number(
                    state.tickets
                ) || 0
            ) +
            4;

        state.coins =
            (
                Number(
                    state.coins
                ) || 0
            ) +
            50;

        state.wins =
            (
                Number(
                    state.wins
                ) || 0
            ) +
            1;

        saveState(
            state
        );

        showDeathScreen(
            true
        );
    }
}

function showDeathScreen(
    victory
) {
    phase =
        "finished";

    resetAttackJoystick();

    document
        .getElementById(
            "deathTitle"
        )
        .textContent =
        victory
            ? "ZWYCIĘSTWO!"
            : "POKONANY";

    document
        .getElementById(
            "deathScreen"
        )
        .classList
        .add(
            "visible"
        );
}

function updateInformation() {
    document
        .getElementById(
            "aliveCounter"
        )
        .textContent =
        "Pozostało: " +
        getAlivePlayers()
            .length;

    if (!player) {
        return;
    }

    let information =
        "";

    if (player.hidden) {
        information +=
            " | 🌿 UKRYTY";
    }

    if (
        player.canPassWalls
    ) {
        information +=
            " | 🧱 PRZENIKANIE";
    }

    if (
        player.stunnedUntil >
        performance.now()
    ) {
        information +=
            " | ⚡ ZATRZYMANY";
    }

    if (
        player.cursedUntil >
        performance.now()
    ) {
        information +=
            " | 🔮 KLĄTWA";
    }

    if (
        player.lowHpShield &&
        player.hp <=
        player.maxHp *
        player.shieldThreshold
    ) {
        information +=
            " | 🛡️ TARCZA";
    }

    document
        .getElementById(
            "playerInfo"
        )
        .textContent =
        player.icon +
        " " +
        player.heroName +
        " | ❤️ " +
        Math.max(
            0,
            Math.ceil(
                player.hp
            )
        ) +
        information;
}

function update() {
    const currentTime =
        performance.now();

    if (
        phase === "intro"
    ) {
        updateIntro(
            currentTime
        );

        updateEffects(
            currentTime
        );

        return;
    }

    if (
        phase !== "playing" ||
        matchFinished
    ) {
        updateEffects(
            currentTime
        );

        return;
    }

    movePlayer();

    fighters
        .slice()
        .forEach(
            function(fighter) {
                if (
                    fighter.isSummon
                ) {
                    updateSummon(
                        fighter
                    );
                } else if (
                    !fighter.isPlayer
                ) {
                    updateBot(
                        fighter,
                        currentTime
                    );
                }
            }
        );

    updatePriestSummons(
        currentTime
    );

    updateVampires(
        currentTime
    );

    updateSwordsmen(
        currentTime
    );

    updateBushStatus();

    updateProjectiles(
        currentTime
    );

    updateWaves(
        currentTime
    );

    updatePotions(
        currentTime
    );

    updateEffects(
        currentTime
    );

    updateCamera();
    updateInformation();
    checkWinner();
}

function worldToScreenX(
    worldX
) {
    return (
        worldX -
        camera.x
    );
}

function worldToScreenY(
    worldY
) {
    return (
        worldY -
        camera.y
    );
}

function isVisible(
    x,
    y,
    width,
    height
) {
    return (
        x + width >=
        camera.x &&
        x <=
        camera.x +
        canvas.width &&
        y + height >=
        camera.y &&
        y <=
        camera.y +
        canvas.height
    );
}

function drawGround() {
    ctx.fillStyle =
        selectedMap.ground;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const tileSize =
        80;

    const startColumn =
        Math.floor(
            camera.x /
            tileSize
        );

    const endColumn =
        Math.ceil(
            (
                camera.x +
                canvas.width
            ) /
            tileSize
        );

    const startRow =
        Math.floor(
            camera.y /
            tileSize
        );

    const endRow =
        Math.ceil(
            (
                camera.y +
                canvas.height
            ) /
            tileSize
        );

    for (
        let column =
            startColumn;

        column <=
        endColumn;

        column++
    ) {
        for (
            let row =
                startRow;

            row <=
            endRow;

            row++
        ) {
            if (
                (
                    column +
                    row
                ) %
                2 === 0
            ) {
                ctx.fillStyle =
                    selectedMap
                        .groundDark;

                ctx.fillRect(
                    column *
                    tileSize -
                    camera.x,

                    row *
                    tileSize -
                    camera.y,

                    tileSize,
                    tileSize
                );
            }
        }
    }
}

function drawWater() {
    waterPools.forEach(
        function(water) {
            if (
                !isVisible(
                    water.x,
                    water.y,
                    water.w,
                    water.h
                )
            ) {
                return;
            }

            const x =
                worldToScreenX(
                    water.x
                );

            const y =
                worldToScreenY(
                    water.y
                );

            ctx.fillStyle =
                "#153e68";

            ctx.fillRect(
                x - 6,
                y - 6,
                water.w + 12,
                water.h + 12
            );

            ctx.fillStyle =
                selectedMap.water;

            ctx.fillRect(
                x,
                y,
                water.w,
                water.h
            );

            ctx.fillStyle =
                selectedMap
                    .waterLight;

            for (
                let waveX = 15;

                waveX <
                water.w;

                waveX += 50
            ) {
                ctx.fillRect(
                    x + waveX,
                    y + 18,
                    26,
                    5
                );
            }
        }
    );
}

function drawBushes() {
    bushes.forEach(
        function(bush) {
            if (
                !isVisible(
                    bush.x,
                    bush.y,
                    bush.w,
                    bush.h
                )
            ) {
                return;
            }

            const x =
                worldToScreenX(
                    bush.x
                );

            const y =
                worldToScreenY(
                    bush.y
                );

            ctx.fillStyle =
                selectedMap.bush;

            ctx.fillRect(
                x,
                y,
                bush.w,
                bush.h
            );

            ctx.fillStyle =
                selectedMap
                    .bushLight;

            for (
                let leafX = 12;

                leafX <
                bush.w;

                leafX += 34
            ) {
                for (
                    let leafY = 12;

                    leafY <
                    bush.h;

                    leafY += 34
                ) {
                    ctx.beginPath();

                    ctx.arc(
                        x + leafX,
                        y + leafY,
                        15,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();
                }
            }
        }
    );
}

function drawWalls() {
    walls.forEach(
        function(wall) {
            if (
                !isVisible(
                    wall.x,
                    wall.y,
                    wall.w,
                    wall.h
                )
            ) {
                return;
            }

            const x =
                worldToScreenX(
                    wall.x
                );

            const y =
                worldToScreenY(
                    wall.y
                );

            ctx.fillStyle =
                "#00000044";

            ctx.fillRect(
                x + 9,
                y + 11,
                wall.w,
                wall.h
            );

            ctx.fillStyle =
                selectedMap.wall;

            ctx.fillRect(
                x,
                y,
                wall.w,
                wall.h
            );

            ctx.fillStyle =
                selectedMap
                    .wallTop;

            ctx.fillRect(
                x,
                y,
                wall.w,
                Math.min(
                    24,
                    wall.h
                )
            );

            ctx.strokeStyle =
                selectedMap
                    .brickLine;

            ctx.lineWidth =
                4;

            ctx.strokeRect(
                x,
                y,
                wall.w,
                wall.h
            );
        }
    );
}

function drawHealthBar(
    fighter,
    x,
    y
) {
    const width =
        fighter.isSummon
            ? 42
            : 62;

    const height =
        fighter.isSummon
            ? 6
            : 9;

    const barX =
        x -
        width / 2;

    const barY =
        y -
        fighter.radius -
        27;

    ctx.fillStyle =
        "#281b20";

    ctx.fillRect(
        barX,
        barY,
        width,
        height
    );

    ctx.fillStyle =
        fighter.isPlayer
            ? "#42de63"
            : fighter.isSummon
                ? "#6fe6ff"
                : "#ef4d4d";

    ctx.fillRect(
        barX,
        barY,

        width *
        Math.max(
            0,
            fighter.hp /
            fighter.maxHp
        ),

        height
    );

    ctx.strokeStyle =
        "#111827";

    ctx.lineWidth =
        2;

    ctx.strokeRect(
        barX,
        barY,
        width,
        height
    );
}

function drawBatSwarm(
    x,
    y
) {
    const time =
        performance.now() /
        120;

    ctx.font =
        "24px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    for (
        let index = 0;

        index < 6;

        index++
    ) {
        const angle =
            time +
            index *
            Math.PI *
            2 /
            6;

        const radius =
            25 +
            Math.sin(
                time +
                index
            ) *
            7;

        ctx.fillText(
            "🦇",

            x +
            Math.cos(
                angle
            ) *
            radius,

            y +
            Math.sin(
                angle
            ) *
            radius
        );
    }
}

function drawFighter(
    fighter
) {
    if (!fighter.alive) {
        return;
    }

    const x =
        worldToScreenX(
            fighter.x
        );

    const y =
        worldToScreenY(
            fighter.y
        );

    if (
        x < -100 ||
        y < -100 ||
        x >
        canvas.width +
        100 ||
        y >
        canvas.height +
        100
    ) {
        return;
    }

    const visible =
        fighter === player ||
        !fighter.hidden ||
        (
            player &&
            player.alive &&
            distance(
                player,
                fighter
            ) < 170
        );

    if (!visible) {
        return;
    }

    ctx.save();

    if (fighter.hidden) {
        ctx.globalAlpha =
            fighter === player
                ? 0.65
                : 0.4;
    }

    if (
        fighter.heroId ===
        "duch" ||
        fighter.isSummon
    ) {
        ctx.globalAlpha *=
            0.78;
    }

    if (
        fighter.swordsman &&
        fighter.moving
    ) {
        ctx.translate(
            x,
            y
        );

        ctx.rotate(
            performance.now() /
            100
        );

        ctx.font =
            "50px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "⚔️",
            0,
            0
        );

        ctx.setTransform(
            1,
            0,
            0,
            1,
            0,
            0
        );
    } else if (
        fighter.transformed
    ) {
        drawBatSwarm(
            x,
            y
        );
    } else {
        ctx.beginPath();

        ctx.arc(
            x,
            y,
            fighter.radius + 7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            fighter.color;

        ctx.fill();

        ctx.strokeStyle =
            fighter.isPlayer
                ? "white"
                : "#111827";

        ctx.lineWidth =
            fighter.isPlayer
                ? 5
                : 3;

        ctx.stroke();

        ctx.font =
            fighter.isSummon
                ? "31px Arial"
                : "43px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            fighter.icon,
            x,
            y
        );
    }

    ctx.font =
        fighter.isSummon
            ? "bold 10px Arial"
            : "bold 13px Arial";

    ctx.textAlign =
        "center";

    ctx.strokeStyle =
        "black";

    ctx.lineWidth =
        4;

    ctx.strokeText(
        fighter.name,
        x,
        y +
        fighter.radius +
        21
    );

    ctx.fillStyle =
        "white";

    ctx.fillText(
        fighter.name,
        x,
        y +
        fighter.radius +
        21
    );

    drawHealthBar(
        fighter,
        x,
        y
    );

    ctx.restore();
}

function drawProjectiles() {
    projectiles.forEach(
        function(projectile) {
            const x =
                worldToScreenX(
                    projectile.x
                );

            const y =
                worldToScreenY(
                    projectile.y
                );

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                projectile.radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                projectile.color;

            ctx.fill();

            ctx.strokeStyle =
                "#111827";

            ctx.lineWidth =
                2;

            ctx.stroke();
        }
    );
}

function drawWaves() {
    waves.forEach(
        function(wave) {
            const x =
                worldToScreenX(
                    wave.x
                );

            const y =
                worldToScreenY(
                    wave.y
                );

            const angle =
                Math.atan2(
                    wave.directionY,
                    wave.directionX
                );

            const width =
                wave.minimumWidth +
                wave.traveled *
                wave.spread;

            ctx.save();

            ctx.translate(
                x,
                y
            );

            ctx.rotate(
                angle
            );

            ctx.strokeStyle =
                wave.color;

            ctx.shadowColor =
                wave.color;

            ctx.shadowBlur =
                wave.ultra
                    ? 18
                    : 10;

            ctx.lineWidth =
                wave.ultra
                    ? 8
                    : 6;

            [
                width * 0.45,
                width * 0.72,
                width
            ].forEach(
                function(
                    size,
                    index
                ) {
                    ctx.beginPath();

                    ctx.arc(
                        -index * 13,
                        0,

                        Math.max(
                            8,
                            size
                        ),

                        -0.65,
                        0.65
                    );

                    ctx.stroke();
                }
            );

            ctx.restore();
        }
    );
}

function drawPotions() {
    potionProjectiles.forEach(
        function(potion) {
            const x =
                worldToScreenX(
                    potion.x
                );

            const y =
                worldToScreenY(
                    potion.y
                );

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                potion.radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                potion.color;

            ctx.fill();

            ctx.strokeStyle =
                "white";

            ctx.lineWidth =
                3;

            ctx.stroke();

            ctx.font =
                "15px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                "🧪",
                x,
                y
            );
        }
    );
}

function drawEffects() {
    const currentTime =
        performance.now();

    effects.forEach(
        function(effect) {
            const progress =
                Math.min(
                    1,

                    (
                        currentTime -
                        effect.born
                    ) /
                    effect.duration
                );

            const opacity =
                1 -
                progress;

            const x =
                worldToScreenX(
                    effect.x
                );

            const y =
                worldToScreenY(
                    effect.y
                );

            ctx.save();

            ctx.globalAlpha =
                opacity;

            if (
                effect.type ===
                "circle"
            ) {
                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    effect.radius,
                    0,
                    Math.PI * 2
                );

                ctx.strokeStyle =
                    effect.color;

                ctx.lineWidth =
                    effect.lineWidth;

                ctx.stroke();
            }

            if (
                effect.type ===
                "text"
            ) {
                ctx.font =
                    "bold 19px Arial";

                ctx.textAlign =
                    "center";

                ctx.fillStyle =
                    effect.color;

                ctx.strokeStyle =
                    "black";

                ctx.lineWidth =
                    4;

                const textY =
                    y -
                    progress *
                    35;

                ctx.strokeText(
                    effect.text,
                    x,
                    textY
                );

                ctx.fillText(
                    effect.text,
                    x,
                    textY
                );
            }

            ctx.restore();
        }
    );
}

function drawMiniMap() {
    const width =
        185;

    const height =
        185;

    const x =
        canvas.width -
        width -
        16;

    const y =
        16;

    ctx.fillStyle =
        "#111827dd";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.fillStyle =
        selectedMap.ground;

    ctx.fillRect(
        x + 5,
        y + 5,
        width - 10,
        height - 10
    );

    fighters.forEach(
        function(fighter) {
            if (!fighter.alive) {
                return;
            }

            const pointX =
                x + 5 +
                fighter.x /
                WORLD_WIDTH *
                (width - 10);

            const pointY =
                y + 5 +
                fighter.y /
                WORLD_HEIGHT *
                (height - 10);

            ctx.beginPath();

            ctx.arc(
                pointX,
                pointY,

                fighter.isPlayer
                    ? 5
                    : fighter.isSummon
                        ? 2
                        : 3,

                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                fighter.isPlayer
                    ? "#36a9ff"
                    : fighter.isSummon
                        ? "#8ceaff"
                        : "#ef4d4d";

            ctx.fill();
        }
    );

    ctx.strokeStyle =
        "white";

    ctx.lineWidth =
        2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );
}

function drawCrosshair() {
    if (
        phase !== "playing" ||
        !player ||
        !player.alive ||
        matchFinished
    ) {
        return;
    }

    ctx.beginPath();

    ctx.arc(
        mouse.x,
        mouse.y,
        13,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "#ffffffcc";

    ctx.lineWidth =
        2;

    ctx.stroke();
}

function draw() {
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawGround();
    drawWater();
    drawBushes();
    drawWalls();

    fighters.forEach(
        drawFighter
    );

    drawProjectiles();
    drawWaves();
    drawPotions();
    drawEffects();
    drawMiniMap();
    drawCrosshair();
}

function gameLoop() {
    update();
    draw();

    requestAnimationFrame(
        gameLoop
    );
}

try {
    prepareGame();
    gameLoop();
} catch (error) {
    console.error(
        error
    );

    document
        .getElementById(
            "loadingPercent"
        )
        .textContent =
        "Błąd kodu";

    document
        .getElementById(
            "loadingText"
        )
        .textContent =
        error.message;
}
</script>

</body>
</html>
