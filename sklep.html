<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div class="logo">🛒 SKLEP</div>

    <div class="currency">
        <div class="pill">🎟️ <span data-tickets>0</span></div>
        <div class="pill">🪙 <span data-coins>0</span></div>
    </div>
</header>

<main class="screen">

    <h1 class="section-title">Sklep z bohaterami</h1>

    <div class="notice">
        Wygrywaj walki, aby zdobywać bilety. Za bilety możesz odblokować nowe postacie.
    </div>

    <div id="shop" class="grid"></div>

</main>

<nav class="bottom-nav">
    <a href="gra.html">🏰<br>Lobby</a>
    <a href="postacie.html">🧙<br>Postacie</a>
    <a class="active" href="sklep.html">🛒<br>Sklep</a>
    <a href="walka.html">⚔️<br>Gra</a>
</nav>

<script src="dane.js"></script>
<script src="common.js"></script>

<script>
function buyHero(heroId) {
    const state = getState();
    const hero = getHero(heroId);

    if (state.unlocked.includes(heroId)) {
        return;
    }

    if (state.tickets < hero.ticketCost) {
        alert("Masz za mało biletów.");
        return;
    }

    state.tickets -= hero.ticketCost;
    state.unlocked.push(heroId);
    state.selected = heroId;

    saveState(state);
    updateTopbar();
    renderShop();

    alert("Odblokowano postać: " + hero.nazwa);
}

function renderShop() {
    const state = getState();
    const container = document.getElementById("shop");

    container.innerHTML = "";

    BOHATEROWIE.forEach(function(hero) {
        if (hero.ticketCost === 0) {
            return;
        }

        const unlocked = state.unlocked.includes(hero.id);

        const card = document.createElement("div");

        card.className = "card shop-item";

        card.innerHTML = `
            <div class="character-icon">${hero.ikona}</div>

            <h2>${hero.nazwa}</h2>

            <div class="power">${hero.moc}</div>

            <p>${hero.opis}</p>

            <div class="stats">

                <div class="stat">
                    <span>❤️ Życie</span>
                    <b>${hero.hp}</b>
                </div>

                <div class="stat">
                    <span>⚔️ Obrażenia</span>
                    <b>${hero.damage}</b>
                </div>

            </div>

            <button class="btn ${unlocked ? "btn-green" : "btn-gold"}">
                ${unlocked ? "ODBLOKOWANO" : "🎟️ " + hero.ticketCost}
            </button>
        `;

        const button = card.querySelector("button");

        if (unlocked) {
            button.disabled = true;
        } else {
            button.onclick = function() {
                buyHero(hero.id);
            };
        }

        container.appendChild(card);
    });
}

renderShop();
</script>

</body>
</html>
