function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function canMove(x,y){if(x<20||x>1580||y<20||y>950)return false;const inside=[...rooms,...corridors].some(r=>x>=r.x+12&&x<=r.x+r.w-12&&y>=r.y+12&&y<=r.y+r.h-12);return inside&&!obstacles.some(o=>x>o.x-18&&x<o.x+o.w+18&&y>o.y-18&&y<o.y+o.h+18)}

[a.id]||0))[0]||suspect;if(target)addChat(p,pick([`Moim zdaniem ${target.name} zachowuje się dziwnie.`,`Widziałem ${target.name} w pobliżu ${room(target)}. To podejrzane.`,`Czy ${target.name} ma jakieś alibi?`]));continue}if(witnessed){addChat(p,`WIDZIAŁEM, jak ${players[witnessed.killer].name} zabił ${players[witnessed.victim].name}!`);continue}if(suspect&&p.sus[suspect.id]>35){addChat(p,pick([`${suspect.name} jest mocno podejrzany. Widziałem coś dziwnego.`,`Głosuję na ${suspect.name}, mam poszlaki.`,`Kto może potwierdzić alibi ${suspect.name}?`]));continue}const last=p.memory.filter(m=>m.kind==='near').at(-1);if(last&&players[last.suspect].alive){addChat(p,`Widziałem ${players[last.suspect].name} blisko miejsca zdarzenia, ale to nie dowód.`)}else addChat(p,pick([`Byłem w ${own} i robiłem zadania.`,`Nie mam wystarczających dowodów. Proponuję pominąć.`,`Kto ostatnio widział ofiarę?`,`Potrzebujemy konkretnych świadków, nie zgadywania.`]))}}function renderMeeting(){const me=players[0];panel.innerHTML=`<h2>📢 ZEBRANIE ${meetingCount}</h2><p>Boty wymieniają obserwacje i głosują na podstawie podejrzeń. ${me.alive?'Wybierz swój głos.':'Jesteś duchem — obserwujesz.'}</p><div id="chat"></div><div id="votes"></div><p id="clock"></p>`;const votes=document.getElementById('votes');if(me.alive){for(const p of alive().filter(p=>p.id!==0)){const b=document.createElement('button');b.textContent='🗳 '+p.name;b.onclick=()=>{playerVote=p.id;renderVotes()};votes.appendChild(b)}const skip=document.createElement('button');skip.textContent='POMIŃ';skip.onclick=()=>{playerVote=-1;renderVotes()};votes.appendChild(skip)}else votes.textContent='Głosowanie botów trwa...';renderVotes();renderChat()}function renderVotes(){const b=document.querySelectorAll('#votes button');b.forEach(x=>{x.style.outline=x.textContent.includes(playerVote===-1?'POMIŃ':players[playerVote]?.name||'@@@@')?'3px solid #6ce1af':''})}function renderChat(){const el=document.getElementById('chat');if(!el)return;el.innerHTML='';for(const m of chat){let d=document.createElement('div'),b=document.createElement('b');b.textContent=m.id<0?'SYSTEM: ':players[m.id].name+': ';d.appendChild(b);d.appendChild(document.createTextNode(m.text));el.appendChild(d)}el.scrollTop=el.scrollHeight}function finishMeeting(){const ballots=[];for(const p of alive()){if(p.id===0){ballots.push(playerVote??-1);continue}let s=strongest(p);if(p.imp){const innocent=alive().filter(q=>!q.imp&&q!==p).sort((a,b)=>(p.sus[b.id]||0)-(p.sus[a.id]||0))[0];ballots.push(innocent&&Math.random()<.75?innocent.id:-1)}else{let score=s?(p.sus[s.id]||0):0;ballots.push(score>35?s.id:score>12&&Math.random()<.35?s.id:-1)}}let counts={};for(let v of ballots)counts[v]=(counts[v]||0)+1;const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);const winner=sorted[0]&&(!sorted[1]||sorted[0][1]>sorted[1][1])&&sorted[0][0]!=='-1'?+sorted[0][0]:null;let msg='Nikt nie został wyrzucony (remis lub pominięcie).';if(winner!==null){players[winner].alive=false;msg=`${players[winner].name} został wyrzucony. ${players[winner].imp?'BYŁ IMPOSTOREM!':'Nie był impostorem.'}`}bodies=[];meeting=false;overlay.style.display='none';killCD=Math.max(killCD,12);players.filter(p=>p.imp).forEach(p=>p.killCd=Math.max(p.killCd,12));say(msg,4800);checkWin()}
function completeTask(p){const idx=p.taskSet.find(i=>!p.done.has(i)&&dist(p,tasks[i])<78);if(idx===undefined)return false;p.done.add(idx);taskDone++;if(p.id===0)say('Zadanie wykonane: '+tasks[idx].n);checkWin();return true}function use(){if(!game||meeting||!players[0].alive)return;const p=players[0];if(sabTimer&&dist(p,{x:120,y:515})<110){sabTimer=0;sabType='';sabotageFixed=true;say('Sabotaż naprawiony!');return}if(p.imp){say('Impostor może udawać zadania, ale ich nie zalicza.');return}if(!completeTask(p))say('Podejdź do żółtego terminala zadania.')}function sabotage(){if(!game||meeting||!players[0].alive||!players[0].imp||sabotageCD>0||sabTimer>0)return;sabType='REAKTOR';sabTimer=45;sabotageCD=70;sabotageFixed=false;say('SABOTAŻ REAKTORA! Załoga ma 45 sekund na naprawę.',4000)}function emergency(){if(!game||meeting||!players[0].alive||emergencyUsed)return;const p=players[0];if(dist(p,{x:330,y:120})>110){say('Idź do przycisku zebrania w Kafeterii!');return}emergencyUsed=true;startMeeting(p,null)}function tryReport(){if(!game||meeting||!players[0].alive)return;const b=nearbyBody(players[0]);if(b)report(players[0],b);else say('Nie ma ciała w zasięgu.')}function tryKill(){if(!game||meeting||!players[0].alive||!players[0].imp||killCD>0)return;const v=nearbyVictim(players[0]);if(v)kill(players[0],v);else say('Brak celu w zasięgu.')}function checkWin(){if(!game||meeting||finalResult)return;let win=null;if(imps().length===0)win='crew';else if(imps().length>=crews().length)win='imp';else if(taskDone>=taskTotal)win='crew';if(win)end(win)}function end(win){if(finalResult)return;finalResult=true;game=false;overlay.style.display='flex';panel.innerHTML=`<h1>${win==='crew'?'🟢 ZAŁOGA WYGRYWA':'🔴 IMPOSTORZY WYGRYWAJĄ'}</h1><h2>${players[0].imp===(win==='imp')?'WYGRAŁEŚ!':'PRZEGRAŁEŚ!'}</h2><p>Impostorzy: ${players.filter(p=>p.imp).map(p=>p.name).join(', ')}.</p><p>Wykonane zadania: ${taskDone}/${taskTotal}. Zebrań: ${meetingCount}.</p><button id="again">ZAGRAJ PONOWNIE</button>`;do const CELL=25,COLS=64,ROWS=39;function navigate(p,dt){const goal=p.target;if(!goal)return;const gx=Math.floor(goal.x/CELL),gy=Math.floor(goal.y/CELL),sx=Math.floor(p.x/CELL),sy=Math.floor(p.y/CELL);const targetKey=gx+','+gy,startKey=sx+','+sy;if(!p.route||p.routeGoal!==targetKey||p.routeStart!==startKey&&(!p.route.length||dist(p,p.route[0])>55)){p.routeGoal=targetKey;p.routeStart=startKey;let queue=[[sx,sy]],seen=new Set([startKey]),prev=new Map(),found=null;let head=0;while(head<queue.length&&head<2600){const [x,y]=queue[head++],k=x+','+y;if(Math.abs(x-gx)<=1&&Math.abs(y-gy)<=1){found=k;break}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,nk=nx+','+ny;if(nx<0||ny<0||nx>=COLS||ny>=ROWS||seen.has(nk)||!canMove(nx*CELL+12,ny*CELL+12))continue;seen.add(nk);prev.set(nk,k);queue.push([nx,ny])}}let path=[];if(found){let k=found;while(k!==startKey&&path.length<200){const [x,y]=k.split(',').map(Number);path.push({x:x*CELL+12,y:y*CELL+12});k=prev.get(k);if(!k)break}path.reverse()}p.route=path}while(p.route.length&&dist(p,p.route[0])<20)p.route.shift();const waypoint=p.route[0]||goal,dx=waypoint.x-p.x,dy=waypoint.y-p.y,d=Math.hypot(dx,dy)||1;move(p,dx/d,dy/d,dt);if(!p.route.length&&dist(p,goal)>45)p.routeGoal='';}
function ai(p,dt){if(!p.alive)return;p.killCd=Math.max(0,p.killCd-dt);p.wander-=dt;const b=nearbyBody(p);if(b&&!p.imp&&Math.random()<dt*1.9){report(p,b);return}if(p.imp){const v=alive().filter(q=>!q.imp&&q!==p).sort((a,b)=>dist(p,a)-dist(p,b))[0];if(v){const witnesses=alive().filter(q=>q!==p&&q!==v&&dist(q,v)<225).length;if(dist(p,v)<70&&p.killCd<=0&&witnesses<=1&&Math.random()<dt*3){kill(p,v);return}if(p.killCd<=0&&witnesses<=2)p.target={x:v.x,y:v.y};else if(p.wander<=0){p.target=pick(tasks);p.wander=rand(3,8)}}}else{const pending=p.taskSet.filter(i=>!p.done.has(i));if(pending.length){const idx=pending.sort((a,b)=>dist(p,tasks[a])-dist(p,tasks[b]))[0];p.target=tasks[idx];if(dist(p,p.target)<55){completeTask(p);p.target=pick(tasks)}}else if(p.wander<=0){p.target=pick(tasks);p.wander=rand(3,8)}if(sabTimer&&Math.random()<dt*.5)p.target={x:120,y:515};if(sabTimer&&dist(p,{x:120,y:515})<85&&Math.random()<dt*1.6){sabTimer=0;sabType='';say(`${p.name} naprawił reaktor!`);}}if(!p.target||dist(p,p.target)<25){p.target=pick(tasks);p.wander=rand(2,5)}navigate(p,dt);let d=dist(p,p.target);if(d>80&&Math.random()<dt*.12){p.target=pick(tasks);p.wander=rand(2,6)}for(const q of alive()){if(q===p||dist(p,q)>190)continue;p.lastSeen[q.id]={room:room(q),at:timer};if(q.imp&&Math.random()<dt*.02)p.sus[q.id]+=0.2}}function update(dt){if(!game)return;timer+=dt;if(meeting){discussionTick+=dt;if(discussionTick>3){discussionTick=0;discuss();renderChat()}const c=document.getElementById('clock');if(c)c.textContent='Pozostało: '+Math.max(0,Math.ceil(meetingDeadline-timer))+' s · Twój głos: '+(playerVote===null?'brak':playerVote===-1?'pomiń':players[playerVote].name);if(timer>=meetingDeadline)finishMeeting();return}killCD=Math.max(0,killCD-dt);sabotageCD=Math.max(0,sabotageCD-dt);if(sabTimer>0){sabTimer-=dt;if(sabTimer<=0){end('imp');return}}const p=players[0];if(p.alive){let dx=Number(!!(keys.d||keys.arrowright))-Number(!!(keys.a||keys.arrowleft)),dy=Number(!!(keys.s||keys.arrowdown))-Number(!!(keys.w||keys.arrowup));let d=Math.hypot(dx,dy)||1;move(p,dx/d,dy/d,dt)}for(const q of players.slice(1)){ai(q,dt);if(meeting||!game)break}if(!meeting&&game)checkWin();document.getElementById('status').textContent=`${p.imp?'🔴 IMPOSTOR':'🔵 CREWMATE'} · ${p.alive?'Żyjesz':'DUCH'} · ${room(p)} · ${Math.floor(timer)} s`;document.getElementById('mission').textContent=`Zadania: ${taskDone}/${taskTotal} · Żywi: ${alive().length}/15`+(sabTimer>0?` · ⚠ REAKTOR: ${Math.ceil(sabTimer)} s`:'');document.getElementById('progress').style.width=100*taskDone/Math.max(1,taskTotal)+'%';document.getElementById('hint').textContent=p.imp?'Unikaj świadków. Zabijaj tylko, gdy nikt nie patrzy.':'Żółte terminale = zadania. Czerwony przycisk = zebranie.';document.getElementById('kill').style.display=p.imp?'':'none';document.getElementById('sabotage').style.display=p.imp?'':'none';document.getElementById('kill').textContent=killCD>0?'Zabij '+Math.ceil(killCD)+'s':'F · Zabij';document.getElementById('sabotage').textContent=sabotageCD>0?'Sabotaż '+Math.ceil(sabotageCD)+'s':'Q · Sabotaż';document.getElementById('use').disabled=!p.alive;document.getElementById('report').disabled=!p.alive;document.getElementById('kill').disabled=!p.alive||killCD>0;document.getElementById('sabotage').disabled=!p.alive||sabotageCD>0;document.getElementById('emergency').disabled=!p.alive||emergencyUsed}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#070f1f';ctx.fillRect(0,0,W,H);const p=players[0]||{x:780,y:480};const scale=Math.min(W/950,H/610,1.05),ox=W/2-p.x*scale,oy=H/2-p.y*scale;ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.fillStyle='#26364b';ctx.fillRect(20,20,1560,960);ctx.strokeStyle='#57708b';ctx.lineWidth=3;for(let x=30;x<1580;x+=60){ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,980);ctx.stroke()}for(let y=20;y<980;y+=60){ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(1580,y);ctx.stroke()}for(const c of corridors){ctx.fillStyle='#36485d';ctx.fillRect(c.x,c.y,c.w,c.h);ctx.strokeStyle='#465f7c';ctx.lineWidth=3;ctx.strokeRect(c.x,c.y,c.w,c.h)}for(const r of rooms){ctx.fillStyle='#30455f';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#8aa2c1';ctx.lineWidth=3;ctx.strokeRect(r.x,r.y,r.w,r.h);ctx.fillStyle='#d4e5ff';ctx.font='bold 17px system-ui';ctx.fillText(r.n,r.x+15,r.y+28)}for(const o of obstacles){ctx.fillStyle='#152538';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#657c9a';ctx.lineWidth=3;ctx.strokeRect(o.x,o.y,o.w,o.h)}for(const t of tasks){ctx.fillStyle='#e6c657';ctx.fillRect(t.x-13,t.y-13,26,26);ctx.strokeStyle='#fff3ae';ctx.lineWidth=2;ctx.strokeRect(t.x-13,t.y-13,26,26)}ctx.fillStyle='#ed585e';ctx.fillRect(910,105,26,26);ctx.font='13px system-ui';ctx.fillStyle='#fff';ctx.fillText('MEETING',890,98);ctx.fillStyle=sabTimer?'#e94d61':'#4e9acb';ctx.fillRect(92,490,56,56);ctx.fillStyle='#fff';ctx.fillText('REACTOR',75,480);for(const b of bodies){ctx.fillStyle=players[b.id].color;ctx.fillRect(b.x-17,b.y-10,34,21);ctx.fillStyle='#dbeaff';ctx.fillRect(b.x-3,b.y-8,19,10);ctx.fillStyle='#eee';ctx.fillRect(b.x+12,b.y-5,20,7)}for(const q of players){if(!q.alive)continue;ctx.save();ctx.translate(q.x,q.y);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,20,22,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=q.color;ctx.beginPath();ctx.roundRect(-17,-23,34,46,13);ctx.fill();ctx.fillRect(-20,0,7,17);ctx.fillStyle='#a9edff';ctx.beginPath();ctx.roundRect(-10,-14,27,17,7);ctx.fill();ctx.strokeStyle=q.id===0?'#fff':'#142133';ctx.lineWidth=q.id===0?4:2;ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 13px system-ui';ctx.fillText(q.name,0,-31);if(players[0]?.imp&&q.imp){ctx.fillStyle='#ff5d76';ctx.fillText('IMPOSTOR',0,-46)}ctx.restore()}ctx.restore();if(players.length&&(!players[0].alive||meeting)){ctx.fillStyle='#ffffff0a';ctx.fillRect(0,0,W,H)}}function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}document.getElementById('use').onclick=use;document.getElementById('report').onclick=tryReport;document.getElementById('kill').onclick=tryKill;document.getElementById('sabotage').onclick=sabotage;document.getElementById('emergency').onclick=emergency;addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(e.repeat)return;if(k==='e')use();if(k==='r')tryReport();if(k==='f')tryKill();if(k==='q')sabotage();if(k==='m')emergency()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys[b.dataset.key]=true;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>keys[b.dataset.key]=false);b.addEventListener('pointercancel',()=>keys[b.dataset.key]=false)});menu();requestAnimationFrame(frame)})();
