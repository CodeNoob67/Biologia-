<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wybierz przedmiot</title>

    <style>
        body{
            font-family:Arial;
            text-align:center;
            background:#f2f2f2;
        }

        h1{
            font-size:50px;
        }

        .przedmiot{
            display:block;
            width:350px;
            margin:20px auto;
            padding:22px;
            font-size:30px;
            font-weight:bold;
            text-decoration:none;
            color:white;
            border-radius:18px;
            transition:0.25s;
        }

        .przedmiot:hover{
            transform:scale(1.08);
        }

        .bio{
            background:#5fd35f;
        }

        .bio:hover{
            background:#38b438;
        }

        .fiz{
            background:#ff9800;
        }

        .fiz:hover{
            background:#dd7f00;
        }

        .chem{
            background:#18b8b8;
        }

        .chem:hover{
            background:#0f9898;
        }

        .mat{
            background:#3d8bfd;
        }

        .mat:hover{
            background:#1e6fe0;
        }

        .ang{
            background:#e53935;
        }

        .ang:hover{
            background:#c62828;
        }

        hr{
            width:90%;
            margin-top:80px;
            border:2px solid black;
        }

        .mail{
            display:inline-block;
            margin:30px;
            padding:18px 35px;
            background:#444;
            color:white;
            font-size:28px;
            font-weight:bold;
            text-decoration:none;
            border-radius:15px;
            transition:0.25s;
        }

        .mail:hover{
            background:#222;
            transform:scale(1.08);
        }
    </style>
</head>

<body>

<h1>📚 NAUKA</h1>

<h1>Wybierz przedmiot</h1>

<a class="przedmiot bio" href="biologia.html" onmouseenter="zagraj()">

</a>

</a>

    ⚗️ Chemia
</a>

<a class="przedmiot mat" href="Matematyka.html" onmouseenter="zagraj()">
    📐 Matematyka
</a>

<a class="przedmiot ang" href="angielski.html" onmouseenter="zagraj()">
    🇬🇧 Angielski
</a>

<hr>

<a class="mail"
href="mailto:mistrzbiologia@gmail.com?subject=Wiadomość%20ze%20strony%20NAUKA&body=Cześć!%0A%0ATutaj%20wpisz%20swoją%20wiadomość."

</script>

</html>
