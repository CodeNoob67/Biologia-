<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zombie Escape</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    width: 260px;
    padding: 14px;
    color: white;
    background: rgba(0, 0, 0, 0.75);
    border: 2px solid #555;
    border-radius: 10px;
    z-index: 10;
}

#hud h2 {
    color: #ffcc33;
    margin-bottom: 10px;
}

.bar {
    width: 100%;
    height: 18px;
    margin: 5px 0 10px;
    background: #222;
    border-radius: 6px;
    overflow: hidden;
}

.fill {
    height: 100%;
}

#healthBar {
    background: #e12b2b;
}

#fuelBar {
    background: #e0bd24;
}

#mission {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    color: white;
    background: rgba(0, 0, 0, 0.78);
    border: 2px solid #ffcc33;
    border-radius: 10px;
    z-index: 10;
    text-align: center;
}

#message {
    position: fixed;
    left: 50%;
    bottom: 45px;
    transform: translateX(-50%);
    padding: 12px 20px;
    color: white;
    background: rgba(0, 0, 0, 0.8);
    border-radius: 8px;
    display: none;
    z-index: 10;
}

#endScreen {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0, 0, 0, 0.92);
    color: white;
    z-index: 20;
}

#endScreen h1 {
    font-size: 70px;
    margin-bottom: 20px;
}

#endScreen button {
    padding: 14px 25px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #ffcc33;
    cursor: pointer;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <h2>ZOMBIE ESCAPE</h2>

    <div>Życie: <span id="healthText">100</span></div>
    <div class="bar">
        <div id="healthBar" class="fill"></div>
    </div>

    <div id="fuelBox" style="display:none">
        <div>Paliwo: <span id="fuelText">100</span>%</div>
        <div class="bar">
            <div id="fuelBar" class="fill"></div>
        </div>
    </div>

    <div>Amunicja: <span id="ammoText">12 / 60</span></div>
    <div>Zabite zombie: <span id="killsText">0</span></div>
    <div>Części radia: <span id="partsText">0 / 3</span></div>
</div>

<div id="mission">
    Znajdź 3 części radia i dotrzyj do punktu ewakuacji.
</div>

<div id="message"></div>

<div id="endScreen">
    <h1 id="endTitle"></h1>
    <button onclick="location.reload()">Zagraj ponownie</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

const WORLD_WIDTH = 5000;
const WORLD_HEIGHT = 5000;

const keys = {};
const mouse = {
    x: 0,
    y: 0,
    down: false
};

let cameraX = 0;
let cameraY = 0;
let gameOver = false;
let lastTime = performance.now();

const player = {
    x: 2500,
    y: 2500,
    radius: 16,
    speed: 220,
    sprintSpeed: 330,
    angle: 0,
    health: 100,
    ammo: 12,
    reserveAmmo: 60,
    magazine: 12,
    reloadTimer: 0,
    shootTimer: 0,
    car: null,
    kills: 0,
    parts: 0
};

const zombies = [];
const cars = [];
const bullets = [];
const buildings = [];
const trees = [];
const radioParts = [];

const extraction = {
    x: 4500,
    y: 500,
    radius: 110,
    active: false
};

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function pointInBuilding(x, y, padding = 0) {
    return buildings.some(building =>
        x > building.x - padding &&
        x < building.x + building.width + padding &&
        y > building.y - padding &&
        y < building.y + building.height + padding
    );
}

function createWorld() {
    for (let i = 0; i < 35; i++) {
        const width = random(120, 260);
        const height = random(100, 240);

        buildings.push({
            x: random(200, WORLD_WIDTH - width - 200),
            y: random(200, WORLD_HEIGHT - height - 200),
            width,
            height
        });
    }

    for (let i = 0; i < 180; i++) {
        const tree = {
            x: random(50, WORLD_WIDTH - 50),
            y: random(50, WORLD_HEIGHT - 50),
            radius: random(15, 25)
        };

        if (!pointInBuilding(tree.x, tree.y, 30)) {
            trees.push(tree);
        }
    }

    for (let i = 0; i < 18; i++) {
        let car;

        do {
            car = {
                x: random(150, WORLD_WIDTH - 150),
                y: random(150, WORLD_HEIGHT - 150),
                width: 70,
                height: 36,
                radius: 34,
                angle: random(0, Math.PI * 2),
                speed: 0,
                maxSpeed: 450,
                acceleration: 300,
                fuel: random(50, 100),
                color: `hsl(${random(0, 360)}, 60%, 48%)`
            };
        } while (pointInBuilding(car.x, car.y, 70));

        cars.push(car);
    }

    for (let i = 0; i < 70; i++) {
        spawnZombie();
    }

    radioParts.push(
        { x: 600, y: 700, collected: false },
        { x: 4200, y: 3800, collected: false },
        { x: 900, y: 4200, collected: false }
    );
}

function spawnZombie() {
    let zombie;

    do {
        zombie = {
            x: random(100, WORLD_WIDTH - 100),
            y: random(100, WORLD_HEIGHT - 100),
            radius: 17,
            speed: random(55, 90),
            health: 60,
            attackTimer: 0,
            wanderAngle: random(0, Math.PI * 2),
            wanderTimer: random(1, 3)
        };
    } while (
        pointInBuilding(zombie.x, zombie.y, 30) ||
        Math.hypot(zombie.x - player.x, zombie.y - player.y) < 400
    );

    zombies.push(zombie);
}

function showMessage(text) {
    const message = document.getElementById("message");

    message.textContent = text;
    message.style.display = "block";

    clearTimeout(showMessage.timer);

    showMessage.timer = setTimeout(() => {
        message.style.display = "none";
    }, 1500);
}

function moveEntity(entity, dx, dy, radius) {
    const oldX = entity.x;

    entity.x += dx;

    if (pointInBuilding(entity.x, entity.y, radius)) {
        entity.x = oldX;
    }

    const oldY = entity.y;

    entity.y += dy;

    if (pointInBuilding(entity.x, entity.y, radius)) {
        entity.y = oldY;
    }

    entity.x = clamp(entity.x, radius, WORLD_WIDTH - radius);
    entity.y = clamp(entity.y, radius, WORLD_HEIGHT - radius);
}

function updatePlayer(delta) {
    if (player.reloadTimer > 0) {
        player.reloadTimer -= delta;

        if (player.reloadTimer <= 0) {
            const needed = player.magazine - player.ammo;
            const loaded = Math.min(needed, player.reserveAmmo);

            player.ammo += loaded;
            player.reserveAmmo -= loaded;

            showMessage("Przeładowano");
        }
    }

    if (player.shootTimer > 0) {
        player.shootTimer -= delta;
    }

    if (player.car) {
        updateCar(player.car, delta);

        player.x = player.car.x;
        player.y = player.car.y;
        player.angle = player.car.angle;

        return;
    }

    const worldMouseX = mouse.x + cameraX;
    const worldMouseY = mouse.y + cameraY;

    player.angle = Math.atan2(
        worldMouseY - player.y,
        worldMouseX - player.x
    );

    let dx = 0;
    let dy = 0;

    if (keys["w"]) dy -= 1;
    if (keys["s"]) dy += 1;
    if (keys["a"]) dx -= 1;
    if (keys["d"]) dx += 1;

    const length = Math.hypot(dx, dy);

    if (length > 0) {
        dx /= length;
        dy /= length;

        const speed = keys["shift"]
            ? player.sprintSpeed
            : player.speed;

        moveEntity(
            player,
            dx * speed * delta,
            dy * speed * delta,
            player.radius
        );
    }

    if (mouse.down) {
        shoot();
    }
}

function updateCar(car, delta) {
    if (car.fuel <= 0) {
        car.speed *= 0.97;
        return;
    }

    let throttle = 0;

    if (keys["w"]) throttle = 1;
    if (keys["s"]) throttle = -1;

    car.speed += throttle * car.acceleration * delta;
    car.speed *= Math.pow(0.975, delta * 60);

    car.speed = clamp(
        car.speed,
        -car.maxSpeed * 0.4,
        car.maxSpeed
    );

    if (Math.abs(car.speed) > 5) {
        const direction = car.speed >= 0 ? 1 : -1;

        if (keys["a"]) {
            car.angle -= 2.4 * delta * direction;
        }

        if (keys["d"]) {
            car.angle += 2.4 * delta * direction;
        }
    }

    if (throttle !== 0) {
        car.fuel -= 1.3 * delta;
    }

    car.fuel = clamp(car.fuel, 0, 100);

    const oldX = car.x;
    const oldY = car.y;

    car.x += Math.cos(car.angle) * car.speed * delta;
    car.y += Math.sin(car.angle) * car.speed * delta;

    if (
        pointInBuilding(car.x, car.y, car.radius) ||
        car.x < car.radius ||
        car.y < car.radius ||
        car.x > WORLD_WIDTH - car.radius ||
        car.y > WORLD_HEIGHT - car.radius
    ) {
        car.x = oldX;
        car.y = oldY;
        car.speed *= -0.35;
    }

    for (let i = zombies.length - 1; i >= 0; i--) {
        const zombie = zombies[i];

        if (distance(car, zombie) < car.radius + zombie.radius) {
            if (Math.abs(car.speed) > 90) {
                zombies.splice(i, 1);
                player.kills++;
                car.speed *= 0.8;
            }
        }
    }
}

function shoot() {
    if (player.car) return;
    if (player.reloadTimer > 0) return;
    if (player.shootTimer > 0) return;

    if (player.ammo <= 0) {
        reload();
        return;
    }

    player.ammo--;
    player.shootTimer = 0.18;

    bullets.push({
        x: player.x,
        y: player.y,
        radius: 4,
        angle: player.angle,
        speed: 900,
        life: 1.2
    });
}

function reload() {
    if (player.reloadTimer > 0) return;
    if (player.ammo >= player.magazine) return;
    if (player.reserveAmmo <= 0) return;

    player.reloadTimer = 1.2;
    showMessage("Przeładowywanie...");
}

function updateBullets(delta) {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];

        bullet.x += Math.cos(bullet.angle) * bullet.speed * delta;
        bullet.y += Math.sin(bullet.angle) * bullet.speed * delta;
        bullet.life -= delta;

        if (
            bullet.life <= 0 ||
            pointInBuilding(bullet.x, bullet.y)
        ) {
            bullets.splice(i, 1);
            continue;
        }

        for (let z = zombies.length - 1; z >= 0; z--) {
            const zombie = zombies[z];

            if (
                distance(bullet, zombie) <
                bullet.radius + zombie.radius
            ) {
                zombie.health -= 40;
                bullets.splice(i, 1);

                if (zombie.health <= 0) {
                    zombies.splice(z, 1);
                    player.kills++;

                    if (Math.random() < 0.2) {
                        player.reserveAmmo += 5;
                    }
                }

                break;
            }
        }
    }
}

function updateZombies(delta) {
    const target = player.car || player;

    for (const zombie of zombies) {
        zombie.attackTimer -= delta;
        zombie.wanderTimer -= delta;

        const dist = distance(zombie, target);

        let angle;
        let speedMultiplier = 1;

        if (dist < 550) {
            angle = Math.atan2(
                target.y - zombie.y,
                target.x - zombie.x
            );

            speedMultiplier = 1.25;
        } else {
            if (zombie.wanderTimer <= 0) {
                zombie.wanderAngle = random(0, Math.PI * 2);
                zombie.wanderTimer = random(1, 4);
            }

            angle = zombie.wanderAngle;
            speedMultiplier = 0.35;
        }

        moveEntity(
            zombie,
            Math.cos(angle) * zombie.speed * speedMultiplier * delta,
            Math.sin(angle) * zombie.speed * speedMultiplier * delta,
            zombie.radius
        );

        if (
            !player.car &&
            dist < zombie.radius + player.radius + 5 &&
            zombie.attackTimer <= 0
        ) {
            player.health -= 8;
            zombie.attackTimer = 0.8;
            showMessage("Zombie cię zaatakował!");
        }
    }
}

function checkRadioParts() {
    for (const part of radioParts) {
        if (part.collected) continue;

        if (
            Math.hypot(player.x - part.x, player.y - part.y) < 45
        ) {
            part.collected = true;
            player.parts++;

            showMessage(
                "Zebrano część radia " +
                player.parts +
                "/3"
            );

            if (player.parts === 3) {
                extraction.active = true;

                document.getElementById("mission").textContent =
                    "Radio działa! Jedź do zielonego punktu ewakuacji.";
            }
        }
    }

    if (
        extraction.active &&
        Math.hypot(
            player.x - extraction.x,
            player.y - extraction.y
        ) < extraction.radius
    ) {
        finishGame(true);
    }
}

function interact() {
    if (player.car) {
        const car = player.car;

        player.car = null;

        player.x = car.x + Math.cos(car.angle + Math.PI / 2) * 55;
        player.y = car.y + Math.sin(car.angle + Math.PI / 2) * 55;

        showMessage("Wysiadłeś z samochodu");
        return;
    }

    let nearestCar = null;
    let nearestDistance = 80;

    for (const car of cars) {
        const dist = distance(player, car);

        if (dist < nearestDistance) {
            nearestDistance = dist;
            nearestCar = car;
        }
    }

    if (nearestCar) {
        player.car = nearestCar;
        showMessage("Ukradłeś samochód!");
    }
}

function updateCamera() {
    const target = player.car || player;

    cameraX += (
        target.x - canvas.width / 2 - cameraX
    ) * 0.1;

    cameraY += (
        target.y - canvas.height / 2 - cameraY
    ) * 0.1;

    cameraX = clamp(
        cameraX,
        0,
        Math.max(0, WORLD_WIDTH - canvas.width)
    );

    cameraY = clamp(
        cameraY,
        0,
        Math.max(0, WORLD_HEIGHT - canvas.height)
    );
}

function updateHud() {
    player.health = clamp(player.health, 0, 100);

    document.getElementById("healthText").textContent =
        Math.ceil(player.health);

    document.getElementById("healthBar").style.width =
        player.health + "%";

    document.getElementById("ammoText").textContent =
        player.reloadTimer > 0
            ? "Przeładowywanie..."
            : player.ammo + " / " + player.reserveAmmo;

    document.getElementById("killsText").textContent =
        player.kills;

    document.getElementById("partsText").textContent =
        player.parts + " / 3";

    const fuelBox = document.getElementById("fuelBox");

    if (player.car) {
        fuelBox.style.display = "block";

        document.getElementById("fuelText").textContent =
            Math.ceil(player.car.fuel);

        document.getElementById("fuelBar").style.width =
            player.car.fuel + "%";
    } else {
        fuelBox.style.display = "none";
    }

    if (player.health <= 0) {
        finishGame(false);
    }
}

function finishGame(win) {
    if (gameOver) return;

    gameOver = true;

    const screen = document.getElementById("endScreen");
    const title = document.getElementById("endTitle");

    screen.style.display = "flex";

    if (win) {
        title.textContent = "UCIEKŁEŚ!";
        title.style.color = "#4cff63";
    } else {
        title.textContent = "POKONANY";
        title.style.color = "#ff3333";
    }
}

function draw() {
    ctx.fillStyle = "#2d7838";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    drawRoads();
    drawBuildings();
    drawTrees();
    drawRadioParts();
    drawExtraction();
    drawCars();
    drawZombies();
    drawBullets();

    if (!player.car) {
        drawPlayer();
    }

    ctx.restore();

    drawCrosshair();
}

function drawRoads() {
    ctx.fillStyle = "#444";

    for (let x = 400; x < WORLD_WIDTH; x += 700) {
        ctx.fillRect(x, 0, 150, WORLD_HEIGHT);
    }

    for (let y = 450; y < WORLD_HEIGHT; y += 700) {
        ctx.fillRect(0, y, WORLD_WIDTH, 150);
    }

    ctx.strokeStyle = "#e7d763";
    ctx.lineWidth = 4;
    ctx.setLineDash([30, 25]);

    for (let x = 475; x < WORLD_WIDTH; x += 700) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, WORLD_HEIGHT);
        ctx.stroke();
    }

    for (let y = 525; y < WORLD_HEIGHT; y += 700) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WORLD_WIDTH, y);
        ctx.stroke();
    }

    ctx.setLineDash([]);
}

function drawBuildings() {
    for (const building of buildings) {
        ctx.fillStyle = "#735f4b";

        ctx.fillRect(
            building.x,
            building.y,
            building.width,
            building.height
        );

        ctx.strokeStyle = "#302820";
        ctx.lineWidth = 5;

        ctx.strokeRect(
            building.x,
            building.y,
            building.width,
            building.height
        );

        ctx.fillStyle = "#8ad4ff";

        for (
            let x = building.x + 20;
            x < building.x + building.width - 20;
            x += 50
        ) {
            for (
                let y = building.y + 20;
                y < building.y + building.height - 20;
                y += 50
            ) {
                ctx.fillRect(x, y, 20, 16);
            }
        }
    }
}

function drawTrees() {
    for (const tree of trees) {
        ctx.fillStyle = "#543317";
        ctx.fillRect(tree.x - 5, tree.y, 10, 25);

        ctx.fillStyle = "#145324";
        ctx.beginPath();
        ctx.arc(
            tree.x,
            tree.y,
            tree.radius,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }
}

function drawPlayer() {
    ctx.save();

    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    ctx.fillStyle = "#f0bd8c";
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#2559a5";
    ctx.fillRect(-10, -10, 20, 20);

    ctx.fillStyle = "#202020";
    ctx.fillRect(5, -4, 28, 8);

    ctx.restore();
}

function drawCars() {
    for (const car of cars) {
        ctx.save();

        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);

        ctx.fillStyle = car.color;

        ctx.fillRect(
            -car.width / 2,
            -car.height / 2,
            car.width,
            car.height
        );

        ctx.fillStyle = "#a4dfff";
        ctx.fillRect(-8, -13, 24, 10);
        ctx.fillRect(-8, 3, 24, 10);

        ctx.fillStyle = "#111";
        ctx.fillRect(-22, -22, 15, 6);
        ctx.fillRect(10, -22, 15, 6);
        ctx.fillRect(-22, 16, 15, 6);
        ctx.fillRect(10, 16, 15, 6);

        if (player.car === car) {
            ctx.strokeStyle = "#42ff56";
            ctx.lineWidth = 4;

            ctx.strokeRect(
                -car.width / 2 - 5,
                -car.height / 2 - 5,
                car.width + 10,
                car.height + 10
            );
        }

        ctx.restore();
    }
}

function drawZombies() {
    for (const zombie of zombies) {
        ctx.fillStyle = "#6d9d45";

        ctx.beginPath();
        ctx.arc(
            zombie.x,
            zombie.y,
            zombie.radius,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = "#ff2020";

        ctx.beginPath();
        ctx.arc(
            zombie.x - 5,
            zombie.y - 5,
            2,
            0,
            Math.PI * 2
        );
        ctx.arc(
            zombie.x + 5,
            zombie.y - 5,
            2,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }
}

function drawBullets() {
    ctx.fillStyle = "#fff35d";

    for (const bullet of bullets) {
        ctx.beginPath();
        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.radius,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }
}

function drawRadioParts() {
    for (const part of radioParts) {
        if (part.collected) continue;

        ctx.fillStyle = "rgba(255, 220, 40, 0.25)";

        ctx.beginPath();
        ctx.arc(
            part.x,
            part.y,
            40,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = "#ffd92e";
        ctx.fillRect(part.x - 15, part.y - 12, 30, 24);

        ctx.fillStyle = "#222";
        ctx.fillRect(part.x - 8, part.y - 5, 16, 8);
    }
}

function drawExtraction() {
    if (!extraction.active) return;

    ctx.fillStyle = "rgba(50, 255, 70, 0.2)";

    ctx.beginPath();
    ctx.arc(
        extraction.x,
        extraction.y,
        extraction.radius,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.strokeStyle = "#43ff55";
    ctx.lineWidth = 8;

    ctx.beginPath();
    ctx.arc(
        extraction.x,
        extraction.y,
        extraction.radius,
        0,
        Math.PI * 2
    );
    ctx.stroke();

    ctx.fillStyle = "#222";
    ctx.fillRect(
        extraction.x - 45,
        extraction.y - 8,
        90,
        16
    );

    ctx.fillRect(
        extraction.x - 8,
        extraction.y - 45,
        16,
        90
    );
}

function drawCrosshair() {
    if (player.car) return;

    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2);

    ctx.moveTo(mouse.x - 16, mouse.y);
    ctx.lineTo(mouse.x - 5, mouse.y);

    ctx.moveTo(mouse.x + 5, mouse.y);
    ctx.lineTo(mouse.x + 16, mouse.y);

    ctx.moveTo(mouse.x, mouse.y - 16);
    ctx.lineTo(mouse.x, mouse.y - 5);

    ctx.moveTo(mouse.x, mouse.y + 5);
    ctx.lineTo(mouse.x, mouse.y + 16);

    ctx.stroke();
}

function update(delta) {
    if (gameOver) return;

    updatePlayer(delta);
    updateBullets(delta);
    updateZombies(delta);
    checkRadioParts();
    updateCamera();
    updateHud();
}

function loop(time) {
    const delta = Math.min(
        (time - lastTime) / 1000,
        0.033
    );

    lastTime = time;

    update(delta);
    draw();

    requestAnimationFrame(loop);
}

window.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    keys[key] = true;

    if (key === "e" && !event.repeat) {
        interact();
    }

    if (key === "r" && !event.repeat) {
        reload();
    }
});

window.addEventListener("keyup", event => {
    keys[event.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", event => {
    mouse.x = event.clientX;
    mouse.y = event.clientY;
});

canvas.addEventListener("mousedown", event => {
    if (event.button === 0) {
        mouse.down = true;
    }
});

window.addEventListener("mouseup", event => {
    if (event.button === 0) {
        mouse.down = false;
    }
});

canvas.addEventListener("contextmenu", event => {
    event.preventDefault();
});

createWorld();
showMessage("Znajdź części radia i uciekaj!");
requestAnimationFrame(loop);
</script>

</body>
</html>
