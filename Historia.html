/* ================================
   PUNKTY
================================ */

function addPoints(amount){

    knowledgePoints += amount;

    document.getElementById("points").textContent =
        knowledgePoints;

    const reward =
        document.getElementById("reward");

    reward.innerHTML =
        "✦ +" + amount + " PUNKTÓW WIEDZY";

    reward.classList.add("show");

    setTimeout(()=>{
        reward.classList.remove("show");
    },1800);
}


/* ================================
   ODPOWIEDŹ
================================ */

function answerQuestion(button, question, answerIndex){

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(b => b.disabled = true);

    if(answerIndex === question.correct){

        button.classList.add("correct");

        addPoints(question.points);

    }else{

        button.classList.add("wrong");

        buttons[question.correct]
            .classList.add("correct");
    }

    setTimeout(()=>{
        show("era");
    },1700);
}


/* ================================
   WYŚWIETLANIE CAŁEJ EPOKI
================================ */

function loadEra(){

    const era = eras[currentEra];

    document.getElementById("eraName").innerHTML =
        era.name +
        `<small style="
            display:block;
            font-size:12px;
            opacity:.65;
            margin-top:3px
        ">${era.years}</small>`;

    document.getElementById("storyTitle")
        .textContent = era.title;

    document.getElementById("storyDescription")
        .innerHTML = era.description;
}


/* ================================
   POPRZEDNIA / NASTĘPNA EPOKA
================================ */

function previousEra(){

    if(currentEra <= 0) return;

    currentEra--;

    transitionToEra();
}

function nextEra(){

    if(currentEra >= eras.length-1) return;

    currentEra++;

    transitionToEra();
}


/* ================================
   ANIMOWANE PRZEJŚCIE
================================ */

function transitionToEra(){

    const transition =
        document.getElementById("transition");

    document.getElementById("eraChangeText")
        .textContent = eras[currentEra].name;

    transition.classList.add("show");

    setTimeout(()=>{
        loadEra();
    },1300);

    setTimeout(()=>{
        transition.classList.remove("show");
    },2800);
}
