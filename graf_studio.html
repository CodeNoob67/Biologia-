<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graph Studio</title>
<style>
:root{--bg:#0c1017;--panel:#121823;--panel2:#171f2c;--line:#283448;--text:#eef4ff;--muted:#91a0b6;--accent:#00c9d4;--danger:#ff4f72}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:64px minmax(0,1fr) 60px}.toolbar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}.brand{font-size:19px;font-weight:800;color:var(--accent);margin-right:12px}.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px;white-space:nowrap}.btn:hover{border-color:var(--accent)}.btn.active{background:#12414b;border-color:var(--accent)}.btn.danger{color:#ff9cad}.sep{width:1px;height:30px;background:var(--line);flex:none}.workspace{position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(#27364c 1px,transparent 1px);background-size:22px 22px;touch-action:none}.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.edge{stroke:#7f9ab8;stroke-width:3;fill:none}.edge.preview{stroke:var(--accent);stroke-dasharray:7 6}.node{position:absolute;min-width:116px;max-width:220px;min-height:72px;padding:14px 15px;background:#1c3043;border:2px solid #47789a;border-radius:18px;text-align:center;box-shadow:0 8px 24px #0005;user-select:none;cursor:grab;touch-action:none;overflow-wrap:anywhere}.node:active{cursor:grabbing}.node.selected{border-color:#ffbd5b;box-shadow:0 0 0 3px #ffbd5b33}.node .emoji{font-size:25px;display:block;margin-bottom:4px}.node .name{font-size:14px;font-weight:700}.node .desc{font-size:11px;color:#b4c4d8;margin-top:4px}.sheetBar{display:flex;align-items:flex-start;gap:6px;background:#101722;border-top:1px solid var(--line);padding:6px 9px 16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:#50627d #101722;z-index:20}.sheetBar::-webkit-scrollbar{height:8px}.sheetBar::-webkit-scrollbar-thumb{background:#50627d;border-radius:8px}.sheetTab{height:32px;min-width:110px;max-width:220px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 9px;border-radius:7px;background:#1b2635;border:1px solid #334359;color:#b8c8db;white-space:nowrap;margin-bottom:6px}.sheetTab.active{background:#16404a;border-color:var(--accent);color:white}.sheetTab .title{overflow:hidden;text-overflow:ellipsis}.sheetTab .close{color:#e59ca6;font-weight:700}.addSheet{height:32px;min-width:36px;flex:none}.hint{position:absolute;bottom:12px;left:12px;background:#111b28d9;border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:#b4c4d8;font-size:12px;pointer-events:none}.modalBackdrop{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:30}.modalBackdrop.show{display:flex}.modal{background:var(--panel);border:1px solid #42536b;border-radius:14px;padding:22px;width:min(420px,calc(100vw - 28px));box-shadow:0 20px 80px #0009}.modal h2{margin:0 0 16px}.modal label{display:block;margin:12px 0 5px;color:var(--muted);font-size:13px}.modal input,.modal select{width:100%;padding:10px;background:#0e1723;border:1px solid #42536b;border-radius:8px;color:var(--text)}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:700px){.toolbar{padding:8px}.brand{font-size:16px}.btn{padding:8px}.hint{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header class="toolbar">
 <span class="brand">◉ Graph Studio</span>
 <button class="btn" id="addNode">＋ Węzeł</button><button class="btn" id="connect">↗ Połącz</button><button class="btn" id="edit">✎ Edytuj</button><button class="btn danger" id="remove">✕ Usuń</button>
 <span class="sep"></span><button class="btn" id="undo">↶ Cofnij</button><button class="btn" id="redo">↷ Ponów</button><span class="sep"></span><button class="btn" id="export">↓ Eksport</button><button class="btn" id="import">↑ Import</button><input type="file" id="file" accept="application/json" hidden>
</header>
<main class="workspace" id="workspace"><svg class="edges" id="edges"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7f9ab8"/></marker></defs><g id="edgeLines"></g></svg><div class="hint" id="hint">Kliknij węzeł, aby go zaznaczyć. Przeciągaj węzły, aby zmienić ich położenie.</div></main>
<nav class="sheetBar" id="sheetBar" aria-label="Arkusze"></nav>
</div>
<div class="modalBackdrop" id="modalBackdrop"><form class="modal" id="nodeForm"><h2 id="modalTitle">Węzeł</h2><label for="nodeName">Nazwa</label><input id="nodeName" required maxlength="100"><label for="nodeEmoji">Ikona (emoji)</label><input id="nodeEmoji" maxlength="12" placeholder="🧬"><label for="nodeDesc">Opis</label><input id="nodeDesc" maxlength="200"><label for="nodeColor">Kolor</label><select id="nodeColor"><option value="#1c3043">Niebieski</option><option value="#244434">Zielony</option><option value="#513343">Różowy</option><option value="#513e27">Pomarańczowy</option><option value="#3c3154">Fioletowy</option></select><div class="modalActions"><button type="button" class="btn" id="cancel">Anuluj</button><button type="submit" class="btn active">Zapisz</button></div></form></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),workspace=$('workspace'),bar=$('sheetBar'),lines=$('edgeLines');
const clone=x=>JSON.parse(JSON.stringify(x));let uid=0;const id=()=>`${Date.now().toString(36)}-${(++uid).toString(36)}`;
const initial=()=>({sheets:[{id:id(),name:'Arkusz 1',nodes:[],edges:[]}],active:null});
let state;try{state=JSON.parse(localStorage.getItem('graph-studio-v2'))||initial()}catch{state=initial()}
if(!Array.isArray(state.sheets)||!state.sheets.length)state=initial();if(!state.sheets.some(s=>s.id===state.active))state.active=state.sheets[0].id;
let selected=null,connectFrom=null,mode='select',drag=null,history=[],future=[],editing=null;
const sheet=()=>state.sheets.find(s=>s.id===state.active),save=()=>{try{localStorage.setItem('graph-studio-v2',JSON.stringify(state))}catch{}},checkpoint=()=>{history.push(clone(state));if(history.length>80)history.shift();future=[]},nodeById=nid=>sheet().nodes.find(n=>n.id===nid);
function render(){renderTabs();renderGraph();$('connect').classList.toggle('active',mode==='connect');$('hint').textContent=mode==='connect'?'Tryb łączenia: kliknij pierwszy węzeł, a następnie drugi.': 'Kliknij węzeł, aby go zaznaczyć. Przeciągaj węzły, aby zmienić ich położenie.';save()}
function renderTabs(){bar.replaceChildren();state.sheets.forEach(s=>{let tab=document.createElement('button');tab.className='sheetTab'+(s.id===state.active?' active':'');tab.title='Kliknij, aby otworzyć. Dwuklik, aby zmienić nazwę.';let title=document.createElement('span');title.className='title';title.textContent=s.name;let close=document.createElement('span');close.className='close';close.textContent='×';close.title='Usuń arkusz';close.addEventListener('click',e=>{e.stopPropagation();if(state.sheets.length===1){alert('Musi pozostać przynajmniej jeden arkusz.');return}if(!confirm(`Usunąć arkusz „${s.name}”?`))return;checkpoint();state.sheets=state.sheets.filter(x=>x.id!==s.id);if(state.active===s.id)state.active=state.sheets[0].id;selected=null;render()});tab.append(title,close);tab.addEventListener('click',()=>{state.active=s.id;selected=null;connectFrom=null;render()});tab.addEventListener('dblclick',()=>{let name=prompt('Nowa nazwa arkusza:',s.name);if(name?.trim()){checkpoint();s.name=name.trim();render()}});bar.append(tab)});let plus=document.createElement('button');plus.className='btn addSheet';plus.textContent='＋';plus.title='Nowy arkusz';plus.onclick=()=>{let name=prompt('Nazwa nowego arkusza:',`Arkusz ${state.sheets.length+1}`);if(name===null)return;checkpoint();let s={id:id(),name:name.trim()||`Arkusz ${state.sheets.length+1}`,nodes:[],edges:[]};state.sheets.push(s);state.active=s.id;selected=null;render()};bar.append(plus)}
function center(n){return{x:n.x+70,y:n.y+43}}function renderGraph(){workspace.querySelectorAll('.node').forEach(el=>el.remove());lines.replaceChildren();sheet().edges.forEach(e=>{let a=nodeById(e.from),b=nodeById(e.to);if(!a||!b)return;let p=center(a),q=center(b),path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${p.x} ${p.y} L${q.x} ${q.y}`);path.setAttribute('class','edge');path.setAttribute('marker-end','url(#arrow)');lines.append(path)});sheet().nodes.forEach(n=>{let el=document.createElement('div');el.className='node'+(selected===n.id?' selected':'');el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.background=n.color||'#1c3043';el.dataset.id=n.id;let emoji=document.createElement('span');emoji.className='emoji';emoji.textContent=n.emoji||'●';let name=document.createElement('div');name.className='name';name.textContent=n.name;let desc=document.createElement('div');desc.className='desc';desc.textContent=n.desc||'';el.append(emoji,name,desc);el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.stopPropagation();if(mode==='connect'){if(!connectFrom){connectFrom=n.id;selected=n.id;renderGraph()}else{if(connectFrom!==n.id&&!sheet().edges.some(x=>x.from===connectFrom&&x.to===n.id)){checkpoint();sheet().edges.push({id:id(),from:connectFrom,to:n.id})}connectFrom=null;selected=n.id;render()}return}selected=n.id;let rect=workspace.getBoundingClientRect();drag={id:n.id,offsetX:e.clientX-rect.left-n.x,offsetY:e.clientY-rect.top-n.y,moved:false,original:{x:n.x,y:n.y},snapshot:clone(state)};el.setPointerCapture(e.pointerId);renderSelection()});el.addEventListener('pointermove',e=>{if(!drag||drag.id!==n.id)return;let rect=workspace.getBoundingClientRect(),x=Math.max(0,Math.round(e.clientX-rect.left-drag.offsetX)),y=Math.max(0,Math.round(e.clientY-rect.top-drag.offsetY));if(Math.abs(x-drag.original.x)+Math.abs(y-drag.original.y)>2)drag.moved=true;n.x=x;n.y=y;el.style.left=x+'px';el.style.top=y+'px';drawEdges()});el.addEventListener('pointerup',()=>{if(!drag)return;if(drag.moved){history.push(drag.snapshot);if(history.length>80)history.shift();future=[];save()}drag=null});el.addEventListener('dblclick',e=>{e.stopPropagation();selected=n.id;openModal(n)});workspace.append(el)})}
function drawEdges(){lines.replaceChildren();sheet().edges.forEach(e=>{let a=nodeById(e.from),b=nodeById(e.to);if(!a||!b)return;let p=center(a),q=center(b),path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${p.x} ${p.y} L${q.x} ${q.y}`);path.setAttribute('class','edge');path.setAttribute('marker-end','url(#arrow)');lines.append(path)})}
function renderSelection(){workspace.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',el.dataset.id===selected))}
workspace.addEventListener('pointerdown',e=>{if(e.target===workspace||e.target===$('edges')){selected=null;connectFrom=null;renderSelection()}});
function openModal(n=null){editing=n?.id||null;$('modalTitle').textContent=n?'Edytuj węzeł':'Nowy węzeł';$('nodeName').value=n?.name||'';$('nodeEmoji').value=n?.emoji||'🧬';$('nodeDesc').value=n?.desc||'';$('nodeColor').value=n?.color||'#1c3043';$('modalBackdrop').classList.add('show');$('nodeName').focus()}
function closeModal(){$('modalBackdrop').classList.remove('show');editing=null}
$('cancel').onclick=closeModal;$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});$('nodeForm').addEventListener('submit',e=>{e.preventDefault();let name=$('nodeName').value.trim();if(!name)return;checkpoint();let data={name,emoji:$('nodeEmoji').value.trim(),desc:$('nodeDesc').value.trim(),color:$('nodeColor').value};if(editing){Object.assign(nodeById(editing),data)}else{let rect=workspace.getBoundingClientRect();let n={id:id(),...data,x:Math.max(12,Math.round(rect.width/2-70)),y:Math.max(12,Math.round(rect.height/2-45))};sheet().nodes.push(n);selected=n.id}closeModal();render()});
$('addNode').onclick=()=>openModal();$('edit').onclick=()=>{if(!selected)return alert('Najpierw zaznacz węzeł.');openModal(nodeById(selected))};$('connect').onclick=()=>{mode=mode==='connect'?'select':'connect';connectFrom=null;render()};$('remove').onclick=()=>{if(!selected)return alert('Najpierw zaznacz węzeł.');checkpoint();sheet().nodes=sheet().nodes.filter(n=>n.id!==selected);sheet().edges=sheet().edges.filter(e=>e.from!==selected&&e.to!==selected);selected=null;render()};$('undo').onclick=()=>{if(!history.length)return;future.push(clone(state));state=history.pop();selected=null;connectFrom=null;render()};$('redo').onclick=()=>{if(!future.length)return;history.push(clone(state));state=future.pop();selected=null;connectFrom=null;render()};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='graph-studio.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.sheets)||!data.sheets.length||!data.sheets.every(s=>Array.isArray(s.nodes)&&Array.isArray(s.edges)))throw Error('Nieprawidłowy plik');checkpoint();state=data;if(!state.sheets.some(s=>s.id===state.active))state.active=state.sheets[0].id;selected=null;render()}catch(err){alert('Nie można wczytać pliku: '+err.message)}e.target.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();connectFrom=null;mode='select';render();return}if(e.target.matches('input,select,textarea'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('undo').click()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('redo').click()}else if((e.key==='Delete'||e.key==='Backspace')&&selected){e.preventDefault();$('remove').click()}});
render();
})();
</script>
</body>
</html>
