<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ziemia przez miliony lat</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

canvas{
    position:fixed;
    inset:0;
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

/* ===============================
   GÓRNE PRZYCISKI
================================ */

#modePanel{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);

    display:flex;
    gap:8px;

    padding:9px;

    background:rgba(5,15,23,.85);
    border:1px solid rgba(255,255,255,.14);
    border-radius:17px;

    backdrop-filter:blur(12px);

    pointer-events:auto;
}

button{
    border:0;
    border-radius:11px;

    padding:11px 18px;

    background:#1c3040;
    color:white;

    font-weight:bold;
    cursor:pointer;

    transition:.2s;
}

button:hover{
    background:#294c65;
    transform:translateY(-1px);
}

button.active{
    background:#168be2;
}

/* ===============================
   PANEL INFORMACJI
================================ */

#info{
    position:absolute;

    left:22px;
    top:105px;

    width:330px;

    background:rgba(4,13,20,.84);

    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;

    padding:20px;

    backdrop-filter:blur(12px);

    pointer-events:auto;
}

#info h1{
    margin:0 0 10px 0;
    font-size:26px;
}

#year{
    color:#55b8ff;
    font-size:29px;
    font-weight:bold;

    margin-bottom:17px;
}

.label{
    margin-top:12px;

    color:#849fb3;

    font-size:11px;
    text-transform:uppercase;
}

.value{
    margin-top:3px;
    font-weight:bold;
    font-size:17px;
}

#description{
    margin-top:16px;

    line-height:1.45;
    color:#d7e4eb;
}

/* ===============================
   PODPOWIEDŹ
================================ */

#hint{
    position:absolute;

    top:105px;
    right:20px;

    padding:11px 14px;

    background:rgba(3,12,18,.78);
    border-radius:13px;

    font-size:12px;
    color:#cbd9e2;
}

/* ===============================
   DOLNY PANEL
================================ */

#timelinePanel{
    position:absolute;

    bottom:18px;
    left:50%;
    transform:translateX(-50%);

    width:min(1080px,94vw);

    padding:16px 20px;

    background:rgba(4,13,20,.88);

    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;

    backdrop-filter:blur(14px);

    pointer-events:auto;
}

#timeline{
    width:100%;
    cursor:pointer;
}

#yearsLabels{
    display:flex;
    justify-content:space-between;

    margin-top:5px;

    font-size:11px;
    color:#8ca5b6;
}

#quick{
    margin-top:11px;

    display:flex;
    gap:7px;

    overflow-x:auto;
    overflow-y:hidden;

    padding-bottom:3px;
}

#quick button{
    flex:0 0 auto;
    padding:7px 10px;
    font-size:12px;
}

/* ===============================
   NAZWA WIDOKU ŻYCIA
================================ */

#sceneTitle{
    position:absolute;

    top:95px;
    left:50%;
    transform:translateX(-50%);

    font-size:22px;
    font-weight:bold;

    text-shadow:0 3px 8px black;

    display:none;
}

/* ===============================
   RESPONSYWNOŚĆ
================================ */

@media(max-width:750px){

    #info{
        left:8px;
        top:82px;
        width:230px;
        padding:13px;
    }

    #info h1{
        font-size:18px;
    }

    #year{
        font-size:20px;
    }

    .value{
        font-size:13px;
    }

    #description{
        font-size:12px;
    }

    #hint{
        display:none;
    }

}
</style>


<!-- WAŻNE: IMPORT MAPA -->
<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="ui">

    <div id="modePanel">
        <button id="earthButton" class="active">

        </button>

        <button id="lifeButton">

        </button>
    </div>


    <div id="info">

        <h1>Historia Ziemi</h1>

        <div id="year">

        <div class="label">

        </div>

        <div class="value" id="period">

        </div>


        <div class="label">

        </div>

        <div class="value" id="environment">

        </div>


        <div class="label">

        </div>

    </div>


    <div id="timelinePanel">

        <input
            type="range"

            <span>4540 mln</span>

                🦐 Kambr
            </button>

            <button onclick="setMYA(375)">
                🐟 Dewon
            </button>

            <button onclick="setMYA(310)">
                🌿 Karbon
            </button>

            <button onclick="setMYA(230)">
                🦎 Trias
            </button>

            <button onclick="setMYA(150)">
                🦕 Jura
            </button>

            <button onclick="setMYA(80)">
                🦖 Kreda
            </button>

            <button onclick="setMYA(2)">
                🦣 Epoka lodowcowa
            </button>

    </div>

</div>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";


/* ============================================================
   RENDERER
============================================================ */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.prepend(
    renderer.domElement
);


/* ============================================================
   SCENA
============================================================ */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x020710);


/* ============================================================
   KAMERA
============================================================ */

const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        0.1,
        2000
    );

camera.position.set(
    0,
    2,
    10
);


/* ============================================================
   CONTROLS
============================================================ */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = .05;

controls.minDistance = 4.5;

controls.maxDistance = 30;

controls.target.set(
    0,
    0,
    0
);


/* ============================================================
   ŚWIATŁA
============================================================ */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.15
    );

scene.add(ambient);


const sunLight =
    new THREE.DirectionalLight(
        0xfff0d0,
        3.6
    );

sunLight.position.set(
    -10,
    14,
    8
);

sunLight.castShadow = true;

sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;

scene.add(sunLight);


/* ============================================================
   GWIAZDY
============================================================ */

const starGeometry =
    new THREE.BufferGeometry();

const starPositions = [];

for(let i=0;i<4000;i++){

    const radius =
        THREE.MathUtils.randFloat(
            90,
            500
        );

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            THREE.MathUtils.randFloatSpread(2)
        );

    starPositions.push(

        radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.cos(phi),

        radius *
        Math.sin(phi) *
        Math.sin(theta)

    );
}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({
        color:0xffffff,
        size:.45
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


/* ============================================================
   GRUPY
============================================================ */

const earthGroup =
    new THREE.Group();

const lifeGroup =
    new THREE.Group();

scene.add(
    earthGroup
);

scene.add(
    lifeGroup
);

lifeGroup.visible = false;


/* ============================================================
   ZIEMIA
============================================================ */

const textureLoader =
    new THREE.TextureLoader();


const earthTexture =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
    );

earthTexture.colorSpace =
    THREE.SRGBColorSpace;


const earthNormal =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_normal_2048.jpg"
    );


const earthSpecular =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_specular_2048.jpg"
    );


const earthMaterial =
    new THREE.MeshPhongMaterial({

        map:earthTexture,

        normalMap:earthNormal,

        specularMap:earthSpecular,

        specular:
            new THREE.Color(
                0x333333
            ),

        shininess:8

    });


const earth =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            3,
            96,
            96
        ),

        earthMaterial

    );

earth.rotation.z =
    THREE.MathUtils.degToRad(
        23.4
    );

earthGroup.add(
    earth
);


/* ============================================================
   ATMOSFERA
============================================================ */

const atmosphere =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            3.08,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({

            color:0x58baff,

            transparent:true,

            opacity:.12,

            side:
                THREE.BackSide

        })

    );

earthGroup.add(
    atmosphere
);


/* ============================================================
   CHMURY
============================================================ */

const cloudTexture =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_clouds_1024.png"
    );

cloudTexture.colorSpace =
    THREE.SRGBColorSpace;


const clouds =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            3.035,
            64,
            64
        ),

        new THREE.MeshPhongMaterial({

            map:cloudTexture,

            transparent:true,

            opacity:.32,

            depthWrite:false

        })

    );

earthGroup.add(
    clouds
);


/* ============================================================
   EFEKT BLASKU ATMOSFERY
============================================================ */

const glow =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            3.17,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({

            color:0x278cff,

            transparent:true,

            opacity:.035,

            side:
                THREE.BackSide

        })

    );

earthGroup.add(glow);


/* ============================================================
   SCENA ŻYCIA
============================================================ */

const lifeSky =
    new THREE.Color(
        0x9ed7ed
    );


/* ============================================================
   PODŁOŻE
============================================================ */

const groundGeometry =
    new THREE.PlaneGeometry(
        80,
        80,
        120,
        120
    );

const groundPositions =
    groundGeometry.attributes.position;

for(
    let i=0;
    i<groundPositions.count;
    i++
){

    const x =
        groundPositions.getX(i);

    const y =
        groundPositions.getY(i);

    let height =
        Math.sin(x*.18)*.35 +
        Math.cos(y*.23)*.28;

    height +=
        Math.sin(
            (x+y)*.08
        )*.65;

    height +=
        Math.sin(
            x*.06
        )*.8;

    groundPositions.setZ(
        i,
        height
    );

}

groundGeometry.computeVertexNormals();


const groundMaterial =
    new THREE.MeshStandardMaterial({

        color:0x8c9e54,

        roughness:1

    });


const ground =
    new THREE.Mesh(

        groundGeometry,

        groundMaterial

    );

ground.rotation.x =
    -Math.PI/2;

ground.position.y =
    -2;

ground.receiveShadow = true;

lifeGroup.add(
    ground
);


/* ============================================================
   RZEKA
============================================================ */

const riverGroup =
    new THREE.Group();

lifeGroup.add(
    riverGroup
);


function createRiverPiece(
    x,
    z,
    width,
    length,
    angle
){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                length
            ),

            new THREE.MeshStandardMaterial({

                color:0x43bfe8,

                roughness:.2,

                metalness:.05,

                transparent:true,

                opacity:.9

            })

        );

    mesh.rotation.x =
        -Math.PI/2;

    mesh.rotation.z =
        angle;

    mesh.position.set(
        x,
        -1.55,
        z
    );

    riverGroup.add(
        mesh
    );

}


createRiverPiece(
    3,
    -4,
    4,
    18,
    .12
);

createRiverPiece(
    1,
    -17,
    5,
    15,
    -.18
);

createRiverPiece(
    5,
    8,
    3,
    14,
    -.1
);


/* ============================================================
   GÓRY
============================================================ */

const mountainsGroup =
    new THREE.Group();

lifeGroup.add(
    mountainsGroup
);


function mountain(
    x,
    z,
    height,
    radius
){

    const m =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                radius,
                height,
                6
            ),

            new THREE.MeshStandardMaterial({

                color:0x8d765e,

                roughness:1

            })

        );

    m.position.set(
        x,
        -2 + height/2,
        z
    );

    m.castShadow = true;
    m.receiveShadow = true;

    mountainsGroup.add(
        m
    );

}


for(let i=0;i<13;i++){

    mountain(

        THREE.MathUtils.randFloat(
            -22,
            22
        ),

        THREE.MathUtils.randFloat(
            -32,
            -22
        ),

        THREE.MathUtils.randFloat(
            4,
            10
        ),

        THREE.MathUtils.randFloat(
            2,
            5
        )

    );

}


/* ============================================================
   ROŚLINNOŚĆ
============================================================ */

const vegetation =
    new THREE.Group();

lifeGroup.add(
    vegetation
);


const trunkMaterial =
    new THREE.MeshStandardMaterial({
        color:0x634226
    });


const leafMaterial =
    new THREE.MeshStandardMaterial({
        color:0x5a7c38
    });


function createTree(
    x,
    z,
    scale=1
){

    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .16*scale,
                .25*scale,
                2.8*scale,
                7
            ),

            trunkMaterial

        );

    trunk.position.y =
        1.4*scale;

    trunk.castShadow = true;

    tree.add(
        trunk
    );


    for(let i=0;i<4;i++){

        const crown =
            new THREE.Mesh(

                new THREE.IcosahedronGeometry(
                    THREE.MathUtils.randFloat(
                        .8,
                        1.25
                    )*scale,
                    1
                ),

                leafMaterial

            );

        crown.position.set(

            THREE.MathUtils.randFloat(
                -.55,
                .55
            )*scale,

            THREE.MathUtils.randFloat(
                2.6,
                3.6
            )*scale,

            THREE.MathUtils.randFloat(
                -.45,
                .45
            )*scale

        );

        crown.castShadow = true;

        tree.add(
            crown
        );

    }


    tree.position.set(
        x,
        -1.8,
        z
    );

    tree.rotation.y =
        Math.random()*
        Math.PI*2;

    vegetation.add(
        tree
    );

}


for(let i=0;i<70;i++){

    let x =
        THREE.MathUtils.randFloat(
            -28,
            28
        );

    let z =
        THREE.MathUtils.randFloat(
            -32,
            15
        );


    if(
        Math.abs(x-3)<4
    ){

        x +=
            x > 3 ?
            5 :
            -5;

    }


    createTree(

        x,
        z,

        THREE.MathUtils.randFloat(
            .5,
            1.55
        )

    );

}


/* ============================================================
   PAPROCIE
============================================================ */

const fernGroup =
    new THREE.Group();

lifeGroup.add(
    fernGroup
);


function createFern(
    x,
    z,
    scale=1
){

    const fern =
        new THREE.Group();


    for(let i=0;i<7;i++){

        const leaf =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .11*scale,
                    .06*scale,
                    1.5*scale
                ),

                new THREE.MeshStandardMaterial({
                    color:0x476d28
                })

            );

        leaf.position.y =
            .6*scale;

        leaf.rotation.y =
            i/7 *
            Math.PI*2;

        leaf.rotation.x =
            -.45;

        leaf.position.x =
            Math.sin(
                leaf.rotation.y
            )*.4*scale;

        leaf.position.z =
            Math.cos(
                leaf.rotation.y
            )*.4*scale;

        fern.add(
            leaf
        );

    }

    fern.position.set(
        x,
        -1.45,
        z
    );

    fernGroup.add(
        fern
    );

}


for(let i=0;i<90;i++){

    createFern(

        THREE.MathUtils.randFloat(
            -23,
            23
        ),

        THREE.MathUtils.randFloat(
            -20,
            12
        ),

        THREE.MathUtils.randFloat(
            .5,
            1.25
        )

    );

}


/* ============================================================
   SKAŁY
============================================================ */

const rocks =
    new THREE.Group();

lifeGroup.add(
    rocks
);


const rockMaterial =
    new THREE.MeshStandardMaterial({
        color:0x81725f,
        roughness:1
    });


for(let i=0;i<35;i++){

    const r =
        new THREE.Mesh(

            new THREE.DodecahedronGeometry(
                THREE.MathUtils.randFloat(
                    .3,
                    1.4
                ),
                0
            ),

            rockMaterial

        );

    r.position.set(

        THREE.MathUtils.randFloat(
            -25,
            25
        ),

        THREE.MathUtils.randFloat(
            -1.8,
            -1
        ),

        THREE.MathUtils.randFloat(
            -28,
            15
        )

    );

    r.scale.y =
        THREE.MathUtils.randFloat(
            .4,
            1
        );

    r.rotation.set(

        Math.random(),

        Math.random(),

        Math.random()

    );

    r.castShadow = true;

    rocks.add(
        r
    );

}


/* ============================================================
   ZWIERZĘTA
============================================================ */

const animals =
    new THREE.Group();

lifeGroup.add(
    animals
);


function makeMaterial(
    color
){

    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:.9
    });

}


/* ============================================================
   SAUROPOD
============================================================ */

function createSauropod(
    x,
    z,
    scale=1,
    color=0x6d7e45
){

    const dinosaur =
        new THREE.Group();

    const mat =
        makeMaterial(
            color
        );


    const body =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.3,
                20,
                16
            ),

            mat

        );

    body.scale.set(
        1.8,
        .85,
        .8
    );

    body.castShadow = true;

    dinosaur.add(
        body
    );


    const neck =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .22,
                .42,
                3.7,
                10
            ),

            mat

        );

    neck.rotation.z =
        -.55;

    neck.position.set(
        1.65,
        1.25,
        0
    );

    neck.castShadow = true;

    dinosaur.add(
        neck
    );


    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .38,
                14,
                12
            ),

            mat

        );

    head.scale.set(
        1.25,
        .75,
        .8
    );

    head.position.set(
        2.7,
        2.55,
        0
    );

    head.castShadow = true;

    dinosaur.add(
        head
    );


    const tail =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                .45,
                4.8,
                10
            ),

            mat

        );

    tail.rotation.z =
        Math.PI/2;

    tail.position.set(
        -3,
        .05,
        0
    );

    tail.castShadow = true;

    dinosaur.add(
        tail
    );


    const legPositions = [

        [-.9,-1,.6],
        [-.9,-1,-.6],
        [.9,-1,.6],
        [.9,-1,-.6]

    ];


    for(
        const p
        of legPositions
    ){

        const leg =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .18,
                    .24,
                    1.9,
                    8
                ),

                mat

            );

        leg.position.set(
            p[0],
            p[1],
            p[2]
        );

        leg.castShadow = true;

        dinosaur.add(
            leg
        );

    }


    dinosaur.scale.setScalar(
        scale
    );

    dinosaur.position.set(
        x,
        -.25,
        z
    );

    dinosaur.rotation.y =
        Math.random()*
        Math.PI*2;

function getMYA(){

    return (
        4540 -
        Number(
            timeline.value
        )
    );

}


window.setMYA =
function(mya){

    timeline.value =
        4540 - mya;

    update();

};


function findPeriod(
    mya
){

    for(
        const p
        of periods
    ){

        if(
            mya >= p.min
        ){

            return p;

        }

    }

    return periods[
        periods.length-1
    ];

}

}

function updateEarth(
    period
){

    earthMaterial.map =
        earthTexture;

    earthMaterial.color.set(
        0xffffff
    );

    clouds.visible = true;

    atmosphere.material.color.set(
        0x58baff
    );


    if(
        period.world==="lava"
    ){

        earthMaterial.map = null;

        earthMaterial.color.set(
            0xa63716
        );

        clouds.visible=false;

        atmosphere.material.color.set(
            0xff7136
        );

    }


    if(
        period.world==="microbes"
    ){

        earthMaterial.color.set(
            0x8da994
        );

        clouds.visible=true;

    }


    if(
        period.world==="ice"
    ){

        earthMaterial.color.set(
            0xd7edf4
        );

        atmosphere.material.color.set(
            0xb8eaff
        );

    }


    earthMaterial.needsUpdate=true;

}


/* ============================================================
   AKTUALIZACJA
============================================================ */

function update(){

    const mya =
        getMYA();

    const p =
        findPeriod(
            mya
        );


    if(
        mya===0
    ){

        yearElement.textContent =
            "Współczesność";

    }

    else{

        yearElement.textContent =
            Math.round(mya) +
            " mln lat temu";

    }


    periodElement.textContent =
        p.name;

    environmentElement.textContent =
        p.environment;

    organismsElement.textContent =
        p.organisms;

    descriptionElement.textContent =
        p.description;


    sceneTitle.textContent =
        "🌿 " +
        p.name;


    updateEarth(
        p
    );

    setupLifeWorld(
        p
    );

}


timeline.addEventListener(
    "input",
    update
);

/* ============================================================
   ANIMACJA
============================================================ */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        earthGroup.visible
    ){

        earth.rotation.y +=
            delta*.025;

        clouds.rotation.y +=
            delta*.035;

    }


    if(
        lifeGroup.visible
    ){

        for(
            const animal
            of animals.children
        ){

            if(
                animal.userData.type===
                "walker"
            ){

                const speed =
                    animal.userData.speed;

                const direction =
                    animal.userData.direction;


                animal.position.x +=
                    Math.cos(
                        direction
                    ) *
                    speed *
                    delta;

                animal.position.z +=
                    Math.sin(
                        direction
                    ) *
                    speed *
                    delta;


                animal.rotation.y =
                    -direction;


                if(
                    Math.abs(
                        animal.position.x
                    ) > 20
                    ||
                    animal.position.z>12
                    ||
                    animal.position.z<-26
                ){

                    animal.userData.direction +=
                        Math.PI +
                        THREE.MathUtils.randFloat(
                            -.7,
                            .7
                        );

                }

            }


            if(
                animal.userData.type===
                "fish"
            ){

                animal.position.x +=
                    animal.userData.speed *
                    delta;

                if(
                    animal.position.x >
                    18
                ){

                    animal.position.x=
                        -18;

                }

            }

        }

    }


    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();


/* ============================================================
   ZMIANA ROZMIARU
============================================================ */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* ============================================================
   START
============================================================ */

update();

showEarth();

</script>
