<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ziemia przez miliony lat</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
        color: white;
    }

    canvas {
        display: block;
    }

    #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
    }

    #topPanel {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        pointer-events: auto;
        background: rgba(5, 12, 18, 0.78);
        backdrop-filter: blur(12px);
        padding: 9px;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.14);
    }

    button {
        border: 0;
        border-radius: 11px;
        padding: 11px 18px;
        background: #1c2c39;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #2f4d62;
    }

    button.active {
        background: #2685d9;
    }

    #infoPanel {
        position: absolute;
        top: 90px;
        left: 20px;
        width: 310px;
        background: rgba(5, 12, 18, 0.76);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 18px;
        padding: 18px;
        pointer-events: auto;
    }

    #infoPanel h1 {
        margin: 0 0 10px;
        font-size: 24px;
    }

    #timeText {
        font-size: 27px;
        font-weight: bold;
        color: #60b7ff;
        margin-bottom: 14px;
    }

    .label {
        font-size: 11px;
        color: #8ca5b8;
        text-transform: uppercase;
        margin-top: 12px;
    }

    .value {
        font-weight: bold;
        margin-top: 3px;
    }

    #description {
        margin-top: 14px;
        color: #d8e3e9;
        line-height: 1.4;
    }

    #bottomPanel {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        width: min(1000px, 94vw);
        pointer-events: auto;
        background: rgba(5, 12, 18, 0.82);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 18px;
        padding: 14px 18px;
    }

    #timeline {
        width: 100%;
        cursor: pointer;
    }

    .timelineLabels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #90a6b4;
        margin-top: 5px;
    }

    #quickButtons {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        margin-top: 10px;
        padding-bottom: 2px;
    }

    #quickButtons button {
        flex: 0 0 auto;
        padding: 7px 10px;
        font-size: 12px;
    }

    #hint {
        position: absolute;
        right: 20px;
        top: 90px;
        background: rgba(5,12,18,0.68);
        padding: 10px 13px;
        border-radius: 12px;
        font-size: 12px;
        color: #c8d6df;
    }

    @media (max-width: 700px) {
        #infoPanel {
            width: 235px;
            top: 78px;
            left: 8px;
            font-size: 12px;
        }

        #infoPanel h1 {
            font-size: 18px;
        }

        #timeText {
            font-size: 19px;
        }

        #hint {
            display: none;
        }
    }
</style>
</head>

<body>

<div id="ui">

    <div id="topPanel">
        <button id="earthMode" class="active">🌍 Ziemia</button>
        <button id="lifeMode">🦖 Życie</button>
    </div>

    <div id="infoPanel">
        <h1>Historia Ziemi</h1>

        <div id="timeText">150 mln lat temu</div>

        <div class="label">Okres</div>
        <div class="value" id="periodText">Jura</div>

        <div class="label">Środowisko</div>
        <div class="value" id="environmentText">Ciepłe lasy i morza</div>

        <div class="label">Organizmy</div>
        <div class="value" id="lifeText">Dinozaury, pterozaury, pierwsze ptaki</div>

        <div id="description">
            Dinozaury dominują na lądzie, a klimat jest znacznie cieplejszy niż obecnie.
        </div>
    </div>

    <div id="hint">
        LPM: obracanie<br>
        Kółko: zoom
    </div>

    <div id="bottomPanel">
        <input
            id="timeline"
            type="range"
            min="0"
            max="4540"
            value="4390"
            step="1"
        >

        <div class="timelineLabels">
            <span>4540 mln</span>
            <span>4000</span>
            <span>3000</span>
            <span>2000</span>
            <span>1000</span>
            <span>500</span>
            <span>Dziś</span>
        </div>

        <div id="quickButtons">
            <button onclick="setMYA(4540)">🌋 Początek Ziemi</button>
            <button onclick="setMYA(3500)">🦠 Pierwsze życie</button>
            <button onclick="setMYA(520)">🦐 Kambr</button>
            <button onclick="setMYA(375)">🐟 Dewon</button>
            <button onclick="setMYA(310)">🌿 Karbon</button>
            <button onclick="setMYA(230)">🦖 Trias</button>
            <button onclick="setMYA(150)">🦕 Jura</button>
            <button onclick="setMYA(80)">🦖 Kreda</button>
            <button onclick="setMYA(2)">🦣 Epoka lodowcowa</button>
            <button onclick="setMYA(0)">🌍 Dzisiaj</button>
        </div>
    </div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

/* =========================================================
   PODSTAWOWE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020710);

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    3000
);

camera.position.set(0, 4, 11);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

document.body.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;
controls.dampingFactor = 0.06;

controls.minDistance = 4;
controls.maxDistance = 30;

controls.target.set(0, 0, 0);


/* =========================================================
   ŚWIATŁO
========================================================= */

const ambient = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambient);

const sunLight = new THREE.DirectionalLight(0xfff0d4, 3.2);

sunLight.position.set(-8, 12, 8);

sunLight.castShadow = true;

sunLight.shadow.mapSize.set(2048, 2048);

scene.add(sunLight);


/* =========================================================
   GWIAZDY
========================================================= */

const starGeometry = new THREE.BufferGeometry();

const starCount = 2500;

const starPositions = [];

for (let i = 0; i < starCount; i++) {

    const r = THREE.MathUtils.randFloat(150, 500);

    const theta = Math.random() * Math.PI * 2;

    const phi = Math.acos(
        THREE.MathUtils.randFloatSpread(2)
    );

    starPositions.push(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.sin(phi) * Math.sin(theta),
        r * Math.cos(phi)
    );
}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3)
);

const starMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.7,
    sizeAttenuation: true
});

const stars = new THREE.Points(
    starGeometry,
    starMaterial
);

scene.add(stars);


/* =========================================================
   GRUPY
========================================================= */

const earthGroup = new THREE.Group();

const lifeGroup = new THREE.Group();

scene.add(earthGroup);
scene.add(lifeGroup);


/* =========================================================
   ZIEMIA 3D
========================================================= */

const earthGeometry = new THREE.SphereGeometry(
    3,
    96,
    96
);

const earthMaterial = new THREE.MeshStandardMaterial({
    color: 0x1674a6,
    roughness: 0.75,
    metalness: 0
});

const earth = new THREE.Mesh(
    earthGeometry,
    earthMaterial
);

earth.castShadow = true;
earth.receiveShadow = true;

earthGroup.add(earth);


/* ATMOSFERA */

const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(3.08, 64, 64),
    new THREE.MeshBasicMaterial({
        color: 0x6bc4ff,
        transparent: true,
        opacity: 0.09,
        side: THREE.BackSide
    })
);

earthGroup.add(atmosphere);


/* =========================================================
   KONTYNENTY 3D
========================================================= */

const continentGroup = new THREE.Group();

earthGroup.add(continentGroup);

const continentMaterial = new THREE.MeshStandardMaterial({
    color: 0x557a35,
    roughness: 1
});

function pointOnSphere(lat, lon, radius = 3.035) {

    const phi =
        THREE.MathUtils.degToRad(90 - lat);

    const theta =
        THREE.MathUtils.degToRad(lon + 180);

    return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
    );
}

function createLandPatch(lat, lon, sx, sy, rot = 0) {

    const geo = new THREE.CircleGeometry(1, 12);

    geo.scale(sx, sy, 1);

    const mesh = new THREE.Mesh(
        geo,
        continentMaterial
    );

    const p = pointOnSphere(lat, lon);

    mesh.position.copy(p);

    mesh.lookAt(0, 0, 0);

    mesh.rotateZ(rot);

    continentGroup.add(mesh);

    return mesh;
}


/* WSPÓŁCZESNY UKŁAD - STYLIZOWANE, ALE ROZPOZNAWALNE */

const landPatches = [

    createLandPatch(
        47, -105,
        0.72, 0.5,
        0.25
    ),

    createLandPatch(
        23, -100,
        0.27, 0.52,
        -0.25
    ),

    createLandPatch(
        -15, -60,
        0.38, 0.76,
        0.08
    ),

    createLandPatch(
        52, 18,
        0.52, 0.3,
        0.12
    ),

    createLandPatch(
        13, 21,
        0.45, 0.74,
        -0.05
    ),

    createLandPatch(
        45, 80,
        1.05, 0.52,
        -0.08
    ),

    createLandPatch(
        20, 78,
        0.36, 0.42,
        0.2
    ),

    createLandPatch(
        -25, 135,
        0.48, 0.3,
        -0.15
    ),

    createLandPatch(
        72, -40,
        0.42, 0.35,
        0.12
    )

];


/* =========================================================
   CHMURY
========================================================= */

const cloudMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.28,
    roughness: 1
});

const cloudGroup = new THREE.Group();

earthGroup.add(cloudGroup);

for (let i = 0; i < 28; i++) {

    const cloud = new THREE.Mesh(
        new THREE.SphereGeometry(
            THREE.MathUtils.randFloat(0.08, 0.2),
            8,
            8
        ),
        cloudMaterial
    );

    const lat =
        THREE.MathUtils.randFloat(-70, 70);

    const lon =
        THREE.MathUtils.randFloat(-180, 180);

    cloud.position.copy(
        pointOnSphere(lat, lon, 3.1)
    );

    cloud.scale.set(
        THREE.MathUtils.randFloat(2, 4),
        0.5,
        THREE.MathUtils.randFloat(0.5, 1.2)
    );

    cloudGroup.add(cloud);
}


/* =========================================================
   TRYB ŻYCIA
========================================================= */

lifeGroup.visible = false;


/* TEREN */

const groundGeometry =
    new THREE.PlaneGeometry(
        60,
        60,
        100,
        100
    );

const pos =
    groundGeometry.attributes.position;

for (let i = 0; i < pos.count; i++) {

    const x = pos.getX(i);
    const y = pos.getY(i);

    const z =
        Math.sin(x * 0.3) * 0.5 +
        Math.cos(y * 0.27) * 0.35 +
        Math.sin((x + y) * 0.14) * 0.6;

    pos.setZ(i, z);
}

groundGeometry.computeVertexNormals();

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x82944c,
        roughness: 1
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.position.y = -1.5;

ground.receiveShadow = true;

lifeGroup.add(ground);


/* RZEKA */

const river = new THREE.Mesh(
    new THREE.PlaneGeometry(
        6,
        50
    ),
    new THREE.MeshStandardMaterial({
        color: 0x38aee0,
        roughness: 0.25,
        metalness: 0.08
    })
);

river.rotation.x =
    -Math.PI / 2;

river.rotation.z =
    0.12;

river.position.set(
    3,
    -1.15,
    -5
);

lifeGroup.add(river);


/* SŁOŃCE */

const lifeSun =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            1.2,
            32,
            32
        ),
        new THREE.MeshBasicMaterial({
            color: 0xffef9a
        })
    );

lifeSun.position.set(
    -15,
    16,
    -35
);

lifeGroup.add(lifeSun);


/* =========================================================
   DRZEWA
========================================================= */

const vegetationGroup =
    new THREE.Group();

lifeGroup.add(vegetationGroup);

function createTree(
    x,
    z,
    scale = 1
) {

    const group =
        new THREE.Group();

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.14 * scale,
                0.22 * scale,
                2.8 * scale,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x5c3822
            })
        );

    trunk.castShadow = true;

    trunk.position.y =
        1.4 * scale;

    group.add(trunk);


    for (let i = 0; i < 4; i++) {

        const crown =
            new THREE.Mesh(
                new THREE.IcosahedronGeometry(
                    THREE.MathUtils.randFloat(
                        0.75,
                        1.2
                    ) * scale,
                    1
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x517b35
                })
            );

        crown.position.set(
            THREE.MathUtils.randFloat(
                -0.5,
                0.5
            ) * scale,

            THREE.MathUtils.randFloat(
                2.7,
                3.8
            ) * scale,

            THREE.MathUtils.randFloat(
                -0.5,
                0.5
            ) * scale
        );

        crown.castShadow = true;

        group.add(crown);
    }

    group.position.set(
        x,
        -1.25,
        z
    );

    group.rotation.y =
        Math.random() * Math.PI * 2;

    vegetationGroup.add(group);

    return group;
}

for (let i = 0; i < 45; i++) {

    let x =
        THREE.MathUtils.randFloat(-22, 22);

    let z =
        THREE.MathUtils.randFloat(-24, 15);

    if (
        Math.abs(x - 3) < 4
    ) {
        x += 6;
    }

    createTree(
        x,
        z,
        THREE.MathUtils.randFloat(
            0.7,
            1.6
        )
    );
}


/* =========================================================
   SKAŁY
========================================================= */

const rockMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x806f59,
        roughness: 1
    });

for (let i = 0; i < 35; i++) {

    const rock =
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                THREE.MathUtils.randFloat(
                    0.25,
                    1.3
                ),
                0
            ),
            rockMaterial
        );

    rock.position.set(
        THREE.MathUtils.randFloat(
            -24,
            24
        ),
        -0.8,
        THREE.MathUtils.randFloat(
            -30,
            12
        )
    );

    rock.scale.y =
        THREE.MathUtils.randFloat(
            0.4,
            1.4
        );

    rock.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
    );

    rock.castShadow = true;

    lifeGroup.add(rock);
}


/* =========================================================
   ZWIERZĘTA 3D
========================================================= */

const animalGroup =
    new THREE.Group();

lifeGroup.add(animalGroup);

function material(color) {

    return new THREE.MeshStandardMaterial({
        color,
        roughness: 0.9
    });
}


/* DINOZAUR */

function createDinosaur(
    x,
    z,
    scale = 1,
    color = 0x667b3c
) {

    const g =
        new THREE.Group();

    const mat =
        material(color);

    const body =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.4 * scale,
                18,
                14
            ),
            mat
        );

    body.scale.set(
        1.5,
        0.75,
        0.75
    );

    body.castShadow = true;

    g.add(body);


    const neck =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.24 * scale,
                0.42 * scale,
                2.4 * scale,
                10
            ),
            mat
        );

    neck.rotation.z =
        -0.55;

    neck.position.set(
        1.3 * scale,
        1.0 * scale,
        0
    );

    neck.castShadow = true;

    g.add(neck);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.42 * scale,
                14,
                12
            ),
            mat
        );

    head.scale.set(
        1.2,
        0.8,
        0.8
    );

    head.position.set(
        2.1 * scale,
        2 * scale,
        0
    );

    head.castShadow = true;

    g.add(head);


    const tail =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                0.45 * scale,
                3.5 * scale,
                10
            ),
            mat
        );

    tail.rotation.z =
        Math.PI / 2;

    tail.position.set(
        -2.3 * scale,
        0,
        0
    );

    tail.castShadow = true;

    g.add(tail);


    const legGeo =
        new THREE.CylinderGeometry(
            0.18 * scale,
            0.23 * scale,
            1.7 * scale,
            8
        );

    [
        [-0.7, -0.9, 0.6],
        [-0.7, -0.9, -0.6],
        [0.7, -0.9, 0.6],
        [0.7, -0.9, -0.6]
    ].forEach(p => {

        const leg =
            new THREE.Mesh(
                legGeo,
                mat
            );

        leg.position.set(
            p[0] * scale,
            p[1] * scale,
            p[2] * scale
        );

        leg.castShadow = true;

        g.add(leg);
    });


    g.position.set(
        x,
        0.2,
        z
    );

    g.rotation.y =
        Math.random() * Math.PI * 2;

    animalGroup.add(g);

    return g;
}


/* TEROPOD */

function createTheropod(
    x,
    z,
    scale = 1
) {

    const g =
        new THREE.Group();

    const mat =
        material(0x6d5436);

    const body =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1,
                16,
                12
            ),
            mat
        );

    body.scale.set(
        1.45,
        0.75,
        0.72
    );

    g.add(body);


    const head =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.1 * scale,
                0.7 * scale,
                0.7 * scale
            ),
            mat
        );

    head.position.set(
        1.6 * scale,
        0.55 * scale,
        0
    );

    g.add(head);


    const tail =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                0.5 * scale,
                3.3 * scale,
                8
            ),
            mat
        );

    tail.rotation.z =
        Math.PI / 2;

    tail.position.set(
        -2.0 * scale,
        0,
        0
    );

    g.add(tail);


    for (let side of [-1, 1]) {

        const leg =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    0.16 * scale,
                    0.19 * scale,
                    1.6 * scale,
                    8
                ),
                mat
            );

        leg.position.set(
            0.2 * scale,
            -1 * scale,
            0.5 * side * scale
        );

        g.add(leg);
    }

    g.position.set(
        x,
        0.6,
        z
    );

    g.scale.setScalar(scale);

    animalGroup.add(g);

    return g;
}


/* MAMUT */

function createMammoth(
    x,
    z,
    scale = 1
) {

    const g =
        new THREE.Group();

    const fur =
        material(0x573a29);

    const ivory =
        material(0xe8dfb8);

    const body =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.3,
                16,
                12
            ),
            fur
        );

    body.scale.set(
        1.3,
        1,
        0.8
    );

    g.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.85,
                14,
                12
            ),
            fur
        );

    head.position.set(
        1.25,
        0.15,
        0
    );

    g.add(head);


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.13,
                0.22,
                2.1,
                9
            ),
            fur
        );

    trunk.position.set(
        1.85,
        -0.85,
        0
    );

    trunk.rotation.z =
        0.1;

    g.add(trunk);


    for (let side of [-1, 1]) {

        const tusk =
            new THREE.Mesh(
                new THREE.TorusGeometry(
                    0.75,
                    0.07,
                    8,
                    24,
                    Math.PI * 1.1
                ),
                ivory
            );

        tusk.rotation.y =
            Math.PI / 2;

        tusk.position.set(
            1.9,
            -0.4,
            0.55 * side
        );

        g.add(tusk);
    }


    for (let xLeg of [-0.7, 0.7]) {

        for (let zLeg of [-0.5, 0.5]) {

            const leg =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        0.18,
                        0.22,
                        1.7,
                        8
                    ),
                    fur
                );

            leg.position.set(
                xLeg,
                -1.3,
                zLeg
            );

            g.add(leg);
        }
    }

    g.position.set(
        x,
        0.7,
        z
    );

    g.scale.setScalar(scale);

    animalGroup.add(g);

    return g;
}


/* RYBA */

function createFish(
    x,
    y,
    z,
    scale = 1
) {

    const g =
        new THREE.Group();

    const mat =
        material(0x607d86);

    const body =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.7,
                14,
                10
            ),
            mat
        );

    body.scale.set(
        1.6,
        0.75,
        0.5
    );

    g.add(body);


    const tail =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                0.55,
                1.3,
                4
            ),
            mat
        );

    tail.rotation.z =
        -Math.PI / 2;

    tail.position.x =
        -1.3;

    g.add(tail);


    g.position.set(
        x,
        y,
        z
    );

    g.scale.setScalar(scale);

    animalGroup.add(g);

    return g;
}

/* =========================================================

========================================================= */

function getMYA() {

    return 4540 -
        Number(slider.value);
}

window.setMYA = function(mya) {

    slider.value =
        4540 - mya;

    updateTime();
}

function findPeriod(mya) {

    for (
        let i = 0;
        i < periods.length;
        i++
    ) {

        if (
            mya >= periods[i].min
        ) {
            return periods[i];
        }
    }

    return periods[
        periods.length - 1
    ];
}

    period
) {

    setContinents(mya);

    if (
        period.world === "lava"
    ) {

        earthMaterial.color.set(
            0xbb3a13
        );

        continentMaterial.color.set(
            0x2d160d
        );

        atmosphere.material.color.set(

        );

    }

    else if (
        period.world === "ice"
    ) {

        earthMaterial.color.set(
            0x1d789f
        );

        continentMaterial.color.set(
            0xddebed
        );

        atmosphere.material.color.set(
            0x9ddfff
        );

    }

    else {

        earthMaterial.color.set(
            0x176fa4
        );

        continentMaterial.color.set(
            0x597e3d
        );

        atmosphere.material.color.set(
            0x6bc4ff
        );
    }
}


/* =========================================================
   AKTUALIZACJA
========================================================= */

function updateTime() {

    const mya =
        getMYA();

    const period =
        findPeriod(mya);


    if (mya === 0) {

        timeText.textContent =
            "Współczesność";

    }

    else {

        timeText.textContent =
            Math.round(mya) +
            " mln lat temu";
    }


    periodText.textContent =
        period.name;

    environmentText.textContent =
        period.environment;

    lifeText.textContent =
        period.life;

    description.textContent =
        period.description;


    updateEarthWorld(
        mya,
        period
    );

    updateLifeWorld(
        period.world
    );
}

slider.addEventListener(
    "input",
    updateTime
);


/* =========================================================
   TRYBY
========================================================= */

function showEarth() {

    earthGroup.visible = true;
    lifeGroup.visible = false;

    earthMode.classList.add(
        "active"
    );

    lifeMode.classList.remove(
        "active"
    );


    camera.position.set(
        0,
        2,
        10
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.minDistance = 5;
    controls.maxDistance = 20;
}

function showLife() {

    earthGroup.visible = false;
    lifeGroup.visible = true;

    lifeMode.classList.add(
        "active"
    );

    earthMode.classList.remove(
        "active"
    );


    camera.position.set(
        11,
        8,
        16
    );

    controls.target.set(
        0,
        0,
        -5
    );

    controls.minDistance = 4;
    controls.maxDistance = 45;
}

earthMode.addEventListener(
    "click",
    showEarth
);

lifeMode.addEventListener(
    "click",
    showLife
);


/* =========================================================
   ANIMACJE
========================================================= */

let clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(
        animate
    );

    const t =
        clock.getElapsedTime();


    if (
        earthGroup.visible
    ) {

        earth.rotation.y +=
            0.0007;

        continentGroup.rotation.y =
            earth.rotation.y;

        cloudGroup.rotation.y +=
            0.0009;
    }


    animalGroup.children.forEach(
        (animal, i) => {

            animal.position.y +=
                Math.sin(
                    t * 2 +
                    i
                ) * 0.0006;

        }
    );


    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* START */

updateTime();
showEarth();
