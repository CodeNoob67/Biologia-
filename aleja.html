<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aleja Pucharów</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            color: white;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #2c5b9c,
                    #122d59
                );
        }

        button,
        a {
            font-family: inherit;
        }

        .screen {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }

        .background-pattern {
            position: absolute;
            inset: 0;

            opacity: 0.08;

            background-image:
                radial-gradient(
                    circle,
                    white 3px,
                    transparent 4px
                );

            background-size:
                90px 90px;
        }

        .topbar {
            position: relative;
            z-index: 20;

            height: 92px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 10px 18px;

            background:
                linear-gradient(
                    #294f87,
                    #173766
                );

            border-bottom:
                5px solid #0b1e3d;

            box-shadow:
                0 6px 0 #00000055;
        }

        .back-button {
            width: 72px;
            height: 64px;

            display: grid;
            place-items: center;

            color: white;
            font-size: 38px;
            text-decoration: none;

            background:
                linear-gradient(
                    #486b9e,
                    #263e68
                );

            border:
                4px solid #08172e;

            border-radius:
                12px;

            box-shadow:
                0 5px 0 #00000066;
        }

        .back-button:hover {
            filter:
                brightness(1.12);
        }

        .title-box {
            position: absolute;
            left: 50%;
            top: 8px;

            transform:
                translateX(-50%);

            text-align: center;
        }

        .title-box h1 {
            margin: 0;

            font-size:
                clamp(
                    27px,
                    4vw,
                    45px
                );

            font-weight: 1000;

            text-shadow:
                4px 4px #0b1b35;
        }

        .title-box p {
            margin: 3px 0 0;

            color: #b9ddff;

            font-size: 13px;
            font-weight: 900;
        }

        .trophy-total {
            min-width: 180px;

            padding: 10px 16px;

            color: #ffe45c;

            text-align: center;

            font-size: 23px;
            font-weight: 1000;

            background:
                linear-gradient(
                    #243e69,
                    #14294c
                );

            border:
                4px solid #091a35;

            border-radius:
                12px;

            box-shadow:
                0 5px 0 #00000066;

            text-shadow:
                2px 2px black;
        }

        .road-window {
            position: absolute;
            left: 0;
            right: 0;
            top: 92px;
            bottom: 0;

            z-index: 5;

            overflow-x: auto;
            overflow-y: hidden;

            scroll-behavior: smooth;

            scrollbar-width: thick;
            scrollbar-color:
                #5bbcff
                #10264c;
        }

        .road-window::-webkit-scrollbar {
            height: 18px;
        }

        .road-window::-webkit-scrollbar-track {
            background: #10264c;
        }

        .road-window::-webkit-scrollbar-thumb {
            background:
                linear-gradient(
                    #71d4ff,
                    #268ed5
                );

            border:
                4px solid #10264c;

            border-radius:
                20px;
        }

        .road-content {
            position: relative;

            width: 2600px;
            min-height: 100%;

            padding:
                40px 100px
                70px;
        }

        .road-line {
            position: absolute;
            left: 120px;
            right: 120px;
            top: 57%;

            height: 35px;

            transform:
                translateY(-50%);

            background:
                linear-gradient(
                    #661442,
                    #3c0d2b
                );

            border:
                5px solid #140820;

            border-radius:
                20px;

            box-shadow:
                inset 0 0 10px #00000099,
                0 7px 0 #00000055;
        }

        .road-progress {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;

            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    #16a6ff,
                    #73e3ff
                );

            border-radius:
                13px;

            box-shadow:
                0 0 12px #5bdfff;
        }

        .road-progress::after {
            content: "";

            position: absolute;
            right: -6px;
            top: -5px;
            bottom: -5px;

            width: 12px;

            background: white;

            border-radius:
                8px;

            box-shadow:
                0 0 8px white,
                0 0 18px #73e3ff;
        }

        .milestones {
            position: relative;

            height: 640px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 55px;
        }

        .milestone {
            position: relative;

            width: 270px;
            min-width: 270px;
            height: 570px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;

            padding:
                12px 10px 25px;
        }

        .milestone:nth-child(even) {
            flex-direction:
                column-reverse;
        }

        .connector {
            position: absolute;
            left: 50%;

            width: 5px;
            height: 90px;

            transform:
                translateX(-50%);

            background: #d4edff;

            border:
                2px solid #15345d;
        }

        .milestone:nth-child(odd)
        .connector {
            bottom: 245px;
        }

        .milestone:nth-child(even)
        .connector {
            top: 245px;
        }

        .reward-card {
            position: relative;
            z-index: 4;

            width: 255px;
            min-height: 235px;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding:
                15px 12px 13px;

            text-align: center;

            background:
                linear-gradient(
                    #bfeeff,
                    #75b7d6
                );

            border:
                5px solid #102c50;

            border-radius:
                16px;

            box-shadow:
                0 8px 0 #00000066;
        }

        .reward-card.locked {
            filter:
                grayscale(0.55)
                brightness(0.75);
        }

        .reward-card.claimed {
            background:
                linear-gradient(
                    #80f5a1,
                    #35b965
                );
        }

        .rarity {
            position: absolute;
            top: -17px;

            padding:
                5px 13px;

            color: #18334c;

            font-size: 11px;
            font-weight: 1000;

            background:
                linear-gradient(
                    #effaff,
                    #9bd6ed
                );

            border:
                3px solid #18334c;

            border-radius:
                12px;

            text-transform:
                uppercase;
        }

        .hero-icon {
            margin-top: 8px;

            font-size: 76px;

            filter:
                drop-shadow(
                    0 6px 2px
                    #00000055
                );
        }

        .hero-name {
            margin-top: 4px;

            color: #102a47;

            font-size: 23px;
            font-weight: 1000;

            text-shadow:
                1px 1px white;
        }

        .hero-description {
            min-height: 45px;

            margin-top: 5px;

            color: #193a58;

            font-size: 12px;
            font-weight: 800;

            line-height: 1.25;
        }

        .claim-button {
            width: 100%;

            margin-top: 10px;
            padding: 10px;

            color: white;

            font-size: 14px;
            font-weight: 1000;

            background:
                linear-gradient(
                    #ffc933,
                    #e98a00
                );

            border:
                4px solid #573000;

            border-radius:
                10px;

            box-shadow:
                0 4px 0 #00000055;

            cursor: pointer;
        }

        .claim-button:hover:not(:disabled) {
            filter:
                brightness(1.12);
        }

        .claim-button:active:not(:disabled) {
            transform:
                translateY(3px);

            box-shadow:
                0 1px 0 #00000055;
        }

        .claim-button:disabled {
            cursor: default;
        }

        .claim-button.locked {
            color: #c9d3dd;

            background:
                linear-gradient(
                    #566579,
                    #303d50
                );

            border-color:
                #172131;
        }

        .claim-button.claimed {
            color: #12391e;

            background:
                linear-gradient(
                    #9cffaf,
                    #43ce6c
                );

            border-color:
                #155326;
        }

        .milestone-badge {
            position: relative;
            z-index: 6;

            width: 92px;
            height: 92px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            color: white;

            background:
                linear-gradient(
                    #ffc629,
                    #e57d00
                );

            border:
                6px solid #442300;

            clip-path:
                polygon(
                    50% 0%,
                    90% 20%,
                    100% 60%,
                    72% 100%,
                    28% 100%,
                    0 60%,
                    10% 20%
                );

            text-shadow:
                2px 2px black;

            filter:
                drop-shadow(
                    0 6px 0
                    #00000055
                );
        }

        .milestone-badge span:first-child {
            font-size: 22px;
        }

        .milestone-number {
            font-size: 20px;
            font-weight: 1000;
        }

        .milestone-status {
            position: absolute;
            left: 50%;

            transform:
                translateX(-50%);

            min-width: 130px;

            padding: 5px 9px;

            color: #d9ecff;

            text-align: center;

            font-size: 11px;
            font-weight: 900;

            background: #102b53;

            border:
                3px solid #081a34;

            border-radius:
                8px;
        }

        .milestone:nth-child(odd)
        .milestone-status {
            bottom: 115px;
        }

        .milestone:nth-child(even)
        .milestone-status {
            top: 115px;
        }

        .milestone-status.reached {
            color: #caffd8;
            background: #17603b;
        }

        .start-marker {
            position: absolute;
            left: 60px;
            top: 57%;

            z-index: 8;

            transform:
                translateY(-50%);

            width: 90px;
            height: 90px;

            display: grid;
            place-items: center;

            color: white;

            font-size: 15px;
            font-weight: 1000;

            background:
                linear-gradient(
                    #4994df,
                    #22569b
                );

            border:
                6px solid #0b2448;

            border-radius:
                50%;

            box-shadow:
                0 6px 0 #00000066;
        }

        .current-marker {
            position: absolute;
            top: calc(57% - 59px);

            z-index: 15;

            width: 46px;
            height: 46px;

            display: grid;
            place-items: center;

            color: #182238;

            font-size: 22px;

            background:
                white;

            border:
                5px solid #1b416f;

            border-radius:
                50%;

            box-shadow:
                0 0 15px #8cecff;

            transition:
                left 0.7s ease;
        }

        .message {
            position: fixed;
            left: 50%;
            bottom: 30px;
            z-index: 100;

            display: none;

            transform:
                translateX(-50%);

            padding:
                13px 22px;

            color: white;

            font-size: 17px;
            font-weight: 1000;

            background: #12233ddd;

            border:
                4px solid #071427;

            border-radius:
                12px;

            box-shadow:
                0 7px 0 #00000055;
        }

        .message.visible {
            display: block;

            animation:
                messageAnimation
                2.2s ease forwards;
        }

        .message.error {
            color: #ff8f8f;
        }

        @keyframes messageAnimation {
            0% {
                opacity: 0;

                transform:
                    translate(-50%, 30px)
                    scale(0.7);
            }

            15% {
                opacity: 1;

                transform:
                    translate(-50%, 0)
                    scale(1.08);
            }

            80% {
                opacity: 1;

                transform:
                    translate(-50%, 0)
                    scale(1);
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -20px)
                    scale(0.9);
            }
        }

        @media (max-width: 700px) {
            .topbar {
                height: 82px;
                padding: 7px;
            }

            .back-button {
                width: 58px;
                height: 54px;
                font-size: 29px;
            }

            .title-box p {
                display: none;
            }

            .title-box h1 {
                font-size: 22px;
            }

            .trophy-total {
                min-width: 100px;
                padding: 8px;
                font-size: 16px;
            }

            .road-window {
                top: 82px;
            }
        }
    </style>
</head>

<body>

<div class="screen">

    <div class="background-pattern"></div>

    <header class="topbar">

        <a
            href="gra.html"
            class="back-button"
            title="Powrót do lobby"
        >
            ◀
        </a>

        <div class="title-box">

            <h1>ALEJA PUCHARÓW</h1>

            <p>
                Zdobywaj pucharki i odblokowuj nowych wojowników
            </p>

        </div>

        <div class="trophy-total">
            🏆
            <span id="totalTrophies">
                0
            </span>
        </div>

    </header>

    <div
        id="roadWindow"
        class="road-window"
    >

        <div
            id="roadContent"
            class="road-content"
        >

            <div class="road-line">

                <div
                    id="roadProgress"
                    class="road-progress"
                ></div>

            </div>

            <div class="start-marker">
                START
            </div>

            <div
                id="currentMarker"
                class="current-marker"
            >
                🏆
            </div>

            <div
                id="milestones"
                class="milestones"
            ></div>

        </div>

    </div>

</div>

<div
    id="message"
    class="message"
></div>

<script src="dane.js"></script>
<script src="common.js"></script>

<script>
"use strict";

const ROAD_REWARDS = [
    {
        trophies: 10,
        id: "szaman",
        name: "Szaman",
        icon: "🧿",
        description:
            "Tworzy małe niebieskie fale uderzeniowe jako główny atak."
    },

    {
        trophies: 25,
        id: "wiking",
        name: "Wiking",
        icon: "🪓",
        description:
            "Ma dużo życia, ogromne obrażenia i krótki zasięg, ale jest wolny."
    },

    {
        trophies: 100,
        id: "mag_ognia",
        name: "Mag ognia",
        icon: "🔥",
        description:
            "Strzela ogniem na krótki dystans."
    },

    {
        trophies: 250,
        id: "mnich",
        name: "Mnich",
        icon: "🧘",
        description:
            "Przy każdym ataku wysyła dwie fale energii naraz."
    },

    {
        trophies: 500,
        id: "mag_lodu",
        name: "Mag lodu",
        icon: "❄️",
        description:
            "Atakuje na zmianę szerokim lodem i pociskiem zamrażającym na 1,5 sekundy."
    },

    {
        trophies: 750,
        id: "samuraj",
        name: "Samuraj",
        icon: "🥷",
        description:
            "Jest szybki i uderza mieczami na krótki dystans około 60 pikseli."
    },

    {
        trophies: 1000,
        id: "centaur",
        name: "Centaur",
        icon: "🐎",
        description:
            "Jest bardzo szybki. Jego szerokie strzały wybuchają po trafieniu."
    }
];

const ROAD_MAX_TROPHIES = 1000;

function byId(id) {
    return document.getElementById(id);
}

function getTotalHeroTrophies(state) {
    if (
        !state.heroTrophies ||
        typeof state.heroTrophies !== "object"
    ) {
        return 0;
    }

    return Object.values(
        state.heroTrophies
    ).reduce(
        function(total, value) {
            return (
                total +
                Math.max(
                    0,
                    Number(value) || 0
                )
            );
        },
        0
    );
}

function ensureRoadData(state) {
    if (
        !Array.isArray(
            state.unlocked
        )
    ) {
        state.unlocked = [
            "farmer"
        ];
    }

    if (
        !Array.isArray(
            state.claimedRoadRewards
        )
    ) {
        state.claimedRoadRewards =
            [];
    }
}

function showMessage(
    text,
    error = false
) {
    const message =
        byId("message");

    message.textContent =
        text;

    message.className =
        "message visible";

    if (error) {
        message.classList.add(
            "error"
        );
    }

    clearTimeout(
        showMessage.timeout
    );

    showMessage.timeout =
        setTimeout(
            function() {
                message.className =
                    "message";
            },
            2200
        );
}

function claimReward(heroId) {
    const reward =
        ROAD_REWARDS.find(
            function(item) {
                return (
                    item.id ===
                    heroId
                );
            }
        );

    if (!reward) {
        return;
    }

    const state =
        getState();

    ensureRoadData(state);

    const total =
        getTotalHeroTrophies(
            state
        );

    if (
        total <
        reward.trophies
    ) {
        showMessage(
            "Potrzebujesz jeszcze " +
            (
                reward.trophies -
                total
            ) +
            " pucharków.",
            true
        );

        return;
    }

    if (
        state.claimedRoadRewards
            .includes(heroId)
    ) {
        showMessage(
            "Ta nagroda została już odebrana."
        );

        return;
    }

    if (
        !state.unlocked.includes(
            heroId
        )
    ) {
        state.unlocked.push(
            heroId
        );
    }

    state.claimedRoadRewards.push(
        heroId
    );

    saveState(state);

    showMessage(
        "Odblokowano postać: " +
        reward.name +
        "!"
    );

    renderRoad();
}

function createRewardCard(
    reward,
    state,
    total
) {
    const milestone =
        document.createElement(
            "article"
        );

    milestone.className =
        "milestone";

    const reached =
        total >=
        reward.trophies;

    const claimed =
        state.claimedRoadRewards
            .includes(
                reward.id
            );

    milestone.innerHTML = `
        <div class="connector"></div>

        <div class="reward-card ${
            claimed
                ? "claimed"
                : reached
                    ? ""
                    : "locked"
        }">

            <div class="rarity">
                ALEJA PUCHARÓW
            </div>

            <div class="hero-icon">
                ${reward.icon}
            </div>

            <div class="hero-name">
                ${reward.name}
            </div>

            <div class="hero-description">
                ${reward.description}
            </div>

            <button
                class="claim-button ${
                    claimed
                        ? "claimed"
                        : reached
                            ? ""
                            : "locked"
                }"
                ${
                    claimed ||
                    !reached
                        ? "disabled"
                        : ""
                }
            >
                ${
                    claimed
                        ? "ODEBRANO"
                        : reached
                            ? "ODBLOKUJ"
                            : "ZABLOKOWANE"
                }
            </button>

        </div>

        <div class="milestone-badge">
            <span>🏆</span>

            <span class="milestone-number">
                ${reward.trophies}
            </span>
        </div>

        <div class="milestone-status ${
            reached
                ? "reached"
                : ""
        }">
            ${
                reached
                    ? claimed
                        ? "POSTAĆ ODEBRANA"
                        : "NAGRODA GOTOWA"
                    : total +
                      " / " +
                      reward.trophies
            }
        </div>
    `;

    const button =
        milestone.querySelector(
            ".claim-button"
        );

    if (
        reached &&
        !claimed
    ) {
        button.onclick =
            function() {
                claimReward(
                    reward.id
                );
            };
    }

    return milestone;
}

function updateRoadPosition(total) {
    const progress =
        Math.min(
            1,
            total /
            ROAD_MAX_TROPHIES
        );

    byId("roadProgress")
        .style.width =
        progress * 100 +
        "%";

    const roadContent =
        byId("roadContent");

    const startX =
        120;

    const endX =
        roadContent
            .scrollWidth -
        120;

    const markerX =
        startX +
        (
            endX -
            startX
        ) *
        progress;

    byId("currentMarker")
        .style.left =
        markerX -
        23 +
        "px";
}

function scrollToCurrentProgress(total) {
    const roadWindow =
        byId("roadWindow");

    const progress =
        Math.min(
            1,
            total /
            ROAD_MAX_TROPHIES
        );

    const maximumScroll =
        roadWindow.scrollWidth -
        roadWindow.clientWidth;

    const target =
        maximumScroll *
        progress;

    roadWindow.scrollLeft =
        Math.max(
            0,
            target -
            roadWindow.clientWidth *
            0.2
        );
}

function renderRoad() {
    const state =
        getState();

    ensureRoadData(state);

    saveState(state);

    const total =
        getTotalHeroTrophies(
            state
        );

    byId("totalTrophies")
        .textContent =
        total;

    const container =
        byId("milestones");

    container.innerHTML =
        "";

    ROAD_REWARDS.forEach(
        function(reward) {
            container.appendChild(
                createRewardCard(
                    reward,
                    state,
                    total
                )
            );
        }
    );

    requestAnimationFrame(
        function() {
            updateRoadPosition(
                total
            );

            scrollToCurrentProgress(
                total
            );
        }
    );
}

renderRoad();
</script>

</body>
</html>
