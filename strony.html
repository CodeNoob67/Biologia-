```html
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Moje strony</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }

    .container {
      width: 100%;
      max-width: 750px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 40px;
    }

    .category {
      background: #1f2937;
      border-radius: 18px;
      margin-bottom: 20px;
      overflow: hidden;
      border: 2px solid #374151;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .category-title {
      width: 100%;
      border: none;
      background: #1f2937;
      color: white;
      font-size: 24px;
      font-weight: bold;
      padding: 22px;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
    }

    .category-title:hover {
      background: #2d3748;
    }

    .arrow {
      transition: transform 0.3s;
    }

    .category.active .arrow {
      transform: rotate(180deg);
    }

    .pages {
      max-height: 0;
      overflow: hidden;
      position: relative;
      transition: max-height 0.45s ease;
    }

    .category.active .pages {
      max-height: 500px;
    }

    .pages a {
      position: relative;
      z-index: 5;
      display: block;
      color: #111827;
      text-decoration: none;
      padding: 20px 25px;
      font-size: 21px;
      font-weight: bold;
      border-top: 1px solid rgba(0,0,0,0.15);
      backdrop-filter: blur(2px);
      transition: 0.25s;
    }

    .pages a:hover {
      padding-left: 38px;
      background: rgba(255,255,255,0.45);
    }


    /* =========================
       NAUKOWE
    ========================= */

    .science .pages {
      animation: scienceBackground 5s infinite alternate ease-in-out;
    }

    @keyframes scienceBackground {
      0% {
        background: #aee8ff;
      }

      100% {
        background: #b9f6c2;
      }
    }

    .dna {
      position: absolute;
      z-index: 1;
      font-size: 38px;
      opacity: 0.35;
      animation: dnaFloat 8s linear infinite;
      pointer-events: none;
    }

    .dna1 {
      left: 5%;
      top: 90%;
      animation-delay: 0s;
    }

    .dna2 {
      left: 40%;
      top: 110%;
      animation-delay: 2s;
    }

    .dna3 {
      left: 75%;
      top: 100%;
      animation-delay: 4s;
    }

    @keyframes dnaFloat {
      from {
        transform: translateY(20px) rotate(0deg);
      }

      to {
        transform: translateY(-250px) rotate(360deg);
      }
    }


    /* =========================
       ZABAWY
    ========================= */

    .fun .pages {
      animation: funBackground 5s infinite alternate ease-in-out;
    }

    @keyframes funBackground {
      0% {
        background: #ffe38a;
      }

      100% {
        background: #ffb7dc;
      }
    }

    .fun-symbol {
      position: absolute;
      z-index: 1;
      font-size: 35px;
      opacity: 0.3;
      pointer-events: none;
      animation: funFloat 7s linear infinite;
    }

    .fun1 {
      left: 10%;
      top: 100%;
    }

    .fun2 {
      left: 45%;
      top: 110%;
      animation-delay: 2s;
    }

    .fun3 {
      left: 80%;
      top: 90%;
      animation-delay: 4s;
    }

    @keyframes funFloat {
      from {
        transform: translateY(20px) rotate(-20deg);
      }

      to {
        transform: translateY(-260px) rotate(340deg);
      }
    }


    /* =========================
       GRY
    ========================= */

    .games .pages {
      animation: gamesBackground 5s infinite alternate ease-in-out;
    }

    @keyframes gamesBackground {
      0% {
        background: #b7a6ff;
      }

      100% {
        background: #ff9f9f;
      }
    }

    .game-symbol {
      position: absolute;
      z-index: 1;
      font-size: 38px;
      opacity: 0.3;
      pointer-events: none;
      animation: gameFloat 6s linear infinite;
    }

    .game1 {
      left: 8%;
      top: 100%;
    }

    .game2 {
      left: 40%;
      top: 110%;
      animation-delay: 2s;
    }

    .game3 {
      left: 78%;
      top: 95%;
      animation-delay: 4s;
    }

    @keyframes gameFloat {
      from {
        transform: translateY(20px) scale(0.8) rotate(0deg);
      }

      to {
        transform: translateY(-260px) scale(1.3) rotate(360deg);
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>🌐 Moje strony</h1>


    <!-- NAUKOWE -->

    <div class="category science">

      <button class="category-title">
        🧬 Naukowe
        <span class="arrow">▼</span>
      </button>

      <div class="pages">

        <span class="dna dna1">🧬</span>
        <span class="dna dna2">🧬</span>
        <span class="dna dna3">🧬</span>

        <a href="index.html">
          🧪 Nauka
        </a>

      </div>

    </div>


    <!-- ZABAWY -->

    <div class="category fun">

      <button class="category-title">
        🎲 Zabawy
        <span class="arrow">▼</span>
      </button>

      <div class="pages">

        <span class="fun-symbol fun1">♟️</span>
        <span class="fun-symbol fun2">🐍</span>
        <span class="fun-symbol fun3">🎲</span>

        <a href="chess.html">
          ♟️ Szachy
        </a>

        <a href="snake.html">
          🐍 Snake
        </a>

      </div>

    </div>


    <!-- GRY -->

    <div class="category games">

      <button class="category-title">
        🎮 Gry
        <span class="arrow">▼</span>
      </button>

      <div class="pages">

        <span class="game-symbol game1">⚔️</span>
        <span class="game-symbol game2">🧟</span>
        <span class="game-symbol game3">🎮</span>

        <a href="gra.html">
          ⚔️ Medieval Arena
        </a>

        <a href="gra1.html">
          🧟 Zombie Escape
        </a>

      </div>

    </div>

  </div>


  <script>

    const categories = document.querySelectorAll(".category");

    categories.forEach(category => {

      const button = category.querySelector(".category-title");

      button.addEventListener("click", () => {

        category.classList.toggle("active");

      });

    });

  </script>

</body>
</html>
